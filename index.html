<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫 (終極強效版)</title>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.45);
      --bg-dark: #07070a;
      --card-glass: rgba(16, 16, 22, 0.85);
      --card-glass-hover: rgba(24, 24, 34, 0.94);
      --text-main: #ffffff;
      --text-sub: #9494ab;
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-hover: rgba(255, 121, 198, 0.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; padding-bottom: 130px;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, "PingFang TC", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }

    #bg-video, #bg-img {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; background-color: var(--bg-dark);
      z-index: -2; display: none; filter: brightness(0.7) blur(4px);
      transform: scale(1); transition: opacity 0.8s ease, transform 0.8s ease;
      will-change: transform, opacity;
    }
    @media (max-width: 768px) {
      #bg-video, #bg-img {
        top: -10vh; left: -10vw; width: 120vw; height: 120vh;
        transform: scale(0.8);
      }
    }

    #bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(7,7,10,0.3) 0%, rgba(7,7,10,0.88) 100%);
      z-index: -1; pointer-events: none;
    }

    .container { width: 100%; max-width: 680px; z-index: 1; position: relative; }
    .top-bar { width: 100%; max-width: 680px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; z-index: 10; }
    .app-logo { font-size: 1.4rem; font-weight: 800; color: var(--primary-pink); text-shadow: 0 0 20px var(--pink-glow); cursor: pointer; letter-spacing: 0.5px; }
    .top-actions { display: flex; gap: 8px; }
    .btn-clean-mem {
      background: rgba(80, 250, 123, 0.15); border: 1px solid rgba(80, 250, 123, 0.4);
      color: #50fa7b; padding: 10px 14px; border-radius: 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      transition: all 0.25s ease; backdrop-filter: blur(10px);
    }
    .btn-clean-mem:hover { background: rgba(80, 250, 123, 0.3); box-shadow: 0 0 15px rgba(80, 250, 123, 0.4); }
    .btn-toggle-admin {
      background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 10px 18px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.25s ease; backdrop-filter: blur(10px);
    }
    .btn-toggle-admin:hover { background: rgba(255, 121, 198, 0.25); border-color: var(--primary-pink); box-shadow: 0 0 15px var(--pink-glow); }

    .admin-drawer { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; will-change: max-height; }
    .admin-drawer.open { max-height: 3500px; }

    .glass-card {
      background: var(--card-glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass); border-radius: 24px; padding: 20px; margin-bottom: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; color: var(--primary-pink); display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.25s ease;
    }
    input:focus, select:focus { border-color: var(--primary-pink); box-shadow: 0 0 12px rgba(255, 121, 198, 0.25); background: rgba(0,0,0,0.6); }
    
    input[type="file"] { padding: 8px; color: var(--text-sub); font-size: 0.85rem; cursor: pointer; }
    input[type="file"]::file-selector-button {
      background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-right: 12px;
    }

    .btn-pink {
      width: 100%; background: linear-gradient(135deg, #ff79c6 0%, #ff52b2 100%); color: #07070a; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(255, 121, 198, 0.35); transition: all 0.25s ease;
    }
    .btn-pink:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(255, 121, 198, 0.5); }

    .btn-blue {
      width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #ffffff; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35); transition: all 0.25s ease;
    }
    .btn-blue:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(59, 130, 246, 0.5); }

    .btn-green {
      width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35); transition: all 0.25s ease;
    }
    .btn-green:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5); }
    .btn-green:disabled { opacity: 0.6; cursor: not-allowed; }

    .page-view { display: none; width: 100%; animation: fadeIn 0.25s ease; }
    .page-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .album-grid-card {
      background: var(--card-glass); backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass); border-radius: 20px; padding: 14px; margin-bottom: 12px;
      display: flex; align-items: center; cursor: pointer; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .album-grid-card:hover {
      background: var(--card-glass-hover); border-color: var(--border-glass-hover);
      transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 121, 198, 0.15);
    }
    .album-grid-thumb { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; margin-right: 14px; flex-shrink: 0; background: #121218; }
    .album-grid-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .album-grid-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .album-grid-count { font-size: 0.85rem; color: var(--primary-pink); font-weight: 600; }
    
    .btn-action-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; z-index: 2; }
    .btn-album-action {
      background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .btn-album-del {
      background: rgba(255, 85, 85, 0.1); border: 1px solid rgba(255, 85, 85, 0.25);
      color: #ff6b6b; padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }

    .breadcrumb-bar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 0.95rem; font-weight: 700;
      color: var(--primary-pink); cursor: pointer; padding: 2px 0;
    }

    .chapter-file-list { display: flex; flex-direction: column; gap: 8px; }
    .chapter-file-item {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 14px;
      cursor: pointer; transition: all 0.2s ease;
    }
    .chapter-file-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255, 121, 198, 0.25); }
    .chapter-info-left { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; margin-right: 10px; }
    .play-icon-circle {
      width: 36px; height: 36px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.95rem; flex-shrink: 0;
    }
    .chapter-meta-text { overflow: hidden; }
    .chapter-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; margin-bottom: 2px; color: #fff; font-size: 0.92rem; }
    .chapter-duration-sub { font-size: 0.78rem; color: var(--text-sub); }

    .btn-action-group { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-sm { padding: 5px 10px; border-radius: 9px; border: none; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-sm-edit { background: rgba(255, 121, 198, 0.15); color: var(--primary-pink); border: 1px solid rgba(255, 121, 198, 0.3); }
    .btn-sm-del { background: rgba(255,255,255,0.06); color: #ff6b6b; border: 1px solid rgba(255,85,85,0.15); }

    .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .btn-page {
      background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3); color: var(--primary-pink);
      padding: 8px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.88rem;
    }
    .btn-page:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-info { font-size: 0.85rem; color: var(--text-sub); }

    .player-card {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; width: 100%; 
      max-height: 90vh; height: auto; overflow-y: auto; overflow-x: hidden;
      background: rgba(16, 16, 22, 0.97); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-bottom: none; border-radius: 26px 26px 0 0;
      padding: 4px 18px 24px 18px; box-shadow: 0 -16px 50px rgba(0,0,0,0.85);
      z-index: 1000; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: pan-y; will-change: transform;
    }
    .player-card.minimized { transform: translateY(105%); }

    .drag-handle-area { width: 100%; padding: 8px 0 10px 0; display: flex; justify-content: center; cursor: grab; }
    .drag-handle { width: 50px; height: 5px; background: rgba(255, 255, 255, 0.45); border-radius: 10px; }

    .cover-box { 
      width: 100%; height: 260px; border-radius: 16px; 
      overflow: hidden; background: #050508; margin: 0 auto 10px auto; 
      position: relative; box-shadow: 0 6px 20px rgba(0,0,0,0.5); 
      display: flex; align-items: center; justify-content: center;
    }
    .cover-box img { 
      max-width: 85%; max-height: 85%; width: auto; height: auto; 
      object-fit: contain; display: none; position: absolute; 
      top: 50%; left: 50%; transform: translate(-50%, -50%); 
      border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .cover-box video { 
      width: 100%; height: 100%; object-fit: cover; display: none; 
      position: absolute; top: 0; left: 0; border-radius: 12px;
    }

    .btn-cover-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 1rem; z-index: 10; transition: all 0.2s ease; backdrop-filter: blur(4px);
    }
    .btn-cover-nav:hover { background: rgba(255, 121, 198, 0.4); border-color: var(--primary-pink); }
    .cover-prev { left: 10px; }
    .cover-next { right: 10px; }
    .cover-indicator {
      position: absolute; bottom: 10px; right: 12px; background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px; border-radius: 8px; font-size: 0.72rem; color: #fff; z-index: 10;
      backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
    }
    
    .album-tag { font-size: 0.82rem; color: var(--text-sub); text-align: center; margin-bottom: 4px; font-weight: 500; }
    
    .lrc-box {
      min-height: 48px; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 1.1rem; font-weight: 800; color: var(--primary-pink);
      text-shadow: 0 0 20px var(--pink-glow), 0 2px 4px rgba(0,0,0,0.8); padding: 2px 8px; line-height: 1.3; margin-bottom: 8px;
    }

    .sub-quick-tools { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
    .btn-sub-quick {
      padding: 5px 10px; background: rgba(255, 121, 198, 0.1); border: 1px solid rgba(255, 121, 198, 0.25);
      color: var(--primary-pink); border-radius: 9px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }

    .seek-slider { width: 100%; height: 6px; accent-color: var(--primary-pink); cursor: pointer; border-radius: 3px; background: rgba(255,255,255,0.1); }
    .time-box { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-sub); margin-top: 4px; margin-bottom: 10px; font-weight: 500; }
    
    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.25rem; cursor: pointer; padding: 6px; transition: transform 0.15s, color 0.2s; }
    .btn-ctrl:hover { color: var(--primary-pink); transform: scale(1.1); }
    .btn-play-main {
      width: 48px; height: 48px; background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%); color: #07070a; border-radius: 50%;
      font-size: 1.3rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(255,255,255,0.3);
    }

    .volume-box { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 10px; padding: 0 2px; }
    .volume-slider { flex: 1; height: 5px; accent-color: var(--text-sub); cursor: pointer; }
    .btn-mute { background: none; border: none; color: var(--text-sub); font-size: 1.05rem; cursor: pointer; }

    .bottom-tools { display: flex; gap: 8px; }
    .btn-pip {
      flex: 1; background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.82rem; cursor: pointer; text-align: center;
      box-shadow: 0 4px 15px rgba(255, 121, 198, 0.15);
    }

    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; height: 64px;
      background: rgba(16, 16, 22, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; padding: 0 14px;
      z-index: 999; cursor: pointer; box-shadow: 0 -6px 25px rgba(0,0,0,0.6); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mini-player.hidden { transform: translateY(100%); }
    .mini-thumb { width: 42px; height: 42px; border-radius: 10px; background: #121218; object-fit: contain; margin-right: 10px; flex-shrink: 0; }
    .mini-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .mini-title { font-size: 0.88rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .mini-subtitle { font-size: 0.75rem; color: var(--primary-pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .mini-btn { background: none; border: none; color: #fff; font-size: 1.15rem; padding: 6px; cursor: pointer; }
  </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img" alt="全域背景">
<div id="bg-overlay"></div>

<div class="container">
  <div class="top-bar">
    <div class="app-logo" onclick="switchPage('home')">🌸 ASMR 隨身庫</div>
    <div class="top-actions">
      <button class="btn-clean-mem" onclick="cleanMemoryAndGC()">⚡ 清理記憶體</button>
      <button class="btn-toggle-admin" onclick="toggleAdminDrawer()">⚙️ 管理選單</button>
    </div>
  </div>

  <div id="admin-drawer" class="admin-drawer">
    <div class="glass-card" style="border: 1px solid rgba(59, 130, 246, 0.4); background: rgba(16, 24, 39, 0.85);">
      <div class="card-title" style="color: #60a5fa;">🔄 跨裝置資料互通 (電腦 ⇄ 手機同步)</div>
      <div style="font-size:0.85rem; color:var(--text-sub); margin-bottom:12px; line-height:1.4;">
        點擊「匯出備份檔案」會下載一份 `.json` 檔案。將檔案傳到另一台裝置，再點擊「匯入備份檔案」即可完整同步所有作品、音訊與字幕！
      </div>
      <button class="btn-blue" onclick="exportDataBackup()">📤 1. 匯出備份檔案 (電腦/手機)</button>
      <div class="form-group" style="margin-top: 12px;">
        <label>📥 2. 匯入備份檔案 (接收端裝置)</label>
        <input type="file" id="import-backup-input" accept="*/*" onchange="importDataBackup(event)">
      </div>
    </div>

    <div class="glass-card">
      <div class="card-title">🖼️ 設定預設全域背景</div>
      <div class="form-group"><label>選取多張圖片或 MP4 影片（可匯入多個，隨時手動切換）</label><input type="file" id="global-bg-input" accept="*/*" multiple></div>
      <button class="btn-pink" onclick="saveGlobalBackgrounds()">儲存全域背景素材</button>
    </div>

    <div class="glass-card">
      <div class="card-title">📁 建立作品分區 (支援多張封面圖/影片手動切換)</div>
      <div class="form-group"><label>作品分區名稱</label><input type="text" id="album-title" placeholder="例如：巫女"></div>
      <div class="form-group"><label>封面素材 (支援複選多張圖片或 MP4 影片)</label><input type="file" id="album-covers" accept="*/*" multiple></div>
      <div class="form-group"><label>此分區專屬背景 (支援複選多張)</label><input type="file" id="album-bgs" accept="*/*" multiple></div>
      <button class="btn-pink" onclick="createAlbum()">建立分區</button>
    </div>

    <!-- 全面放寬 accept 限制，相容 iOS Safari 所有副檔名與檔案選取 -->
    <div class="glass-card">
      <div class="card-title">⚡ 一鍵自動配對音檔與字幕</div>
      <div class="form-group">
        <label>選擇目標作品分區</label>
        <select id="select-album"><option value="">-- 請先建立分區 --</option></select>
      </div>
      
      <div style="border-top:1px dashed var(--border-glass); margin:12px 0; padding-top:12px;">
        <div style="font-weight:700; color:#10b981; margin-bottom:8px; font-size:0.95rem;">🚀 1-Click 批量自動匹配上傳 (iOS Safari 解鎖版)</div>
        <div class="form-group">
          <label>複選所有音訊檔 (可一次選多個 .mp3/.wav/.m4a)</label>
          <input type="file" id="batch-audios" accept="*/*" multiple>
        </div>
        <div class="form-group">
          <label>複選所有字幕檔 (可一次選多個 .lrc/.srt/.txt)</label>
          <input type="file" id="batch-lrcs" accept="*/*" multiple>
        </div>
        <button id="btn-batch-upload" class="btn-green" onclick="batchUploadAndPair()">⚡ 一鍵配對並自動匯入篇章</button>
      </div>

      <div style="border-top:1px dashed var(--border-glass); margin:12px 0; padding-top:12px;">
        <div style="font-weight:700; color:var(--text-sub); margin-bottom:8px; font-size:0.88rem;">單一篇章手動新增</div>
        <div class="form-group"><label>篇章名稱</label><input type="text" id="track-title-input" placeholder="例如：01_開場 (留空則用檔名)"></div>
        <div class="form-group"><label>音訊檔案</label><input type="file" id="track-audio" accept="*/*"></div>
        <div class="form-group"><label>字幕檔案 (.lrc / .srt / .vtt / .txt)</label><input type="file" id="track-lrc" accept="*/*"></div>
        <button class="btn-pink" onclick="addTrack()">新增單一篇章</button>
      </div>
    </div>
  </div>

  <div id="view-home" class="page-view active">
    <div class="glass-card">
      <div class="card-title">📚 選擇作品集</div>
      <div id="album-list">載入中...</div>
      <div id="pagination-container"></div>
    </div>
  </div>

  <div id="view-detail" class="page-view">
    <div class="glass-card">
      <div class="breadcrumb-bar" onclick="switchPage('home')">
        <span>⬅ ROOT / 📁 <span id="detail-album-title">作品名稱</span></span>
      </div>
      <div id="chapter-list-container" class="chapter-file-list"></div>
    </div>
  </div>
</div>

<div id="mini-player" class="mini-player hidden" onclick="expandPlayer()">

  function initPiPEngine() {
    if (isPiPInitialized) return;
    try {
      pipCanvas = document.createElement('canvas');
      pipCanvas.width = 1080;
      pipCanvas.height = 1080;
      pipCtx = pipCanvas.getContext('2d', { alpha: false });

      function renderPiPFrame() {
        if (pipCtx) {
          pipCtx.fillStyle = "#07070a";
          pipCtx.fillRect(0, 0, 1080, 1080);

          if (cachedCoverElement) {
            if (cachedCoverElement.tagName === 'VIDEO' && cachedCoverElement.paused) {
              cachedCoverElement.play().catch(() => {});
            }
            drawCoverToCanvas(pipCtx, cachedCoverElement, 1080, isCoverVideoActive);
          } else {
            pipCtx.fillStyle = "#121218";
            pipCtx.fillRect(0, 0, 1080, 1080);
            pipCtx.fillStyle = "#ff79c6";
            pipCtx.font = "bold 48px sans-serif";
            pipCtx.textAlign = "center";
            pipCtx.fillText("ASMR 隨身庫", 540, 540);
          }

          const currentTime = audio.currentTime;
          let currentText = getActiveSubtitleText(currentTime);

          pipCtx.textAlign = "center";
          pipCtx.font = "bold 64px -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', sans-serif";
          
          let lines = [];
          if (pipCtx.measureText(currentText).width > 940) {
            let mid = Math.floor(currentText.length / 2);
            lines.push(currentText.substring(0, mid));
            lines.push(currentText.substring(mid));
          } else {
            lines.push(currentText);
          }

          let startY = lines.length > 1 ? 920 : 960;
          lines.forEach((lineText, idx) => {
            let curY = startY + (idx * 72);
            pipCtx.lineWidth = 9;
            pipCtx.strokeStyle = "rgba(0, 0, 0, 0.95)";
            pipCtx.strokeText(lineText, 540, curY);

            pipCtx.fillStyle = "#ff79c6";
            pipCtx.fillText(lineText, 540, curY);
          });
        }
        requestAnimationFrame(renderPiPFrame);
      }
      requestAnimationFrame(renderPiPFrame);

      const stream = pipCanvas.captureStream(30);
      pipVideo.srcObject = stream;
      pipVideo.play();
      isPiPInitialized = true;
    } catch(e) { console.error(e); }
  }

  function drawCoverToCanvas(ctx, source, size, isVideo) {
    let imgWidth = source.videoWidth || source.width;
    let imgHeight = source.videoHeight || source.height;
    if (!imgWidth || !imgHeight) return;

    ctx.save();
    ctx.fillStyle = "#050508";
    ctx.fillRect(0, 0, size, size);

    if (isVideo) {
      let hRatio = size / imgWidth;
      let vRatio = size / imgHeight;
      let ratio = Math.max(hRatio, vRatio);
      let centerShiftX = (size - imgWidth * ratio) / 2;
      let centerShiftY = (size - imgHeight * ratio) / 2;
      ctx.drawImage(source, 0, 0, imgWidth, imgHeight, centerShiftX, centerShiftY, imgWidth * ratio, imgHeight * ratio);
    } else {
      let maxDrawSize = size * 0.85;
      let hRatio = maxDrawSize / imgWidth;
      let vRatio = maxDrawSize / imgHeight;
      let ratio = Math.min(hRatio, vRatio);
      let centerShiftX = (size - imgWidth * ratio) / 2;
      let centerShiftY = (size - imgHeight * ratio) / 2;
      ctx.drawImage(source, 0, 0, imgWidth, imgHeight, centerShiftX, centerShiftY, imgWidth * ratio, imgHeight * ratio);
    }
    ctx.restore();
  }

  async function enablePiP() {
    if (currentIndex === -1) return alert("請先播放一個篇章才能開啟桌面懸浮窗！");
    if (audio.paused) {
      await audio.play().catch(() => {});
      document.getElementById("btn-play").innerText = "⏸";
      document.getElementById("mini-btn-play").innerText = "⏸";
    }
    initPiPEngine();
    if (cachedCoverElement && cachedCoverElement.tagName === 'VIDEO') cachedCoverElement.play().catch(() => {});
    
    try {
      if (pipVideo !== document.pictureInPictureElement) await pipVideo.requestPictureInPicture();
      else await document.exitPictureInPicture();
    } catch (err) {
      setTimeout(async () => {
        try { await pipVideo.requestPictureInPicture(); } catch(e) { alert("無法啟用懸浮視窗，請確認手機瀏覽器支援 PiP。"); }
      }, 200);
    }
  }

  const request = indexedDB.open("ASMR_Categorized_DB_V26", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("albums")) db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
  };
  request.onsuccess = (e) => { db = e.target.result; loadData(); initMediaSession(); };

  function loadData() {
    const tx = db.transaction(["albums", "tracks", "settings"], "readonly");
    tx.objectStore("albums").getAll().onsuccess = (e) => { albums = e.target.result; updateAlbumDropdown(); renderAlbumList(); };
    tx.objectStore("tracks").getAll().onsuccess = (e) => { tracks = e.target.result; renderAlbumList(); if(currentActiveAlbumId) renderDetailView(currentActiveAlbumId); };
    tx.objectStore("settings").get("globalBgs").onsuccess = (e) => {
      const res = e.target.result;
      if (res && res.blobs && res.blobs.length > 0) {
        globalBackgrounds = res.blobs;
        bgIndex = 0;
        if (!isCustomAlbumPlaying) applyBackgroundBlob(globalBackgrounds[bgIndex]);
      }
    };
  }

  async function exportDataBackup() {
    const tx = db.transaction(["albums", "tracks", "settings"], "readonly");
    let exportAlbums = await new Promise(res => tx.objectStore("albums").getAll().onsuccess = e => res(e.target.result));
    let exportTracks = await new Promise(res => tx.objectStore("tracks").getAll().onsuccess = e => res(e.target.result));
    let exportSettings = await new Promise(res => tx.objectStore("settings").getAll().onsuccess = e => res(e.target.result));

    async function blobToBase64(blob) {
      if (!blob) return null;
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    }

    let cleanAlbums = [];
    for (let alb of exportAlbums) {
      let cBlobs = [];
      if (alb.coverBlobs) {
        for (let b of alb.coverBlobs) cBlobs.push(await blobToBase64(b));
      } else if (alb.coverBlob) {
        cBlobs.push(await blobToBase64(alb.coverBlob));
      }
      let bBlobs = [];
      if (alb.bgBlobs) {
        for (let b of alb.bgBlobs) bBlobs.push(await blobToBase64(b));
      }
      cleanAlbums.push({ id: alb.id, title: alb.title, coverBlobs: cBlobs, bgBlobs: bBlobs });
    }

    let cleanTracks = [];
    for (let trk of exportTracks) {
      cleanTracks.push({
        id: trk.id,
        albumId: trk.albumId,
        title: trk.title,
        audioBase64: await blobToBase64(trk.audioBlob),
        lrcText: trk.lrcText
      });
    }

    let cleanSettings = [];
    for (let st of exportSettings) {
      if (st.key === 'globalBgs' && st.blobs) {
        let gBlobs = [];
        for (let b of st.blobs) gBlobs.push(await blobToBase64(b));
        cleanSettings.push({ key: 'globalBgs', blobs: gBlobs });
      } else {
        cleanSettings.push(st);
      }
    }

    const backupData = { version: 1, albums: cleanAlbums, tracks: cleanTracks, settings: cleanSettings };
    const jsonStr = JSON.stringify(backupData);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = createTrackedObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = `ASMR_Backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    alert("備份檔案已成功匯出！");
  }

  async function importDataBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (!confirm("匯入備份將會覆蓋當前裝置的所有資料，確定要繼續嗎？")) {
      event.target.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        
        function base64ToBlob(base64Data) {
          if (!base64Data) return null;
          const parts = base64Data.split(';base64,');
          const contentType = parts[0].split(':')[1];
          const raw = window.atob(parts[1]);
          const rawLength = raw.length;
          const uInt8Array = new Uint8Array(rawLength);
          for (let i = 0; i < rawLength; ++i) {
            uInt8Array[i] = raw.charCodeAt(i);
          }
          return new Blob([uInt8Array], { type: contentType });
        }

        const tx = db.transaction(["albums", "tracks", "settings"], "readwrite");
        tx.objectStore("albums").clear();
        tx.objectStore("tracks").clear();
        tx.objectStore("settings").clear();

        for (let alb of data.albums) {
          let cBlobs = [];
          if (alb.coverBlobs) {
            for (let bStr of alb.coverBlobs) cBlobs.push(base64ToBlob(bStr));
          }
          let bBlobs = [];
          if (alb.bgBlobs) {
            for (let bStr of alb.bgBlobs) bBlobs.push(base64ToBlob(bStr));
          }
          tx.objectStore("albums").add({ id: alb.id, title: alb.title, coverBlobs: cBlobs, bgBlobs: bBlobs });
        }

        for (let trk of data.tracks) {
          tx.objectStore("tracks").add({
            id: trk.id,
            albumId: trk.albumId,
            title: trk.title,
            audioBlob: base64ToBlob(trk.audioBase64),
            lrcText: trk.lrcText
          });
        }

        for (let st of data.settings) {
          if (st.key === 'globalBgs' && st.blobs) {
            let gBlobs = [];
            for (let bStr of st.blobs) gBlobs.push(base64ToBlob(bStr));
            tx.objectStore("settings").add({ key: 'globalBgs', blobs: gBlobs });
          } else {
            tx.objectStore("settings").add(st);
          }
        }

        tx.oncomplete = () => {
          alert("資料成功匯入並同步！");
          location.reload();
        };
      } catch (err) {
        console.error(err);
        alert("匯入失敗：檔案格式錯誤或損毀。");
      }
    };
    reader.readAsText(file);
  }

  async function saveGlobalBackgrounds() {
    const files = document.getElementById("global-bg-input").files;

    tx.objectStore("settings").put({ key: "globalBgs", blobs: blobsArray });

      globalBackgrounds = blobsArray; bgIndex = 0; isCustomAlbumPlaying = false;

  function applyBackgroundBlob(blob) {
    if (!blob) return;
    const url = createTrackedObjectURL(blob);
    if (blob.type && blob.type.startsWith('video/')) {
      bgVideo.src = url; bgVideo.style.display = "block"; bgVideo.play().catch(()=>{}); bgImg.style.display = "none";
    } else {
      bgImg.src = url; bgImg.style.display = "block"; bgVideo.style.display = "none"; bgVideo.pause();

  async function deleteAlbum(albumId, event) {
    event.stopPropagation();
    const album = albums.find(a => a.id === albumId);
    if (!album) return;
    if (!confirm(`確定要刪除作品集「${album.title}」嗎？`)) return;

    const tx = db.transaction(["albums", "tracks"], "readwrite");
    tx.objectStore("albums").delete(albumId);
    tx.objectStore("tracks").getAll().onsuccess = (e) => {
      e.target.result.forEach(t => { if (t.albumId === albumId) tx.objectStore("tracks").delete(t.id); });
    };
    tx.oncomplete = () => {
      if (currentActiveAlbumId === albumId) switchPage('home');
      loadData();
      alert("作品集已刪除！");
    };
  }

  function readFileTextSmart(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        let text = e.target.result;
        if (text.includes('\uFFFD')) {
          const readerSJIS = new FileReader();
          readerSJIS.onload = (e2) => resolve(e2.target.result);
          readerSJIS.readAsText(file, 'shift-jis');
        } else { resolve(text); }
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  // 超級洗淨檔名：移除副檔名、底線、減號與前後空白，支援模糊比對
  function getCleanBaseName(filename) {
    if (!filename) return "";
    let clean = filename.trim();
    if (clean.includes('.')) {
      clean = clean.substring(0, clean.lastIndexOf('.'));
    }
    return clean.toLowerCase().replace(/[\s\-_]/g, '').trim();
  }

  // 大升級：一鍵配對與批量匯入核心 logic
  async function batchUploadAndPair() {
    const selectEl = document.getElementById("select-album");
    const albumId = parseInt(selectEl.value);
    
    if (!albumId || isNaN(albumId)) {
      return alert("⚠️ 請先在選單選擇目標作品分區！");
    }

    const audioFiles = Array.from(document.getElementById("batch-audios").files || []);
    if (audioFiles.length === 0) {
      return alert("⚠️ 請選取要上傳的音訊檔案！");
    }

    const lrcFiles = Array.from(document.getElementById("batch-lrcs").files || []);
    const btnBatch = document.getElementById("btn-batch-upload");
    
    // UI 載入動畫防呆
    btnBatch.disabled = true;
    const originalBtnText = btnBatch.innerText;
    btnBatch.innerText = "⏳ 正在配對與匯入中，請稍候...";

    try {
      // 建立字幕 Map 對照表
      const lrcMap = new Map();
      for (let lrcFile of lrcFiles) {
        let cleanKey = getCleanBaseName(lrcFile.name);
        lrcMap.set(cleanKey, lrcFile);
      }

      let pairedCount = 0;
      const tx = db.transaction(["tracks"], "readwrite");
      const store = tx.objectStore("tracks");

      for (let audioFile of audioFiles) {
        let audioCleanKey = getCleanBaseName(audioFile.name);
        let displayTitle = audioFile.name.includes('.') ? audioFile.name.substring(0, audioFile.name.lastIndexOf('.')) : audioFile.name;
        
        let lrcText = "";
        if (lrcMap.has(audioCleanKey)) {
          let matchedLrcFile = lrcMap.get(audioCleanKey);
          lrcText = await readFileTextSmart(matchedLrcFile);
          pairedCount++;
        }

        store.add({
          albumId: albumId,
          title: displayTitle,
          audioBlob: audioFile,
          lrcText: lrcText
        });
      }

      tx.oncomplete = () => {
        alert(`🎉 批量匯入成功！\n共成功上傳 ${audioFiles.length} 個音訊，其中 ${pairedCount} 個已精準自動配對字幕！`);
        document.getElementById("batch-audios").value = "";
        document.getElementById("batch-lrcs").value = "";
        btnBatch.disabled = false;
        btnBatch.innerText = originalBtnText;
        loadData();
      };

    } catch (err) {
      console.error(err);
      alert("❌ 匯入過程中發生錯誤，請重新試試看！");
      btnBatch.disabled = false;
      btnBatch.innerText = originalBtnText;
    }
  }

  async function addTrack() {
    const albumId = parseInt(document.getElementById("select-album").value);
    if (!albumId) return alert("請先選擇作品分區！");
    const audioFile = document.getElementById("track-audio").files[0];
    if (!audioFile) return alert("請選擇音訊檔案！");
    
    let defaultTitle = audioFile.name.substring(0, audioFile.name.lastIndexOf('.')) || audioFile.name;
    const title = document.getElementById("track-title-input").value.trim() || defaultTitle;
    const lrcFile = document.getElementById("track-lrc").files[0];
    let lrcText = lrcFile ? await readFileTextSmart(lrcFile) : "";

    const tx = db.transaction(["tracks"], "readwrite");
    tx.objectStore("tracks").add({ albumId, title, audioBlob: audioFile, lrcText });
    tx.oncomplete = () => {
      alert("篇章新增成功！");
      document.getElementById("track-title-input").value = "";
      document.getElementById("track-audio").value = "";
      document.getElementById("track-lrc").value = "";
      loadData();
    };
  }

  async function saveTrackSubtitle(trackId, lrcText) {
    return new Promise((resolve) => {
      const tx = db.transaction(["tracks"], "readwrite");
      const store = tx.objectStore("tracks");
      store.get(trackId).onsuccess = (e) => {
        const track = e.target.result;
        if (track) { track.lrcText = lrcText; store.put(track); }
      };
      tx.oncomplete = () => {
        const t = tracks.find(item => item.id === trackId);
        if (t) t.lrcText = lrcText;
        if (currentIndex !== -1 && currentTrackList[currentIndex] && currentTrackList[currentIndex].id === trackId) {
          currentTrackList[currentIndex].lrcText = lrcText;
          currentLrc = parseSubtitles(lrcText, audio.duration);
        }
        loadData(); resolve(true);
      };
    });
  }

  async function uploadCurrentTrackLrc(event) {
    if (currentIndex === -1 || !currentTrackList[currentIndex]) return alert("請先選擇篇章！");
    const file = event.target.files[0];
    if (!file) return;
    const text = await readFileTextSmart(file);
    await saveTrackSubtitle(currentTrackList[currentIndex].id, text);
    alert("字幕匯入成功！"); event.target.value = "";
  }

  async function pasteCurrentTrackLrc() {
    if (currentIndex === -1 || !currentTrackList[currentIndex]) return alert("請先選擇篇章！");
    const text = prompt("請貼上字幕內容：");
    if (text && text.trim()) { await saveTrackSubtitle(currentTrackList[currentIndex].id, text.trim()); alert("字幕更新成功！"); }
  }

  async function inspectCurrentTrackLrc() {
    if (currentIndex === -1 || !currentTrackList[currentIndex]) return alert("請先選擇篇章！");
    const track = currentTrackList[currentIndex];
    const newText = prompt(`【${track.title}】字幕內容：`, track.lrcText || "");
    if (newText !== null) { await saveTrackSubtitle(track.id, newText.trim()); alert("字幕已儲存！"); }
  }

  async function editTrackLrc(trackId) {
    const track = tracks.find(t => t.id === trackId);
    if (!track) return;
    const newText = prompt(`編輯【${track.title}】字幕：`, track.lrcText || "");
    if (newText !== null) { await saveTrackSubtitle(trackId, newText.trim()); alert("字幕已儲存！"); }
  }

  async function deleteTrack(trackId, event) {
    event.stopPropagation();
    if (!confirm("確定要刪除這個篇章嗎？")) return;
    const tx = db.transaction(["tracks"], "readwrite");
    tx.objectStore("tracks").delete(trackId);
    tx.oncomplete = () => { loadData(); alert("篇章已刪除！"); };
  }

  function renderAlbumList() {
    const listEl = document.getElementById("album-list");
    const paginationEl = document.getElementById("pagination-container");
    listEl.innerHTML = ""; paginationEl.innerHTML = "";
    if (albums.length === 0) {
      listEl.innerHTML = "<div style='color:var(--text-sub); font-size:0.9rem; padding:10px 0; text-align:center;'>目前沒有作品分區，請從右上角管理選單新增。</div>";
      return;
    }
    const totalPages = Math.ceil(albums.length / itemsPerPage);
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    const start = (currentPage - 1) * itemsPerPage;
    const paginatedAlbums = albums.slice(start, start + itemsPerPage);

    paginatedAlbums.forEach(album => {
      const albumTracks = tracks.filter(t => t.albumId === album.id);
      const card = document.createElement("div");
      card.className = "album-grid-card";
      card.onclick = () => {
        if (album.bgBlobs && album.bgBlobs.length > 0) {
          isCustomAlbumPlaying = true;
          currentAlbumBgBlobs = album.bgBlobs;
          albumBgIndex = 0;
          applyBackgroundBlob(currentAlbumBgBlobs[albumBgIndex]);
        } else {
          isCustomAlbumPlaying = false;
          if (globalBackgrounds.length > 0) applyBackgroundBlob(globalBackgrounds[bgIndex]);
        }
        switchPage('detail', album.id);
      };
      
      let thumbHtml = '<div class="album-grid-thumb" style="display:flex; align-items:center; justify-content:center; color:#555; font-size:1.4rem;">📁</div>';
      let covers = album.coverBlobs || (album.coverBlob ? [album.coverBlob] : []);
      if (covers.length > 0) {
        let thumbUrl = createTrackedObjectURL(covers[0]);
        if (covers[0].type && covers[0].type.startsWith('video/')) {
          thumbHtml = `<video src="${thumbUrl}" class="album-grid-thumb" autoplay loop muted playsinline style="object-fit:cover;"></video>`;
        } else {
          thumbHtml = `<img src="${thumbUrl}" class="album-grid-thumb" style="object-fit:cover;">`;
        }
      }

      card.innerHTML = `
        ${thumbHtml}
        <div class="album-grid-info">
          <div class="album-grid-title">${album.title}</div>
          <div class="album-grid-count">包含 ${albumTracks.length} 個篇章 ▶</div>
        </div>
        <div class="btn-action-col" onclick="event.stopPropagation()">
          <button class="btn-album-action" onclick="editAlbumCovers(${album.id}, event)">✏️ 修改封面</button>
          <button class="btn-album-del" onclick="deleteAlbum(${album.id}, event)">🗑️ 刪除</button>
        </div>
      `;
      listEl.appendChild(card);
    });

    if (totalPages > 1) {
      paginationEl.innerHTML = `
        <div class="pagination-bar">
          <button class="btn-page" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">◀ 上一頁</button>
          <span class="page-info">第 ${currentPage} / ${totalPages} 頁</span>
          <button class="btn-page" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">下一頁 ▶</button>
        </div>
      `;
    }
  }

  function changePage(page) { currentPage = page; renderAlbumList(); }

  function renderDetailView(albumId) {
    const album = albums.find(a => a.id === albumId);
    if (!album) return;
    document.getElementById("detail-album-title").innerText = album.title;
    const container = document.getElementById("chapter-list-container");
    container.innerHTML = "";
    const albumTracks = tracks.filter(t => t.albumId === albumId);
    if (albumTracks.length === 0) {
      container.innerHTML = "<div style='color:var(--text-sub); font-size:0.9rem; padding:10px 0; text-align:center;'>此分區目前沒有篇章。</div>";
      return;
    }
    albumTracks.forEach(track => {
      const item = document.createElement("div");
      item.className = "chapter-file-item";
      item.onclick = () => playTrack(album.id, track.id);
      item.innerHTML = `
        <div class="chapter-info-left">
          <div class="play-icon-circle">▶</div>
          <div class="chapter-meta-text">
            <div class="chapter-name">${track.title}</div>
            <div class="chapter-duration-sub">${(track.lrcText && track.lrcText.trim()) ? '💬 有動態字幕' : '⚪ 無動態字幕'}</div>
          </div>
        </div>
        <div class="btn-action-group" onclick="event.stopPropagation()">
          <button class="btn-sm btn-sm-edit" onclick="editTrackLrc(${track.id})">字幕</button>
          <button class="btn-sm btn-sm-del" onclick="deleteTrack(${track.id}, event)">刪除</button>
        </div>
      `;
      container.appendChild(item);
    });
  }

  function playTrack(albumId, trackId) {
    const album = albums.find(a => a.id === albumId);
    currentTrackList = tracks.filter(t => t.albumId === albumId);
    currentIndex = currentTrackList.findIndex(t => t.id === trackId);
    if (currentIndex === -1) return;

    const track = currentTrackList[currentIndex];
    currentPlayingAlbumId = albumId;

    audio.src = createTrackedObjectURL(track.audioBlob);
    audio.play();

    document.getElementById("btn-play").innerText = "⏸";
    document.getElementById("mini-btn-play").innerText = "⏸";

    document.getElementById("mini-title").innerText = track.title;
    document.getElementById("mini-lrc").innerText = album ? album.title : "ASMR 隨身庫";
    document.getElementById("album-tag").innerText = album ? `📁 ${album.title}` : "";

    activeAlbumCoverBlobs = album && album.coverBlobs ? album.coverBlobs : (album && album.coverBlob ? [album.coverBlob] : []);
    activeCoverIndex = 0;
    setupPlayerCovers();

    let firstCoverUrl = activeAlbumCoverBlobs.length > 0 ? createTrackedObjectURL(activeAlbumCoverBlobs[0]) : "";
    document.getElementById("mini-thumb").src = firstCoverUrl || "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%23121218'/></svg>";

    updateMediaSessionMetadata(track.title, album ? album.title : "ASMR 隨身庫", firstCoverUrl);
    currentLrc = parseSubtitles(track.lrcText, audio.duration);

    miniPlayer.classList.remove("hidden");
    expandPlayer();
  }

  function setupPlayerCovers() {
    const coverBox = document.getElementById("player-cover-box");
    const navButtons = coverBox.querySelectorAll('.btn-cover-nav, .cover-indicator');
    coverBox.innerHTML = "";
    navButtons.forEach(btn => coverBox.appendChild(btn));

    coverElements = [];

    if (activeAlbumCoverBlobs.length === 0) {
      cachedCoverElement = null;
      isCoverVideoActive = false;
      document.getElementById("cover-indicator").innerText = "0 / 0";
      return;
    }

    activeAlbumCoverBlobs.forEach((blob, idx) => {
      let url = createTrackedObjectURL(blob);
      let el;
      if (blob.type && blob.type.startsWith('video/')) {
        el = document.createElement('video');
        el.src = url;
        el.autoplay = true;
        el.loop = true;
        el.muted = true;
        el.playsInline = true;
      } else {
        el = document.createElement('img');
        el.src = url;
      }
      el.style.display = idx === 0 ? "block" : "none";
      coverBox.appendChild(el);
      coverElements.push(el);
    });

    updateCoverDisplay();
  }

  function updateCoverDisplay() {
    if (coverElements.length === 0) return;
    coverElements.forEach((el, idx) => {
      if (idx === activeCoverIndex) {
        el.style.display = "block";
        cachedCoverElement = el;
        isCoverVideoActive = el.tagName === 'VIDEO';
        if (isCoverVideoActive) el.play().catch(() => {});
      } else {
        el.style.display = "none";
        if (el.tagName === 'VIDEO') el.pause();
      }
    });
    document.getElementById("cover-indicator").innerText = `${activeCoverIndex + 1} / ${coverElements.length}`;
  }

  function nextCover() {
    if (coverElements.length <= 1) return;
    activeCoverIndex = (activeCoverIndex + 1) % coverElements.length;
    updateCoverDisplay();
  }

  function prevCover() {
    if (coverElements.length <= 1) return;
    activeCoverIndex = (activeCoverIndex - 1 + coverElements.length) % coverElements.length;
    updateCoverDisplay();
  }

  function togglePlay() {
    if (currentIndex === -1) return;
    if (audio.paused) {
      audio.play();
      if (isCoverVideoActive && cachedCoverElement) cachedCoverElement.play();
      document.getElementById("btn-play").innerText = "⏸";
      document.getElementById("mini-btn-play").innerText = "⏸";
    } else {
      audio.pause();
      if (isCoverVideoActive && cachedCoverElement) cachedCoverElement.pause();
      document.getElementById("btn-play").innerText = "▶";
      document.getElementById("mini-btn-play").innerText = "▶";
    }
  }

  function prevTrack() { if (currentIndex > 0) playTrack(currentPlayingAlbumId, currentTrackList[currentIndex - 1].id); }
  function nextTrack() { if (currentIndex < currentTrackList.length - 1) playTrack(currentPlayingAlbumId, currentTrackList[currentIndex + 1].id); }
  function seekRelative(seconds) { if (!audio.duration) return; audio.currentTime = Math.min(Math.max(audio.currentTime + seconds, 0), audio.duration); }

  function toggleMute() {
    if (audio.muted) {
      audio.muted = false; document.getElementById("btn-mute").innerText = "🔈"; volumeSlider.value = lastVolume;
    } else {
      lastVolume = audio.volume; audio.muted = true; document.getElementById("btn-mute").innerText = "🔇"; volumeSlider.value = 0;
    }
  }

  volumeSlider.addEventListener("input", (e) => {
    audio.volume = e.target.value; audio.muted = (e.target.value == 0);
    document.getElementById("btn-mute").innerText = (e.target.value == 0) ? "🔇" : "🔈";
  });

  seekSlider.addEventListener("input", (e) => {
    if (!audio.duration) return;
    audio.currentTime = (e.target.value / 100) * audio.duration;
  });

  audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    seekSlider.value = (audio.currentTime / audio.duration) * 100;
    document.getElementById("time-current").innerText = formatTime(audio.currentTime);
    document.getElementById("time-duration").innerText = formatTime(audio.duration);

    let activeText = getActiveSubtitleText(audio.currentTime);
    document.getElementById("lrc-box").innerText = activeText;
    document.getElementById("mini-lrc").innerText = activeText !== "♪ 選擇小篇章開始收聽 ♪" ? activeText : "♪ 播放中...";
    updatePositionState();
  });

  audio.addEventListener("ended", () => {
    if (currentIndex < currentTrackList.length - 1) { nextTrack(); }
    else { document.getElementById("btn-play").innerText = "▶"; document.getElementById("mini-btn-play").innerText = "▶"; }
  });

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function expandPlayer() {
    playerCard.style.transform = 'translateY(0)';
    playerCard.classList.remove("minimized");
    miniPlayer.classList.add("hidden");
  }

  function minimizePlayer() {
    playerCard.style.transform = 'translateY(105%)';
    playerCard.classList.add("minimized");
    if (currentIndex !== -1) miniPlayer.classList.remove("hidden");
  }

  function parseSubtitles(rawText, duration) {
    if (!rawText || !rawText.trim()) return [];
    const lines = rawText.split('\n');
    let parsed = [];
    for (let line of lines) {
      line = line.trim();
      if (!line) continue;
      const lrcMatch = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/);
      if (lrcMatch) {
        const m = parseInt(lrcMatch[1], 10);
        const s = parseInt(lrcMatch[2], 10);
        const msStr = lrcMatch[3];
        const ms = parseInt(msStr.length === 2 ? msStr * 10 : msStr, 10);
        parsed.push({ time: m * 60 + s + ms / 1000, text: lrcMatch[4].trim() });
        continue;
      }
      const srtMatch = line.match(/(\d{2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})[,.](\d{3})/);
      if (srtMatch) {
        parsed.push({ time: parseInt(srtMatch[1])*3600 + parseInt(srtMatch[2])*60 + parseInt(srtMatch[3]) + parseInt(srtMatch[4])/1000, text: "" });
        continue;
      }
      if (parsed.length > 0 && !line.match(/^\d+$/) && !line.includes('-->')) {
        if (!parsed[parsed.length - 1].text) parsed[parsed.length - 1].text = line;
        else parsed[parsed.length - 1].text += " " + line;
      }
    }
    return parsed.sort((a, b) => a.time - b.time);
  }

  function getActiveSubtitleText(currentTime) {
    if (!currentLrc || currentLrc.length === 0) return "♪ 享受純淨的 ASMR 時光 ♪";
    let active = "♪ 享受純淨的 ASMR 時光 ♪";
    for (let item of currentLrc) {
      if (currentTime >= item.time) active = item.text || active;
      else break;
    }
    return active;
  }

  function initMediaSession() {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => togglePlay());
      navigator.mediaSession.setActionHandler('pause', () => togglePlay());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
    }
  }

  function updateMediaSessionMetadata(title, albumTitle, coverUrl) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title || 'ASMR 篇章',
        artist: albumTitle || 'ASMR 隨身庫',
        album: albumTitle || 'ASMR 隨身庫',
        artwork: coverUrl ? [{ src: coverUrl, sizes: '512x512', type: 'image/png' }] : []
      });
    }
  }

  function updatePositionState() {
    if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession && audio.duration) {
      try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate || 1, position: audio.currentTime }); } catch (e) {}
    }
  }
</script>
