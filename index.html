<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>軟軟專用肉棒</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --accent-color: #ff477e;
            --accent-glow: rgba(255, 71, 126, 0.4);
            --text-main: #f0f0f5;
            --text-sub: #9e9ea8;
            --border-color: #2e2e42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background-color 0.5s ease;
        }

        /* 閃光特效 */
        body.flash-effect {
            animation: flashPulse 0.6s infinite alternate;
        }

        @keyframes flashPulse {
            0% { background-color: var(--bg-color); }
            100% { background-color: #3b1424; }
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .upload-section {
            background-color: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: var(--accent-color);
        }

        .upload-section input {
            display: none;
        }

        .upload-label {
            color: var(--text-sub);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .player-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid var(--border-color);
        }

        .track-info {
            text-align: center;
        }

        .track-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-status {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        /* 互動愛心能量槽區域 */
        .pleasure-meter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(255, 71, 126, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 71, 126, 0.15);
        }

        .heart-wrapper {
            position: relative;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart-icon {
            font-size: 48px;
            position: absolute;
            color: #2e2e42; /* 底色：未填滿時的暗色 */
            transition: transform 0.1s ease;
        }

        .heart-fill {
            font-size: 48px;
            position: absolute;
            color: var(--accent-color);
            clip-path: inset(100% 0 0 0); /* 初始完全遮蔽 */
            transition: clip-path 0.1s linear, filter 0.3s ease;
            filter: drop-shadow(0 0 2px rgba(255, 71, 126, 0.5));
        }

        /* 當愛心填滿時的動態心跳 */
        .heart-wrapper.maxed .heart-icon,
        .heart-wrapper.maxed .heart-fill {
            animation: heartbeat 0.8s infinite ease-in-out;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        .meter-text {
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 進度條 */
        .progress-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            appearance: none;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--text-main);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .time-codes {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* 控制按鈕 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--border-color);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #3e3e5c;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            width: 56px;
            height: 56px;
            background-color: var(--accent-color);
            color: white;
            font-size: 1.4rem;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-primary:hover {
            background-color: #ff2a6d;
        }

        /* 播放清單 */
        .playlist-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .playlist-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }

        .playlist-item:hover {
            background-color: rgba(255,255,255,0.03);
        }

        .playlist-item.active {
            background-color: rgba(255, 71, 126, 0.15);
            color: var(--accent-color);
            font-weight: 500;
        }

        /* 捲軸美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ASMR Private Vault</h1>
            <button class="btn" id="pip-btn" title="切換懸浮視窗" style="width: 36px; height: 36px; font-size: 0.9rem;">🪟</button>
        </header>

        <!-- 檔案上傳區 -->
        <div class="upload-section" id="drop-zone">
            <input type="file" id="audio-file-input" accept="audio/*" multiple>
            <label for="audio-file-input" class="upload-label">
                點擊或拖曳上傳 ASMR 音檔 (支援多檔批量)<br>
                <span style="font-size: 0.75rem; color: #6e6e80;">將自動針對女性舒適呻吟與高頻氣音進行解析</span>
            </label>
        </div>

        <!-- 播放器主卡片 -->
        <div class="player-card">
            <div class="track-info">
                <div class="track-title" id="track-title">尚未選擇音檔</div>
                <div class="track-status" id="track-status">等待播放中...</div>
            </div>

            <!-- 愛心填滿互動能量槽（根據舒服的聲音動態填滿） -->
            <div class="pleasure-meter-container">
                <div class="heart-wrapper" id="heart-wrapper">
                    <div class="heart-icon">❤️</div>
                    <div class="heart-fill" id="heart-fill">❤️</div>
                </div>
                <div class="meter-text" id="meter-text">舒適度解析中: 0%</div>
            </div>

            <!-- 進度條 -->
            <div class="progress-container">
                <input type="range" class="progress-bar" id="progress-bar" value="0" min="0" max="100" step="0.1">
                <div class="time-codes">
                    <span id="current-time">00:00</span>
                    <span id="total-time">00:00</span>
                </div>
            </div>

            <!--  کنترل介面 -->
            <div class="controls">
                <button class="btn" id="prev-btn" title="上一首">⏮</button>
                <button class="btn btn-primary" id="play-btn" title="播放/暫停">▶</button>
                <button class="btn" id="next-btn" title="下一首">⏭</button>
            </div>
        </div>

        <!-- 播放清單 -->
        <div class="playlist-container" id="playlist">
            <!-- 動態生成清單 -->
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        const audioFile jouwInput = document.getElementById('audio-file-input');
        const audioElement = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const trackTitleEl = document.getElementById('track-title');
        const trackStatusEl = document.getElementById('track-status');
        const playlistEl = document.getElementById('playlist');
        const pipBtn = document.getElementById('pip-btn');
        
        // 互動效果元素
        const heartWrapper = document.getElementById('heart-wrapper');
        const heartFill = document.getElementById('heart-fill');
        const meterText = document.getElementById('meter-text');
        const bodyElement = document.body;

        let playlist = [];
        let currentIndex = 0;
        
        // 語音頻譜分析變數
        let audioCtx, analyser, sourceNode;
        let isAnalyzerInit = false;
        let pleasureLevel = 0; // 0 到 100 的愛心填滿進度

        // 初始化 Web Audio API 用於即時分析聲音頻率（抓取女性舒適呻吟的高頻段與氣音特徵）
        function initAudioAnalyzer() {
            if (isAnalyzerInit) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                sourceNode = audioCtx.createMediaElementSource(audioElement);
                
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                analyser.fftSize = 512;
                isAnalyzerInit = true;
            } catch (e) {
                console.log("AudioContext 初始化受限，需者互動觸發", e);
            }
        }

        // 檔案上傳處理
        audioFile jouwInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                playlist.push({
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    url: URL.createObjectURL(file)
                });
            });

            renderPlaylist();
            if (audioElement.paused && playlist.length === files.length) {
                loadTrack(0);
            }
        });

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
                item.innerHTML = `<span>${track.name}</span>`;
                item.addEventListener('click', () => {
                    loadTrack(index);
                    playAudio();
                });
                playlistEl.appendChild(item);
            });
        }

        function loadTrack(index) {
            if (playlist.length === 0) return;
            currentIndex = index;
            const track = playlist[currentIndex];
            audioElement.src = track.url;
            trackTitleEl.textContent = track.name;
            trackStatusEl.textContent = "準備就緒";
            renderPlaylist();
        }

        function playAudio() {
            if (!audioElement.src) return;
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioElement.play();
            playBtn.textContent = '⏸';
            trackStatusEl.textContent = "正在聆聽舒服的聲音...";
            initAudioAnalyzer();
            startPleasureMonitor();
        }

        function pauseAudio() {
            audioElement.pause();
            playBtn.textContent = '▶';
            trackStatusEl.textContent = "已暫停";
        }

        playBtn.addEventListener('click', () => {
            if (audioElement.paused) {
                playAudio();
            } else {
                pauseAudio();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            playAudio();
        });

        nextBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
            playAudio();
        });

        audioElement.addEventListener('ended', () => {
            nextBtn.click();
        });

        // 格式化時間
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        audioElement.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audioElement.duration);
            progressBar.max = audioElement.duration;
        });

        audioElement.addEventListener('timeupdate', () => {
            if (!audioElement.paused) {
                progressBar.value = audioElement.currentTime;
                currentTimeEl.textContent = formatTime(audioElement.currentTime);
            }
        });

        progressBar.addEventListener('input', () => {
            audioElement.currentTime = progressBar.value;
        });

        // 即時音頻分析與愛心填滿互動核心邏輯
        function startPleasureMonitor() {
            if (!analyser) return;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function updateMeter() {
                if (audioElement.paused || audioElement.ended) return;

                analyser.getByteFrequencyData(dataArray);

                // 針對女性舒服呻吟與高頻呼吸聲（集中在中高頻區段，例如 bin 30 到 120）進行加權計算
                let highFreqSum = 0;
                let startBin = Math.floor(bufferLength * 0.15);
                let endBin = Math.floor(bufferLength * 0.7);
                
                for (let i = startBin; i < endBin; i++) {
                    highFreqSum += dataArray[i];
                }
                let avgEnergy = highFreqSum / (endBin - startBin);

                // 根據聲音舒服與高亢程度調整愛心填滿速度
                // 聲音越舒服、頻率能量越高，填滿速度越快；若聲音平淡則會緩慢遞減
                if (avgEnergy > 35) {
                    let fillSpeed = (avgEnergy / 255) * 4.5; // 聲音越激烈舒服，加速度越高
                    pleasureLevel = Math.min(100, pleasureLevel + fillSpeed);
                } else {
                    pleasureLevel = Math.max(0, pleasureLevel - 1.2); // 沒有呻吟時緩慢下降
                }

                // 更新畫面上的愛心填滿程度 (利用 clip-path 達成由下往上填滿)
                let clipPercent = 100 - pleasureLevel;
                heartFill.style.clipPath = `inset(${clipPercent}% 0 0 0)`;
                meterText.textContent = `舒適度解析中: ${Math.round(pleasureLevel)}%`;

                // 當愛心完全填滿（達到 98% 以上）時，啟動滿載跳動與粉紅閃光特效
                if (pleasureLevel >= 98) {
                    heartWrapper.classList.add('maxed');
                    bodyElement.classList.add('flash-effect');
                } else {
                    heartWrapper.classList.remove('maxed');
                    bodyElement.classList.remove('flash-effect');
                }

                requestAnimationFrame(updateMeter);
            }

            requestAnimationFrame(updateMeter);
        }

        // 桌面懸浮視窗 (Picture-in-Picture 支援)
        pipBtn.addEventListener('click', async () => {
            try {
                if (!document.pictureInPictureElement) {
                    // 建立即時畫布作為懸浮視窗內容
                    const canvas = document.createElement('canvas');
                    canvas.width = 300;
                    canvas.height = 150;
                    const ctx = canvas.getContext('2d');
                    
                    const video = document.createElement('video');
                    video.muted = true;
                    video.srcObject = canvas.captureStream();
                    video.play();

                    function drawPip() {
                        if (!document.pictureInPictureElement) return;
                        ctx.fillStyle = '#1a1a24';
                        ctx.fillRect(0, 0, 300, 150);
                        
                        // 繪製標題
                        ctx.fillStyle = '#f0f0f5';
                        ctx.font = '14px sans-serif';
                        let currentTrackName = playlist[currentIndex] ? playlist[currentIndex].name : "ASMR 播放中";
                        ctx.fillText(currentTrackName.substring(0, 22), 20, 40);

                        // 繪製愛心與舒適度百分比
                        ctx.fillStyle = '#ff477e';
                        ctx.font = 'bold 24px sans-serif';
                        ctx.fillText(`❤️ ${Math.round(pleasureLevel)}%`, 20, 90);

                        ctx.fillStyle = '#9e9ea8';
                        ctx.font = '12px sans-serif';
                        ctx.fillText(pleasureLevel >= 98 ? "✨ 舒服狀態高潮滿載 ✨" : "正在享受舒適呻吟...", 20, 120);

                        requestAnimationFrame(drawPip);
                    }
                    drawPip();

                    await video.requestPictureInPicture();
                } else {
                    await document.exitPictureInPicture();
                }
            } catch (err) {
                console.error("懸浮視窗啟動失敗:", err);
            }
        });
    </script>
</body>
</html>
