<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫 (動態影音 YouTube 風格滿版流暢升級版)</title>
  <style>
    /* Additional necessary styles */
    body {
      margin: 0; padding: 0;
      background: #07070a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, "PingFang TC", sans-serif;
    }
    #video-player-box { width: 100%; height: 100%; }
    #main-video-player { width: 100%; height: 100%; object-fit: cover; }
    .heart-toy-container { /* styles for heart effect */ }
    /* Other styles omitted for brevity */
  </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img" alt="全域背景">
<div id="bg-overlay"></div>

<div class="container">
  <div class="top-bar">
    <div class="app-logo" onclick="switchPage('home')">🌸 ASMR 隨身庫</div>
  </div>

  <div id="player-card" class="player-card">
    <div id="media-display-container">
      <div class="video-player-box" id="video-player-box">
        <video id="main-video-player" playsinline webkit-playsinline muted loop></video>
        <div class="heart-toy-container" id="heart-toy" onclick="triggerHeartEffect()">
          <svg class="heart-svg"> <!-- Heart Effect SVG --> </svg>
        </div>
      </div>
    </div>
    <div class="controls">
      <button onclick="toggleFullScreen()">🔲 全螢幕</button>
      <button id="btn-play" onclick="togglePlay()">▶</button>
    </div>
  </div>
</div>

<audio id="main-audio" crossorigin="anonymous" preload="auto"></audio>
<script>
  const mainVideoPlayer = document.getElementById("main-video-player");
  const audio = document.getElementById("main-audio");
  
  function toggleFullScreen() {
    const container = document.getElementById("media-display-container");
    if (!document.fullscreenElement) {
      container.requestFullscreen().catch(err => {
        console.error(`${err.message}`);
      });
    } else {
      document.exitFullscreen();
    }
  }

  function togglePlay() {
    if (mainVideoPlayer.paused) {
      mainVideoPlayer.play();
      audio.play();
      document.getElementById("btn-play").innerText = "⏸";
    } else {
      mainVideoPlayer.pause();
      audio.pause();
      document.getElementById("btn-play").innerText = "▶";
    }
  }

  function triggerHeartEffect() {
    // Logic for heart effect
  }

  // Event listeners for fullscreen change
  document.addEventListener("fullscreenchange", function() {
    const isFullscreen = document.fullscreenElement != null;
    mainVideoPlayer.style.display = isFullscreen ? "block" : "none";
  });

  // Preload video and audio, and add functionality as required
</script>
</body>
</html>
