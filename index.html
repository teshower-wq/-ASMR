<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫 (全功能修復升級版)</title>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.45);
      --bg-dark: #07070a;
      --card-glass: rgba(16, 16, 22, 0.85);
      --card-glass-hover: rgba(24, 24, 34, 0.94);
      --text-main: #ffffff;
      --text-sub: #9494ab;
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-hover: rgba(255, 121, 198, 0.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; padding-bottom: 130px;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, "PingFang TC", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }

    #bg-video, #bg-img {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; background-color: var(--bg-dark);
      z-index: -2; display: none; filter: brightness(0.7) blur(4px);
      transform: scale(1); transition: opacity 0.8s ease;
      will-change: transform, opacity;
    }
    @media (max-width: 768px) {
      #bg-video, #bg-img {
        top: -10vh; left: -10vw; width: 120vw; height: 120vh;
        transform: scale(0.8);
      }
    }

    #bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(7,7,10,0.3) 0%, rgba(7,7,10,0.88) 100%);
      z-index: -1; pointer-events: none;
    }

    .container { width: 100%; max-width: 680px; z-index: 1; position: relative; }
    .top-bar { width: 100%; max-width: 680px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; z-index: 10; }
    .app-logo { font-size: 1.4rem; font-weight: 800; color: var(--primary-pink); text-shadow: 0 0 20px var(--pink-glow); cursor: pointer; letter-spacing: 0.5px; }
    .top-actions { display: flex; gap: 8px; }
    
    .btn-toggle-admin {
      background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 10px 14px; border-radius: 14px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn-toggle-admin:hover { background: rgba(255, 121, 198, 0.25); border-color: var(--primary-pink); }
    
    .btn-clear-mem {
      background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444; padding: 10px 14px; border-radius: 14px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn-clear-mem:hover { background: rgba(239, 68, 68, 0.25); }

    .admin-drawer { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; will-change: max-height; }
    .admin-drawer.open { max-height: 3000px; }

    .glass-card {
      background: var(--card-glass);
      border: 1px solid var(--border-glass); border-radius: 24px; padding: 20px; margin-bottom: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; color: var(--primary-pink); display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.25s ease;
    }
    input:focus, select:focus { border-color: var(--primary-pink); box-shadow: 0 0 12px rgba(255, 121, 198, 0.25); background: rgba(0,0,0,0.6); }
    
    input[type="file"] { padding: 8px; color: var(--text-sub); font-size: 0.85rem; cursor: pointer; }
    input[type="file"]::file-selector-button {
      background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-right: 12px;
    }

    .btn-pink {
      width: 100%; background: linear-gradient(135deg, #ff79c6 0%, #ff52b2 100%); color: #07070a; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(255, 121, 198, 0.35); transition: all 0.25s ease;
    }
    .btn-pink:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(255, 121, 198, 0.5); }

    .btn-blue {
      width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #ffffff; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35); transition: all 0.25s ease;
    }

    .page-view { display: none; width: 100%; animation: fadeIn 0.25s ease; }
    .page-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .album-grid-card {
      background: var(--card-glass);
      border: 1px solid var(--border-glass); border-radius: 20px; padding: 14px; margin-bottom: 12px;
      display: flex; align-items: center; cursor: pointer; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .album-grid-card:hover {
      background: var(--card-glass-hover); border-color: var(--border-glass-hover);
      transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 121, 198, 0.15);
    }
    .album-grid-thumb { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; margin-right: 14px; flex-shrink: 0; background: #121218; }
    .album-grid-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .album-grid-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .album-grid-count { font-size: 0.85rem; color: var(--primary-pink); font-weight: 600; }
    
    .btn-action-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; z-index: 2; }
    .btn-album-del {
      background: rgba(255, 85, 85, 0.1); border: 1px solid rgba(255, 85, 85, 0.25);
      color: #ff6b6b; padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }

    .breadcrumb-bar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 0.95rem; font-weight: 700;
      color: var(--primary-pink); cursor: pointer; padding: 2px 0;
    }

    .chapter-file-list { display: flex; flex-direction: column; gap: 8px; }
    .chapter-file-item {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 14px;
      cursor: pointer; transition: all 0.2s ease;
    }
    .chapter-file-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255, 121, 198, 0.25); }
    .chapter-info-left { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; margin-right: 10px; }
    .play-icon-circle {
      width: 36px; height: 36px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.95rem; flex-shrink: 0;
    }
    .chapter-meta-text { overflow: hidden; }
    .chapter-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; margin-bottom: 2px; color: #fff; font-size: 0.92rem; }
    .chapter-duration-sub { font-size: 0.78rem; color: var(--text-sub); }

    .btn-action-group { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-sm-del { background: rgba(255,255,255,0.06); color: #ff6b6b; border: 1px solid rgba(255,85,85,0.15); padding: 5px 10px; border-radius: 9px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }

    .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .btn-page {
      background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3); color: var(--primary-pink);
      padding: 8px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.88rem;
    }
    .btn-page:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-info { font-size: 0.85rem; color: var(--text-sub); }

    .player-card {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; width: 100%; 
      max-height: 90vh; height: auto; overflow-y: auto; overflow-x: hidden;
      background: rgba(16, 16, 22, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.12); border-bottom: none; border-radius: 26px 26px 0 0;
      padding: 4px 18px 24px 18px; box-shadow: 0 -16px 50px rgba(0,0,0,0.85);
      z-index: 1000; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: pan-y; will-change: transform;
    }
    .player-card.minimized { transform: translateY(105%); }

    .drag-handle-area { width: 100%; padding: 8px 0 10px 0; display: flex; justify-content: center; cursor: grab; }
    .drag-handle { width: 50px; height: 5px; background: rgba(255, 255, 255, 0.45); border-radius: 10px; }

    /* 修復影片黑邊問題，改為完全滿版填滿模式 */
    .cover-box { 
      width: 100%; height: 260px; border-radius: 16px; 
      overflow: hidden; background: #050508; margin: 0 auto 10px auto; 
      position: relative; box-shadow: 0 6px 20px rgba(0,0,0,0.5); 
      display: flex; align-items: center; justify-content: center;
    }
    .cover-box img, .cover-box video { 
      width: 100%; height: 100%; object-fit: cover; display: none; 
      position: absolute; top: 0; left: 0; border-radius: 16px;
      will-change: transform;
    }

    .btn-cover-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 1rem; z-index: 10; transition: all 0.2s ease;
    }
    .btn-cover-nav:hover { background: rgba(255, 121, 198, 0.4); border-color: var(--primary-pink); }
    .cover-prev { left: 10px; }
    .cover-next { right: 10px; }
    .cover-indicator {
      position: absolute; bottom: 10px; right: 12px; background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px; border-radius: 8px; font-size: 0.72rem; color: #fff; z-index: 10;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .album-tag { font-size: 0.82rem; color: var(--text-sub); text-align: center; margin-bottom: 4px; font-weight: 500; }
    
    .lrc-box {
      min-height: 48px; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 1.1rem; font-weight: 800; color: var(--primary-pink);
      text-shadow: 0 0 20px var(--pink-glow), 0 2px 4px rgba(0,0,0,0.8); padding: 2px 8px; line-height: 1.3; margin-bottom: 8px;
    }

    .sub-quick-tools { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
    .btn-sub-quick {
      padding: 5px 10px; background: rgba(255, 121, 198, 0.1); border: 1px solid rgba(255, 121, 198, 0.25);
      color: var(--primary-pink); border-radius: 9px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }

    .seek-slider { width: 100%; height: 6px; accent-color: var(--primary-pink); cursor: pointer; border-radius: 3px; background: rgba(255,255,255,0.1); }
    .time-box { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-sub); margin-top: 4px; margin-bottom: 10px; font-weight: 500; }
    
    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.25rem; cursor: pointer; padding: 6px; transition: transform 0.15s, color 0.2s; }
    .btn-ctrl:hover { color: var(--primary-pink); transform: scale(1.1); }
    .btn-play-main {
      width: 48px; height: 48px; background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%); color: #07070a; border-radius: 50%;
      font-size: 1.3rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(255,255,255,0.3);
    }

    .volume-box { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 10px; padding: 0 2px; }
    .volume-slider { flex: 1; height: 5px; accent-color: var(--text-sub); cursor: pointer; }

    .bottom-tools { display: flex; gap: 8px; }
    .btn-pip {
      flex: 1; background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.82rem; cursor: pointer; text-align: center;
      box-shadow: 0 4px 15px rgba(255, 121, 198, 0.15);
    }

    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; height: 64px;
      background: rgba(16, 16, 22, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; padding: 0 14px;
      z-index: 999; cursor: pointer; box-shadow: 0 -6px 25px rgba(0,0,0,0.6); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mini-player.hidden { transform: translateY(100%); }
    .mini-thumb { width: 42px; height: 42px; border-radius: 10px; background: #121218; object-fit: cover; margin-right: 10px; flex-shrink: 0; }
    .mini-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .mini-title { font-size: 0.88rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .mini-subtitle { font-size: 0.75rem; color: var(--primary-pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .mini-btn { background: none; border: none; color: #fff; font-size: 1.15rem; padding: 6px; cursor: pointer; }
  </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img" alt="全域背景">
<div id="bg-overlay"></div>

<div class="container">
  <div class="top-bar">
    <div class="app-logo" onclick="switchPage('home')">🌸 ASMR 隨身庫</div>
    <div class="top-actions">
      <button class="btn-clear-mem" onclick="clearMemoryCache()" title="清理快取記憶體以防發燙">🧹 一鍵清理</button>
      <button class="btn-toggle-admin" onclick="toggleAdminDrawer()">⚙️ 管理選單</button>
    </div>
  </div>

  <div id="admin-drawer" class="admin-drawer">
    <div class="glass-card" style="border: 1px solid rgba(59, 130, 246, 0.4); background: rgba(16, 24, 39, 0.85);">
      <div class="card-title" style="color: #60a5fa;">🔄 跨裝置資料同步</div>
      <div style="font-size:0.85rem; color:var(--text-sub); margin-bottom:12px;">匯出包含完整音訊與字幕的 `.json` 備份檔，即可於手機或電腦端完全復原。</div>
      <button class="btn-blue" onclick="exportDataBackup()">📤 匯出備份檔案 (電腦/手機)</button>
      <div class="form-group" style="margin-top: 12px;">
        <label>📥 匯入備份檔案</label>
        <input type="file" id="import-backup-input" accept=".json" onchange="importDataBackup(event)">
      </div>
    </div>

    <div class="glass-card">
      <div class="card-title">🖼️ 設定預設全域背景</div>
      <div class="form-group"><label>選取多張圖片或 MP4 影片（手動切換）</label><input type="file" id="global-bg-input" accept="image/*,video/*" multiple></div>
      <button class="btn-pink" onclick="saveGlobalBackgrounds()">儲存全域背景素材</button>
    </div>
    
    <div class="glass-card">
      <div class="card-title">📁 建立作品分區 (支援多封面/背景)</div>
      <div class="form-group"><label>作品分區名稱</label><input type="text" id="album-title" placeholder="例如：系列名稱"></div>
      <div class="form-group"><label>封面素材 (圖片/MP4複選)</label><input type="file" id="album-covers" accept="image/*,video/*" multiple></div>
      <div class="form-group"><label>分區背景 (複選)</label><input type="file" id="album-bgs" accept="image/*,video/*" multiple></div>
      <button class="btn-pink" onclick="createAlbum()">建立分區</button>
    </div>
    
    <div class="glass-card">
      <div class="card-title">🎵 匯入篇章至分區 (支援一鍵批次自動配對)</div>
      <div class="form-group"><label>選擇作品分區</label><select id="select-album"><option value="">-- 請先建立分區 --</option></select></div>
      <div class="form-group"><label>批次音訊檔案 (可複選 .mp3 / .wav 等)</label><input type="file" id="batch-track-audio" multiple></div>
      <div class="form-group"><label>批次字幕檔案 (可複選 .lrc / .srt / .txt)</label><input type="file" id="batch-track-lrc" multiple></div>
      <div style="font-size:0.78rem; color:var(--text-sub); margin-bottom:8px;">💡 系統將自動根據主檔名對應音訊與字幕檔！</div>
      <button class="btn-pink" onclick="batchAddTracks()">⚡ 一鍵自動配對並匯入篇章</button>
    </div>
  </div>

  <div id="view-home" class="page-view active">
    <div class="glass-card">
      <div class="card-title">📚 選擇作品集</div>
      <div id="album-list">載入中...</div>
      <div id="pagination-container"></div>
    </div>
  </div>

  <div id="view-detail" class="page-view">
    <div class="glass-card">
      <div class="breadcrumb-bar" onclick="switchPage('home')">
        <span>⬅ ROOT / 📁 <span id="detail-album-title">作品名稱</span></span>
      </div>
      <div id="chapter-list-container" class="chapter-file-list"></div>
    </div>
  </div>
</div>

<div id="mini-player" class="mini-player hidden" onclick="expandPlayer()">
  <img id="mini-thumb" class="mini-thumb" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%23121218'/></svg>">
  <div class="mini-info">
    <div id="mini-title" class="mini-title">未選擇篇章</div>
    <div id="mini-lrc" class="mini-subtitle">♪ 點擊展開播放面板</div>
  </div>
  <button class="mini-btn" onclick="event.stopPropagation(); togglePlay();" id="mini-btn-play">▶</button>
  <button class="mini-btn" onclick="event.stopPropagation(); expandPlayer();">▲</button>
</div>

<div id="player-card" class="player-card minimized">
  <div class="drag-handle-area" id="drag-handle-area" onclick="minimizePlayer()" title="點擊向下滑動關閉">
    <div class="drag-handle"></div>
  </div>

  <div class="cover-box" id="player-cover-box">
    <button class="btn-cover-nav cover-prev" onclick="prevCover()">❮</button>
    <button class="btn-cover-nav cover-next" onclick="nextCover()">❯</button>
    <div class="cover-indicator" id="cover-indicator">1 / 1</div>
  </div>
  
  <div id="album-tag" class="album-tag">請選擇作品分區</div>
  <div id="lrc-box" class="lrc-box">♪ 選擇小篇章開始收聽 ♪</div>

  <div class="sub-quick-tools">
    <label class="btn-sub-quick">📂 匯入字幕<input type="file" id="quick-lrc-input" style="display:none;" onchange="uploadCurrentTrackLrc(event)"></label>
    <button class="btn-sub-quick" onclick="pasteCurrentTrackLrc()">📝 貼上字幕</button>
  </div>

  <input type="range" id="seek-slider" class="seek-slider" value="0" min="0" max="100" step="0.1">
  <div class="time-box"><span id="time-current">00:00</span><span id="time-duration">00:00</span></div>

  <div class="controls">
    <button class="btn-ctrl" onclick="prevTrack()">⏮</button>
    <button class="btn-ctrl" onclick="seekRelative(-5)">↺5</button>
    <button class="btn-ctrl btn-play-main" id="btn-play" onclick="togglePlay()">▶</button>
    <button class="btn-ctrl" onclick="seekRelative(30)">↻30</button>
    <button class="btn-ctrl" onclick="nextTrack()">⏭</button>
  </div>

  <div class="volume-box">
    <span>🔈</span>
    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
    <span>🔊</span>
  </div>

  <div class="bottom-tools">
    <button class="btn-pip" onclick="enablePiP()">📺 桌面懸浮 (PiP 字幕)</button>
  </div>
</div>

<video id="pip-video" crossorigin="anonymous" playsinline muted style="position: fixed; bottom: 0; right: 0; width: 2px; height: 2px; opacity: 0.001; pointer-events: none; z-index: -999;"></video>
<audio id="main-audio" crossorigin="anonymous" preload="auto"></audio>

<script>
  let db;
  let albums = [];
  let tracks = [];
  let currentTrackList = [];
  let currentIndex = -1;
  let currentLrc = [];
  let currentPlayingAlbumId = null;
  let currentActiveAlbumId = null;
  let currentTrackObj = null;

  let globalBackgrounds = [];
  let bgIndex = 0;

  // --- 快取記憶體管理 ---
  function createManagedUrl(blob) {
    if (!blob) return "";
    const url = URL.createObjectURL(blob);
    activeBlobUrls.push(url);
    return url;
  }

  function clearMemoryCache() {
    activeBlobUrls.forEach(url => URL.revokeObjectURL(url));
    activeBlobUrls = [];
    if (pipCtx) pipCtx.clearRect(0, 0, 1080, 1080);
    alert("🧹 已釋放所有快取記憶體！");
  }

  // --- IndexedDB 資料庫整合 ---
  const request = indexedDB.open("ASMR_Categorized_DB_V26", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("albums")) db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
  };
  request.onsuccess = (e) => { db = e.target.result; loadData(); initMediaSession(); };

  function loadData() {
    const tx = db.transaction(["albums", "tracks", "settings"], "readonly");
    tx.objectStore("albums").getAll().onsuccess = (e) => { albums = e.target.result; updateAlbumDropdown(); renderAlbumList(); };
    tx.objectStore("tracks").getAll().onsuccess = (e) => { tracks = e.target.result; renderAlbumList(); if(currentActiveAlbumId) renderDetailView(currentActiveAlbumId); };
    tx.objectStore("settings").get("globalBgs").onsuccess = (e) => {
      const res = e.target.result;
      if (res && res.blobs && res.blobs.length > 0) {
        globalBackgrounds = res.blobs;
        bgIndex = 0;
        if (!isCustomAlbumPlaying) applyBackgroundBlob(globalBackgrounds[bgIndex]);
      }
    };
  }

    if(!confirm("確定要刪除此作品分區及區內的所有篇章嗎？")) return;
    const tx = db.transaction(["albums", "tracks"], "readwrite");
    tx.objectStore("albums").delete(albumId);
    
    // 同步刪除該分區所有篇章
    const trackStore = tx.objectStore("tracks");
    tracks.filter(t => t.albumId == albumId).forEach(t => trackStore.delete(t.id));

    tx.oncomplete = () => {

  // --- 智能多檔案自動配對匯入 ---
  async function batchAddTracks() {
    const albumId = document.getElementById("select-album").value;
    if(!albumId) return alert("請先選擇作品分區！");

    const audioFiles = Array.from(document.getElementById("batch-track-audio").files);
    const lrcFiles = Array.from(document.getElementById("batch-track-lrc").files);

    if(audioFiles.length === 0) return alert("請選擇至少一個音訊檔案！");

    const getBaseName = (fileName) => fileName.substring(0, fileName.lastIndexOf('.')) || fileName;

    let successCount = 0;
    const tx = db.transaction("tracks", "readwrite");
    const store = tx.objectStore("tracks");

    for(let audioFile of audioFiles) {
      const baseName = getBaseName(audioFile.name);
      const matchedLrcFile = lrcFiles.find(f => getBaseName(f.name) === baseName);
      let lrcText = "";

      if(matchedLrcFile) {
        lrcText = await matchedLrcFile.text();
      }

      const trackObj = {
        albumId: parseInt(albumId),
        title: baseName,
        audioBlob: audioFile,
        lrcText: lrcText
      };
      store.add(trackObj);
      successCount++;
    }

    tx.oncomplete = () => {
      alert(`🎉 成功匯入並自動配對 ${successCount} 個篇章！`);
      document.getElementById("batch-track-audio").value = "";
      document.getElementById("batch-track-lrc").value = "";
      loadData();
    };
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
  }

  // --- 字幕解析與動態掛載修復 ---
  function parseLRC(lrcStr) {
    if (!lrcStr) return [];
    const lines = lrcStr.split('\n');
    const result = [];
    const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
    lines.forEach(line => {
      const match = timeReg.exec(line);
      if (match) {
        const min = parseInt(match[1]);
        const sec = parseInt(match[2]);
        const ms = parseInt(match[3].length === 2 ? match[3] * 10 : match[3]);
        const time = min * 60 + sec + ms / 1000;
        const text = line.replace(timeReg, '').trim();
        if (text) result.push({ time, text });
      }
    });
    result.sort((a, b) => a.time - b.time);
    return result;
  }

  function getActiveSubtitleText(time) {
    if (!currentLrc || currentLrc.length === 0) return "♪ 無字幕 (點擊下方匯入字幕)";
    let text = "";

      if (time >= currentLrc[i].time) {
        text = currentLrc[i].text;
      } else break;
    }
    return text || "♪ ...";
  }

  // --- PiP 桌面懸浮字幕 Engine ---
  function initPiPEngine() {
    if (isPiPInitialized) return;
    try {
      pipCanvas = document.createElement('canvas');
      pipCanvas.width = 1080;
      pipCanvas.height = 1080;
      pipCtx = pipCanvas.getContext('2d', { alpha: false });

      function drawPiPFrame(force = false) {
        const currentTime = audio.currentTime;
        let currentText = getActiveSubtitleText(currentTime);

        if (!force && currentText === lastPiPSubtitleText && !isCoverVideoActive) {
          requestAnimationFrame(() => drawPiPFrame());
          return; 
        }
        lastPiPSubtitleText = currentText;

        if (pipCtx) {
          pipCtx.fillStyle = "#07070a";
          pipCtx.fillRect(0, 0, 1080, 1080);

          if (cachedCoverElement) {
            drawCoverToCanvas(pipCtx, cachedCoverElement, 1080);
          }

          pipCtx.textAlign = "center";
          pipCtx.font = "bold 64px -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', sans-serif";
          
          let lines = [];
          if (pipCtx.measureText(currentText).width > 940) {
            let mid = Math.floor(currentText.length / 2);
            lines.push(currentText.substring(0, mid));
            lines.push(currentText.substring(mid));
          } else {
            lines.push(currentText);
          }

          let startY = lines.length > 1 ? 920 : 960;
          lines.forEach((lineText, idx) => {
            let curY = startY + (idx * 72);
            pipCtx.lineWidth = 9;
            pipCtx.strokeStyle = "rgba(0, 0, 0, 0.95)";
            pipCtx.strokeText(lineText, 540, curY);

            pipCtx.fillStyle = "#ff79c6";
            pipCtx.fillText(lineText, 540, curY);
          });
        }
        requestAnimationFrame(() => drawPiPFrame());
      }
      requestAnimationFrame(() => drawPiPFrame(true));

      const stream = pipCanvas.captureStream(15);
      pipVideo.srcObject = stream;
      pipVideo.play();
      isPiPInitialized = true;
    } catch(e) { console.error(e); }
  }

  function drawCoverToCanvas(ctx, source, size) {
    let imgWidth = source.videoWidth || source.width;
    let imgHeight = source.videoHeight || source.height;
    if (!imgWidth || !imgHeight) return;

    ctx.save();
    let maxDrawSize = size;
    let hRatio = maxDrawSize / imgWidth;
    let vRatio = maxDrawSize / imgHeight;
    let ratio = Math.max(hRatio, vRatio);
    let centerShiftX = (size - imgWidth * ratio) / 2;
    let centerShiftY = (size - imgHeight * ratio) / 2;
    ctx.drawImage(source, 0, 0, imgWidth, imgHeight, centerShiftX, centerShiftY, imgWidth * ratio, imgHeight * ratio);
    ctx.restore();
  }

  // --- 備份匯出與同步匯入 ---
  async function exportDataBackup() {
    try {
      const tx = db.transaction(["albums", "tracks"], "readonly");
      let exportAlbums = await new Promise(res => tx.objectStore("albums").getAll().onsuccess = e => res(e.target.result));
      let exportTracks = await new Promise(res => tx.objectStore("tracks").getAll().onsuccess = e => res(e.target.result));

      async function blobToBase64(blob) {
        if (!blob) return null;
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.readAsDataURL(blob);
        });
      }

      let cleanAlbums = [];
      for (let alb of exportAlbums) {
        let cBlobs = [];
        if (alb.coverBlobs) { for (let b of alb.coverBlobs) cBlobs.push(await blobToBase64(b)); }
        let bBlobs = [];
        if (alb.bgBlobs) { for (let b of alb.bgBlobs) bBlobs.push(await blobToBase64(b)); }
        cleanAlbums.push({ id: alb.id, title: alb.title, coverBlobs: cBlobs, bgBlobs: bBlobs });
      }

      let cleanTracks = [];
      for (let trk of exportTracks) {
        cleanTracks.push({
          id: trk.id, albumId: trk.albumId, title: trk.title,
          audioBase64: await blobToBase64(trk.audioBlob),
          lrcText: trk.lrcText
        });
      }

      const jsonStr = JSON.stringify({ albums: cleanAlbums, tracks: cleanTracks }, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `ASMR_Backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    } catch(err) { alert("匯出失敗：" + err.message); }
  }

  async function importDataBackup(e) {
    const file = e.target.files[0];
    if(!file) return;

    function base64ToBlob(base64) {
      if(!base64) return null;
      const arr = base64.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) u8arr[n] = bstr.charCodeAt(n);
      return new Blob([u8arr], { type: mime });
    }

    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        const tx = db.transaction(["albums", "tracks"], "readwrite");
        
        if(data.albums) {
          const albStore = tx.objectStore("albums");
          for(let a of data.albums) {
            albStore.put({
              id: a.id, title: a.title,
              coverBlobs: (a.coverBlobs || []).map(base64ToBlob),
              bgBlobs: (a.bgBlobs || []).map(base64ToBlob)
            });
          }
        }

        if(data.tracks) {
          const trkStore = tx.objectStore("tracks");
          for(let t of data.tracks) {
            trkStore.put({
              id: t.id, albumId: t.albumId, title: t.title,
              audioBlob: base64ToBlob(t.audioBase64),
              lrcText: t.lrcText
            });
          }
        }

        tx.oncomplete = () => { alert("🎉 備份資料已順利同步匯入！"); loadData(); };
      } catch(err) { alert("解析 JSON 檔失敗：" + err.message); }
    };
    reader.readAsText(file);
  }

  function expandPlayer() { playerCard.classList.remove("minimized"); miniPlayer.classList.add("hidden"); }
  function minimizePlayer() { playerCard.classList.add("minimized"); miniPlayer.classList.remove("hidden"); }

  function initMediaSession() {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', togglePlay);
      navigator.mediaSession.setActionHandler('pause', togglePlay);
      navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
      navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
    }
  }

  function prevTrack() {
    if(currentIndex > 0) {
      currentIndex--;
      playTrackFromList(currentTrackList[currentIndex].id);
    }
  }
  function nextTrack() {
    if(currentIndex < currentTrackList.length - 1) {
      currentIndex++;
      playTrackFromList(currentTrackList[currentIndex].id);
    }
  }
  function seekRelative(sec) { audio.currentTime += sec; }
</script>
</body>
</html>
