<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫</title>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.7);
      --bg-dark: #0b0b0e;
      --card-glass: rgba(18, 18, 24, 0.95);
      --text-main: #ffffff;
      --text-sub: #a0a0b2;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 12px;
      padding-bottom: 90px;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    #bg-video, #bg-img {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: -2;
      display: none;
      filter: brightness(0.4);
    }
    #bg-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(11,11,14,0.4) 0%, rgba(11,11,14,0.9) 100%);
      z-index: -1;
    }

    .container { width: 100%; max-width: 480px; z-index: 1; }

    .player-card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      margin: auto;
      max-width: 480px; width: 100%;
      max-height: 94vh;
      overflow-y: auto;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom: none;
      border-radius: 24px 24px 0 0;
      padding: 8px 16px 20px 16px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
      z-index: 1000;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
      touch-action: none;
    }
    
    .player-card.minimized { transform: translateY(105%); }

    .drag-handle-area {
      width: 100%; padding: 4px 0 8px 0;
      display: flex; justify-content: center; cursor: grab;
    }
    .drag-handle {
      width: 40px; height: 4px;
      background: rgba(255, 255, 255, 0.3); border-radius: 10px;
    }

    .cover-box {
      width: 100%; max-height: 36vh;
      aspect-ratio: 1 / 1; border-radius: 16px;
      overflow: hidden; background: #1a1a22;
      margin: 0 auto 6px auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      position: relative;
    }
    .cover-box img, .cover-box video { width: 100%; height: 100%; object-fit: cover; display: none; }

    .album-tag { font-size: 0.78rem; color: var(--text-sub); text-align: center; margin-bottom: 2px; }
    .track-title { font-size: 0.95rem; font-weight: 700; text-align: center; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .lrc-box {
      min-height: 52px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 1.1rem; font-weight: 800;
      color: var(--primary-pink);
      text-shadow: 0 0 16px var(--pink-glow), 0 0 4px #000;
      padding: 4px 8px; line-height: 1.35; margin-bottom: 6px;
      word-break: break-word;
    }

    .sub-quick-tools { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
    .btn-sub-quick {
      padding: 6px 10px;
      background: rgba(255, 121, 198, 0.15);
      border: 1px solid var(--primary-pink);
      color: var(--primary-pink);
      border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
    }

    .seek-slider { width: 100%; height: 4px; accent-color: #ffffff; cursor: pointer; }
    .time-box { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; margin-bottom: 6px; }
    
    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; padding: 4px; }
    .btn-play-main { width: 48px; height: 48px; background: #fff; color: #000; border-radius: 50%; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; }

    .volume-box { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 8px; }
    .volume-slider { flex: 1; height: 4px; accent-color: var(--text-sub); }
    .btn-mute { background: none; border: none; color: var(--text-sub); font-size: 1rem; cursor: pointer; padding: 2px; }

    .bottom-tools { display: flex; gap: 8px; }
    .btn-pip, .btn-minimize {
      flex: 1; background: rgba(255, 121, 198, 0.15);
      border: 1px solid var(--primary-pink);
      color: var(--primary-pink);
      padding: 8px; border-radius: 10px;
      font-weight: bold; font-size: 0.78rem; cursor: pointer;
    }

    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0;
      margin: auto; max-width: 480px; height: 60px;
      background: rgba(18, 18, 24, 0.95);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex; align-items: center; padding: 0 12px;
      z-index: 999; cursor: pointer;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
    }
    .mini-player.hidden { transform: translateY(100%); }

    .mini-thumb { width: 40px; height: 40px; border-radius: 8px; background: #1a1a22; object-fit: cover; margin-right: 10px; flex-shrink: 0; }
    .mini-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .mini-title { font-size: 0.82rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-subtitle { font-size: 0.72rem; color: var(--primary-pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-btn { background: none; border: none; color: #fff; font-size: 1.2rem; padding: 6px; cursor: pointer; }

    .glass-card {
      background: var(--card-glass);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 16px; margin-bottom: 16px;
    }
    .card-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 12px; color: var(--primary-pink); }
    
    .form-group { margin-bottom: 10px; }
    label { font-size: 0.78rem; color: var(--text-sub); display: block; margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 0.85rem;
    }
    .btn-pink { width: 100%; background: var(--primary-pink); color: #000; border: none; padding: 10px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 6px; }

    .album-group { border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; margin-bottom: 10px; overflow: hidden; background: rgba(0,0,0,0.2); }
    .album-header { padding: 12px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.95rem; }
    .chapter-list { padding: 8px 12px; }
    .chapter-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .chapter-item:last-child { border-bottom: none; }
    .btn-sm { padding: 4px 10px; border-radius: 6px; border: none; font-size: 0.78rem; font-weight: bold; cursor: pointer; }
    .btn-sm-play { background: var(--primary-pink); color: #000; margin-right: 4px; }
    .btn-sm-edit { background: rgba(255, 121, 198, 0.2); color: var(--primary-pink); border: 1px solid var(--primary-pink); margin-right: 4px; }
    .btn-sm-del { background: rgba(255,255,255,0.1); color: #ff5555; }
    
    .edit-box { padding: 12px; background: rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.08); display: none; }
  </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img" alt="背景">
<div id="bg-overlay"></div>

<div class="container">

  <!-- 1. 作品集總覽 -->
  <div class="glass-card">
    <div class="card-title">📚 作品集分區與選集列表</div>
    <div id="album-list">載入中...</div>
  </div>

  <!-- 2. 建立分區 -->
  <div class="glass-card">
    <div class="card-title">📁 建立作品分區</div>
    <div class="form-group">
      <label>作品分區名稱</label>
      <input type="text" id="album-title" placeholder="例如：彼女さん厳し～♡ 系列">
    </div>
    <div class="form-group">
      <label>封面素材 (圖片/MP4影片)</label>
      <input type="file" id="album-cover" accept="image/*,video/*">
    </div>
    <div class="form-group">
      <label>背景素材 (圖片/MP4影片)</label>
      <input type="file" id="album-bg" accept="image/*,video/*">
    </div>
    <button class="btn-pink" onclick="createAlbum()">建立分區</button>
  </div>

  <!-- 3. 匯入篇章 -->
  <div class="glass-card">
    <div class="card-title">🎵 匯入篇章至分區</div>
    <div class="form-group">
      <label>選擇所屬作品分區</label>
      <select id="select-album"><option value="">-- 請先建立分區 --</option></select>
    </div>
    <div class="form-group">
      <label>篇章名稱</label>
      <input type="text" id="track-title-input" placeholder="例如：01_え～♡彼女さん厳し～♡">
    </div>
    <div class="form-group">
      <label>音訊檔案</label>
      <input type="file" id="track-audio">
    </div>
    <div class="form-group">
      <label>字幕檔案 (.lrc / .srt / .vtt / .txt)</label>
      <input type="file" id="track-lrc">
    </div>
    <button class="btn-pink" onclick="addTrack()">新增篇章至分區</button>
  </div>

</div>

<!-- 底部 Mini 播放條 -->
<div id="mini-player" class="mini-player hidden" onclick="expandPlayer()">
  <img id="mini-thumb" class="mini-thumb" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%231a1a22'/></svg>">
  <div class="mini-info">
    <div id="mini-title" class="mini-title">未選擇篇章</div>
    <div id="mini-lrc" class="mini-subtitle">♪ 點擊展開播放面板</div>
  </div>
  <button class="mini-btn" onclick="event.stopPropagation(); togglePlay();" id="mini-btn-play">▶</button>
  <button class="mini-btn" onclick="event.stopPropagation(); expandPlayer();">▲</button>
</div>

<!-- Full 播放器卡片 -->
<div id="player-card" class="player-card minimized">
  <div class="drag-handle-area" id="drag-handle-area">
    <div class="drag-handle"></div>
  </div>

  <div class="cover-box">
    <img id="cover-img" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%231a1a22'/></svg>" style="display:block;">
    <video id="cover-video" autoplay loop muted playsinline style="display:none;"></video>
  </div>
  
  <div id="album-tag" class="album-tag">請選擇作品分區</div>
  <div id="track-title" class="track-title">未選擇篇章</div>
  
  <div id="lrc-box" class="lrc-box">♪ 選擇小篇章開始收聽 ♪</div>

  <div class="sub-quick-tools">
    <label class="btn-sub-quick">
      📂 匯入字幕檔
      <input type="file" id="quick-lrc-input" style="display:none;" onchange="uploadCurrentTrackLrc(event)">
    </label>
    <button class="btn-sub-quick" onclick="pasteCurrentTrackLrc()">📝 貼上字幕</button>
    <button class="btn-sub-quick" onclick="inspectCurrentTrackLrc()">🔍 檢視/修改</button>
  </div>

  <input type="range" id="seek-slider" class="seek-slider" value="0" min="0" step="0.1">
  <div class="time-box">
    <span id="time-current">00:00</span>
    <span id="time-duration">00:00</span>
  </div>

  <div class="controls">
    <button class="btn-ctrl" onclick="prevTrack()">⏮</button>
    <button class="btn-ctrl" onclick="seekRelative(-5)">↺5</button>
    <button class="btn-ctrl btn-play-main" id="btn-play" onclick="togglePlay()">▶</button>
    <button class="btn-ctrl" onclick="seekRelative(30)">↻30</button>
    <button class="btn-ctrl" onclick="nextTrack()">⏭</button>
  </div>

  <div class="volume-box">
    <button class="btn-mute" id="btn-mute" onclick="toggleMute()">🔈</button>
    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
    <span>🔊</span>
  </div>

  <div class="bottom-tools">
    <button class="btn-pip" onclick="enablePiP()">📺 桌面懸浮 (PiP)</button>
    <button class="btn-minimize" onclick="minimizePlayer()">▼ 收起面板瀏覽選集</button>
  </div>
</div>

<canvas id="pip-canvas" width="1200" height="240" style="display:none;"></canvas>
<video id="pip-video" muted playsinline webkit-playsinline style="display:none;"></video>
<audio id="main-audio" crossorigin="anonymous" preload="auto"></audio>

<script>
  let db;
  let albums = [];
  let tracks = [];
  let currentTrackList = [];
  let currentIndex = -1;
  let currentLrc = [];
  let currentPlayingAlbumId = null;
  let lastVolume = 1;

  let audioCtx = null;
  let audioSource = null;
  let audioDest = null;

  const audio = document.getElementById("main-audio");
  const bgVideo = document.getElementById("bg-video");
  const bgImg = document.getElementById("bg-img");
  const coverImg = document.getElementById("cover-img");
  const coverVideo = document.getElementById("cover-video");

  const playerCard = document.getElementById("player-card");
  const miniPlayer = document.getElementById("mini-player");

  const canvas = document.getElementById("pip-canvas");
  const ctx = canvas.getContext("2d");
  const pipVideo = document.getElementById("pip-video");

  const request = indexedDB.open("ASMR_Categorized_DB_V2", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("albums")) db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
  };
  request.onsuccess = (e) => { 
    db = e.target.result; 
    loadData(); 
    startCanvasLoop(); 
  };

  function initAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
        audioSource = audioCtx.createMediaElementSource(audio);
        audioDest = audioCtx.createMediaStreamDestination();
        audioSource.connect(audioDest);
        audioSource.connect(audioCtx.destination);
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function loadData() {
    const tx = db.transaction(["albums", "tracks"], "readonly");
    tx.objectStore("albums").getAll().onsuccess = (e) => { albums = e.target.result; updateAlbumDropdown(); };
    tx.objectStore("tracks").getAll().onsuccess = (e) => { tracks = e.target.result; renderAlbumList(); };
  }

  function updateAlbumDropdown() {
    const select = document.getElementById("select-album");
    select.innerHTML = albums.length ? "" : '<option value="">-- 請先建立分區 --</option>';
    albums.forEach(a => {
      const opt = document.createElement("option");
      opt.value = a.id;
      opt.innerText = a.title;
      select.appendChild(opt);
    });
  }

  async function createAlbum() {
    const title = document.getElementById("album-title").value.trim();
    if (!title) return alert("請輸入分區名稱！");

    const coverBlob = document.getElementById("album-cover").files[0] || null;
    const bgBlob = document.getElementById("album-bg").files[0] || null;

    const tx = db.transaction(["albums"], "readwrite");
    tx.objectStore("albums").add({ title, coverBlob, bgBlob });
    tx.oncomplete = () => {
      document.getElementById("album-title").value = "";
      document.getElementById("album-cover").value = "";
      document.getElementById("album-bg").value = "";
      loadData();
    };
  }

  function readFileTextSmart(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        let text = e.target.result;
        if (text.includes('\uFFFD')) {
          const readerSJIS = new FileReader();
          readerSJIS.onload = (e2) => resolve(e2.target.result);
          readerSJIS.readAsText(file, 'shift-jis');
        } else {
          resolve(text);
        }
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  async function addTrack() {
    const albumId = parseInt(document.getElementById("select-album").value);
    if (!albumId) return alert("請先選擇或建立作品分區！");

    const audioFile = document.getElementById("track-audio").files[0];
    if (!audioFile) return alert("請選擇音訊檔案！");

    const title = document.getElementById("track-title-input").value.trim() || audioFile.name;
    const lrcFile = document.getElementById("track-lrc").files[0];
    let lrcText = "";
    
    if (lrcFile) {
      lrcText = await readFileTextSmart(lrcFile);
    }

    const tx = db.transaction(["tracks"], "readwrite");
    tx.objectStore("tracks").add({ albumId, title, audioBlob: audioFile, lrcText });
    tx.oncomplete = () => {
      alert("篇章新增成功！");
      document.getElementById("track-title-input").value = "";
      document.getElementById("track-audio").value = "";
      document.getElementById("track-lrc").value = "";
      loadData();
    };
  }

  async function saveTrackSubtitle(trackId, lrcText) {
    return new Promise((resolve) => {
      const tx = db.transaction(["tracks"], "readwrite");
      const store = tx.objectStore("tracks");
      store.get(trackId).onsuccess = (e) => {
        const track = e.target.result;
        if (track) {
          track.lrcText = lrcText;
          store.put(track);
        }
      };
      tx.oncomplete = () => {
        const t = tracks.find(item => item.id === trackId);
        if (t) t.lrcText = lrcText;
        if (currentIndex !== -1 && currentTrackList[currentIndex] && currentTrackList[currentIndex].id === trackId) {
          currentTrackList[currentIndex].lrcText = lrcText;
          currentLrc = parseSubtitles(lrcText, audio.duration);
        }
        renderAlbumList();
        resolve(true);
      };
    });
  }

  async function uploadCurrentTrackLrc(event) {
    if (currentIndex === -1 || !currentTrackList[currentIndex]) return alert("請先選擇要播放的小篇章！");
    const file = event.target.files[0];
    if (!file) return;

    const text = await readFileTextSmart(file);
    const trackId = currentTrackList[currentIndex].id;
    await saveTrackSubtitle(trackId, text);
    alert("字幕匯入成功！");
    event.target.value = "";
  }

  async function pasteCurrentTrackLrc() {
    if (currentIndex === -1 || !currentTrackList[currentIndex]) return alert("請先選擇要播放的小篇章！");
    const text = prompt("請貼上字幕內容（支援 LRC/SRT/VTT 或純劇本台詞）：");
    if (text && text.trim()) {
      const trackId = currentTrackList[currentIndex].id;
      await saveTrackSubtitle(trackId, text.trim());
      alert("字幕更新成功！");
    }
  }

  async function inspectCurrentTrackLrc() {
    if (currentIndex === -1 || !currentTrackList[currentIndex]) return alert("請先選擇要播放的小篇章！");
    const track = currentTrackList[currentIndex];
    const newText = prompt(`【${track.title}】的目前字幕原始內容：`, track.lrcText || "");
    if (newText !== null) {
      await saveTrackSubtitle(track.id, newText.trim());
      alert("字幕修改已儲存！");
    }
  }

  async function editTrackLrc(trackId) {
    const track = tracks.find(t => t.id === trackId);
    if (!track) return;

    const newText = prompt(`請編輯【${track.title}】的字幕內容：`, track.lrcText || "");
    if (newText !== null) {
      await saveTrackSubtitle(trackId, newText.trim());
      alert("字幕已儲存！");
    }
  }

  function renderAlbumList() {
    const listEl = document.getElementById("album-list");
    listEl.innerHTML = "";

    if (albums.length === 0) {
      listEl.innerHTML = "<div style='color:var(--text-sub); font-size:0.85rem;'>無作品分區，請先新增。</div>";
      return;
    }

    albums.forEach(album => {
      const albumTracks = tracks.filter(t => t.albumId === album.id);
      const group = document.createElement("div");
      group.className = "album-group";

      let chaptersHtml = "";
      if (albumTracks.length === 0) {
        chaptersHtml = "<div style='color:var(--text-sub); font-size:0.8rem;'>此分區無小篇章。</div>";
      } else {
        albumTracks.forEach(track => {
          const hasLrcTag = (track.lrcText && track.lrcText.trim()) ? "💬" : "⚪";
          chaptersHtml += `
            <div class="chapter-item">
              <span style="font-size:0.85rem; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${hasLrcTag} ${track.title}</span>
              <div>
                <button class="btn-sm btn-sm-play" onclick="playTrack(${album.id}, ${track.id})">播放</button>
                <button class="btn-sm btn-sm-edit" onclick="editTrackLrc(${track.id})">字幕</button>
                <button class="btn-sm btn-sm-del" onclick="deleteTrack(${track.id})">刪除</button>
              </div>
            </div>
          `;
        });
      }

      group.innerHTML = `
        <div class="album-header">
          <span>📁 ${album.title} (${albumTracks.length})</span>
          <div>
            <button class="btn-sm btn-sm-edit" onclick="toggleEditAlbum(${album.id})">⚙️ 素材</button>
            <button class="btn-sm btn-sm-del" onclick="deleteAlbum(${album.id})">刪分區</button>
          </div>
        </div>
        
        <div id="edit-box-${album.id}" class="edit-box">
          <div class="form-group">
            <label>修改分區名稱</label>
            <input type="text" id="edit-title-${album.id}" value="${album.title}">
          </div>
          <div class="form-group">
            <label>更換封面 (圖片/MP4)</label>
            <input type="file" id="edit-cover-${album.id}" accept="image/*,video/*">
          </div>
          <div class="form-group">
            <label>更換背景 (圖片/MP4)</label>
            <input type="file" id="edit-bg-${album.id}" accept="image/*,video/*">
          </div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="btn-pink" style="margin-top:0;" onclick="saveAlbumEdit(${album.id})">儲存更換</button>
            <button class="btn-sm" style="background:rgba(255,255,255,0.2); color:#fff; padding:8px 12px;" onclick="toggleEditAlbum(${album.id})">取消</button>
          </div>
        </div>

        <div class="chapter-list">${chaptersHtml}</div>
      `;
      listEl.appendChild(group);
    });
  }

  function toggleEditAlbum(id) {
    const editBox = document.getElementById(`edit-box-${id}`);
    if (editBox) editBox.style.display = (editBox.style.display === "block") ? "none" : "block";
  }

  async function saveAlbumEdit(id) {
    const newTitle = document.getElementById(`edit-title-${id}`).value.trim();
    if (!newTitle) return alert("請輸入分區名稱！");

    const newCover = document.getElementById(`edit-cover-${id}`).files[0];
    const newBg = document.getElementById(`edit-bg-${id}`).files[0];

    const tx = db.transaction(["albums"], "readwrite");
    const store = tx.objectStore("albums");

    store.get(id).onsuccess = (e) => {
      const album = e.target.result;
      if (!album) return;
      album.title = newTitle;
      if (newCover) album.coverBlob = newCover;
      if (newBg) album.bgBlob = newBg;
      store.put(album);
    };

    tx.oncomplete = () => {
      alert("更換成功！");
      loadData();
    };
  }

  function playTrack(albumId, trackId) {
    initAudioContext();
    currentPlayingAlbumId = albumId;
    const album = albums.find(a => a.id === albumId);
    currentTrackList = tracks.filter(t => t.albumId === albumId);
    currentIndex = currentTrackList.findIndex(t => t.id === trackId);
    const track = currentTrackList[currentIndex];

    document.getElementById("album-tag").innerText = album.title;
    document.getElementById("track-title").innerText = track.title;
    document.getElementById("mini-title").innerText = track.title;

    audio.src = URL.createObjectURL(track.audioBlob);

    const targetBgBlob = album.bgBlob;
    if (targetBgBlob) {
      const url = URL.createObjectURL(targetBgBlob);
      if (targetBgBlob.type.startsWith('video/')) {
        bgVideo.src = url; bgVideo.style.display = "block"; bgVideo.play();
        bgImg.style.display = "none";
      } else {
        bgImg.src = url; bgImg.style.display = "block";
        bgVideo.style.display = "none"; bgVideo.pause();
      }
    } else {
      bgVideo.style.display = "none"; bgImg.style.display = "none";
    }

    if (album.coverBlob) {
      const url = URL.createObjectURL(album.coverBlob);
      if (album.coverBlob.type.startsWith('video/')) {
        coverVideo.src = url; coverVideo.style.display = "block"; coverVideo.play();
        coverImg.style.display = "none";
      } else {
        coverImg.src = url; coverImg.style.display = "block";
        document.getElementById("mini-thumb").src = url;
        coverVideo.style.display = "none"; coverVideo.pause();
      }
    } else {
      const defaultImg = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%231a1a22'/></svg>";
      coverImg.src = defaultImg;
      document.getElementById("mini-thumb").src = defaultImg;
      coverImg.style.display = "block"; coverVideo.style.display = "none";
    }

    currentLrc = parseSubtitles(track.lrcText, audio.duration);
    audio.play();
    document.getElementById("btn-play").innerText = "⏸";
    document.getElementById("mini-btn-play").innerText = "⏸";

    expandPlayer();
  }

  function parseSubtitles(text, duration) {
    if (!text || !text.trim()) return [];
    const lines = text.split(/\r?\n/);
    const result = [];

    const lrcReg = /\[(\d{1,2}):(\d{2})(?:[\.:](\d{1,3}))?\]/g;
    const lrcThreeReg = /\[(\d{1,2}):(\d{2}):(\d{2})(?:[\.:](\d{1,3}))?\]/g;
    const plainTimeReg = /^(\d{1,2}):(\d{2})(?:[\.:](\d{1,3}))?\s+(.*)/;
    const srtVttReg = /(?:(\d{2}):)?(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(?:(\d{2}):)?(\d{2}):(\d{2})[,.](\d{3})/;

    let pendingSrtTime = null;

    lines.forEach(line => {
      line = line.trim();
      if (!line) return;
      if (line.startsWith('WEBVTT') || line.startsWith('NOTE')) return;

      const srtMatch = line.match(srtVttReg);
      if (srtMatch) {
        const h = parseInt(srtMatch[1] || 0), m = parseInt(srtMatch[2]), s = parseInt(srtMatch[3]), ms = parseInt(srtMatch[4]);
        pendingSrtTime = h * 3600 + m * 60 + s + ms / 1000;
        return;
      } else if (pendingSrtTime !== null && !isNaN(line)) {
        return;
      } else if (pendingSrtTime !== null && line) {
        result.push({ time: pendingSrtTime, text: line });
        pendingSrtTime = null;
        return;
      }

      lrcThreeReg.lastIndex = 0;
      if (lrcThreeReg.test(line)) {
        lrcThreeReg.lastIndex = 0;
        let match;
        const cleanText = line.replace(/\[\d{1,2}:\d{2}:\d{2}(?:[\.:]\d{1,3})?\]/g, "").trim();
        while ((match = lrcThreeReg.exec(line)) !== null) {
          const h = parseInt(match[1]), min = parseInt(match[2]), sec = parseInt(match[3]);
          const ms = match[4] ? parseInt(match[4].padEnd(3, '0')) : 0;
          result.push({ time: h * 3600 + min * 60 + sec + ms / 1000, text: cleanText || line });
        }
        return;
      }

      lrcReg.lastIndex = 0;
      if (lrcReg.test(line)) {
        lrcReg.lastIndex = 0;
        let match;
        const cleanText = line.replace(/\[\d{1,2}:\d{2}(?:[\.:]\d{1,3})?\]/g, "").trim();
        while ((match = lrcReg.exec(line)) !== null) {
          const min = parseInt(match[1]), sec = parseInt(match[2]);
          const ms = match[3] ? parseInt(match[3].padEnd(3, '0')) : 0;
          result.push({ time: min * 60 + sec + ms / 1000, text: cleanText || line });
        }
        return;
      }

      const plainMatch = line.match(plainTimeReg);
      if (plainMatch) {
        const min = parseInt(plainMatch[1]), sec = parseInt(plainMatch[2]);
        const ms = plainMatch[3] ? parseInt(plainMatch[3].padEnd(3, '0')) : 0;
        const txt = plainMatch[4].trim();
        if (txt) result.push({ time: min * 60 + sec + ms / 1000, text: txt });
        return;
      }
    });

    if (result.length === 0) {
      const validLines = lines.filter(l => l.trim() && !l.startsWith('[ti:') && !l.startsWith('[ar:') && !l.startsWith('[al:'));
      if (validLines.length > 0) {
        const totalSec = (duration && duration > 0) ? duration : 180;
        const step = totalSec / validLines.length;
        validLines.forEach((l, i) => {
          result.push({ time: i * step, text: l.trim() });
        });
      }
    }

    return result.sort((a, b) => a.time - b.time);
  }

  audio.onloadedmetadata = () => {
    if (currentIndex !== -1 && currentTrackList[currentIndex]) {
      currentLrc = parseSubtitles(currentTrackList[currentIndex].lrcText, audio.duration);
    }
  };

  audio.ontimeupdate = () => {
    document.getElementById("time-current").innerText = formatTime(audio.currentTime);
    document.getElementById("time-duration").innerText = formatTime(audio.duration || 0);
    if (audio.duration) {
      document.getElementById("seek-slider").value = (audio.currentTime / audio.duration) * 100;
    }

    const lrcBox = document.getElementById("lrc-box");
    const miniLrc = document.getElementById("mini-lrc");

    if (!currentTrackList[currentIndex] || !currentTrackList[currentIndex].lrcText) {
      const defaultTxt = "♪ 無動態字幕 ♪";
      lrcBox.innerText = defaultTxt;
      miniLrc.innerText = defaultTxt;
    } else if (currentLrc.length === 0) {
      const defaultTxt = "♪ 字幕解析中或格式為空 ♪";
      lrcBox.innerText = defaultTxt;
      miniLrc.innerText = defaultTxt;
    } else {
      let currentText = "♪";
      for (let i = 0; i < currentLrc.length; i++) {
        if (audio.currentTime >= currentLrc[i].time) {
          currentText = currentLrc[i].text;
        } else {
          break;
        }
      }
      lrcBox.innerText = currentText;
      miniLrc.innerText = currentText;
    }
  };

  function togglePlay() {
    initAudioContext();
    if (!audio.src) return;
    if (audio.paused) { 
      audio.play(); 
      document.getElementById("btn-play").innerText = "⏸"; 
      document.getElementById("mini-btn-play").innerText = "⏸"; 
    } else { 
      audio.pause(); 
      document.getElementById("btn-play").innerText = "▶"; 
      document.getElementById("mini-btn-play").innerText = "▶"; 
    }
  }

  function seekRelative(sec) { audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + sec)); }
  function prevTrack() { if (currentIndex > 0) playTrack(currentTrackList[currentIndex - 1].albumId, currentTrackList[currentIndex - 1].id); }
  function nextTrack() { if (currentIndex < currentTrackList.length - 1) playTrack(currentTrackList[currentIndex + 1].albumId, currentTrackList[currentIndex + 1].id); }

  function deleteAlbum(id) {
    if (!confirm("確定刪除此分區及底下所有篇章？")) return;
    const tx = db.transaction(["albums", "tracks"], "readwrite");
    tx.objectStore("albums").delete(id);
    tracks.filter(t => t.albumId === id).forEach(t => tx.objectStore("tracks").delete(t.id));
    tx.oncomplete = () => loadData();
  }

  function deleteTrack(id) {
    if (!confirm("確定刪除此篇章？")) return;
    const tx = db.transaction(["tracks"], "readwrite");
    tx.objectStore("tracks").delete(id);
    tx.oncomplete = () => loadData();
  }

  document.getElementById("seek-slider").oninput = (e) => { if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration; };

  function minimizePlayer() {
    playerCard.classList.add("minimized");
    if (audio.src) miniPlayer.classList.remove("hidden");
  }

  function expandPlayer() {
    playerCard.classList.remove("minimized");
    miniPlayer.classList.add("hidden");
  }

  let touchStartY = 0;
  let touchCurrentY = 0;
  const dragHandleArea = document.getElementById("drag-handle-area");

  dragHandleArea.addEventListener("touchstart", (e) => {
    touchStartY = e.touches[0].clientY;
    playerCard.style.transition = "none";
  }, { passive: true });

  dragHandleArea.addEventListener("touchmove", (e) => {
    touchCurrentY = e.touches[0].clientY;
    let deltaY = touchCurrentY - touchStartY;
    if (deltaY > 0) playerCard.style.transform = `translateY(${deltaY}px)`;
  }, { passive: true });

  dragHandleArea.addEventListener("touchend", () => {
    playerCard.style.transition = "transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)";
    let deltaY = touchCurrentY - touchStartY;
    if (deltaY > 80) minimizePlayer();
    playerCard.style.transform = "";
    touchStartY = 0; touchCurrentY = 0;
  });

  function toggleMute() {
    const slider = document.getElementById("volume-slider");
    const btnMute = document.getElementById("btn-mute");
    if (audio.volume > 0) {
      lastVolume = audio.volume;
      audio.volume = 0; slider.value = 0; btnMute.innerText = "🔇";
    } else {
      audio.volume = lastVolume > 0 ? lastVolume : 1;
      slider.value = audio.volume; btnMute.innerText = "🔈";
    }
  }

  document.getElementById("volume-slider").oninput = (e) => { 
    const val = parseFloat(e.target.value);
    audio.volume = val; 
    const btnMute = document.getElementById("btn-mute");
    if (val === 0) btnMute.innerText = "🔇";
    else { btnMute.innerText = "🔈"; lastVolume = val; }
  };

  audio.onended = () => nextTrack();

  function formatTime(sec) {
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  /* 橫幅 (1200x240) 字幕畫布渲染 */
  function renderCanvasFrame() {
    ctx.fillStyle = "#050508";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const currentText = document.getElementById("lrc-box").innerText || "♪";

    let fontSize = 56;
    const fontStack = '-apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.font = `bold ${fontSize}px ${fontStack}`;
    
    let textWidth = ctx.measureText(currentText).width;
    const maxTextWidth = canvas.width - 60;
    if (textWidth > maxTextWidth) {
      fontSize = Math.max(28, Math.floor(fontSize * (maxTextWidth / textWidth)));
      ctx.font = `bold ${fontSize}px ${fontStack}`;
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowColor = "rgba(255, 121, 198, 0.9)";
    ctx.shadowBlur = 20;
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 8;
    ctx.strokeText(currentText, canvas.width / 2, canvas.height / 2);

    ctx.fillStyle = "#ff79c6";
    ctx.fillText(currentText, canvas.width / 2, canvas.height / 2);
  }

  function startCanvasLoop() {
    function loop() {
      renderCanvasFrame();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  async function enablePiP() {
    try {
      initAudioContext();

      if (audio.paused) {
        await audio.play();
        document.getElementById("btn-play").innerText = "⏸";
        document.getElementById("mini-btn-play").innerText = "⏸";
      }

      const canvasStream = canvas.captureStream ? canvas.captureStream(30) : canvas.mozCaptureStream(30);
      const videoTrack = canvasStream.getVideoTracks()[0];
      
      const combinedStream = new MediaStream();
      if (videoTrack) combinedStream.addTrack(videoTrack);

      if (audioDest && audioDest.stream) {
        const audioTrack = audioDest.stream.getAudioTracks()[0];
        if (audioTrack) combinedStream.addTrack(audioTrack);
      }

      pipVideo.srcObject = combinedStream;
      await pipVideo.play();

      if (document.pictureInPictureElement) {
        await document.exitPictureInPicture();
      } else if (pipVideo.requestPictureInPicture) {
        await pipVideo.requestPictureInPicture();
      } else if (pipVideo.webkitSetPresentationMode) {
        pipVideo.webkitSetPresentationMode("picture-in-picture");
      } else {
        alert("您的裝置不支援懸浮視窗 (PiP)");
      }
    } catch (e) {
      console.error(e);
      alert("開啟懸浮字幕失敗！請確保音樂正在播放中再試一次。");
    }
  }
</script>
