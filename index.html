<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫 (極致影音升級版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.45);
      --bg-dark: #07070a;
      --card-glass: rgba(16, 16, 22, 0.88);
      --card-glass-hover: rgba(24, 24, 34, 0.95);
      --text-main: #ffffff;
      --text-sub: #9494ab;
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-hover: rgba(255, 121, 198, 0.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; padding-bottom: 160px;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, "PingFang TC", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #bg-video, #bg-img {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; background-color: var(--bg-dark);
      z-index: -2; display: none; filter: brightness(0.7) blur(4px);
    }
    #bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(7,7,10,0.3) 0%, rgba(7,7,10,0.88) 100%);
      z-index: -1; pointer-events: none;
    }

    /* 基本 UI 組件 */
    .container { width: 100%; max-width: 680px; z-index: 1; position: relative; }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; z-index: 10; }
    .app-logo { font-size: 1.4rem; font-weight: 800; color: var(--primary-pink); text-shadow: 0 0 20px var(--pink-glow); cursor: pointer; }
    .top-actions { display: flex; gap: 8px; }
    
    .btn-clean-mem, .btn-toggle-admin {
      padding: 10px 14px; border-radius: 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.2s ease;
    }
    .btn-clean-mem { background: rgba(80, 250, 123, 0.15); border: 1px solid rgba(80, 250, 123, 0.4); color: #50fa7b; }
    .btn-toggle-admin { background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3); color: var(--primary-pink); }

    .admin-drawer { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; width: 100%; }
    .admin-drawer.open { max-height: 5200px; }

    .glass-card {
      background: var(--card-glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass); border-radius: 24px; padding: 20px; margin-bottom: 18px; box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; color: var(--primary-pink); }
    .form-group { margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; color: #fff; font-size: 0.95rem; outline: none;
    }
    input[type="file"]::file-selector-button {
      background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-right: 12px;
    }

    .btn-pink { width: 100%; background: linear-gradient(135deg, #ff79c6 0%, #ff52b2 100%); color: #07070a; border: none; padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem; }
    .btn-green { width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; border: none; padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem; }

    .page-view { display: none; width: 100%; animation: fadeIn 0.2s ease; }
    .page-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* MP3 專輯卡片 */
    .album-grid-card {
      background: var(--card-glass); border: 1px solid var(--border-glass); border-radius: 20px; padding: 14px; margin-bottom: 12px;
      display: flex; align-items: center; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .album-grid-thumb { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; margin-right: 14px; background: #121218; }
    
    /* MP4 專輯卡片 */
    .album-youtube-card {
      background: var(--card-glass); border: 1px solid rgba(255, 121, 198, 0.3); border-radius: 20px; overflow: hidden; margin-bottom: 16px; cursor: pointer;
    }
    .album-youtube-thumb-container { width: 100%; height: 200px; background: #000; position: relative; }
    .album-youtube-thumb-container video { width: 100%; height: 100%; object-fit: cover; }
    .album-youtube-info { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }

    .album-grid-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .album-grid-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; color: #fff; }
    .album-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.72rem; margin-top: 4px; font-weight: 700; }
    .badge-mp3 { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-mp4 { background: rgba(255, 121, 198, 0.2); color: var(--primary-pink); border: 1px solid rgba(255, 121, 198, 0.4); }

    .btn-action-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .btn-album-action, .btn-album-del { padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .btn-album-action { background: rgba(255, 121, 198, 0.12); color: var(--primary-pink); border: 1px solid rgba(255, 121, 198, 0.3); }
    .btn-album-del { background: rgba(255, 85, 85, 0.1); color: #ff6b6b; border: 1px solid rgba(255, 85, 85, 0.25); }

    .breadcrumb-bar { display: flex; gap: 10px; margin-bottom: 14px; font-size: 0.95rem; font-weight: 700; color: var(--primary-pink); cursor: pointer; }
    .chapter-file-item {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; margin-bottom: 8px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 14px; cursor: pointer;
    }
    .chapter-info-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .play-icon-circle { width: 36px; height: 36px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.95rem; }
    .chapter-name { font-weight: 700; color: #fff; font-size: 0.92rem; }
    .chapter-duration-sub { font-size: 0.78rem; color: var(--text-sub); }
    .btn-action-group { display: flex; gap: 6px; }
    .btn-sm { padding: 5px 10px; border-radius: 9px; font-size: 0.78rem; font-weight: 600; border: 1px solid var(--border-glass); background: transparent; color:#fff;}

    /* ======================================================== */
    /* 1. MP3 專屬播放面板 (保留原有的浮動式卡片) */
    /* ======================================================== */
    .player-card-mp3 {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; width: 100%; 
      background: rgba(16, 16, 22, 0.98); backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-bottom: none; border-radius: 26px 26px 0 0;
      padding: 4px 18px 24px 18px; box-shadow: 0 -16px 50px rgba(0,0,0,0.85);
      z-index: 1000; transition: transform 0.25s ease;
    }
    .player-card-mp3.minimized { transform: translateY(110%); pointer-events: none; }
    .drag-handle-area { width: 100%; padding: 10px 0; display: flex; justify-content: center; cursor: grab; }
    .drag-handle { width: 50px; height: 5px; background: rgba(255, 255, 255, 0.45); border-radius: 10px; }
    .cover-box { width: 100%; height: 240px; border-radius: 16px; overflow: hidden; background: #050508; margin-bottom: 10px; position: relative; display: flex; align-items: center; justify-content: center; }
    .cover-box img, .cover-box video { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; }
    .lrc-box { text-align: center; font-size: 1.05rem; font-weight: 800; color: var(--primary-pink); text-shadow: 0 0 10px var(--pink-glow); padding: 8px; margin-bottom: 8px; }
    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.25rem; cursor: pointer; }
    .btn-play-main { width: 48px; height: 48px; background: #fff; color: #07070a; border-radius: 50%; font-size: 1.3rem; }
    .seek-slider { width: 100%; height: 6px; accent-color: var(--primary-pink); cursor: pointer; border-radius: 3px; background: rgba(255,255,255,0.1); }
    .time-box { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-sub); margin: 6px 0; }

    /* ======================================================== */
    /* 2. MP4 現代化 YouTube 風格全版播放器 (完全獨立代碼) */
    /* ======================================================== */
    .mp4-modern-overlay {
      position: fixed; inset: 0; background: #000; z-index: 99999; 
      display: none; flex-direction: column; justify-content: center; align-items: center;
    }
    .mp4-modern-overlay.active { display: flex; }
    
    .mp4-video-container {
      position: relative; width: 100%; height: 100%; max-width: 100vw; max-height: 100vh;
      background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    /* iOS 全螢幕支援與橫向強制滿版 */
    .mp4-video-container:-webkit-full-screen { width: 100vw; height: 100vh; }
    .mp4-video-container:fullscreen { width: 100vw; height: 100vh; }
    
    .mp4-video-element {
      width: 100%; height: 100%; object-fit: contain;
    }

    /* 內嵌式字幕 (YouTube Style) */
    .mp4-subtitles {
      position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 800px; text-align: center; pointer-events: none;
      transition: bottom 0.3s ease, opacity 0.3s ease; z-index: 10;
    }
    .mp4-subtitles span {
      background: rgba(0, 0, 0, 0.75); color: #fff; padding: 6px 12px;
      border-radius: 8px; font-size: 1.3rem; font-weight: 700; line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8); display: inline-block;
    }
    /* 控制列隱藏時字幕下移 */
    .mp4-video-container.hide-ui .mp4-subtitles { bottom: 30px; }

    /* UI 浮層控制列 */
    .mp4-ui-layer {
      position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
      transition: opacity 0.3s ease; z-index: 20;
    }
    .mp4-video-container.hide-ui .mp4-ui-layer { opacity: 0; pointer-events: none; }
    
    .mp4-top-bar {
      padding: 16px; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      display: flex; justify-content: space-between; align-items: center;
    }
    .mp4-title { color: #fff; font-size: 1.1rem; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    .mp4-btn-close { background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; backdrop-filter: blur(5px); }

    /* 中央點擊區與快進退視覺反饋 */
    .mp4-center-click-area { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
    
    .mp4-bottom-bar {
      padding: 10px 16px 16px 16px; background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
    }
    .mp4-progress-container { width: 100%; height: 20px; display: flex; align-items: center; cursor: pointer; margin-bottom: 8px; }
    .mp4-progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; position: relative; }
    .mp4-progress-fill { height: 100%; background: var(--primary-pink); border-radius: 2px; width: 0%; position: relative; }
    .mp4-progress-thumb { position: absolute; right: -6px; top: -4px; width: 12px; height: 12px; background: var(--primary-pink); border-radius: 50%; opacity: 0; transition: opacity 0.2s; }
    .mp4-progress-container:hover .mp4-progress-thumb { opacity: 1; }

    .mp4-controls-row { display: flex; align-items: center; gap: 16px; color: #fff; }
    .mp4-icon-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; transition: color 0.2s; display: flex; align-items: center; }
    .mp4-icon-btn:hover { color: var(--primary-pink); }
    .mp4-time { font-size: 0.9rem; font-weight: 600; opacity: 0.9; }
    .mp4-spacer { flex: 1; }

    /* 愛心高潮特效 (獨立保留) */
    .heart-toy-container {
      position: absolute; top: 75px; right: 20px; width: 54px; height: 54px; z-index: 15; cursor: pointer;
      filter: drop-shadow(0 0 12px rgba(255, 121, 198, 0.95)); transition: transform 0.15s ease;
    }
    .heart-toy-container:active { transform: scale(1.3); }
    .heart-bg { fill: rgba(10, 10, 16, 0.6); stroke: #ff79c6; stroke-width: 2.8; }
    .heart-full-beat { animation: heartFullBeat 0.4s infinite alternate ease-in-out !important; }
    @keyframes heartFullBeat { 0% { transform: scale(1); filter: drop-shadow(0 0 15px #ff79c6); } 100% { transform: scale(1.45); filter: drop-shadow(0 0 35px #ff1493); } }
    .cover-climax-shake-pink { animation: climaxPinkGlowShake 0.35s infinite alternate ease-in-out !important; }
    @keyframes climaxPinkGlowShake {
      0% { box-shadow: inset 0 0 30px rgba(255, 105, 180, 0.75); transform: translate(1px, 1px); }
      33% { transform: translate(-2px, -2px); }
      100% { box-shadow: inset 0 0 70px rgba(255, 20, 147, 0.95); transform: translate(2px, -1px); }
    }

    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; height: 64px;
      background: rgba(16, 16, 22, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; padding: 0 14px; z-index: 999; cursor: pointer;
    }
    .mini-player.hidden { display: none; }
    .mini-thumb { width: 42px; height: 42px; border-radius: 10px; background: #121218; object-fit: cover; margin-right: 10px; }
    .mini-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .mini-title { font-size: 0.88rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-subtitle { font-size: 0.75rem; color: var(--primary-pink); }
    .mini-btn { background: none; border: none; color: #fff; font-size: 1.15rem; padding: 6px; cursor: pointer; }

    #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: 90%; max-width: 400px; align-items: center; }
    .toast-msg { background: rgba(16, 16, 22, 0.92); border: 1px solid var(--primary-pink); color: #fff; padding: 12px 20px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; text-align: center; pointer-events: auto; }
  </style>
</head>
<body>

<div id="toast-container"></div>
<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img" alt="全域背景">
<div id="bg-overlay"></div>

<div class="container">
  <div class="top-bar">
    <div class="app-logo" onclick="switchPage('home')">🌸 ASMR 隨身庫</div>
    <div class="top-actions">
      <button class="btn-clean-mem" onclick="cleanMemoryAndGC()">⚡ 清理快取</button>
      <button class="btn-toggle-admin" onclick="toggleAdminDrawer()">⚙️ 管理</button>
    </div>
  </div>

  <div id="admin-drawer" class="admin-drawer">
    <div class="glass-card">
      <div class="card-title">📁 建立作品分區</div>
      <div class="form-group"><label>分區名稱</label><input type="text" id="album-title"></div>
      <div class="form-group">
        <label>分區類型</label>
        <select id="album-type">
          <option value="mp3">🎵 純音訊 MP3 專區</option>
          <option value="mp4">🌸 現代化 YouTube 影片專區</option>
        </select>
      </div>
      <button class="btn-pink" onclick="createAlbum()">建立分區</button>
    </div>
    <div class="glass-card">
      <div class="card-title">⚡ 匯入篇章</div>
      <div class="form-group"><select id="select-album"><option value="">-- 請先建立分區 --</option></select></div>
      <div class="form-group"><label>音訊檔 (MP3/WAV)</label><input type="file" id="track-audio" accept="audio/*"></div>
      <div class="form-group"><label>影片檔 (僅 MP4 專區需要)</label><input type="file" id="track-video" accept="video/*"></div>
      <div class="form-group"><label>字幕檔 (LRC/VTT)</label><input type="file" id="track-lrc" accept=".lrc,.vtt,.srt,.txt"></div>
      <button class="btn-green" onclick="addTrack()">新增單一篇章</button>
    </div>
  </div>

  <div id="view-home" class="page-view active">
    <div class="glass-card">
      <div class="card-title">📚 選擇作品集</div>
      <div id="album-list"></div>
    </div>
  </div>

  <div id="view-detail" class="page-view">
    <div class="glass-card">
      <div class="breadcrumb-bar" onclick="switchPage('home')">⬅ 返回列表 / <span id="detail-album-title"></span></div>
      <div id="chapter-list-container"></div>
    </div>
  </div>
</div>

<audio id="mp3-audio-player" crossorigin="anonymous" playsinline preload="auto"></audio>

<div id="mini-player" class="mini-player hidden" onclick="expandMp3Player()">
  <img id="mini-thumb" class="mini-thumb">
  <div class="mini-info">
    <div id="mini-title" class="mini-title">未選擇篇章</div>
    <div id="mini-lrc" class="mini-subtitle">♪ 點擊展開</div>
  </div>
  <button class="mini-btn" onclick="event.stopPropagation(); toggleMp3Play();" id="mini-btn-play">▶</button>
</div>

<div id="player-card-mp3" class="player-card-mp3 minimized">
  <div class="drag-handle-area" onclick="minimizeMp3Player()"><div class="drag-handle"></div></div>
  <div class="cover-box" id="player-cover-box"><img id="mp3-cover-img" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><rect width='100%' height='100%' fill='%23121218'/></svg>" style="display:block;"></div>
  <div id="lrc-box-mp3" class="lrc-box">♪ 選擇篇章開始收聽 ♪</div>
  <input type="range" id="seek-slider-mp3" class="seek-slider" value="0" min="0" max="100" step="0.1">
  <div class="time-box"><span id="time-current-mp3">00:00</span><span id="time-duration-mp3">00:00</span></div>
  <div class="controls">
    <button class="btn-ctrl" onclick="playPrevTrack()">⏮</button>
    <button class="btn-ctrl btn-play-main" id="btn-play-mp3" onclick="toggleMp3Play()">▶</button>
    <button class="btn-ctrl" onclick="playNextTrack()">⏭</button>
  </div>
</div>

<audio id="mp4-audio-player" crossorigin="anonymous" playsinline preload="auto"></audio>

<div id="mp4-modern-overlay" class="mp4-modern-overlay">
  <div class="mp4-video-container" id="mp4-video-container">
    <video id="mp4-video-player" class="mp4-video-element" muted loop playsinline webkit-playsinline crossorigin="anonymous"></video>
    
    <div class="mp4-subtitles"><span id="mp4-subtitle-text">♪ 載入中... ♪</span></div>

    <div class="heart-toy-container" id="heart-toy" onclick="event.stopPropagation(); alert('高潮特效觸發！');">
      <svg viewBox="0 0 32 32"><path class="heart-bg" d="M16 28.5 C16 28.5 3 19 3 10.5 C3 6 6.5 2.5 11 2.5 C13.8 2.5 15.3 3.8 16 5 C16.7 3.8 18.2 2.5 21 2.5 C25.5 2.5 29 6 29 10.5 C29 19 16 28.5 16 28.5 Z" /></svg>
    </div>

    <div class="mp4-ui-layer" id="mp4-ui-layer" onclick="toggleMp4Play()">
      
      <div class="mp4-top-bar" onclick="event.stopPropagation()">
        <div class="mp4-title" id="mp4-header-title">影片標題</div>
        <button class="mp4-btn-close" onclick="closeMp4Player()">✕</button>
      </div>

      <div class="mp4-center-click-area"></div>

      <div class="mp4-bottom-bar" onclick="event.stopPropagation()">
        <div class="mp4-progress-container" id="mp4-progress-container">
          <div class="mp4-progress-track">
            <div class="mp4-progress-fill" id="mp4-progress-fill"></div>
            <div class="mp4-progress-thumb" id="mp4-progress-thumb"></div>
          </div>
        </div>
        
        <div class="mp4-controls-row">
          <button class="mp4-icon-btn" onclick="toggleMp4Play()" id="btn-play-mp4">▶</button>
          <button class="mp4-icon-btn" onclick="skipMp4(-10)" title="倒退 10 秒">↺</button>
          <button class="mp4-icon-btn" onclick="skipMp4(10)" title="快進 10 秒">↻</button>
          
          <div class="mp4-time">
            <span id="mp4-time-current">00:00</span> / <span id="mp4-time-duration">00:00</span>
          </div>
          
          <div class="mp4-spacer"></div>
          
          <button class="mp4-icon-btn" onclick="playPrevTrack()" title="上一集">⏮</button>
          <button class="mp4-icon-btn" onclick="playNextTrack()" title="下一集">⏭</button>
          <button class="mp4-icon-btn" style="margin-left: 10px;" onclick="toggleMp4Fullscreen()" title="全螢幕">⛶</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  /* 資料庫與共用邏輯 */
  let db, albums = [], tracks = [], currentTrackList = [], currentIndex = -1, currentLrc = [];
  let currentAlbumType = 'mp3';
  let activeCreatedUrls = [];

  const mp3Audio = document.getElementById("mp3-audio-player");
  const mp4Audio = document.getElementById("mp4-audio-player");
  const mp4Video = document.getElementById("mp4-video-player");

  function showToast(msg) {
    const box = document.getElementById("toast-container");
    const t = document.createElement("div"); t.className = "toast-msg"; t.innerText = msg;
    box.appendChild(t); setTimeout(() => t.remove(), 3000);
  }

  function cleanMemoryAndGC() {
    activeCreatedUrls.forEach(url => { try { URL.revokeObjectURL(url); } catch(e){} });
    activeCreatedUrls = []; showToast("⚡ 已清理快取，最佳化效能。");
  }

  function createObjectURLTracked(blob) {
    if (!blob) return "";
    const url = URL.createObjectURL(blob);
    activeCreatedUrls.push(url); return url;
  }

  /* DB 初始化 (簡化版) */
  const request = indexedDB.open("ASMR_Categorized_DB_V45", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
    db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
  };
  request.onsuccess = (e) => { db = e.target.result; loadData(); };

  function loadData() {
    const tx = db.transaction(["albums", "tracks"], "readonly");
    tx.objectStore("albums").getAll().onsuccess = (e) => { albums = e.target.result; renderAlbums(); };
    tx.objectStore("tracks").getAll().onsuccess = (e) => { tracks = e.target.result; };
  }

  function switchPage(page, id=null) {
    document.querySelectorAll(".page-view").forEach(el => el.classList.remove("active"));
    if(page === 'home') document.getElementById("view-home").classList.add("active");
    if(page === 'detail') {
      document.getElementById("view-detail").classList.add("active");
      renderDetail(id);
    }
  }

  function renderAlbums() {
    const list = document.getElementById("album-list"); list.innerHTML = "";
    albums.forEach(album => {
      let card = document.createElement("div");
      card.className = album.albumType === 'mp4' ? "album-youtube-card" : "album-grid-card";
      let trackCount = tracks.filter(t => t.albumId === album.id).length;
      
      if (album.albumType === 'mp4') {
        card.innerHTML = `
          <div class="album-youtube-thumb-container">
             <div style="width:100%; height:100%; background:#1f1f2e; display:flex; align-items:center; justify-content:center; color:#ff79c6; font-weight:bold;">▶ 現代化影片專區</div>
          </div>
          <div class="album-youtube-info">
            <div><div class="album-grid-title">${album.title}</div><span class="album-badge badge-mp4">MP4 影片</span></div>
          </div>
        `;
      } else {
        card.innerHTML = `
          <div class="album-grid-thumb"></div>
          <div class="album-grid-info">
            <div class="album-grid-title">${album.title}</div><span class="album-badge badge-mp3">MP3 音訊</span>
          </div>
        `;
      }
      card.onclick = () => switchPage('detail', album.id);
      list.appendChild(card);
    });
    
    // 更新選單
    const sel = document.getElementById("select-album");
    sel.innerHTML = '<option value="">-- 選擇 --</option>';
    albums.forEach(a => { sel.innerHTML += `<option value="${a.id}">${a.title}</option>`; });
  }

  function renderDetail(albumId) {
    const album = albums.find(a => a.id === albumId);
    document.getElementById("detail-album-title").innerText = album.title;
    const list = document.getElementById("chapter-list-container"); list.innerHTML = "";
    let tList = tracks.filter(t => t.albumId === albumId);
    tList.forEach((track, idx) => {
      let div = document.createElement("div"); div.className = "chapter-file-item";
      div.innerHTML = `<div class="chapter-info-left" onclick="startPlay(${albumId}, ${idx})"><div class="play-icon-circle">▶</div><div class="chapter-name">${track.title}</div></div>`;
      list.appendChild(div);
    });
  }

  async function createAlbum() {
    let t = document.getElementById("album-title").value, type = document.getElementById("album-type").value;
    if(!t) return;
    db.transaction("albums", "readwrite").objectStore("albums").add({ title: t, albumType: type }).onsuccess = () => { loadData(); showToast("建立成功！"); };
  }

  async function addTrack() {
    let aId = parseInt(document.getElementById("select-album").value);
    let aFile = document.getElementById("track-audio").files[0];
    let vFile = document.getElementById("track-video").files[0];
    let lFile = document.getElementById("track-lrc").files[0];
    if(!aId || !aFile) return showToast("缺漏檔案！");
    
    let lrcText = lFile ? await lFile.text() : "";
    let data = { albumId: aId, title: aFile.name.split('.')[0], audioBlob: aFile, videoBlob: vFile, lrcText };
    db.transaction("tracks", "readwrite").objectStore("tracks").add(data).onsuccess = () => { loadData(); showToast("篇章新增成功！"); };
  }

  /* LRC 解析引擎 */
  function parseUniversalLyrics(rawText) {
    if (!rawText) return [];
    const lines = rawText.split('\n'), lyrics = [];
    const lrcTimeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
    lines.forEach(line => {
      const match = lrcTimeReg.exec(line);
      if (match) {
        let t = parseInt(match[1])*60 + parseInt(match[2]) + parseInt(match[3].padEnd(3,'0'))/1000;
        let text = line.replace(lrcTimeReg, '').trim();
        if (text) lyrics.push({ time: t, text });
      }
    });
    return lyrics;
  }
  function getSubtitle(time) {
    let txt = "♪ 沉浸播放中 ♪";
    for(let i=0; i<currentLrc.length; i++) { if(time >= currentLrc[i].time) txt = currentLrc[i].text; else break; }
    return txt;
  }
  function formatTime(secs) {
    if(isNaN(secs)) return "00:00";
    let m = Math.floor(secs/60), s = Math.floor(secs%60);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }

  /* ======================================================== */
  /* 播放引擎切換核心 */
  /* ======================================================== */
  function startPlay(albumId, trackIdx) {
    const album = albums.find(a => a.id === albumId);
    currentTrackList = tracks.filter(t => t.albumId === albumId);
    currentIndex = trackIdx;
    currentAlbumType = album.albumType;
    let track = currentTrackList[currentIndex];
    currentLrc = parseUniversalLyrics(track.lrcText);

    // 關閉所有舊播放
    mp3Audio.pause(); mp4Audio.pause(); mp4Video.pause();

    if (currentAlbumType === 'mp4') {
      document.getElementById("mp4-modern-overlay").classList.add("active");
      document.getElementById("player-card-mp3").classList.add("minimized");
      document.getElementById("mini-player").classList.add("hidden");
      
      document.getElementById("mp4-header-title").innerText = track.title;
      
      // MP4 雙引擎同步機制 (音訊主導時間，影像強制靜音跟隨)
      mp4Audio.src = createObjectURLTracked(track.audioBlob);
      if (track.videoBlob) {
        mp4Video.src = createObjectURLTracked(track.videoBlob);
      } else {
        mp4Video.removeAttribute('src'); // 若無影片就純黑畫面
      }
      
      mp4Audio.play();
      if(mp4Video.src) mp4Video.play();
      syncMp4UI();
      resetMp4IdleTimer();
      
    } else {
      // 傳統 MP3 模式
      document.getElementById("mp4-modern-overlay").classList.remove("active");
      document.getElementById("player-card-mp3").classList.remove("minimized");
      document.getElementById("mini-player").classList.remove("hidden");
      
      document.getElementById("mini-title").innerText = track.title;
      mp3Audio.src = createObjectURLTracked(track.audioBlob);
      mp3Audio.play();
      syncMp3UI();
    }
  }

  function playNextTrack() {
    if (currentIndex < currentTrackList.length - 1) startPlay(currentTrackList[0].albumId, currentIndex + 1);
    else showToast("最後一首了！");
  }
  function playPrevTrack() {
    if (currentIndex > 0) startPlay(currentTrackList[0].albumId, currentIndex - 1);
  }

  /* ======================================================== */
  /* 獨立模塊：MP3 邏輯 */
  /* ======================================================== */
  function toggleMp3Play() {
    if(mp3Audio.paused) mp3Audio.play(); else mp3Audio.pause();
    syncMp3UI();
  }
  function syncMp3UI() {
    let sym = mp3Audio.paused ? "▶" : "❚❚";
    document.getElementById("btn-play-mp3").innerText = sym;
    document.getElementById("mini-btn-play").innerText = sym;
  }
  function minimizeMp3Player() { document.getElementById("player-card-mp3").classList.add("minimized"); }
  function expandMp3Player() { document.getElementById("player-card-mp3").classList.remove("minimized"); }
  
  mp3Audio.addEventListener('timeupdate', () => {
    let p = (mp3Audio.currentTime / mp3Audio.duration) * 100 || 0;
    document.getElementById("seek-slider-mp3").value = p;
    document.getElementById("time-current-mp3").innerText = formatTime(mp3Audio.currentTime);
    document.getElementById("time-duration-mp3").innerText = formatTime(mp3Audio.duration);
    let txt = getSubtitle(mp3Audio.currentTime);
    document.getElementById("lrc-box-mp3").innerText = txt;
    document.getElementById("mini-lrc").innerText = txt;
  });
  mp3Audio.addEventListener('ended', playNextTrack);
  document.getElementById("seek-slider-mp3").addEventListener('input', (e) => { mp3Audio.currentTime = (e.target.value/100)*mp3Audio.duration; });


  /* ======================================================== */
  /* 獨立模塊：MP4 現代播放器邏輯 (UI自動隱藏、全螢幕、雙軌同步) */
  /* ======================================================== */
  let mp4IdleTimer = null;
  const mp4Container = document.getElementById("mp4-video-container");

  function resetMp4IdleTimer() {
    mp4Container.classList.remove("hide-ui");
    clearTimeout(mp4IdleTimer);
    if (!mp4Audio.paused) {
      mp4IdleTimer = setTimeout(() => { mp4Container.classList.add("hide-ui"); }, 3000);
    }
  }
  // 點擊喚醒或暫停
  mp4Container.addEventListener("mousemove", resetMp4IdleTimer);
  mp4Container.addEventListener("touchstart", resetMp4IdleTimer);

  function toggleMp4Play() {
    if (mp4Audio.paused) { mp4Audio.play(); if(mp4Video.src) mp4Video.play(); }
    else { mp4Audio.pause(); if(mp4Video.src) mp4Video.pause(); }
    syncMp4UI(); resetMp4IdleTimer();
  }
  
  function syncMp4UI() {
    document.getElementById("btn-play-mp4").innerText = mp4Audio.paused ? "▶" : "❚❚";
  }

  function skipMp4(seconds) {
    mp4Audio.currentTime = Math.max(0, Math.min(mp4Audio.currentTime + seconds, mp4Audio.duration));
    if(mp4Video.duration) mp4Video.currentTime = mp4Audio.currentTime % mp4Video.duration;
    resetMp4IdleTimer();
  }

  function closeMp4Player() {
    mp4Audio.pause(); mp4Video.pause();
    document.getElementById("mp4-modern-overlay").classList.remove("active");
    if(document.fullscreenElement) document.exitFullscreen();
  }

  // 完美時間同步機制
  mp4Audio.addEventListener('timeupdate', () => {
    // 讓影片循環配合主音訊時間 (防誤差漂移)
    if(mp4Video.duration) {
      let expected = mp4Audio.currentTime % mp4Video.duration;
      if (Math.abs(mp4Video.currentTime - expected) > 0.4) {
        mp4Video.currentTime = expected;
      }
    }
    
    // 更新進度條與時間
    let dur = mp4Audio.duration || 0;
    let pct = dur ? (mp4Audio.currentTime / dur) * 100 : 0;
    document.getElementById("mp4-progress-fill").style.width = pct + "%";
    document.getElementById("mp4-time-current").innerText = formatTime(mp4Audio.currentTime);
    document.getElementById("mp4-time-duration").innerText = formatTime(dur);
    
    // 更新內嵌字幕
    document.getElementById("mp4-subtitle-text").innerText = getSubtitle(mp4Audio.currentTime);
  });
  
  mp4Audio.addEventListener('ended', playNextTrack);

  // 自訂進度條點擊
  document.getElementById("mp4-progress-container").addEventListener('click', (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    mp4Audio.currentTime = pos * mp4Audio.duration;
    if(mp4Video.duration) mp4Video.currentTime = mp4Audio.currentTime % mp4Video.duration;
  });

  // iOS/現代全螢幕機制
  function toggleMp4Fullscreen() {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    
    if (!document.fullscreenElement) {
      // 嘗試標準 Fullscreen API
      if (mp4Container.requestFullscreen) {
        mp4Container.requestFullscreen().catch(err => console.log(err));
      } else if (mp4Container.webkitRequestFullscreen) { /* Safari */
        mp4Container.webkitRequestFullscreen();
      } else if (isIOS) {
        // iPhone 特殊處理：如果有影片，直接把 video 丟進 native fullscreen
        // 但因為要求「自訂介面+字幕」，最好的作法是依賴 CSS 100vw，或者利用 Screen Orientation 鎖定
        showToast("📱 建議將手機橫放以獲得最佳滿版體驗");
      }
      
      try { screen.orientation.lock('landscape').catch(()=>{}); } catch(e){}
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

</script>
</body>
</html>
