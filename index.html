<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人分區隨身庫</title>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.6);
      --bg-dark: #0b0b0e;
      --card-glass: rgba(18, 18, 24, 0.82);
      --text-main: #ffffff;
      --text-sub: #a0a0b2;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 全螢幕自訂 MP4 動態背景 */
    #bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: -2;
      display: none;
      filter: brightness(0.45);
    }
    #bg-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(11,11,14,0.3) 0%, rgba(11,11,14,0.85) 100%);
      z-index: -1;
    }

    .container { width: 100%; max-width: 480px; padding-bottom: 60px; z-index: 1; }

    /* 核心播放器玻璃卡片 */
    .player-card {
      background: var(--card-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .cover-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: #1a1a22;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .album-tag { font-size: 0.8rem; color: var(--text-sub); text-align: center; margin-bottom: 2px; }
    .track-title { font-size: 1.15rem; font-weight: 700; text-align: center; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 高亮粉紅字體動態字幕區 */
    .lrc-box {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-pink);
      text-shadow: 0 0 12px var(--pink-glow), 0 0 2px #000;
      padding: 6px;
      line-height: 1.35;
      margin-bottom: 12px;
      transition: all 0.15s ease-in-out;
    }

    /* 進度與控制按鈕 */
    .seek-slider { width: 100%; height: 4px; accent-color: #ffffff; cursor: pointer; }
    .time-box { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-sub); margin-top: 4px; margin-bottom: 12px; }
    
    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; padding: 6px; }
    .btn-play-main { width: 50px; height: 50px; background: #fff; color: #000; border-radius: 50%; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; }

    .volume-box { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 12px; }
    .volume-slider { flex: 1; height: 4px; accent-color: var(--text-sub); }

    .btn-pip {
      width: 100%;
      background: rgba(255, 121, 198, 0.15);
      border: 1px solid var(--primary-pink);
      color: var(--primary-pink);
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* 區塊與分區介面 */
    .glass-card {
      background: var(--card-glass);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 12px; color: var(--primary-pink); }
    
    .form-group { margin-bottom: 10px; }
    label { font-size: 0.78rem; color: var(--text-sub); display: block; margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 0.85rem;
    }
    .btn-pink { width: 100%; background: var(--primary-pink); color: #000; border: none; padding: 10px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 6px; }

    /* 分區作品集 Accordion */
    .album-group { border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; margin-bottom: 10px; overflow: hidden; background: rgba(0,0,0,0.2); }
    .album-header {
      padding: 12px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; font-size: 0.95rem;
    }
    .chapter-list { padding: 8px 12px; }
    .chapter-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .chapter-item:last-child { border-bottom: none; }
    .btn-sm { padding: 4px 10px; border-radius: 6px; border: none; font-size: 0.78rem; font-weight: bold; cursor: pointer; }
    .btn-sm-play { background: var(--primary-pink); color: #000; margin-right: 4px; }
    .btn-sm-del { background: rgba(255,255,255,0.1); color: #ff5555; }
  </style>
</head>
<body>

<!-- MP4 背景視訊與陰影遮罩 -->
<video id="bg-video" autoplay loop muted playsinline></video>
<div id="bg-overlay"></div>

<div class="container">

  <!-- 主播放器卡片 -->
  <div class="player-card">
    <div class="cover-box">
      <img id="cover-img" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%231a1a22'/></svg>" alt="封面">
    </div>
    
    <div id="album-tag" class="album-tag">請選擇分區作品</div>
    <div id="track-title" class="track-title">未選擇篇章</div>
    
    <!-- 粉紅色專屬動態字幕區 -->
    <div id="lrc-box" class="lrc-box">♪ 選擇小篇章開始收聽 ♪</div>

    <!-- 進度條 -->
    <input type="range" id="seek-slider" class="seek-slider" value="0" min="0" step="0.1">
    <div class="time-box">
      <span id="time-current">00:00</span>
      <span id="time-duration">00:00</span>
    </div>

    <!-- 控制鏈 -->
    <div class="controls">
      <button class="btn-ctrl" onclick="prevTrack()">⏮</button>
      <button class="btn-ctrl" onclick="seekRelative(-5)">↺5</button>
      <button class="btn-ctrl btn-play-main" id="btn-play" onclick="togglePlay()">▶</button>
      <button class="btn-ctrl" onclick="seekRelative(30)">↻30</button>
      <button class="btn-ctrl" onclick="nextTrack()">⏭</button>
    </div>

    <div class="volume-box">
      🔈 <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1"> 🔊
    </div>

    <button class="btn-pip" onclick="enablePiP()">📺 切換動態字幕至桌面懸浮 (PiP)</button>
  </div>

  <!-- 新增作品分區 (大區塊) -->
  <div class="glass-card">
    <div class="card-title">📁 1. 建立作品分區 (如：系列/專輯)</div>
    <div class="form-group">
      <label>作品分區名稱</label>
      <input type="text" id="album-title" placeholder="例如：彼女さん厳し～♡ 系列">
    </div>
    <div class="form-group">
      <label>作品封面圖片 (選填)</label>
      <input type="file" id="album-cover" accept="image/*">
    </div>
    <div class="form-group">
      <label>作品 MP4 動態背景影片 (選填)</label>
      <input type="file" id="album-bgvideo" accept="video/mp4">
    </div>
    <button class="btn-pink" onclick="createAlbum()">建立分區</button>
  </div>

  <!-- 新增小篇章 (音軌 + 字幕) -->
  <div class="glass-card">
    <div class="card-title">🎵 2. 匯入篇章至指定分區</div>
    <div class="form-group">
      <label>選擇所屬作品分區</label>
      <select id="select-album"><option value="">-- 請先建立分區 --</option></select>
    </div>
    <div class="form-group">
      <label>篇章名稱</label>
      <input type="text" id="track-title-input" placeholder="例如：01_え～♡彼女さん厳し～♡">
    </div>
    <div class="form-group">
      <label>音訊檔案 (解鎖全格式支援)</label>
      <input type="file" id="track-audio">
    </div>
    <div class="form-group">
      <label>字幕檔案 (支援 LRC / SRT / VTT，即時滾動)</label>
      <input type="file" id="track-lrc">
    </div>
    <button class="btn-pink" onclick="addTrack()">新增篇章至分區</button>
  </div>

  <!-- 作品分區與章節清單 -->
  <div class="glass-card">
    <div class="card-title">📚 3. 作品集分區總覽</div>
    <div id="album-list">載入中...</div>
  </div>

</div>

<canvas id="pip-canvas" width="600" height="600" style="display:none;"></canvas>
<video id="pip-video" muted playsinline style="display:none;"></video>
<audio id="main-audio" preload="auto"></audio>

<script>
  let db;
  let albums = [];
  let tracks = [];
  let currentTrackList = [];
  let currentIndex = -1;
  let currentLrc = [];

  const audio = document.getElementById("main-audio");
  const bgVideo = document.getElementById("bg-video");
  const canvas = document.getElementById("pip-canvas");
  const ctx = canvas.getContext("2d");
  const pipVideo = document.getElementById("pip-video");
  let currentCoverImg = new Image();

  // 1. 初始化資料庫 (Albums 區塊 + Tracks 篇章)
  const request = indexedDB.open("ASMR_Categorized_DB_V1", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("albums")) {
      db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
    }
    if (!db.objectStoreNames.contains("tracks")) {
      db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
    }
  };
  request.onsuccess = (e) => {
    db = e.target.result;
    loadData();
  };

  // 2. 資料讀取與選單更新
  function loadData() {
    const tx = db.transaction(["albums", "tracks"], "readonly");
    tx.objectStore("albums").getAll().onsuccess = (e) => { albums = e.target.result; updateAlbumDropdown(); };
    tx.objectStore("tracks").getAll().onsuccess = (e) => { tracks = e.target.result; renderAlbumList(); };
  }

  function updateAlbumDropdown() {
    const select = document.getElementById("select-album");
    select.innerHTML = albums.length ? "" : '<option value="">-- 請先建立分區 --</option>';
    albums.forEach(a => {
      const opt = document.createElement("option");
      opt.value = a.id;
      opt.innerText = a.title;
      select.appendChild(opt);
    });
  }

  // 3. 建立作品分區
  async function createAlbum() {
    const title = document.getElementById("album-title").value.trim();
    if (!title) return alert("請輸入分區名稱！");

    const coverBlob = document.getElementById("album-cover").files[0] || null;
    const bgVideoBlob = document.getElementById("album-bgvideo").files[0] || null;

    const tx = db.transaction(["albums"], "readwrite");
    tx.objectStore("albums").add({ title, coverBlob, bgVideoBlob });
    tx.oncomplete = () => {
      document.getElementById("album-title").value = "";
      document.getElementById("album-cover").value = "";
      document.getElementById("album-bgvideo").value = "";
      loadData();
    };
  }

  // 4. 匯入篇章至分區
  async function addTrack() {
    const albumId = parseInt(document.getElementById("select-album").value);
    if (!albumId) return alert("請先選擇或建立作品分區！");

    const audioFile = document.getElementById("track-audio").files[0];
    if (!audioFile) return alert("請選擇音訊檔案！");

    const title = document.getElementById("track-title-input").value.trim() || audioFile.name;
    const lrcFile = document.getElementById("track-lrc").files[0];
    let lrcText = "";
    if (lrcFile) lrcText = await lrcFile.text();

    const tx = db.transaction(["tracks"], "readwrite");
    tx.objectStore("tracks").add({ albumId, title, audioBlob: audioFile, lrcText });
    tx.oncomplete = () => {
      document.getElementById("track-title-input").value = "";
      document.getElementById("track-audio").value = "";
      document.getElementById("track-lrc").value = "";
      loadData();
    };
  }

  // 5. 渲染分區架構清單
  function renderAlbumList() {
    const listEl = document.getElementById("album-list");
    listEl.innerHTML = "";

    if (albums.length === 0) {
      listEl.innerHTML = "<div style='color:var(--text-sub); font-size:0.85rem;'>無作品分區，請先新增。</div>";
      return;
    }

    albums.forEach(album => {
      const albumTracks = tracks.filter(t => t.albumId === album.id);
      const group = document.createElement("div");
      group.className = "album-group";

      let chaptersHtml = "";
      if (albumTracks.length === 0) {
        chaptersHtml = "<div style='color:var(--text-sub); font-size:0.8rem;'>此分區無小篇章。</div>";
      } else {
        albumTracks.forEach(track => {
          chaptersHtml += `
            <div class="chapter-item">
              <span style="font-size:0.85rem; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${track.title}</span>
              <div>
                <button class="btn-sm btn-sm-play" onclick="playTrack(${album.id}, ${track.id})">播放</button>
                <button class="btn-sm btn-sm-del" onclick="deleteTrack(${track.id})">刪除</button>
              </div>
            </div>
          `;
        });
      }

      group.innerHTML = `
        <div class="album-header">
          <span>📁 ${album.title} (${albumTracks.length})</span>
          <button class="btn-sm btn-sm-del" onclick="deleteAlbum(${album.id})">刪分區</button>
        </div>
        <div class="chapter-list">${chaptersHtml}</div>
      `;
      listEl.appendChild(group);
    });
  }

  // 6. 播放機制與動態資源載入 (MP4 背景 + 封面 + 字幕)
  function playTrack(albumId, trackId) {
    const album = albums.find(a => a.id === albumId);
    currentTrackList = tracks.filter(t => t.albumId === albumId);
    currentIndex = currentTrackList.findIndex(t => t.id === trackId);
    const track = currentTrackList[currentIndex];

    document.getElementById("album-tag").innerText = album.title;
    document.getElementById("track-title").innerText = track.title;
    audio.src = URL.createObjectURL(track.audioBlob);

    // 載入 MP4 動態背景
    if (album.bgVideoBlob) {
      bgVideo.src = URL.createObjectURL(album.bgVideoBlob);
      bgVideo.style.display = "block";
      bgVideo.play();
    } else {
      bgVideo.style.display = "none";
    }

    // 載入封面圖
    if (album.coverBlob) {
      const url = URL.createObjectURL(album.coverBlob);
      document.getElementById("cover-img").src = url;
      currentCoverImg.src = url;
    } else {
      document.getElementById("cover-img").src = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%231a1a22'/></svg>";
      currentCoverImg.src = "";
    }

    // 高相容字幕解析
    currentLrc = parseSubtitles(track.lrcText);
    audio.play();
    document.getElementById("btn-play").innerText = "⏸";
  }

  // 7. 超高相容性字幕解析引擎 (支援 LRC, SRT, VTT 與多時間戳)
  function parseSubtitles(text) {
    if (!text) return [];
    const lines = text.split(/\r?\n/);
    const result = [];

    // 正則匹配 [mm:ss.xx] / [mm:ss:xx] / [mm:ss]
    const lrcReg = /\[(\d{1,2}):(\d{2})(?:[\.:](\d{1,3}))?\]/g;
    // 正則匹配 SRT / VTT 時間戳 (00:00:12,340)
    const srtReg = /(\d{2}):(\d{2}):(\d{2})[,.](\d{3})/;

    let pendingSrtTime = null;

    lines.forEach(line => {
      line = line.trim();
      if (!line) return;

      // 檢查 SRT/VTT 格式
      const srtMatch = line.match(srtReg);
      if (srtMatch) {
        const h = parseInt(srtMatch[1]), m = parseInt(srtMatch[2]), s = parseInt(srtMatch[3]), ms = parseInt(srtMatch[4]);
        pendingSrtTime = h * 3600 + m * 60 + s + ms / 1000;
        return;
      } else if (pendingSrtTime !== null && !isNaN(line)) {
        return; // 跳過行號
      } else if (pendingSrtTime !== null && line) {
        result.push({ time: pendingSrtTime, text: line });
        pendingSrtTime = null;
        return;
      }

      // 檢查標準 LRC 格式
      let match;
      const cleanText = line.replace(/\[\d{1,2}:\d{2}(?:[\.:]\d{1,3})?\]/g, "").trim();
      lrcReg.lastIndex = 0;

      while ((match = lrcReg.exec(line)) !== null) {
        const min = parseInt(match[1]);
        const sec = parseInt(match[2]);
        const ms = match[3] ? parseInt(match[3].padEnd(3, '0')) : 0;
        const time = min * 60 + sec + ms / 1000;
        if (cleanText) result.push({ time, text: cleanText });
      }
    });

    return result.sort((a, b) => a.time - b.time);
  }

  // 8. 音訊時間同步與動態字幕滾動
  audio.ontimeupdate = () => {
    document.getElementById("time-current").innerText = formatTime(audio.currentTime);
    document.getElementById("time-duration").innerText = formatTime(audio.duration || 0);
    if (audio.duration) {
      document.getElementById("seek-slider").value = (audio.currentTime / audio.duration) * 100;
    }

    const lrcBox = document.getElementById("lrc-box");
    if (currentLrc.length === 0) {
      lrcBox.innerText = "♪ 無動態字幕 ♪";
    } else {
      let currentText = "♪";
      for (let i = 0; i < currentLrc.length; i++) {
        if (audio.currentTime >= currentLrc[i].time) {
          currentText = currentLrc[i].text;
        } else {
          break;
        }
      }
      lrcBox.innerText = currentText;
    }

    renderCanvasFrame();
  };

  // 播放控制
  function togglePlay() {
    if (!audio.src) return;
    if (audio.paused) { audio.play(); document.getElementById("btn-play").innerText = "⏸"; }
    else { audio.pause(); document.getElementById("btn-play").innerText = "▶"; }
  }
  function seekRelative(sec) { audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + sec)); }
  function prevTrack() { if (currentIndex > 0) playTrack(currentTrackList[currentIndex - 1].albumId, currentTrackList[currentIndex - 1].id); }
  function nextTrack() { if (currentIndex < currentTrackList.length - 1) playTrack(currentTrackList[currentIndex + 1].albumId, currentTrackList[currentIndex + 1].id); }

  function deleteAlbum(id) {
    if (!confirm("確定刪除此分區及底下所有篇章？")) return;
    const tx = db.transaction(["albums", "tracks"], "readwrite");
    tx.objectStore("albums").delete(id);
    tracks.filter(t => t.albumId === id).forEach(t => tx.objectStore("tracks").delete(t.id));
    tx.oncomplete = () => loadData();
  }

  function deleteTrack(id) {
    if (!confirm("確定刪除此篇章？")) return;
    const tx = db.transaction(["tracks"], "readwrite");
    tx.objectStore("tracks").delete(id);
    tx.oncomplete = () => loadData();
  }

  document.getElementById("seek-slider").oninput = (e) => { if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration; };
  document.getElementById("volume-slider").oninput = (e) => { audio.volume = e.target.value; };
  audio.onended = () => nextTrack();

  function formatTime(sec) {
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  // 9. 桌面背景懸浮字幕 (PiP Canvas 合成)
  function renderCanvasFrame() {
    ctx.fillStyle = "#0b0b0e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (currentCoverImg.complete && currentCoverImg.src) {
      ctx.drawImage(currentCoverImg, 50, 40, 500, 450);
    }

    const currentText = document.getElementById("lrc-box").innerText;
    ctx.fillStyle = "#ff79c6";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(255,121,198,0.8)";
    ctx.shadowBlur = 12;
    ctx.fillText(currentText, 300, 545);
  }

  async function enablePiP() {
    try {
      renderCanvasFrame();
      const stream = canvas.captureStream(15);
      pipVideo.srcObject = stream;
      await pipVideo.play();
      if (document.pictureInPictureElement) {
        await document.exitPictureInPicture();
      } else {
        await pipVideo.requestPictureInPicture();
      }
    } catch (e) {
      alert("請先點擊播放音軌後，再開啟桌面懸浮字幕！");
    }
  }
</script>

</body>
</html>
