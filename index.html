<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫 (極速 PiP 最終版)</title>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.85);
      --bg-dark: #0b0b0e;
      --card-glass: rgba(18, 18, 24, 0.92);
      --text-main: #ffffff;
      --text-sub: #a0a0b2;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; padding-bottom: 110px;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, "PingFang TC", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }

    #bg-video, #bg-img {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: -2; display: none; filter: brightness(0.4);
    }
    #bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(11,11,14,0.3) 0%, rgba(11,11,14,0.85) 100%);
      z-index: -1;
    }

    .container { width: 100%; max-width: 680px; z-index: 1; position: relative; }
    .top-bar { width: 100%; max-width: 680px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; z-index: 10; }
    .app-logo { font-size: 1.3rem; font-weight: bold; color: var(--primary-pink); text-shadow: 0 0 12px var(--pink-glow); cursor: pointer; }
    .btn-toggle-admin {
      background: rgba(255, 121, 198, 0.2); border: 1px solid var(--primary-pink);
      color: var(--primary-pink); padding: 10px 18px; border-radius: 14px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
    }

    .admin-drawer { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-in-out; width: 100%; }
    .admin-drawer.open { max-height: 2000px; }

    .glass-card {
      background: var(--card-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; margin-bottom: 20px;
      box-shadow: 0 10px 36px rgba(0,0,0,0.6);
    }
    .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 16px; color: var(--primary-pink); display: flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 14px; }
    label { font-size: 0.88rem; color: var(--text-sub); display: block; margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; color: #fff; font-size: 0.95rem; }
    .btn-pink { width: 100%; background: var(--primary-pink); color: #000; border: none; padding: 14px; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 10px; font-size: 1rem; }

    .page-view { display: none; width: 100%; }
    .page-view.active { display: block; }

    .album-grid-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px; padding: 18px; margin-bottom: 16px; display: flex; align-items: center; cursor: pointer;
    }
    .album-grid-thumb { width: 96px; height: 96px; border-radius: 14px; object-fit: cover; margin-right: 18px; flex-shrink: 0; }
    .album-grid-info { flex: 1; overflow: hidden; }
    .album-grid-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .album-grid-count { font-size: 0.95rem; color: var(--primary-pink); font-weight: bold; }

    .breadcrumb-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 1.1rem; font-weight: bold; color: var(--primary-pink); cursor: pointer; }
    .chapter-file-list { display: flex; flex-direction: column; gap: 12px; }
    .chapter-file-item {
      display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; font-size: 1.1rem; cursor: pointer;
    }
    .chapter-info-left { display: flex; align-items: center; gap: 16px; overflow: hidden; flex: 1; margin-right: 12px; }
    .play-icon-circle { width: 44px; height: 44px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; flex-shrink: 0; }
    .chapter-meta-text { overflow: hidden; }
    .chapter-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; margin-bottom: 4px; color: #fff; }
    .chapter-duration-sub { font-size: 0.85rem; color: var(--text-sub); }

    .btn-action-group { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-sm { padding: 8px 14px; border-radius: 10px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
    .btn-sm-edit { background: rgba(255, 121, 198, 0.2); color: var(--primary-pink); border: 1px solid var(--primary-pink); }
    .btn-sm-del { background: rgba(255,255,255,0.1); color: #ff5555; }

    .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 0 6px; }
    .btn-page { background: rgba(255, 121, 198, 0.15); border: 1px solid var(--primary-pink); color: var(--primary-pink); padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .btn-page:disabled { opacity: 0.4; cursor: not-allowed; border-color: rgba(255,255,255,0.2); color: var(--text-sub); }
    .page-info { font-size: 0.95rem; color: var(--text-sub); }

    .player-card {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; width: 100%; max-height: 94vh; overflow-y: auto;
      background: var(--card-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-bottom: none; border-radius: 26px 26px 0 0;
      padding: 12px 24px 28px 24px; box-shadow: 0 -12px 45px rgba(0,0,0,0.85);
      z-index: 1000; transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .player-card.minimized { transform: translateY(105%); }

    .drag-handle-area { width: 100%; padding: 4px 0 16px 0; display: flex; justify-content: center; cursor: grab; }
    .drag-handle { width: 56px; height: 6px; background: rgba(255, 255, 255, 0.4); border-radius: 10px; }

    .cover-box { width: 100%; max-height: 32vh; aspect-ratio: 1 / 1; border-radius: 18px; overflow: hidden; background: #1a1a22; margin: 0 auto 10px auto; position: relative; }
    .cover-box img, .cover-box video { width: 100%; height: 100%; object-fit: cover; display: none; }
    .album-tag { font-size: 0.9rem; color: var(--text-sub); text-align: center; margin-bottom: 8px; }
    
    .lrc-box {
      min-height: 90px; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 1.6rem; font-weight: 900; color: var(--primary-pink);
      text-shadow: 0 0 25px var(--pink-glow), 0 2px 5px rgba(0,0,0,0.9); padding: 8px 12px; line-height: 1.4; margin-bottom: 12px;
    }

    .sub-quick-tools { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
    .btn-sub-quick { padding: 8px 14px; background: rgba(255, 121, 198, 0.15); border: 1px solid var(--primary-pink); color: var(--primary-pink); border-radius: 10px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }

    .seek-slider { width: 100%; height: 6px; accent-color: #ffffff; cursor: pointer; }
    .time-box { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-sub); margin-top: 6px; margin-bottom: 10px; }
    
    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 6px; }
    .btn-play-main { width: 52px; height: 52px; background: #fff; color: #000; border-radius: 50%; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; }

    .volume-box { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: var(--text-sub); margin-bottom: 12px; }
    .volume-slider { flex: 1; height: 5px; accent-color: var(--text-sub); }
    .btn-mute { background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; }

    .bottom-tools { display: flex; gap: 12px; }
    .btn-pip {
      flex: 1; background: rgba(255, 121, 198, 0.15); border: 1px solid var(--primary-pink);
      color: var(--primary-pink); padding: 12px; border-radius: 12px; font-weight: bold; font-size: 0.88rem; cursor: pointer; text-align: center;
    }

    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; height: 68px;
      background: rgba(18, 18, 24, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.12); display: flex; align-items: center; padding: 0 16px;
      z-index: 999; cursor: pointer; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); transition: transform 0.3s ease;
    }
    .mini-player.hidden { transform: translateY(100%); }
    .mini-thumb { width: 48px; height: 48px; border-radius: 10px; background: #1a1a22; object-fit: cover; margin-right: 14px; flex-shrink: 0; }
    .mini-info { flex: 1; overflow: hidden; margin-right: 14px; }
    .mini-title { font-size: 0.92rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-subtitle { font-size: 0.82rem; color: var(--primary-pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
    .mini-btn { background: none; border: none; color: #fff; font-size: 1.4rem; padding: 6px; cursor: pointer; }
  </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img" alt="全域背景">
<div id="bg-overlay"></div>

<div class="container">
  <div class="top-bar">
    <div class="app-logo" onclick="switchPage('home')">🌸 ASMR 隨身庫</div>
    <button class="btn-toggle-admin" onclick="toggleAdminDrawer()">⚙️ 管理選單</button>
  </div>

  <div id="admin-drawer" class="admin-drawer">
    <div class="glass-card">
      <div class="card-title">🖼️ 設定預設全域背景</div>
      <div class="form-group">
        <label>選取多張圖片或 MP4 影片（每 1 分鐘自動輪換）</label>
        <input type="file" id="global-bg-input" accept="image/*,video/*" multiple>
      </div>
      <button class="btn-pink" onclick="saveGlobalBackgrounds()">儲存並啟動背景輪播</button>
    </div>

    <div class="glass-card">
      <div class="card-title">📁 建立作品分區</div>
      <div class="form-group"><label>作品分區名稱</label><input type="text" id="album-title" placeholder="例如：系列名稱"></div>
      <div class="form-group"><label>封面/圖片素材</label><input type="file" id="album-cover" accept="image/*,video/*"></div>
      <div class="form-group"><label>此分區專屬背景 (選填)</label><input type="file" id="album-bg" accept="image/*,video/*"></div>
      <button class="btn-pink" onclick="createAlbum()">建立分區</button>
    </div>

    <div class="glass-card">
      <div class="card-title">🎵 匯入篇章至分區</div>
      <div class="form-group"><label>選擇作品分區</label><select id="select-album"><option value="">-- 請先建立分區 --</option></select></div>
      <div class="form-group"><label>篇章名稱</label><input type="text" id="track-title-input" placeholder="例如：01_開場"></div>
      <div class="form-group"><label>音訊檔案</label><input type="file" id="track-audio"></div>
      <div class="form-group"><label>字幕檔案 (.lrc / .srt / .vtt / .txt)</label><input type="file" id="track-lrc"></div>
      <button class="btn-pink" onclick="addTrack()">新增篇章至分區</button>
    </div>
  </div>

  <div id="view-home" class="page-view active">
    <div class="glass-card">
      <div class="card-title">📚 選擇作品集</div>
      <div id="album-list">載入中...</div>
      <div id="pagination-container"></div>
    </div>
  </div>

  <div id="view-detail" class="page-view">
    <div class="glass-card">
      <div class="breadcrumb-bar" onclick="switchPage('home')">
        <span>⬅ ROOT / 📁 <span id="detail-album-title">作品名稱</span></span>
      </div>
      <div id="chapter-list-container" class="chapter-file-list"></div>
    </div>
  </div>
</div>

<div id="mini-player" class="mini-player hidden" onclick="expandPlayer()">
  <img id="mini-thumb" class="mini-thumb" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%231a1a22'/></svg>">
  <div class="mini-info">
    <div id="mini-title" class="mini-title">未選擇篇章</div>
    <div id="mini-lrc" class="mini-subtitle">♪ 點擊展開播放面板</div>
  </div>
  <button class="mini-btn" onclick="event.stopPropagation(); togglePlay();" id="mini-btn-play">▶</button>
  <button class="mini-btn" onclick="event.stopPropagation(); expandPlayer();">▲</button>
</div>

<div id="player-card" class="player-card minimized">
  <div class="drag-handle-area" id="drag-handle-area" onclick="minimizePlayer()"><div class="drag-handle"></div></div>

  <div class="cover-box">
    <img id="cover-img" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%231a1a22'/></svg>" style="display:block;">
    <video id="cover-video" autoplay loop muted playsinline style="display:none;"></video>
  </div>
  
  <div id="album-tag" class="album-tag">請選擇作品分區</div>
  <div id="lrc-box" class="lrc-box">♪ 選擇小篇章開始收聽 ♪</div>

  <div class="sub-quick-tools">
    <label class="btn-sub-quick">📂 匯入字幕<input type="file" id="quick-lrc-input" style="display:none;" onchange="uploadCurrentTrackLrc(event)"></label>
    <button class="btn-sub-quick" onclick="pasteCurrentTrackLrc()">📝 貼上字幕</button>
    <button class="btn-sub-quick" onclick="inspectCurrentTrackLrc()">🔍 檢視/修改</button>
  </div>

  <input type="range" id="seek-slider" class="seek-slider" value="0" min="0" max="100" step="0.1">
  <div class="time-box"><span id="time-current">00:00</span><span id="time-duration">00:00</span></div>

  <div class="controls">
    <button class="btn-ctrl" onclick="prevTrack()">⏮</button>
    <button class="btn-ctrl" onclick="seekRelative(-5)">↺5</button>
    <button class="btn-ctrl btn-play-main" id="btn-play" onclick="togglePlay()">▶</button>
    <button class="btn-ctrl" onclick="seekRelative(30)">↻30</button>
    <button class="btn-ctrl" onclick="nextTrack()">⏭</button>
  </div>

  <div class="volume-box">
    <button class="btn-mute" id="btn-mute" onclick="toggleMute()">🔈</button>
    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
    <span>🔊</span>
  </div>

  <div class="bottom-tools">
    <button class="btn-pip" onclick="enablePiP()">📺 桌面懸浮 (PiP)</button>
  </div>
</div>

<!-- iOS 專用即時串流影片元素 -->
<video id="pip-video" crossorigin="anonymous" playsinline muted style="position: fixed; bottom: 0; right: 0; width: 2px; height: 2px; opacity: 0.001; pointer-events: none; z-index: -999;"></video>
<audio id="main-audio" crossorigin="anonymous" preload="auto"></audio>

<script>
  let db;
  let albums = [];
  let tracks = [];
  let currentTrackList = [];
  let currentIndex = -1;
  let currentLrc = [];
  let currentPlayingAlbumId = null;
  let currentActiveAlbumId = null;
  let lastVolume = 1;

  let globalBackgrounds = [];
  let bgIndex = 0;
  let bgIntervalTimer = null;
  let isCustomAlbumPlaying = false;

  let pipCanvas = null;
  let pipCtx = null;
  let cachedCoverImage = null;
  let isPiPInitialized = false;

  let currentPage = 1;
  const itemsPerPage = 4;

  const audio = document.getElementById("main-audio");
  const bgVideo = document.getElementById("bg-video");
  const bgImg = document.getElementById("bg-img");
  const coverImg = document.getElementById("cover-img");
  const coverVideo = document.getElementById("cover-video");
  const pipVideo = document.getElementById("pip-video");

  const playerCard = document.getElementById("player-card");
  const miniPlayer = document.getElementById("mini-player");
  const seekSlider = document.getElementById("seek-slider");
  const volumeSlider = document.getElementById("volume-slider");

  // 初始化 Media Session 系統層級與 PiP 小視窗控制
  function initMediaSession() {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => togglePlay());
      navigator.mediaSession.setActionHandler('pause', () => togglePlay());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
      navigator.mediaSession.setActionHandler('seekbackward', (details) => {
        const skipTime = details.seekOffset || 5;
        seekRelative(-skipTime);
      });
      navigator.mediaSession.setActionHandler('seekforward', (details) => {
        const skipTime = details.seekOffset || 30;
        seekRelative(skipTime);
      });
      try {
        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (details.seekTime !== undefined && audio.duration) {
            audio.currentTime = details.seekTime;
            updatePositionState();
          }
        });
      } catch (e) { console.log(e); }
    }
  }

  function updateMediaSessionMetadata(title, albumTitle, coverUrl) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title || 'ASMR 篇章',
        artist: albumTitle || 'ASMR 隨身庫',
        album: albumTitle || 'ASMR 隨身庫',
        artwork: coverUrl ? [{ src: coverUrl, sizes: '512x512', type: 'image/png' }] : []
      });
    }
  }

  function updatePositionState() {
    if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
      if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
        try {
          navigator.mediaSession.setPositionState({
            duration: audio.duration,
            playbackRate: audio.playbackRate || 1,
            position: audio.currentTime
          });
        } catch (e) {}
      }
    }
  }

  // 初始化全域 Canvas 串流引擎
  function initPiPEngine() {
    if (isPiPInitialized) return;
    try {
      pipCanvas = document.createElement('canvas');
      pipCanvas.width = 512;
      pipCanvas.height = 512;
      pipCtx = pipCanvas.getContext('2d', { alpha: false });

      setInterval(() => {
        if (!pipCtx) return;
        pipCtx.fillStyle = "#121218";
        pipCtx.fillRect(0, 0, 512, 512);

        if (cachedCoverImage && cachedCoverImage.complete) {
          pipCtx.drawImage(cachedCoverImage, 56, 40, 400, 400);
        } else {
          pipCtx.fillStyle = "#1a1a22";
          pipCtx.fillRect(56, 40, 400, 400);
          pipCtx.fillStyle = "#ff79c6";
          pipCtx.font = "bold 24px sans-serif";
          pipCtx.textAlign = "center";
          pipCtx.fillText("ASMR 隨身庫", 256, 240);
        }

        const currentTime = audio.currentTime;
        let currentText = "♪ 享受音樂中 ♪";
        if (currentLrc.length > 0) {
          for (let i = 0; i < currentLrc.length; i++) {
            if (currentTime >= currentLrc[i].time) currentText = currentLrc[i].text;
            else break;
          }
        }

        pipCtx.fillStyle = "rgba(0, 0, 0, 0.75)";
        pipCtx.fillRect(20, 430, 472, 65);

        pipCtx.fillStyle = "#ff79c6";
        pipCtx.font = "bold 22px -apple-system, BlinkMacSystemFont, sans-serif";
        pipCtx.textAlign = "center";
        
        if (pipCtx.measureText(currentText).width > 440) {
          pipCtx.fillText(currentText.substring(0, 20), 256, 455);
          pipCtx.fillText(currentText.substring(20, 40), 256, 480);
        } else {
          pipCtx.fillText(currentText, 256, 470);
        }
      }, 1000 / 15);

      const stream = pipCanvas.captureStream(15);
      pipVideo.srcObject = stream;
      pipVideo.play();
      isPiPInitialized = true;
    } catch(e) {
      console.error(e);
    }
  }

  const request = indexedDB.open("ASMR_Categorized_DB_V13", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("albums")) db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
  };
  request.onsuccess = (e) => { db = e.target.result; loadData(); initMediaSession(); };

  function loadData() {
    const tx = db.transaction(["albums", "tracks", "settings"], "readonly");
    tx.objectStore("albums").getAll().onsuccess = (e) => { albums = e.target.result; updateAlbumDropdown(); renderAlbumList(); };
    tx.objectStore("tracks").getAll().onsuccess = (e) => { tracks = e.target.result; renderAlbumList(); if(currentActiveAlbumId) renderDetailView(currentActiveAlbumId); };
    tx.objectStore("settings").get("globalBgs").onsuccess = (e) => {
      const res = e.target.result;
      if (res && res.blobs && res.blobs.length > 0) {
        globalBackgrounds = res.blobs;
        startBackgroundCarousel();
      }
    };
  }

  function switchPage(viewName, albumId) {
    document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
    if (viewName === 'home') {
      document.getElementById('view-home').classList.add('active');
      currentActiveAlbumId = null; isCustomAlbumPlaying = false;
      if (globalBackgrounds.length > 0) applyBackgroundBlob(globalBackgrounds[bgIndex]);
    } else if (viewName === 'detail') {
      document.getElementById('view-detail').classList.add('active');
      currentActiveAlbumId = albumId; renderDetailView(albumId);
    }
  }

  function toggleAdminDrawer() { document.getElementById("admin-drawer").classList.toggle("open"); }
  function updateAlbumDropdown() {
    const select = document.getElementById("select-album");
    select.innerHTML = albums.length ? "" : '<option value="">-- 請先建立分區 --</option>';
    albums.forEach(a => {
      const opt = document.createElement("option"); opt.value = a.id; opt.innerText = a.title; select.appendChild(opt);
    });
  }

  async function saveGlobalBackgrounds() {
    const files = document.getElementById("global-bg-input").files;
    if (!files || files.length === 0) return alert("請選擇背景檔案！");
    const blobsArray = Array.from(files);
    const tx = db.transaction(["settings"], "readwrite");
    tx.objectStore("settings").put({ key: "globalBgs", blobs: blobsArray });
    tx.oncomplete = () => {
      globalBackgrounds = blobsArray; bgIndex = 0; isCustomAlbumPlaying = false; startBackgroundCarousel();
      alert(`成功設定 ${blobsArray.length} 張背景！`);
      document.getElementById("global-bg-input").value = "";
    };
  }

  function startBackgroundCarousel() {
    if (bgIntervalTimer) clearInterval(bgIntervalTimer);
    if (!globalBackgrounds || globalBackgrounds.length === 0) return;
    if (!isCustomAlbumPlaying) applyBackgroundBlob(globalBackgrounds[bgIndex]);
    bgIntervalTimer = setInterval(() => {
      if (!isCustomAlbumPlaying && globalBackgrounds.length > 0) {
        bgIndex = (bgIndex + 1) % globalBackgrounds.length;
        applyBackgroundBlob(globalBackgrounds[bgIndex]);
      }
    }, 60000);
  }

  function applyBackgroundBlob(blob) {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    if (blob.type && blob.type.startsWith('video/')) {
      bgVideo.src = url; bgVideo.style.display = "block"; bgVideo.play(); bgImg.style.display = "none";
    } else {
      bgImg.src = url; bgImg.style.display = "block"; bgVideo.style.display = "none"; bgVideo.pause();
    }
  }

  async function createAlbum() {
    const title = document.getElementById("album-title").value.trim();
    if (!title) return alert("請輸入分區名稱！");
    const coverBlob = document.getElementById("album-cover").files[0] || null;
    const bgBlob = document.getElementById("album-bg").files[0] || null;
    const tx = db.transaction(["albums"], "readwrite");
    tx.objectStore("albums").add({ title, coverBlob, bgBlob });
    tx.oncomplete = () => {
      document.getElementById("album-title").value = "";
      document.getElementById("album-cover").value = "";
      document.getElementById("album-bg").value = "";
      loadData(); toggleAdminDrawer();
    };
  }

  function readFileTextSmart(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        let text = e.target.result;
        if (text.includes('\uFFFD')) {
          const readerSJIS = new FileReader();
          readerSJIS.onload = (e2) => resolve(e2.target.result);
          readerSJIS.readAsText(file, 'shift-jis');
        } else { resolve(text); }
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  async function addTrack() {
    const albumId = parseInt(document.getElementById("select-album").value);
    if (!albumId) return alert("請先選擇作品分區！");
    const audioFile = document.getElementById("track-audio").files[0];
    if (!audioFile) return alert("請選擇音訊檔案！");
    const title = document.getElementById("track-title-input").value.trim() || audioFile.name;
    const lrcFile = document.getElementById("track-lrc").files[0];
    let lrcText = "";
    if (lrcFile) lrcText = await readFileTextSmart(lrcFile);

    const tx = db.transaction(["tracks"], "readwrite");
    tx.objectStore("tracks").add({ albumId, title, audioBlob: audioFile, lrcText });
    tx.oncomplete = () => {
      alert("篇章新增成功！");
      document.getElementById("track-title-input").value = "";
      document.getElementById("track-audio").value = "";
      document.getElementById("track-lrc").value = "";
      loadData();
    };
  }

  async function saveTrackSubtitle(trackId, lrcText) {
    return new Promise((resolve) => {
      const tx = db.transaction(["tracks"], "readwrite");
      const store = tx.objectStore("tracks");
      store.get(trackId).onsuccess = (e) => {
        const track = e.target.result;
        if (track) { track.lrcText = lrcText; store.put(track); }
      };
      tx.oncomplete = () => {
        const t = tracks.find(item => item.id === trackId);
        if (t) t.lrcText = lrcText;
        if (currentIndex !== -1 && currentTrackList[currentIndex] && currentTrackList[currentIndex].id === trackId) {
          currentTrackList[currentIndex].lrcText = lrcText;
          currentLrc = parseSubtitles(lrcText, audio.duration);
        }
        loadData(); resolve(true);
      };
    });
  }

  async function uploadCurrentTrackLrc(event) {
    if (currentIndex === -1 || !currentTrackList[currentIndex]) return alert("請先選擇篇章！");
    const file = event.target.files[0];
    if (!file) return;
    const text = await readFileTextSmart(file);
    await saveTrackSubtitle(currentTrackList[currentIndex].id, text);
    alert("字幕匯入成功！"); event.target.value = "";
  }

  async function pasteCurrentTrackLrc() {
    if (currentIndex === -1 || !currentTrackList[currentIndex]) return alert("請先選擇篇章！");
    const text = prompt("請貼上字幕內容：");
    if (text && text.trim()) { await saveTrackSubtitle(currentTrackList[currentIndex].id, text.trim()); alert("字幕更新成功！"); }
  }

  async function inspectCurrentTrackLrc() {
    if (currentIndex === -1 || !currentTrackList[currentIndex]) return alert("請先選擇篇章！");
    const track = currentTrackList[currentIndex];
    const newText = prompt(`【${track.title}】字幕內容：`, track.lrcText || "");
    if (newText !== null) { await saveTrackSubtitle(track.id, newText.trim()); alert("字幕已儲存！"); }
  }

  async function editTrackLrc(trackId) {
    const track = tracks.find(t => t.id === trackId);
    if (!track) return;
    const newText = prompt(`編輯【${track.title}】字幕：`, track.lrcText || "");
    if (newText !== null) { await saveTrackSubtitle(trackId, newText.trim()); alert("字幕已儲存！"); }
  }

  function renderAlbumList() {
    const listEl = document.getElementById("album-list");
    const paginationEl = document.getElementById("pagination-container");
    listEl.innerHTML = ""; paginationEl.innerHTML = "";
    if (albums.length === 0) {
      listEl.innerHTML = "<div style='color:var(--text-sub); font-size:1rem; padding:12px 0;'>目前沒有作品分區，請從右上角管理選單新增。</div>";
      return;
    }
    const totalPages = Math.ceil(albums.length / itemsPerPage);
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    const start = (currentPage - 1) * itemsPerPage;
    const paginatedAlbums = albums.slice(start, start + itemsPerPage);

    paginatedAlbums.forEach(album => {
      const albumTracks = tracks.filter(t => t.albumId === album.id);
      const card = document.createElement("div");
      card.className = "album-grid-card";
      card.onclick = () => {
        if (album.bgBlob) { isCustomAlbumPlaying = true; applyBackgroundBlob(album.bgBlob); }
        else { isCustomAlbumPlaying = false; if (globalBackgrounds.length > 0) applyBackgroundBlob(globalBackgrounds[bgIndex]); }
        switchPage('detail', album.id);
      };
      let thumbUrl = album.coverBlob ? URL.createObjectURL(album.coverBlob) : "";
      card.innerHTML = `
        ${thumbUrl ? `<img src="${thumbUrl}" class="album-grid-thumb">` : '<div class="album-grid-thumb" style="background:#222; display:flex; align-items:center; justify-content:center; color:#555;">📁</div>'}
        <div class="album-grid-info"><div class="album-grid-title">${album.title}</div><div class="album-grid-count">包含 ${albumTracks.length} 個篇章 ▶</div></div>
      `;
      listEl.appendChild(card);
    });

    if (totalPages > 1) {
      paginationEl.innerHTML = `
        <div class="pagination-bar">
          <button class="btn-page" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">◀ 上一頁</button>
          <span class="page-info">第 ${currentPage} / ${totalPages} 頁</span>
          <button class="btn-page" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">下一頁 ▶</button>
        </div>
      `;
    }
  }

  function changePage(page) { currentPage = page; renderAlbumList(); }

  function renderDetailView(albumId) {
    const album = albums.find(a => a.id === albumId);
    if (!album) return;
    document.getElementById("detail-album-title").innerText = album.title;
    const container = document.getElementById("chapter-list-container");
    container.innerHTML = "";
    const albumTracks = tracks.filter(t => t.albumId === albumId);
    if (albumTracks.length === 0) {
      container.innerHTML = "<div style='color:var(--text-sub); font-size:1rem; padding:12px 0;'>此分區目前沒有篇章。</div>";
      return;
    }
    albumTracks.forEach(track => {
      const item = document.createElement("div");
      item.className = "chapter-file-item";
      item.onclick = () => playTrack(album.id, track.id);
      item.innerHTML = `
        <div class="chapter-info-left">
          <div class="play-icon-circle">▶</div>
          <div class="chapter-meta-text">
            <div class="chapter-name">${track.title}</div>
            <div class="chapter-duration-sub">${(track.lrcText && track.lrcText.trim()) ? '💬 有動態字幕' : '⚪ 無動態字幕'}</div>
          </div>
        </div>
        <div class="btn-action-group" onclick="event.stopPropagation()">
          <button class="btn-sm btn-sm-edit" onclick="editTrackLrc(${track.id})">字幕</button>
          <button class="btn-sm btn-sm-del" onclick="deleteTrack(${track.id})">刪</button>
        </div>
      `;
      container.appendChild(item);
    });
  }

  async function deleteTrack(trackId) {
    if (!confirm("確定要刪除這個篇章嗎？")) return;
    const tx = db.transaction(["tracks"], "readwrite");
    tx.objectStore("tracks").delete(trackId);
    tx.oncomplete = () => {
      if (currentIndex !== -1 && currentTrackList[currentIndex] && currentTrackList[currentIndex].id === trackId) {
        audio.pause(); audio.src = ""; currentIndex = -1; minimizePlayer();
      }
      loadData();
    };
  }

  function playTrack(albumId, trackId) {
    initPiPEngine();
    currentPlayingAlbumId = albumId;
    const album = albums.find(a => a.id === albumId);
    currentTrackList = tracks.filter(t => t.albumId === albumId);
    currentIndex = currentTrackList.findIndex(t => t.id === trackId);
    const track = currentTrackList[currentIndex];

    document.getElementById("album-tag").innerText = album.title;
    document.getElementById("mini-title").innerText = track.title;
    audio.src = URL.createObjectURL(track.audioBlob);
    
    if (album.bgBlob) { isCustomAlbumPlaying = true; applyBackgroundBlob(album.bgBlob); }
    else { isCustomAlbumPlaying = false; if (globalBackgrounds.length > 0) applyBackgroundBlob(globalBackgrounds[bgIndex]); }

    let coverUrl = "";
    if (album.coverBlob && album.coverBlob.type.startsWith('image/')) {
      coverUrl = URL.createObjectURL(album.coverBlob);
      coverImg.src = coverUrl; document.getElementById("mini-thumb").src = coverUrl;
      coverImg.style.display = "block"; coverVideo.style.display = "none";
      cachedCoverImage = new Image(); cachedCoverImage.src = coverUrl;
    } else {
      coverUrl = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%231a1a22'/></svg>";
      coverImg.src = coverUrl; document.getElementById("mini-thumb").src = coverUrl;
      coverImg.style.display = "block"; coverVideo.style.display = "none"; cachedCoverImage = null;
    }

    // 同步系統控制中心與小視窗資訊
    updateMediaSessionMetadata(track.title, album.title, coverUrl);

    currentLrc = parseSubtitles(track.lrcText, audio.duration);
    audio.play();
    document.getElementById("btn-play").innerText = "⏸";
    document.getElementById("mini-btn-play").innerText = "⏸";
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
    expandPlayer();
  }

  // 解析動態字幕 (LRC / 逐行 fallback)
  function parseSubtitles(text, duration) {
    if (!text || !text.trim()) return [];
    const lines = text.split('\n');
    const lrc = [];
    const lrcRegex = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\](.*)/;

    for (let line of lines) {
      line = line.trim();
      const match = lrcRegex.exec(line);
      if (match) {
        const min = parseInt(match[1]);
        const sec = parseInt(match[2]);
        const ms = match[3] ? parseFloat("0." + match[3]) : 0;
        const time = min * 60 + sec + ms;
        const content = match[4].trim();
        if (content) lrc.push({ time, text: content });
      }
    }

    if (lrc.length > 0) {
      lrc.sort((a, b) => a.time - b.time);
      return lrc;
    }

    const cleanLines = lines.map(l => l.trim()).filter(l => l.length > 0);
    if (cleanLines.length === 0) return [];
    const interval = (duration && !isNaN(duration)) ? duration / cleanLines.length : 5;
    return cleanLines.map((t, idx) => ({ time: idx * interval, text: t }));
  }

  // 播放器核心控制函式
  function togglePlay() {
    if (!audio.src) return;
    if (audio.paused) {
      audio.play();
      document.getElementById("btn-play").innerText = "⏸";
      document.getElementById("mini-btn-play").innerText = "⏸";
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
    } else {
      audio.pause();
      document.getElementById("btn-play").innerText = "▶";
      document.getElementById("mini-btn-play").innerText = "▶";
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
    }
  }

  function prevTrack() {
    if (currentTrackList.length === 0) return;
    currentIndex = (currentIndex - 1 + currentTrackList.length) % currentTrackList.length;
    playTrack(currentPlayingAlbumId, currentTrackList[currentIndex].id);
  }

  function nextTrack() {
    if (currentTrackList.length === 0) return;
    currentIndex = (currentIndex + 1) % currentTrackList.length;
    playTrack(currentPlayingAlbumId, currentTrackList[currentIndex].id);
  }

  function seekRelative(seconds) {
    if (!audio.duration) return;
    audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds));
    updatePositionState();
  }

  function toggleMute() {
    if (audio.volume > 0) {
      lastVolume = audio.volume;
      audio.volume = 0;
      volumeSlider.value = 0;
      document.getElementById("btn-mute").innerText = "🔇";
    } else {
      audio.volume = lastVolume || 1;
      volumeSlider.value = audio.volume;
      document.getElementById("btn-mute").innerText = "🔈";
    }
  }

  function expandPlayer() {
    playerCard.classList.remove("minimized");
    miniPlayer.classList.add("hidden");
  }

  function minimizePlayer() {
    playerCard.classList.add("minimized");
    if (currentIndex !== -1) miniPlayer.classList.remove("hidden");
  }

  async function enablePiP() {
    initPiPEngine();
    try {
      if (document.pictureInPictureElement) {
        await document.exitPictureInPicture();
      } else {
        await pipVideo.requestPictureInPicture();
      }
    } catch (e) {
      alert("PiP 啟動失敗：" + e.message);
    }
  }

  // 時間與進度條監聽
  audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    const cur = audio.currentTime;
    const dur = audio.duration;
    seekSlider.value = (cur / dur) * 100;
    
    document.getElementById("time-current").innerText = formatTime(cur);
    document.getElementById("time-duration").innerText = formatTime(dur);

    // 更新即時字幕
    let activeText = "♪ 享受音樂中 ♪";
    if (currentLrc.length > 0) {
      for (let i = 0; i < currentLrc.length; i++) {
        if (cur >= currentLrc[i].time) activeText = currentLrc[i].text;
        else break;
      }
    }
    document.getElementById("lrc-box").innerText = activeText;
    document.getElementById("mini-lrc").innerText = activeText;

    updatePositionState();
  });

  audio.addEventListener("loadedmetadata", () => {
    document.getElementById("time-duration").innerText = formatTime(audio.duration);
    if (currentIndex !== -1 && currentTrackList[currentIndex]) {
      currentLrc = parseSubtitles(currentTrackList[currentIndex].lrcText, audio.duration);
    }
    updatePositionState();
  });

  audio.addEventListener("ended", () => { nextTrack(); });

  seekSlider.addEventListener("input", (e) => {
    if (!audio.duration) return;
    audio.currentTime = (e.target.value / 100) * audio.duration;
    updatePositionState();
  });

  volumeSlider.addEventListener("input", (e) => {
    audio.volume = e.target.value;
    document.getElementById("btn-mute").innerText = audio.volume == 0 ? "🔇" : "🔈";
  });

  function formatTime(sec) {
    if (isNaN(sec)) return "00:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
  }
</script>
