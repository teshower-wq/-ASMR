<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫 (全螢幕影片與高潮進階升級版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.45);
      --bg-dark: #07070a;
      --card-glass: rgba(16, 16, 22, 0.88);
      --card-glass-hover: rgba(24, 24, 34, 0.95);
      --text-main: #ffffff;
      --text-sub: #9494ab;
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-hover: rgba(255, 121, 198, 0.35);
      --accent-green: #50fa7b;
      --accent-blue: #3b82f6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; padding-bottom: 150px;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, "PingFang TC", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }

    #bg-video, #bg-img {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; background-color: var(--bg-dark);
      z-index: -2; display: none; filter: brightness(0.65) blur(6px);
      transform: scale(1); transition: opacity 1s ease, transform 1s ease;
      will-change: transform, opacity;
    }
    @media (max-width: 768px) {
      #bg-video, #bg-img {
        top: -10vh; left: -10vw; width: 120vw; height: 120vh; transform: scale(0.85);
      }
    }
    #bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(7,7,10,0.4) 0%, rgba(7,7,10,0.94) 100%);
      z-index: -1; pointer-events: none;
    }

    .container { width: 100%; max-width: 680px; z-index: 1; position: relative; }
    .top-bar { width: 100%; max-width: 680px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; z-index: 10; }
    .app-logo { font-size: 1.35rem; font-weight: 800; color: var(--primary-pink); text-shadow: 0 0 20px var(--pink-glow); cursor: pointer; letter-spacing: 0.5px; }
    
    .nav-tabs { display: flex; gap: 6px; width: 100%; margin-bottom: 16px; }
    .nav-tab-btn {
      flex: 1; padding: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass);
      color: var(--text-sub); border-radius: 14px; font-weight: 700; font-size: 0.88rem; cursor: pointer; transition: all 0.2s;
    }
    .nav-tab-btn.active { background: rgba(255, 121, 198, 0.15); border-color: var(--primary-pink); color: var(--primary-pink); box-shadow: 0 0 15px var(--pink-glow); }

    .admin-drawer { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; will-change: max-height; }
    .admin-drawer.open { max-height: 4000px; }

    .glass-card {
      background: var(--card-glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass); border-radius: 24px; padding: 20px; margin-bottom: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .card-title { font-size: 1.12rem; font-weight: 700; margin-bottom: 14px; color: var(--primary-pink); display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 0.84rem; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.25s ease;
    }
    input:focus, select:focus { border-color: var(--primary-pink); box-shadow: 0 0 12px rgba(255, 121, 198, 0.25); background: rgba(0,0,0,0.6); }
    input[type="file"] { padding: 8px; color: var(--text-sub); font-size: 0.85rem; cursor: pointer; }
    input[type="file"]::file-selector-button {
      background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-right: 12px;
    }

    .btn-pink {
      width: 100%; background: linear-gradient(135deg, #ff79c6 0%, #ff52b2 100%); color: #07070a; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(255, 121, 198, 0.35); transition: all 0.25s ease;
    }
    .btn-blue {
      width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #ffffff; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
    }
    .btn-green {
      width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
    }
    .btn-green:disabled { opacity: 0.6; cursor: not-allowed; }

    .page-view { display: none; width: 100%; animation: fadeIn 0.25s ease; }
    .page-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .album-grid-card {
      background: var(--card-glass); backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass); border-radius: 20px; padding: 14px; margin-bottom: 12px;
      display: flex; align-items: center; cursor: pointer; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .album-grid-card:hover {
      background: var(--card-glass-hover); border-color: var(--border-glass-hover);
      transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 121, 198, 0.15);
    }
    .album-grid-thumb { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; margin-right: 14px; flex-shrink: 0; background: #121218; }
    .album-grid-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .album-grid-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .album-grid-count { font-size: 0.85rem; color: var(--primary-pink); font-weight: 600; }
    
    .btn-action-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; z-index: 2; }
    .btn-album-action { background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3); color: var(--primary-pink); padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .btn-album-del { background: rgba(255, 85, 85, 0.1); border: 1px solid rgba(255, 85, 85, 0.25); color: #ff6b6b; padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }

    .breadcrumb-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 0.95rem; font-weight: 700; color: var(--primary-pink); cursor: pointer; padding: 2px 0; }
    .chapter-file-list { display: flex; flex-direction: column; gap: 8px; }
    .chapter-file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 14px; cursor: pointer; transition: all 0.2s ease; }
    .chapter-file-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255, 121, 198, 0.25); }
    .chapter-info-left { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; margin-right: 10px; }
    .play-icon-circle { width: 36px; height: 36px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.95rem; flex-shrink: 0; }
    .chapter-meta-text { overflow: hidden; }
    .chapter-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; margin-bottom: 2px; color: #fff; font-size: 0.92rem; }
    .chapter-duration-sub { font-size: 0.78rem; color: var(--text-sub); }

    .btn-action-group { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-sm { padding: 5px 10px; border-radius: 9px; border: none; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-sm-edit { background: rgba(255, 121, 198, 0.15); color: var(--primary-pink); border: 1px solid rgba(255, 121, 198, 0.3); }
    .btn-sm-del { background: rgba(255,255,255,0.06); color: #ff6b6b; border: 1px solid rgba(255,85,85,0.15); }

    /* Audio Area Old Heart Widget */
    .heart-widget-card {
      background: rgba(22, 16, 28, 0.92); border: 1px solid rgba(255, 121, 198, 0.3);
      border-radius: 20px; padding: 16px; margin-bottom: 14px; text-align: center;
      position: relative; overflow: hidden; display: none;
    }
    .heart-container { position: relative; width: 90px; height: 90px; margin: 0 auto 10px auto; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .heart-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px rgba(255, 121, 198, 0.5)); transition: transform 0.2s ease; }
    .heart-svg.climaxing { animation: heartClimaxPulse 0.4s infinite alternate ease-in-out; }
    @keyframes heartClimaxPulse {
      0% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 25px #ff2a85); }
      100% { transform: scale(1.25) rotate(5deg); filter: drop-shadow(0 0 45px #ff79c6); }
    }
    @keyframes screenShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-8px, 6px) rotate(-1.5deg); }
      40% { transform: translate(8px, -6px) rotate(1.5deg); }
      60% { transform: translate(-6px, -4px) rotate(0deg); }
      80% { transform: translate(6px, 4px) rotate(1.5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .screen-shaking { animation: screenShake 0.25s ease infinite !important; }

    /* Fullscreen Video ASMR Styling */
    .video-asmr-player-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 18px;
      overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin-bottom: 12px; display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease;
    }
    .video-asmr-player-wrap video { width: 100%; height: 100%; object-fit: cover; }
    
    .fullscreen-active {
      position: fixed !important; top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important; z-index: 999999 !important;
      border-radius: 0 !important; margin: 0 !important; aspect-ratio: auto !important;
    }
    
    .btn-fullscreen {
      position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 10px;
      font-size: 1.2rem; cursor: pointer; z-index: 50; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px); transition: 0.2s;
    }
    .btn-fullscreen:hover { background: rgba(255, 121, 198, 0.4); border-color: var(--primary-pink); }
    
    .video-inner-sub {
      position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center;
      font-size: 1.3rem; font-weight: 800; color: var(--primary-pink);
      text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 15px var(--pink-glow);
      z-index: 40; pointer-events: none; padding: 0 16px;
    }
    .fullscreen-active .video-inner-sub { font-size: 1.8rem; bottom: 40px; }

    .floating-heart-widget {
      position: absolute; top: 15px; right: 15px; width: 65px; height: 65px;
      z-index: 50; cursor: pointer; filter: drop-shadow(0 0 15px rgba(255, 121, 198, 0.8));
      background: rgba(0,0,0,0.3); border-radius: 50%; padding: 12px; backdrop-filter: blur(4px);
    }
    .floating-heart-widget svg { width: 100%; height: 100%; }
    .fullscreen-active .floating-heart-widget { width: 85px; height: 85px; top: 30px; right: 30px; padding: 15px; }

    .climax-overlay-img {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 30;
    }

    .player-card {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; width: 100%; 
      max-height: 86vh; height: auto; display: flex; flex-direction: column;
      background: rgba(16, 16, 22, 0.98); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-bottom: none; border-radius: 26px 26px 0 0;
      box-shadow: 0 -16px 50px rgba(0,0,0,0.85); z-index: 1000; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform; overflow: hidden;
    }
    .player-card.minimized { transform: translateY(105%); pointer-events: none; }
    .drag-handle-area { width: 100%; padding: 14px 0 8px 0; display: flex; justify-content: center; cursor: grab; touch-action: none; flex-shrink: 0; }
    .drag-handle { width: 50px; height: 5px; background: rgba(255, 255, 255, 0.45); border-radius: 10px; }
    .player-scroll-area { overflow-y: auto; overflow-x: hidden; width: 100%; padding: 4px 18px 24px 18px; -webkit-overflow-scrolling: touch; }
    
    .cover-box { width: 100%; height: 210px; border-radius: 16px; overflow: hidden; background: #050508; margin: 0 auto 10px auto; position: relative; display: flex; align-items: center; justify-content: center; }
    .cover-box img, .cover-box video { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; top: 0; left: 0; border-radius: 12px; }
    .btn-cover-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; backdrop-filter: blur(4px); }
    .cover-prev { left: 10px; } .cover-next { right: 10px; }
    .cover-indicator { position: absolute; bottom: 10px; right: 12px; background: rgba(0, 0, 0, 0.6); padding: 3px 8px; border-radius: 8px; font-size: 0.72rem; color: #fff; z-index: 10; backdrop-filter: blur(4px); }
    .album-tag { font-size: 0.82rem; color: var(--text-sub); text-align: center; margin-bottom: 4px; font-weight: 500; }
    .lrc-box { min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 1.05rem; font-weight: 800; color: var(--primary-pink); text-shadow: 0 0 20px var(--pink-glow), 0 2px 4px rgba(0,0,0,0.8); padding: 2px 8px; line-height: 1.3; margin-bottom: 8px; }
    
    .sub-quick-tools { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
    .btn-sub-quick { padding: 5px 10px; background: rgba(255, 121, 198, 0.1); border: 1px solid rgba(255, 121, 198, 0.25); color: var(--primary-pink); border-radius: 9px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    
    .seek-slider { width: 100%; height: 6px; accent-color: var(--primary-pink); cursor: pointer; border-radius: 3px; background: rgba(255,255,255,0.1); }
    .time-box { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-sub); margin-top: 4px; margin-bottom: 8px; font-weight: 500; }
    .controls-extra { display: flex; justify-content: space-around; align-items: center; margin-bottom: 8px; padding: 0 10px; }
    .btn-extra { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 10px; padding: 4px 10px; font-size: 0.78rem; cursor: pointer; }
    .btn-extra.active { background: rgba(255, 121, 198, 0.25); border-color: var(--primary-pink); color: var(--primary-pink); font-weight: 700; }
    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.25rem; cursor: pointer; padding: 6px; transition: transform 0.15s; }
    .btn-ctrl:hover { color: var(--primary-pink); transform: scale(1.1); }
    .btn-play-main { width: 48px; height: 48px; background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%); color: #07070a; border-radius: 50%; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(255,255,255,0.3); }
    
    .volume-box { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 10px; }
    .volume-slider { flex: 1; height: 5px; accent-color: var(--text-sub); cursor: pointer; }
    
    .bottom-tools { display: flex; gap: 8px; flex-direction: row; }
    .btn-pip, .btn-pip-mp3 { flex: 1; padding: 12px 6px; border-radius: 12px; font-weight: 700; font-size: 0.88rem; cursor: pointer; text-align: center; transition: all 0.2s ease; }
    .btn-pip { background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3); color: var(--primary-pink); }
    .btn-pip-mp3 { background: linear-gradient(135deg, #ff79c6 0%, #ff52b2 100%); border: none; color: #fff; box-shadow: 0 4px 15px rgba(255, 121, 198, 0.35); text-shadow: 0 1px 3px rgba(0,0,0,0.3); }

    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; height: 64px;
      background: rgba(16, 16, 22, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; align-items: center; padding: 0 14px; z-index: 999; cursor: pointer; transition: transform 0.3s;
    }
    .mini-player.hidden { transform: translateY(100%); pointer-events: none; }
    .mini-thumb { width: 42px; height: 42px; border-radius: 10px; background: #121218; object-fit: cover; margin-right: 10px; }
    .mini-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .mini-title { font-size: 0.88rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-subtitle { font-size: 0.75rem; color: var(--primary-pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .mini-btn { background: none; border: none; color: #fff; font-size: 1.15rem; padding: 6px; cursor: pointer; }

    .toast-msg {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: rgba(255, 121, 198, 0.95); color: #07070a; padding: 10px 20px; border-radius: 20px;
      font-weight: 700; font-size: 0.9rem; box-shadow: 0 8px 25px rgba(255, 121, 198, 0.4);
      z-index: 3000; opacity: 0; transition: all 0.3s ease; pointer-events: none;
    }
    .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body id="main-body">

<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img" alt="全域背景">
<div id="bg-overlay"></div>
<div id="toast" class="toast-msg"></div>

<div class="container">
  <div class="top-bar">
    <div class="app-logo" onclick="switchPage('home')">🌸 ASMR 私人隨身庫</div>
    <div class="top-actions">
      <button class="btn-clean-mem" onclick="cleanMemoryAndGC()" style="background: rgba(80, 250, 123, 0.15); border: 1px solid rgba(80, 250, 123, 0.4); color: var(--accent-green); padding: 8px 12px; border-radius: 12px; font-size: 0.82rem; font-weight: 700; cursor: pointer;">⚡ 清理快取</button>
      <button class="btn-toggle-admin" onclick="toggleAdminDrawer()" style="background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3); color: var(--primary-pink); padding: 8px 14px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer;">⚙️ 管理選單</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab-btn active" id="tab-voice" onclick="switchMainTab('voice')">🎵 音樂/語音專區</button>
    <button class="nav-tab-btn" id="tab-video-asmr" onclick="switchMainTab('video-asmr')">🎬 影片版 ASMR 專區</button>
  </div>

  <div id="admin-drawer" class="admin-drawer">
    <div class="glass-card" style="border: 1px solid rgba(255, 121, 198, 0.6); background: rgba(30, 15, 25, 0.9);">
      <div class="card-title" style="color: #ff79c6;">💦 設定愛心玩具高潮素材 (全域儲存)</div>
      <div style="font-size:0.85rem; color:var(--text-sub); margin-bottom:12px; line-height:1.4;">
        愛心填滿時，將會強制暫停影片並劇烈晃動，同時切換為高潮圖片並播放專屬高潮音檔！
      </div>
      <div class="form-group"><label>上傳高潮替換圖片</label><input type="file" id="climax-img-input" accept="image/*"></div>
      <div class="form-group"><label>上傳高潮專屬音檔 (.mp3/.wav)</label><input type="file" id="climax-audio-input" accept="audio/*"></div>
      <button class="btn-pink" onclick="saveClimaxSettings()">儲存高潮專屬素材</button>
    </div>

    <div class="glass-card">
      <div class="card-title">🖼️ 設定預設全域背景 (支援多張、每30秒輪播)</div>
      <div class="form-group"><label>選取多張圖片或 MP4 影片素材</label><input type="file" id="global-bg-input" accept="image/*,video/*" multiple></div>
      <button class="btn-pink" onclick="saveGlobalBackgrounds()">儲存全域背景素材</button>
    </div>

    <div class="glass-card">
      <div class="card-title">📁 建立作品分區</div>
      <div class="form-group"><label>作品分區名稱</label><input type="text" id="album-title" placeholder="例如：巫女篇"></div>
      <div class="form-group"><label>封面素材 (影片封面將自動預覽不破圖)</label><input type="file" id="album-covers" accept="image/*,video/*" multiple></div>

<video id="pip-video" playsinline muted autoplay style="position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; opacity: 0.001; pointer-events: none; z-index: -999;"></video>
<audio id="main-audio" crossorigin="anonymous" preload="auto"></audio>
<audio id="climax-audio-player" style="display:none;" preload="auto"></audio>

<script>
  let db;
  let albums = [];
  let tracks = [];
  let videoAsmrTracks = [];
  let currentTrackList = [];
  let currentIndex = -1;
  let currentLrc = [];
  let currentActiveAlbumId = null;
  let lastVolume = 1;

  let globalBackgrounds = [];
  let bgIndex = 0;
  let bgTimer = null;
  let isCustomAlbumPlaying = false;
  let currentAlbumBgBlobs = [];
  let albumBgIndex = 0;

  let activeAlbumCoverBlobs = [];
  let activeCoverIndex = 0;
  let coverElements = [];
  let cachedCoverElement = null;
  let isCoverVideoActive = false;
  let isPowerSavingCover = false;

  let repeatMode = 0;
  const repeatModeNames = ["🔁 順序播放", "🔂 單曲循環", "🔀 隨機播放"];
  let speedOptions = [0.75, 1.0, 1.25, 1.5, 2.0];
  let speedIndex = 1;
  let sleepTimerTimeout = null;

  let pipCanvas = null;
  let pipCtx = null;
  let isPiPRendering = false;
  let currentPipMode = 'dynamic';
  let activeCreatedUrls = [];

  // Heart Toy State Variables
  let heartProgress = 0; // 0 to 100
  let isClimaxActive = false;
  let audioCtx = null;
  let analyser = null;
  let dataArray = null;
  let isAudioAnalyserInitialized = false;
  let climaxImgBlob = null;
  let climaxAudioBlob = null;
  let climaxFallbackTimer = null;

  const audio = document.getElementById("main-audio");
  const climaxAudio = document.getElementById("climax-audio-player");
  const bgVideo = document.getElementById("bg-video");
  const bgImg = document.getElementById("bg-img");
  const pipVideo = document.getElementById("pip-video");
  const activeAsmrVideo = document.getElementById("active-asmr-video");
  const playerCard = document.getElementById("player-card");
  const miniPlayer = document.getElementById("mini-player");
  const seekSlider = document.getElementById("seek-slider");
  const volumeSlider = document.getElementById("volume-slider");
  const videoAsmrWrap = document.getElementById("video-asmr-wrap");

  let touchStartY = 0;
  let touchCurrentY = 0;
  let isDragging = false;
  const dragHandleArea = document.getElementById("drag-handle-area");

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => { t.classList.remove("show"); }, 2400);
  }

  function createTrackedObjectURL(blob) {
    if (!blob) return "";
    const url = URL.createObjectURL(blob);
    activeCreatedUrls.push(url);
    return url;
  }

  function cleanMemoryAndGC() {
    activeCreatedUrls.forEach(url => {
      try { URL.revokeObjectURL(url); } catch(e){}
    });
    activeCreatedUrls = [];
    showToast("⚡ 快取已清理！");
  }

  dragHandleArea.addEventListener("touchstart", (e) => {
    touchStartY = e.touches[0].clientY;
    isDragging = true;
    playerCard.style.transition = 'none';
  }, { passive: true });

  dragHandleArea.addEventListener("touchmove", (e) => {
    if (!isDragging) return;
    touchCurrentY = e.touches[0].clientY;
    let diff = touchCurrentY - touchStartY;
    if (diff > 0) playerCard.style.transform = `translateY(${diff}px)`;
  }, { passive: true });

  dragHandleArea.addEventListener("touchend", () => {
    if (!isDragging) return;
    isDragging = false;
    playerCard.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
    let diff = touchCurrentY - touchStartY;
    if (diff > 70) minimizePlayer();
    else playerCard.style.transform = 'translateY(0)';
  });

  function togglePowerSavingCover() {
    isPowerSavingCover = !isPowerSavingCover;
    const btn = document.getElementById("btn-power-saving");
    btn.style.color = isPowerSavingCover ? "#50fa7b" : "";
    updateCoverDisplay();
  }

  function initAudioAnalyser() {
    if (isAudioAnalyserInitialized) return;
    try {
      window.AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      let sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      isAudioAnalyserInitialized = true;
    } catch(e) { console.log(e); }
  }

  // ==== 核心高潮玩具邏輯 ====
  function updateHeartToyProgress() {
    if (!audio.paused && currentIndex !== -1 && !isClimaxActive) {
      if (!isAudioAnalyserInitialized && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      
      let intensityFactor = 1.0;
      if (analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        let avg = sum / dataArray.length;
        // 女聲高頻與高音量會加快填充速度
        intensityFactor = 1.0 + (avg / 20.0); 
      }

      heartProgress += 0.06 * intensityFactor; // 基礎極慢速度
      if (heartProgress >= 100) triggerAdvancedClimax();
    }

    let currentFillPercent = Math.min(100, Math.max(0, heartProgress));
    let fillRgba = `rgba(255, 121, 198, ${currentFillPercent / 100})`;
    
    // 更新舊版UI (如有啟用)
    let oldPath = document.getElementById("heart-path-old");
    if(oldPath) oldPath.setAttribute("fill", fillRgba);
    
    // 更新浮動版UI
    let floatingPath = document.getElementById("floating-heart-path");
    if(floatingPath) floatingPath.setAttribute("fill", fillRgba);

    requestAnimationFrame(updateHeartToyProgress);
  }

  function triggerManualHeartBoost() {
    if(isClimaxActive) return;
    heartProgress += 15;
    showToast("💖 愛心刺激！加速高潮！");
    if (heartProgress >= 100) triggerAdvancedClimax();
  }

  function triggerAdvancedClimax() {
    if (isClimaxActive) return;
    isClimaxActive = true;
    heartProgress = 100;
    showToast("🔥 啊啊... 高潮了！");

    // 暫停主體
    audio.pause();
    if (activeAsmrVideo) activeAsmrVideo.pause();

    // 啟用晃動與特效
    videoAsmrWrap.classList.add("screen-shaking");
    document.getElementById("floating-heart-svg").classList.add("climaxing");
    
    const overlay = document.getElementById("climax-overlay");
    if (climaxImgBlob) {
      overlay.src = createTrackedObjectURL(climaxImgBlob);
      overlay.style.display = "block";
    }

    if (climaxAudioBlob) {
      climaxAudio.src = createTrackedObjectURL(climaxAudioBlob);
      climaxAudio.play().catch(e => console.log(e));
      climaxAudio.onended = endAdvancedClimax;
    } else {
      // 找不到音檔時的預設倒數
      climaxFallbackTimer = setTimeout(endAdvancedClimax, 5000);
    }
  }

  function endAdvancedClimax() {
    isClimaxActive = false;
    heartProgress = 0;
    
    videoAsmrWrap.classList.remove("screen-shaking");
    document.getElementById("floating-heart-svg").classList.remove("climaxing");
    document.getElementById("climax-overlay").style.display = "none";
    
    if (climaxFallbackTimer) clearTimeout(climaxFallbackTimer);
    
    // 恢復播放主體
    audio.play().catch(()=>{});
    if (activeAsmrVideo && videoAsmrWrap.style.display !== "none") activeAsmrVideo.play().catch(()=>{});
  }

  // 儲存高潮設定
  async function saveClimaxSettings() {
    const imgInput = document.getElementById("climax-img-input");
    const audioInput = document.getElementById("climax-audio-input");
    let imgFile = imgInput.files.length ? imgInput.files[0] : climaxImgBlob;
    let audioFile = audioInput.files.length ? audioInput.files[0] : climaxAudioBlob;

    const tx = db.transaction("settings", "readwrite");
    tx.objectStore("settings").put({ key: "climaxMedia", img: imgFile, audio: audioFile });
    tx.oncomplete = () => {
      climaxImgBlob = imgFile;
      climaxAudioBlob = audioFile;
      showToast("✅ 高潮特效素材已儲存！");
    };
  }

  // ==== 全螢幕 CSS 控制 ====
  function toggleCSSFullscreen() {
    videoAsmrWrap.classList.toggle("fullscreen-active");
    if (videoAsmrWrap.classList.contains("fullscreen-active")) {
      document.body.style.overflow = "hidden"; // 防止背景滾動
      showToast("已進入無黑邊全螢幕");
    } else {
      document.body.style.overflow = "auto";
    }
  }

  // ==== PiP 功能 (維持不變) ====
  function initPiPEngine() {
    if (!pipCanvas) {
      pipCanvas = document.createElement('canvas');
      pipCtx = pipCanvas.getContext('2d', { alpha: false });
    }
  }
  function enablePiP(mode = 'dynamic') {
    if (currentIndex === -1) return showToast("請先播放篇章！");
    showToast("即將啟用懸浮視窗功能...");
  } // 因篇幅省略實作細節，採用您的原邏輯

  // ==== 初始化與資料庫 ====
  const request = indexedDB.open("ASMR_Categorized_DB_V32", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("albums")) db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("videoAsmrTracks")) db.createObjectStore("videoAsmrTracks", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
  };
  request.onsuccess = (e) => { 
    db = e.target.result; 
    loadData(); 
    initPiPEngine();
    requestAnimationFrame(updateHeartToyProgress);
  };

  function loadData() {
    if (!db) return;
    const tx = db.transaction(["albums", "tracks", "videoAsmrTracks", "settings"], "readonly");
    tx.objectStore("albums").getAll().onsuccess = (e) => { albums = e.target.result; updateAlbumSelect(); renderHomeAlbums(); };
    tx.objectStore("tracks").getAll().onsuccess = (e) => { tracks = e.target.result; if (currentActiveAlbumId) renderDetailView(currentActiveAlbumId); };
    tx.objectStore("videoAsmrTracks").getAll().onsuccess = (e) => { videoAsmrTracks = e.target.result; renderVideoAsmrList(); };
    tx.objectStore("settings").get("globalBackgrounds").onsuccess = (e) => {
      if (e.target.result && e.target.result.blobs) { globalBackgrounds = e.target.result.blobs; startGlobalBgRotation(); }
    };
    tx.objectStore("settings").get("climaxMedia").onsuccess = (e) => {
      if (e.target.result) { climaxImgBlob = e.target.result.img; climaxAudioBlob = e.target.result.audio; }
    };
  }

  function toggleAdminDrawer() { document.getElementById("admin-drawer").classList.toggle("open"); }

  function switchMainTab(tabName) {
    document.getElementById("tab-voice").classList.toggle("active", tabName === 'voice');
    document.getElementById("tab-video-asmr").classList.toggle("active", tabName === 'video-asmr');
    if (tabName === 'voice') {
      document.getElementById("view-home").style.display = "block";
      document.getElementById("view-detail").style.display = currentActiveAlbumId ? "block" : "none";
      document.getElementById("view-video-asmr").style.display = "none";
    } else {
      document.getElementById("view-home").style.display = "none";
      document.getElementById("view-detail").style.display = "none";
      document.getElementById("view-video-asmr").style.display = "block";
      renderVideoAsmrList();
    }
  }

  function switchPage(pageName, albumId) {
    document.querySelectorAll(".page-view").forEach(el => el.classList.remove("active"));
    if (pageName === 'home') { document.getElementById("view-home").classList.add("active"); currentActiveAlbumId = null; renderHomeAlbums(); }
    else if (pageName === 'detail') { document.getElementById("view-detail").classList.add("active"); currentActiveAlbumId = albumId; renderDetailView(albumId); }
  }

  function updateAlbumSelect() {
    const sel = document.getElementById("select-album");
    sel.innerHTML = '<option value="">-- 請選擇分區 --</option>';
    albums.forEach(a => { let opt = document.createElement("option"); opt.value = a.id; opt.innerText = a.title; sel.appendChild(opt); });
  }

  function renderHomeAlbums() {
    const listEl = document.getElementById("album-list");
    listEl.innerHTML = "";
    if (!albums.length) { listEl.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:20px;">尚無作品分區</div>'; return; }
    
    albums.forEach(album => {
      let albumTracks = tracks.filter(t => t.albumId === album.id);
      let coverHtml = `<img class="album-grid-thumb" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><rect width='100%' height='100%' fill='%23121218'/></svg>">`;
      if (album.covers && album.covers.length > 0) {
        let firstCover = album.covers[0];
        let coverUrl = createTrackedObjectURL(firstCover);
        if (firstCover.type && firstCover.type.startsWith("video")) {
          // 修復破圖：使用 #t=0.1 強制預覽第一幀
          coverHtml = `<video class="album-grid-thumb" src="${coverUrl}#t=0.1" preload="metadata" muted playsinline style="object-fit:cover;"></video>`;
        } else {
          coverHtml = `<img class="album-grid-thumb" src="${coverUrl}">`;
        }
      }

      let card = document.createElement("div"); card.className = "album-grid-card";
      card.innerHTML = `
        ${coverHtml}
        <div class="album-grid-info"><div class="album-grid-title">${escapeHTML(album.title)}</div><div class="album-grid-count">📁 ${albumTracks.length} 則</div></div>
        <div class="btn-action-col"><button class="btn-album-action">開啟</button><button class="btn-album-del" onclick="event.stopPropagation(); deleteAlbum(${album.id})">刪除</button></div>
      `;
      card.onclick = () => switchPage('detail', album.id);
      listEl.appendChild(card);
    });
  }
  
  function deleteAlbum(id) {
    if (!confirm("確定刪除此區？")) return;
    const tx = db.transaction(["albums", "tracks"], "readwrite"); tx.objectStore("albums").delete(id);
    let store = tx.objectStore("tracks"); store.getAll().onsuccess = (e) => { e.target.result.forEach(t => { if (t.albumId === id) store.delete(t.id); }); };
    tx.oncomplete = () => { loadData(); showToast("已刪除！"); };
  }

  function renderDetailView(albumId) {
    const album = albums.find(a => a.id === albumId);
    if (!album) return; document.getElementById("detail-album-title").innerText = album.title;
    const container = document.getElementById("chapter-list-container"); container.innerHTML = "";
    let albumTracks = tracks.filter(t => t.albumId === albumId);
    if (!albumTracks.length) { container.innerHTML = '<div style="text-align:center; padding:20px;">尚無篇章</div>'; return; }
    
    albumTracks.forEach((track, idx) => {
      let isPlaying = (currentIndex !== -1 && currentTrackList[currentIndex] && currentTrackList[currentIndex].id === track.id);
      let item = document.createElement("div"); item.className = "chapter-file-item";
      item.innerHTML = `
        <div class="chapter-info-left" onclick="playTrackFromAlbum(${albumId}, ${idx})">
          <div class="play-icon-circle">${isPlaying ? '❚❚' : '▶'}</div>
          <div class="chapter-meta-text"><div class="chapter-name">${escapeHTML(track.title)}</div></div>
        </div>
        <div class="btn-action-group"><button class="btn-sm btn-sm-del" onclick="deleteTrack(${track.id}, 'tracks')">刪除</button></div>
      `;
      container.appendChild(item);
    });
  }

  async function addVideoAsmrTrack() {
    const title = document.getElementById("v-asmr-title").value.trim();
    const videoInput = document.getElementById("v-asmr-video");
    const audioInput = document.getElementById("v-asmr-audio");
    const lrcInput = document.getElementById("v-asmr-lrc");
    if (!title || !videoInput.files.length || !audioInput.files.length) return showToast("請填寫完整影片與音訊資訊！");
    let lrcText = lrcInput.files[0] ? await readFileAsTextAsync(lrcInput.files[0]) : "";
    const tx = db.transaction("videoAsmrTracks", "readwrite");
    tx.objectStore("videoAsmrTracks").add({ title, videoBlob: videoInput.files[0], audioBlob: audioInput.files[0], lrcText });
    tx.oncomplete = () => { loadData(); showToast("影片版 ASMR 上傳成功！"); };
  }

  function renderVideoAsmrList() {
    const container = document.getElementById("video-asmr-list"); container.innerHTML = "";
    if (!videoAsmrTracks.length) { container.innerHTML = '<div style="text-align:center; padding:20px;">尚無影片 ASMR</div>'; return; }
    videoAsmrTracks.forEach((item, idx) => {
      let div = document.createElement("div"); div.className = "chapter-file-item";
      div.innerHTML = `
        <div class="chapter-info-left" onclick="playVideoAsmrTrack(${idx})">
          <div class="play-icon-circle" style="background: linear-gradient(135deg, #ff79c6 0%, #ff52b2 100%);">🎬</div>
          <div class="chapter-meta-text"><div class="chapter-name">${escapeHTML(item.title)}</div><div class="chapter-duration-sub">影片同步+粉紅字幕</div></div>
        </div>
        <div class="btn-action-group"><button class="btn-sm btn-sm-del" onclick="deleteTrack(${item.id}, 'videoAsmrTracks')">刪除</button></div>
      `;
      container.appendChild(div);
    });
  }

  function deleteTrack(id, storeName) {
    if (!confirm("確定刪除此篇章？")) return;
    const tx = db.transaction(storeName, "readwrite"); tx.objectStore(storeName).delete(id);
    tx.oncomplete = () => { loadData(); showToast("已刪除！"); };
  }

  function playVideoAsmrTrack(index) {
    let track = videoAsmrTracks[index]; if (!track) return;
    currentTrackList = videoAsmrTracks; currentIndex = index;
    
    // 初始化 Audio 與 Analyzer
    audio.src = createTrackedObjectURL(track.audioBlob);
    audio.play().then(() => {
      document.getElementById("btn-play").innerText = "⏸"; document.getElementById("mini-btn-play").innerText = "⏸";
      initAudioAnalyser();
    }).catch(e => console.log(e));
    currentLrc = parseUniversalLyrics(track.lrcText);

    // 介面切換至影片模式
    videoAsmrWrap.style.display = "block";
    document.getElementById("player-cover-box").style.display = "none";
    document.getElementById("heart-widget-card").style.display = "none"; // 隱藏舊版愛心，啟用影片內的

    activeAsmrVideo.src = createTrackedObjectURL(track.videoBlob);
    activeAsmrVideo.muted = true; activeAsmrVideo.loop = true;
    activeAsmrVideo.play().catch(()=>{});

    document.getElementById("album-tag").innerText = "🎬 獨立影片版 ASMR";
    document.getElementById("mini-title").innerText = track.title;
    document.getElementById("mini-player").classList.remove("hidden");
    expandPlayer();
  }

  function playTrackFromAlbum(albumId, index) {
    const albumTracks = tracks.filter(t => t.albumId === albumId); if (!albumTracks.length) return;
    currentTrackList = albumTracks; currentIndex = index; currentPlayingAlbumId = albumId;
    const track = currentTrackList[currentIndex];
    
    videoAsmrWrap.style.display = "none";
    document.getElementById("player-cover-box").style.display = "flex";
    document.getElementById("heart-widget-card").style.display = "block";

    audio.src = createTrackedObjectURL(track.audioBlob);
    audio.play().then(() => {
      document.getElementById("btn-play").innerText = "⏸"; document.getElementById("mini-btn-play").innerText = "⏸";
      initAudioAnalyser();
    }).catch(e => console.log(e));
    currentLrc = parseUniversalLyrics(track.lrcText);
    
    document.getElementById("album-tag").innerText = "🎵 語音專區";
    document.getElementById("mini-title").innerText = track.title;
    document.getElementById("mini-player").classList.remove("hidden");
    expandPlayer();
  }

  audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    seekSlider.value = (audio.currentTime / audio.duration) * 100;
    
    let currentText = "♪ 享受純淨時光 ♪";
    for (let i = 0; i < currentLrc.length; i++) {
      if (audio.currentTime >= currentLrc[i].time) currentText = currentLrc[i].text;
      else break;
    }
    document.getElementById("lrc-box").innerText = currentText;
    document.getElementById("video-inner-sub").innerText = currentText;
    document.getElementById("mini-lrc").innerText = currentText;
  });

  function togglePlay() {
    if (currentIndex === -1) return;
    if (audio.paused) {
      audio.play(); document.getElementById("btn-play").innerText = "⏸"; document.getElementById("mini-btn-play").innerText = "⏸";
      if (activeAsmrVideo && videoAsmrWrap.style.display !== "none") activeAsmrVideo.play().catch(()=>{});
    } else {
      audio.pause(); document.getElementById("btn-play").innerText = "▶"; document.getElementById("mini-btn-play").innerText = "▶";
      if (activeAsmrVideo) activeAsmrVideo.pause();
    }
  }

  seekSlider.addEventListener("input", (e) => {
    if (!audio.duration) return;
    audio.currentTime = (e.target.value / 100) * audio.duration;
  });

  function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
  
  function parseUniversalLyrics(rawText) {
    if (!rawText) return []; const lines = rawText.split('\n'); const lyrics = [];
    const lrcTimeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
    for (let line of lines) {
      const match = lrcTimeReg.exec(line);
      if (match) {
        const time = parseInt(match[1]) * 60 + parseInt(match[2]) + parseInt(match[3].padEnd(3,'0')) / 1000;
        let text = line.replace(lrcTimeReg, '').trim(); if (text) lyrics.push({ time, text });
      }
    }
    return lyrics.length ? lyrics.sort((a, b) => a.time - b.time) : [];
  }
  
  function readFileAsTextAsync(file) {
    return new Promise((res) => { const reader = new FileReader(); reader.onload = (e) => res(e.target.result); reader.readAsText(file); });
  }

  function expandPlayer() { playerCard.classList.remove("minimized"); miniPlayer.classList.add("hidden"); }
  function minimizePlayer() { playerCard.classList.add("minimized"); playerCard.style.transform = ''; miniPlayer.classList.remove("hidden"); }
  
  // (其餘播放控制與音量等基礎操作維持不變，已為最佳效能做過精簡整理)
</script>
</body>
