<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫 (全域背景記憶與iOS懸浮大升級版)</title>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.45);
      --bg-dark: #07070a;
      --card-glass: rgba(16, 16, 22, 0.85);
      --card-glass-hover: rgba(24, 24, 34, 0.94);
      --text-main: #ffffff;
      --text-sub: #9494ab;
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-hover: rgba(255, 121, 198, 0.35);
      --accent-green: #50fa7b;
      --accent-blue: #3b82f6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; padding-bottom: 140px;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, "PingFang TC", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }

    #bg-video, #bg-img {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; background-color: var(--bg-dark);
      z-index: -2; display: none; filter: brightness(0.65) blur(5px);
      transform: scale(1); transition: opacity 1s ease, transform 1s ease;
      will-change: transform, opacity;
    }
    @media (max-width: 768px) {
      #bg-video, #bg-img {
        top: -10vh; left: -10vw; width: 120vw; height: 120vh;
        transform: scale(0.85);
      }
    }

    #bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(7,7,10,0.35) 0%, rgba(7,7,10,0.92) 100%);
      z-index: -1; pointer-events: none;
    }

    .container { width: 100%; max-width: 680px; z-index: 1; position: relative; }
    .top-bar { width: 100%; max-width: 680px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; z-index: 10; }
    .app-logo { font-size: 1.4rem; font-weight: 800; color: var(--primary-pink); text-shadow: 0 0 20px var(--pink-glow); cursor: pointer; letter-spacing: 0.5px; }
    .top-actions { display: flex; gap: 8px; }
    .btn-clean-mem {
      background: rgba(80, 250, 123, 0.15); border: 1px solid rgba(80, 250, 123, 0.4);
      color: var(--accent-green); padding: 10px 14px; border-radius: 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      transition: all 0.25s ease; backdrop-filter: blur(10px);
    }
    .btn-clean-mem:hover { background: rgba(80, 250, 123, 0.3); box-shadow: 0 0 15px rgba(80, 250, 123, 0.4); }
    .btn-toggle-admin {
      background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 10px 18px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.25s ease; backdrop-filter: blur(10px);
    }
    .btn-toggle-admin:hover { background: rgba(255, 121, 198, 0.25); border-color: var(--primary-pink); box-shadow: 0 0 15px var(--pink-glow); }

    .admin-drawer { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; will-change: max-height; }
    .admin-drawer.open { max-height: 4000px; }

    .glass-card {
      background: var(--card-glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass); border-radius: 24px; padding: 20px; margin-bottom: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; color: var(--primary-pink); display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.25s ease;
    }
    input:focus, select:focus { border-color: var(--primary-pink); box-shadow: 0 0 12px rgba(255, 121, 198, 0.25); background: rgba(0,0,0,0.6); }
    
    input[type="file"] { padding: 8px; color: var(--text-sub); font-size: 0.85rem; cursor: pointer; }
    input[type="file"]::file-selector-button {
      background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-right: 12px;
    }

    .btn-pink {
      width: 100%; background: linear-gradient(135deg, #ff79c6 0%, #ff52b2 100%); color: #07070a; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(255, 121, 198, 0.35); transition: all 0.25s ease;
    }
    .btn-pink:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(255, 121, 198, 0.5); }

    .btn-blue {
      width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #ffffff; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35); transition: all 0.25s ease;
    }
    .btn-blue:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(59, 130, 246, 0.5); }

    .btn-green {
      width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35); transition: all 0.25s ease;
    }
    .btn-green:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5); }
    .btn-green:disabled { opacity: 0.6; cursor: not-allowed; }

    .page-view { display: none; width: 100%; animation: fadeIn 0.25s ease; }
    .page-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .album-grid-card {
      background: var(--card-glass); backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass); border-radius: 20px; padding: 14px; margin-bottom: 12px;
      display: flex; align-items: center; cursor: pointer; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .album-grid-card:hover {
      background: var(--card-glass-hover); border-color: var(--border-glass-hover);
      transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 121, 198, 0.15);
    }
    .album-grid-thumb { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; margin-right: 14px; flex-shrink: 0; background: #121218; }
    .album-grid-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .album-grid-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .album-grid-count { font-size: 0.85rem; color: var(--primary-pink); font-weight: 600; }
    
    .btn-action-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; z-index: 2; }
    .btn-album-action {
      background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .btn-album-del {
      background: rgba(255, 85, 85, 0.1); border: 1px solid rgba(255, 85, 85, 0.25);
      color: #ff6b6b; padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }

    .breadcrumb-bar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 0.95rem; font-weight: 700;
      color: var(--primary-pink); cursor: pointer; padding: 2px 0;
    }

    .chapter-file-list { display: flex; flex-direction: column; gap: 8px; }
    .chapter-file-item {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 14px;
      cursor: pointer; transition: all 0.2s ease;
    }
    .chapter-file-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255, 121, 198, 0.25); }
    .chapter-info-left { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; margin-right: 10px; }
    .play-icon-circle {
      width: 36px; height: 36px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.95rem; flex-shrink: 0;
    }
    .chapter-meta-text { overflow: hidden; }
    .chapter-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; margin-bottom: 2px; color: #fff; font-size: 0.92rem; }
    .chapter-duration-sub { font-size: 0.78rem; color: var(--text-sub); }

    .btn-action-group { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-sm { padding: 5px 10px; border-radius: 9px; border: none; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-sm-edit { background: rgba(255, 121, 198, 0.15); color: var(--primary-pink); border: 1px solid rgba(255, 121, 198, 0.3); }
    .btn-sm-del { background: rgba(255,255,255,0.06); color: #ff6b6b; border: 1px solid rgba(255,85,85,0.15); }

    .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .btn-page {
      background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3); color: var(--primary-pink);
      padding: 8px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.88rem;
    }
    .btn-page:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-info { font-size: 0.85rem; color: var(--text-sub); }

    /* --- 播放面板重點優化 (修正 iOS 控制與可見度) --- */
    .player-card {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; width: 100%; 
      max-height: 86vh; height: auto; display: flex; flex-direction: column;
      background: rgba(16, 16, 22, 0.98); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-bottom: none; border-radius: 26px 26px 0 0;
      box-shadow: 0 -16px 50px rgba(0,0,0,0.85);
      z-index: 1000; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform; overflow: hidden;
    }
    .player-card.minimized { transform: translateY(105%); pointer-events: none; }

    .drag-handle-area { 
      width: 100%; padding: 14px 0 8px 0; display: flex; justify-content: center; cursor: grab; 
      touch-action: none; flex-shrink: 0; background: transparent;
    }
    .drag-handle { width: 50px; height: 5px; background: rgba(255, 255, 255, 0.45); border-radius: 10px; }

    /* 面頁內容滑動區 (支援獨立滾動) */
    .player-scroll-area {
      overflow-y: auto; overflow-x: hidden; width: 100%;
      padding: 4px 18px 24px 18px; -webkit-overflow-scrolling: touch;
    }

    .cover-box { 
      width: 100%; height: 210px; border-radius: 16px; 
      overflow: hidden; background: #050508; margin: 0 auto 10px auto; 
      position: relative; box-shadow: 0 6px 20px rgba(0,0,0,0.5); 
      display: flex; align-items: center; justify-content: center;
    }
    .cover-box img, .cover-box video { 
      width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; 
      top: 0; left: 0; border-radius: 12px;
    }

    .btn-cover-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 1rem; z-index: 10; transition: all 0.2s ease; backdrop-filter: blur(4px);
    }
    .btn-cover-nav:hover { background: rgba(255, 121, 198, 0.4); border-color: var(--primary-pink); }
    .cover-prev { left: 10px; }
    .cover-next { right: 10px; }
    .cover-indicator {
      position: absolute; bottom: 10px; right: 12px; background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px; border-radius: 8px; font-size: 0.72rem; color: #fff; z-index: 10;
      backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
    }
    
    .album-tag { font-size: 0.82rem; color: var(--text-sub); text-align: center; margin-bottom: 4px; font-weight: 500; }
    
    .lrc-box {
      min-height: 48px; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 1.05rem; font-weight: 800; color: var(--primary-pink);
      text-shadow: 0 0 20px var(--pink-glow), 0 2px 4px rgba(0,0,0,0.8); padding: 2px 8px; line-height: 1.3; margin-bottom: 8px;
    }

    .sub-quick-tools { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
    .btn-sub-quick {
      padding: 5px 10px; background: rgba(255, 121, 198, 0.1); border: 1px solid rgba(255, 121, 198, 0.25);
      color: var(--primary-pink); border-radius: 9px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }

    .seek-slider { width: 100%; height: 6px; accent-color: var(--primary-pink); cursor: pointer; border-radius: 3px; background: rgba(255,255,255,0.1); }
    .time-box { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-sub); margin-top: 4px; margin-bottom: 8px; font-weight: 500; }
    
    .controls-extra { display: flex; justify-content: space-around; align-items: center; margin-bottom: 8px; padding: 0 10px; }
    .btn-extra { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 10px; padding: 4px 10px; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; }
    .btn-extra.active { background: rgba(255, 121, 198, 0.25); border-color: var(--primary-pink); color: var(--primary-pink); font-weight: 700; }

    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.25rem; cursor: pointer; padding: 6px; transition: transform 0.15s, color 0.2s; }
    .btn-ctrl:hover { color: var(--primary-pink); transform: scale(1.1); }
    .btn-play-main {
      width: 48px; height: 48px; background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%); color: #07070a; border-radius: 50%;
      font-size: 1.3rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(255,255,255,0.3);
    }

    .volume-box { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 10px; padding: 0 2px; }
    .volume-slider { flex: 1; height: 5px; accent-color: var(--text-sub); cursor: pointer; }
    .btn-mute { background: none; border: none; color: var(--text-sub); font-size: 1.05rem; cursor: pointer; }

    .bottom-tools { display: flex; gap: 8px; flex-direction: row; }
    
    .btn-pip {
      flex: 1; background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 12px 6px; border-radius: 12px; font-weight: 700; font-size: 0.88rem; cursor: pointer; text-align: center;
      box-shadow: 0 4px 15px rgba(255, 121, 198, 0.15); transition: all 0.2s ease;
    }
    .btn-pip:active { transform: scale(0.96); }

    .btn-pip-mp3 {
      flex: 1; background: linear-gradient(135deg, #ff79c6 0%, #ff52b2 100%); border: none;
      color: #fff; padding: 12px 6px; border-radius: 12px; font-weight: 800; font-size: 0.88rem; cursor: pointer; text-align: center;
      box-shadow: 0 4px 15px rgba(255, 121, 198, 0.35); text-shadow: 0 1px 3px rgba(0,0,0,0.3); transition: all 0.2s ease;
    }
    .btn-pip-mp3:active { transform: scale(0.96); }

    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; height: 64px;
      background: rgba(16, 16, 22, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; padding: 0 14px;
      z-index: 999; cursor: pointer; box-shadow: 0 -6px 25px rgba(0,0,0,0.6); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mini-player.hidden { transform: translateY(100%); pointer-events: none; }
    .mini-thumb { width: 42px; height: 42px; border-radius: 10px; background: #121218; object-fit: cover; margin-right: 10px; flex-shrink: 0; }
    .mini-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .mini-title { font-size: 0.88rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .mini-subtitle { font-size: 0.75rem; color: var(--primary-pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .mini-btn { background: none; border: none; color: #fff; font-size: 1.15rem; padding: 6px; cursor: pointer; }

    /* Toast 通知 */
    .toast-msg {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: rgba(255, 121, 198, 0.95); color: #07070a; padding: 10px 20px; border-radius: 20px;
      font-weight: 700; font-size: 0.9rem; box-shadow: 0 8px 25px rgba(255, 121, 198, 0.4);
      z-index: 3000; opacity: 0; transition: all 0.3s ease; pointer-events: none;
    }
    .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img" alt="全域背景">
<div id="bg-overlay"></div>
<div id="toast" class="toast-msg"></div>

<div class="container">
  <div class="top-bar">
    <div class="app-logo" onclick="switchPage('home')">🌸 ASMR 隨身庫</div>
    <div class="top-actions">
      <button class="btn-clean-mem" onclick="cleanMemoryAndGC()">⚡ 清理記憶體</button>
      <button class="btn-toggle-admin" onclick="toggleAdminDrawer()">⚙️ 管理選單</button>
    </div>
  </div>

  <div id="admin-drawer" class="admin-drawer">
    <div class="glass-card" style="border: 1px solid rgba(59, 130, 246, 0.4); background: rgba(16, 24, 39, 0.85);">
      <div class="card-title" style="color: #60a5fa;">🔄 跨裝置資料無損互通 (電腦 ⇄ 手機同步)</div>
      <div style="font-size:0.85rem; color:var(--text-sub); margin-bottom:12px; line-height:1.4;">
        點擊「匯出備份檔案」會將所有作品、音效 Blob 與字幕轉為 json 備份檔。在另一台裝置點擊「匯入備份檔案」即可完整還原！
      </div>
      <button class="btn-blue" id="btn-export-backup" onclick="exportDataBackup()">📤 1. 匯出完整無損備份檔案 (電腦/手機)</button>
      <div class="form-group" style="margin-top: 12px;">
        <label>📥 2. 匯入備份檔案 (接收端裝置)</label>
        <input type="file" id="import-backup-input" accept=".json,application/json" onchange="importDataBackup(event)">
      </div>
    </div>

    <div class="glass-card">
      <div class="card-title">🖼️ 設定預設全域背景 (支援多張、每30秒自動輪播)</div>
      <div class="form-group"><label>選取多張圖片或 MP4 影片素材</label><input type="file" id="global-bg-input" accept="image/*,video/*" multiple></div>
      <button class="btn-pink" onclick="saveGlobalBackgrounds()">儲存全域背景素材</button>
    </div>

    <div class="glass-card">
      <div class="card-title">📁 建立作品分區 (封面手動切換)</div>
      <div class="form-group"><label>作品分區名稱</label><input type="text" id="album-title" placeholder="例如：巫女"></div>
      <div class="form-group"><label>封面素材 (支援複選多張圖片或 MP4 影片)</label><input type="file" id="album-covers" accept="image/*,video/*" multiple></div>
      <div class="form-group"><label>此分區專屬背景 (支援複選多張)</label><input type="file" id="album-bgs" accept="image/*,video/*" multiple></div>
      <button class="btn-pink" onclick="createAlbum()">建立分區</button>
    </div>

    <div class="glass-card">
      <div class="card-title">⚡ 一鍵自動配對音檔與字幕</div>
      <div class="form-group">
        <label>選擇目標作品分區</label>
        <select id="select-album"><option value="">-- 請先建立分區 --</option></select>
      </div>
      
      <div style="border-top:1px dashed var(--border-glass); margin:12px 0; padding-top:12px;">
        <div style="font-weight:700; color:#10b981; margin-bottom:8px; font-size:0.95rem;">🚀 1-Click 批量自動匹配上傳 (LRC/VTT/SRT 全解鎖)</div>
        <div class="form-group">
          <label>複選所有音訊檔 (可一次選多個 .mp3/.wav/.m4a)</label>
          <input type="file" id="batch-audios" accept="audio/*,.mp3,.wav,.m4a,.flac,.aac" multiple>
        </div>
        <div class="form-group">

<!-- iOS / Safari 懸浮視窗專用載體影片 (必須 playsinline 與 muted) -->

<audio id="main-audio" crossorigin="anonymous" preload="auto"></audio>

<script>
  let db;
  let albums = [];
  let tracks = [];
  let currentTrackList = [];
  let currentIndex = -1;
  let currentLrc = [];
  let currentPlayingAlbumId = null;
  let currentActiveAlbumId = null;
  let lastVolume = 1;

  let globalBackgrounds = [];
  let bgIndex = 0;
  let bgTimer = null;
  let isCustomAlbumPlaying = false;
  let currentAlbumBgBlobs = [];
  let albumBgIndex = 0;

  let activeAlbumCoverBlobs = [];
  let activeCoverIndex = 0;
  let coverElements = [];
  let cachedCoverElement = null;
  let isCoverVideoActive = false;
  let isPowerSavingCover = false;

  // 播放增強設定
  let repeatMode = 0; // 0: 順序, 1: 單曲循環, 2: 隨機播放
  const repeatModeNames = ["🔁 順序播放", "🔂 單曲循環", "🔀 隨機播放"];
  let speedOptions = [0.75, 1.0, 1.25, 1.5, 2.0];
  let speedIndex = 1;
  let sleepTimerTimeout = null;
  let sleepTimerMinutes = 0;

  let pipCanvas = null;
  let pipCtx = null;
  let isPiPRendering = false;
  let currentPipMode = 'dynamic';

  let currentPage = 1;
  const itemsPerPage = 4;
  let activeCreatedUrls = [];

  const audio = document.getElementById("main-audio");
  const bgVideo = document.getElementById("bg-video");
  const bgImg = document.getElementById("bg-img");
  const pipVideo = document.getElementById("pip-video");
  const playerCard = document.getElementById("player-card");
  const miniPlayer = document.getElementById("mini-player");
  const seekSlider = document.getElementById("seek-slider");
  const volumeSlider = document.getElementById("volume-slider");

  let touchStartY = 0;
  let touchCurrentY = 0;
  let isDragging = false;
  const dragHandleArea = document.getElementById("drag-handle-area");

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => { t.classList.remove("show"); }, 2400);
  }

  function createTrackedObjectURL(blob) {
    if (!blob) return "";
    const url = URL.createObjectURL(blob);
    activeCreatedUrls.push(url);
    return url;
  }

  function cleanMemoryAndGC() {
    activeCreatedUrls.forEach(url => {
      try { URL.revokeObjectURL(url); } catch(e){}
    });
    activeCreatedUrls = [];
    if (bgVideo.paused) {
      bgVideo.removeAttribute('src');
      bgVideo.load();
    }
    showToast("⚡ 已完成記憶體釋放與快取清理！");
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (bgVideo && !bgVideo.paused) bgVideo.pause();
    } else {
      if (bgVideo && bgVideo.src && audio && !audio.paused) bgVideo.play().catch(()=>{});
    }
  });

  // iOS 手勢拖拽改進：綁定 dragHandleArea 控制展開與收合
  dragHandleArea.addEventListener("touchstart", (e) => {
    touchStartY = e.touches[0].clientY;
    isDragging = true;
    playerCard.style.transition = 'none';
  }, { passive: true });

  dragHandleArea.addEventListener("touchmove", (e) => {
    if (!isDragging) return;
    touchCurrentY = e.touches[0].clientY;
    let diff = touchCurrentY - touchStartY;
    if (diff > 0) {
      playerCard.style.transform = `translateY(${diff}px)`;
    }
  }, { passive: true });

  dragHandleArea.addEventListener("touchend", () => {
    if (!isDragging) return;
    isDragging = false;
    playerCard.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
    let diff = touchCurrentY - touchStartY;
    if (diff > 70) {
      minimizePlayer();
    } else {
      playerCard.style.transform = 'translateY(0)';
    }
    touchStartY = 0; 
    touchCurrentY = 0;
  });

  // iOS 懸浮視窗播放狀態與主音訊連動
  pipVideo.addEventListener('pause', () => {
    if (!audio.paused && document.pictureInPictureElement === pipVideo) {
      audio.pause();
      document.getElementById("btn-play").innerText = "▶";
      document.getElementById("mini-btn-play").innerText = "▶";
    }
  });
  pipVideo.addEventListener('play', () => {
    if (audio.paused && document.pictureInPictureElement === pipVideo) {
      audio.play().catch(()=>{});
      document.getElementById("btn-play").innerText = "⏸";
      document.getElementById("mini-btn-play").innerText = "⏸";
    }
  });

  function togglePowerSavingCover() {
    isPowerSavingCover = !isPowerSavingCover;
    const btn = document.getElementById("btn-power-saving");
    if (isPowerSavingCover) {
      btn.innerText = "⚡ 省電模式：靜態開";
      btn.style.background = "rgba(80, 250, 123, 0.2)";
      btn.style.borderColor = "#50fa7b";
      btn.style.color = "#50fa7b";
    } else {
      btn.innerText = "⚡ 省電模式：動態開";
      btn.style.background = "";
      btn.style.borderColor = "";
      btn.style.color = "";
    }
    updateCoverDisplay();
  }

  // --- 重大優化：懸浮視窗 (PiP) 初始化與幀繪製 ---
  function initPiPEngine() {
    if (!pipCanvas) {
      pipCanvas = document.createElement('canvas');
      pipCtx = pipCanvas.getContext('2d', { alpha: false });
    }
  }

  function setupPiPCanvas(mode) {
    currentPipMode = mode;
    initPiPEngine();
    
    if (mode === 'mp3') {
      pipCanvas.width = 1200;
      pipCanvas.height = 350;
    } else {
      pipCanvas.width = 1080;
      pipCanvas.height = 1080;
    }
    
    // 初始化畫面串流 (預先載入，避免觸發時失控)
    if (!pipVideo.srcObject) {
      const stream = pipCanvas.captureStream(30);
      pipVideo.srcObject = stream;
    }

    if (!isPiPRendering) {
      isPiPRendering = true;
      requestAnimationFrame(renderPiPFrame);
    }
  }

  function renderPiPFrame() {
    if (!pipCtx || !isPiPRendering) return;
    
    const currentTime = audio.currentTime;
    let currentText = getActiveSubtitleText(currentTime);

    if (currentPipMode === 'dynamic') {
      // --- 模式 1: 動態專區 (1080x1080) ---
      pipCtx.fillStyle = "#07070a";
      pipCtx.fillRect(0, 0, 1080, 1080);

      if (cachedCoverElement) {
        if (cachedCoverElement.tagName === 'VIDEO' && cachedCoverElement.paused && !isPowerSavingCover) {
          cachedCoverElement.play().catch(() => {});
        }
        drawCoverToCanvas(pipCtx, cachedCoverElement, 1080, isCoverVideoActive && !isPowerSavingCover);
      } else {
        pipCtx.fillStyle = "#121218";
        pipCtx.fillRect(0, 0, 1080, 1080);
        pipCtx.fillStyle = "#ff79c6";
        pipCtx.font = "bold 48px sans-serif";
        pipCtx.textAlign = "center";
        pipCtx.textBaseline = "middle";
        pipCtx.fillText("ASMR 隨身庫", 540, 540);
      }

      // 繪製動態字幕
      pipCtx.textAlign = "center";
      pipCtx.textBaseline = "alphabetic";
      pipCtx.font = "bold 60px -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif";
      
      let lines = wrapCanvasText(pipCtx, currentText, 940);
      let startY = lines.length > 1 ? (940 - (lines.length - 1) * 70) : 960;
      
      lines.forEach((lineText, idx) => {
        let curY = startY + (idx * 70);
        pipCtx.lineWidth = 10;
        pipCtx.strokeStyle = "rgba(0, 0, 0, 0.9)";
        pipCtx.strokeText(lineText, 540, curY);
        pipCtx.fillStyle = "#ff79c6";
        pipCtx.fillText(lineText, 540, curY);
      });

    } else if (currentPipMode === 'mp3') {
      // --- 模式 2: MP3專區 (1200x350 霧面深黑底 + 霓虹粉大字體) ---
      pipCtx.fillStyle = "#0e0e14";
      pipCtx.fillRect(0, 0, 1200, 350);

      // 背景裝飾微光線條
      pipCtx.strokeStyle = "rgba(255, 121, 198, 0.15)";
      pipCtx.lineWidth = 4;
      pipCtx.beginPath();
      pipCtx.moveTo(100, 40);
      pipCtx.lineTo(1100, 40);
      pipCtx.moveTo(100, 310);
      pipCtx.lineTo(1100, 310);
      pipCtx.stroke();

      // 字幕極致放大與排版 (刪除上方篇章名稱)
      pipCtx.fillStyle = "#ff79c6";
      pipCtx.font = "bold 72px -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif";
      pipCtx.textAlign = "center";
      pipCtx.textBaseline = "middle";
      
      pipCtx.shadowColor = "rgba(255, 121, 198, 0.55)";
      pipCtx.shadowBlur = 18;

      let maxWidth = 1080;
      let lines = wrapCanvasText(pipCtx, currentText, maxWidth);
      
      if (lines.length > 2) {
        pipCtx.font = "bold 58px -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif";
      }

      let lineHeight = (lines.length > 2) ? 70 : 88;
      let totalHeight = lines.length * lineHeight;
      let startY = 175 - (totalHeight / 2) + (lineHeight / 2);

      lines.forEach((lineText, i) => {
        pipCtx.fillText(lineText, 600, startY + (i * lineHeight));
      });
      
      pipCtx.shadowColor = "transparent";
      pipCtx.shadowBlur = 0;
    }

    requestAnimationFrame(renderPiPFrame);
  }

  function wrapCanvasText(ctx, text, maxWidth) {
    let chars = text.split('');
    let line = '';
    let lines = [];
    for (let n = 0; n < chars.length; n++) {
      let testLine = line + chars[n];
      let metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        lines.push(line);
        line = chars[n];
      } else {
        line = testLine;
      }
    }
    lines.push(line);
    return lines;
  }

  function drawCoverToCanvas(ctx, source, size, isVideo) {
    let imgWidth = source.videoWidth || source.width;
    let imgHeight = source.videoHeight || source.height;
    if (!imgWidth || !imgHeight) return;

    ctx.save();
    ctx.fillStyle = "#050508";
    ctx.fillRect(0, 0, size, size);

    let hRatio = size / imgWidth;
    let vRatio = size / imgHeight;
    let ratio = Math.max(hRatio, vRatio);
    let centerShiftX = (size - imgWidth * ratio) / 2;
    let centerShiftY = (size - imgHeight * ratio) / 2;
    ctx.drawImage(source, 0, 0, imgWidth, imgHeight, centerShiftX, centerShiftY, imgWidth * ratio, imgHeight * ratio);
    ctx.restore();
  }

  // --- 重大修復：100% 一次順利喚醒 iOS / Desktop 懸浮視窗 ---
  function enablePiP(mode = 'dynamic') {
    if (currentIndex === -1) return showToast("請先播放一個篇章！");

    if (!document.pictureInPictureEnabled && !pipVideo.webkitSupportsPresentationMode) {
      return alert("您的瀏覽器不支援懸浮視窗 (Picture-in-Picture) 功能。");
    }

    // 1. 同步設定 Canvas 模式
    setupPiPCanvas(mode);

    // 2. 確保載體影音播放
    if (audio.paused) audio.play().catch(()=>{});
    pipVideo.play().catch(()=>{});

    // 3. 如果當前已在 PiP 模式中，則直接退出
    if (document.pictureInPictureElement === pipVideo) {
      document.exitPictureInPicture().catch(()=>{});
      return;
    }

    // 4. 第一時間同步調用，保障原生 API 不被非同步阻斷
    try {
      if (pipVideo.requestPictureInPicture) {
        pipVideo.requestPictureInPicture().catch(err => {
          console.warn("PiP 喚醒嘗試:", err);
          showToast("懸浮視窗啟動中...");
        });
      } else if (pipVideo.webkitSetPresentationMode) {
        pipVideo.webkitSetPresentationMode("picture-in-picture");
      }
    } catch(e) {
      console.error(e);
      showToast("請再點擊一次開啟懸浮視窗");
    }
  }

  const request = indexedDB.open("ASMR_Categorized_DB_V30", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("albums")) db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
  };
  request.onsuccess = (e) => { 
    db = e.target.result; 
    loadData(); 
    initMediaSession(); 
    initPiPEngine(); // 預先初始化 PiP
  };

  window.addEventListener('DOMContentLoaded', () => {
    try {
      const cachedBgData = localStorage.getItem("asmr_quick_global_bg");
      if (cachedBgData) {
        const bgObj = JSON.parse(cachedBgData);
        if (bgObj && bgObj.url) {
          if (bgObj.type.startsWith("video")) {
            bgImg.style.display = "none";
            bgVideo.style.display = "block";
            bgVideo.src = bgObj.url;
            bgVideo.muted = true;
            bgVideo.play().catch(()=>{});
          } else {
            bgVideo.style.display = "none";
            bgImg.style.display = "block";
            bgImg.src = bgObj.url;
          }
        }
      }
    } catch(err) { console.error(err); }
  });

  function loadData() {
    if (!db) return;
    const tx = db.transaction(["albums", "tracks", "settings"], "readonly");
    tx.objectStore("albums").getAll().onsuccess = (e) => {
      albums = e.target.result;
      updateAlbumSelect();
      renderHomeAlbums();
    };
    tx.objectStore("tracks").getAll().onsuccess = (e) => {
      tracks = e.target.result;
      if (currentActiveAlbumId) renderDetailView(currentActiveAlbumId);
    };
    tx.objectStore("settings").get("globalBackgrounds").onsuccess = (e) => {
      if (e.target.result && e.target.result.blobs && e.target.result.blobs.length > 0) {
        globalBackgrounds = e.target.result.blobs;
        bgIndex = 0;
        startGlobalBgRotation();
      }
    };
  }

  function toggleAdminDrawer() {
    document.getElementById("admin-drawer").classList.toggle("open");
  }

  function switchPage(pageName, albumId) {
    document.querySelectorAll(".page-view").forEach(el => el.classList.remove("active"));
    if (pageName === 'home') {
      document.getElementById("view-home").classList.add("active");
      currentActiveAlbumId = null;
      renderHomeAlbums();
    } else if (pageName === 'detail') {
      document.getElementById("view-detail").classList.add("active");
      currentActiveAlbumId = albumId;
      renderDetailView(albumId);
    }
  }

  function updateAlbumSelect() {
    const sel = document.getElementById("select-album");
    sel.innerHTML = '<option value="">-- 請選擇分區 --</option>';
    albums.forEach(a => {
      let opt = document.createElement("option");
      opt.value = a.id;
      opt.innerText = a.title;
      sel.appendChild(opt);
    });
  }

  async function saveGlobalBackgrounds() {
    const input = document.getElementById("global-bg-input");
    if (!input.files.length) return alert("請先選取圖片或影片檔案！");
    let blobs = Array.from(input.files);
    
    if (blobs.length > 0) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          localStorage.setItem("asmr_quick_global_bg", JSON.stringify({
            url: e.target.result,
            type: blobs[0].type
          }));
        } catch(err) {}
      };
      reader.readAsDataURL(blobs[0]);
    }

    const tx = db.transaction("settings", "readwrite");
    tx.objectStore("settings").put({ key: "globalBackgrounds", blobs: blobs });
    tx.oncomplete = () => {
      globalBackgrounds = blobs;
      bgIndex = 0;
      startGlobalBgRotation();
      showToast("✅ 全域背景儲存成功！");
    };
  }

  function startGlobalBgRotation() {
    if (bgTimer) clearInterval(bgTimer);
    if (!globalBackgrounds.length) return;
    applyGlobalBackground(globalBackgrounds[bgIndex]);
    bgTimer = setInterval(() => {
      if (!isCustomAlbumPlaying && globalBackgrounds.length > 0) {
        bgIndex = (bgIndex + 1) % globalBackgrounds.length;
        applyGlobalBackground(globalBackgrounds[bgIndex]);
      }
    }, 30000);
  }

  function applyGlobalBackground(blob) {
    if (!blob) return;
    const url = createTrackedObjectURL(blob);
    if (blob.type.startsWith("video")) {
      bgImg.style.display = "none";
      bgVideo.style.display = "block";
      bgVideo.src = url;
      bgVideo.muted = true;
      bgVideo.play().catch(()=>{});
    } else {
      bgVideo.style.display = "none";
      bgVideo.pause();
      bgImg.style.display = "block";
      bgImg.src = url;
    }
  }

  function applyAlbumBackground(blobs, idx) {
    if (!blobs || !blobs.length) return;
    const blob = blobs[idx % blobs.length];
    const url = createTrackedObjectURL(blob);
    if (blob.type.startsWith("video")) {
      bgImg.style.display = "none";
      bgVideo.style.display = "block";
      bgVideo.src = url;
      bgVideo.muted = true;
      bgVideo.play().catch(()=>{});
    } else {
      bgVideo.style.display = "none";
      bgVideo.pause();
      bgImg.style.display = "block";
      bgImg.src = url;
    }
  }

  async function createAlbum() {
    const title = document.getElementById("album-title").value.trim();
    const coverInput = document.getElementById("album-covers");

  function parseUniversalLyrics(rawText) {
    if (!rawText) return [];
    const lines = rawText.split('\n');
    const lyrics = [];
    const lrcTimeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
    let isLrcFormat = false;

    for (let line of lines) {
      if (lrcTimeReg.test(line)) {
        isLrcFormat = true;
        break;
      }
    }

    if (isLrcFormat) {
      for (let line of lines) {
        const match = lrcTimeReg.exec(line);
        if (match) {
          const minutes = parseInt(match[1], 10);
          const seconds = parseInt(match[2], 10);
          const msStr = match[3].padEnd(3, '0');
          const milliseconds = parseInt(msStr, 10);
          const time = minutes * 60 + seconds + milliseconds / 1000;
          let text = line.replace(lrcTimeReg, '').trim();
          if (text) lyrics.push({ time, text });
        }
      }
    } else {
      const timeRangeReg = /(\d{2}):(\d{2}):(\d{2})[\.,](\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})[\.,](\d{3})/;
      let currentStartTime = null;
      let textBuffer = [];

      for (let line of lines) {
        line = line.trim();
        const match = timeRangeReg.exec(line);
        if (match) {
          if (currentStartTime !== null && textBuffer.length > 0) {
            lyrics.push({ time: currentStartTime, text: textBuffer.join(' ') });
            textBuffer = [];
          }
          const h = parseInt(match[1], 10);
          const m = parseInt(match[2], 10);
          const s = parseInt(match[3], 10);
          const ms = parseInt(match[4], 10);
          currentStartTime = h * 3600 + m * 60 + s + ms / 1000;
        } else if (line === '' || !isNaN(line) || line.toUpperCase() === 'WEBVTT') {
          if (currentStartTime !== null && textBuffer.length > 0) {
            lyrics.push({ time: currentStartTime, text: textBuffer.join(' ') });
            textBuffer = [];
            currentStartTime = null;
          }
        } else if (currentStartTime !== null) {
          let cleanLine = line.replace(/<[^>]*>/g, '');
          if (cleanLine) textBuffer.push(cleanLine);
        }
      }
      if (currentStartTime !== null && textBuffer.length > 0) {
        lyrics.push({ time: currentStartTime, text: textBuffer.join(' ') });
      }
    }

    if (lyrics.length === 0) {
      let validLines = lines.map(l => l.trim()).filter(l => l && !l.startsWith('WEBVTT'));
      validLines.forEach((text, i) => {
        lyrics.push({ time: i * 4.0, text });
      });
    }

    lyrics.sort((a, b) => a.time - b.time);
    return lyrics;
  }

  async function addTrack() {
    const albumId = parseInt(document.getElementById("select-album").value);
    const titleInput = document.getElementById("track-title-input").value.trim();
    const audioInput = document.getElementById("track-audio");
    const lrcInput = document.getElementById("track-lrc");

    if (!albumId) return alert("請先選擇目標作品分區！");
    if (!audioInput.files.length) return alert("請選擇音訊檔案！");

    const audioFile = audioInput.files[0];
    const lrcFile = lrcInput.files[0];
    let title = titleInput || audioFile.name.replace(/\.[^/.]+$/, "");
    let lrcText = "";

    if (lrcFile) {
      lrcText = await lrcFile.text();
    }

    const tx = db.transaction("tracks", "readwrite");
    tx.objectStore("tracks").add({
      albumId,
      title,
      audioBlob: audioFile,
      lrcText
    });
    tx.oncomplete = () => {
      document.getElementById("track-title-input").value = "";
      audioInput.value = "";
      lrcInput.value = "";
      loadData();
      showToast("✅ 單一篇章新增成功！");
    };
  }

  function readFileAsTextAsync(file) {
    return new Promise((resolve) => {
      if (!file) resolve("");
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result || "");
      reader.onerror = () => resolve("");
      reader.readAsText(file);
    });
  }

  async function batchUploadAndPair() {
    const albumId = parseInt(document.getElementById("select-album").value);
    const audioInput = document.getElementById("batch-audios");
    const lrcInput = document.getElementById("batch-lrcs");
    const btn = document.getElementById("btn-batch-upload");

    if (!albumId) return alert("請先選擇目標作品分區！");
    if (!audioInput.files.length) return alert("請至少選取一個音訊檔案！");

    btn.disabled = true;
    btn.innerText = "⚡ 正在配對並匯入...";

    let audios = Array.from(audioInput.files).sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
    let lrcs = Array.from(lrcInput.files);

    let lrcMapData = [];
    for (let l of lrcs) {
      let text = await readFileAsTextAsync(l);
      let lBase = l.name.replace(/\.[^/.]+$/, "").trim();
      lrcMapData.push({ base: lBase, text: text });
    }

    try {
      const tx = db.transaction("tracks", "readwrite");
      const store = tx.objectStore("tracks");

      for (let audioFile of audios) {
        let baseName = audioFile.name.replace(/\.[^/.]+$/, "").trim();
        let matchedLrcText = "";

        let found = lrcMapData.find(item => {
          let lBase = item.base;
          return lBase === baseName || baseName.includes(lBase) || lBase.includes(baseName);
        });

        if (found) matchedLrcText = found.text;

        store.add({
          albumId,
          title: baseName,
          audioBlob: audioFile,
          lrcText: matchedLrcText
        });
      }

      tx.oncomplete = () => {
        audioInput.value = "";
        lrcInput.value = "";
        btn.disabled = false;
        btn.innerText = "⚡ 一鍵配對並自動匯入篇章";
        loadData();
        showToast(`✅ 成功批量匯入 ${audios.length} 個篇章並自動配對！`);
      };

      tx.onerror = (err) => {
        console.error(err);
        btn.disabled = false;
        btn.innerText = "⚡ 一鍵配對並自動匯入篇章";
        alert("❌ 批量匯入失敗，可能是容量不足。");
      };
    } catch(e) {
      console.error(e);
      btn.disabled = false;
      btn.innerText = "⚡ 一鍵配對並自動匯入篇章";
    }
  }

  function playTrackFromAlbum(albumId, index) {
    const albumTracks = tracks.filter(t => t.albumId === albumId);
    if (!albumTracks.length) return;
    currentTrackList = albumTracks;
    currentIndex = index;
    currentPlayingAlbumId = albumId;

    const track = currentTrackList[currentIndex];
    const album = albums.find(a => a.id === albumId);

    isCustomAlbumPlaying = true;
    if (album && album.backgrounds && album.backgrounds.length > 0) {
      currentAlbumBgBlobs = album.backgrounds;
      albumBgIndex = 0;
      applyAlbumBackground(currentAlbumBgBlobs, albumBgIndex);
    }

    setupActiveAlbumCovers(album);
    loadAndPlayCurrentTrack(track, album);
    expandPlayer();
  }

  function setupActiveAlbumCovers(album) {
    activeAlbumCoverBlobs = (album && album.covers && album.covers.length > 0) ? album.covers : [];
    activeCoverIndex = 0;
    buildCoverElements();
  }

  function buildCoverElements() {
    const box = document.getElementById("player-cover-box");
    box.innerHTML = `
      <button class="btn-cover-nav cover-prev" onclick="prevCover()">❮</button>
      <button class="btn-cover-nav cover-next" onclick="nextCover()">❯</button>
      <div class="cover-indicator" id="cover-indicator">1 / 1</div>
    `;
    coverElements = [];
    cachedCoverElement = null;

    if (!activeAlbumCoverBlobs.length) {
      let img = document.createElement("img");
      img.src = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%23121218'/></svg>";
      img.style.display = "block";
      box.appendChild(img);
      coverElements.push(img);
      cachedCoverElement = img;
      isCoverVideoActive = false;
      document.getElementById("cover-indicator").innerText = "1 / 1";
      return;
    }

    activeAlbumCoverBlobs.forEach((blob, i) => {
      let url = createTrackedObjectURL(blob);
      if (blob.type.startsWith("video")) {
        let vid = document.createElement("video");
        vid.src = url;
        vid.muted = true;
        vid.loop = true;
        vid.playsInline = true;
        vid.style.display = (i === 0) ? "block" : "none";
        box.appendChild(vid);
        coverElements.push(vid);
        if (i === 0) {
          cachedCoverElement = vid;
          isCoverVideoActive = true;
          if (!isPowerSavingCover) vid.play().catch(()=>{});
        }
      } else {
        let img = document.createElement("img");
        img.src = url;
        img.style.display = (i === 0) ? "block" : "none";
        box.appendChild(img);
        coverElements.push(img);
        if (i === 0) {
          cachedCoverElement = img;
          isCoverVideoActive = false;
        }
      }
    });
    updateCoverDisplay();
  }

  function updateCoverDisplay() {
    if (!coverElements.length) return;
    coverElements.forEach((el, i) => {
      if (i === activeCoverIndex) {
        el.style.display = "block";
        cachedCoverElement = el;
        isCoverVideoActive = (el.tagName === 'VIDEO');
        if (el.tagName === 'VIDEO') {
          if (isPowerSavingCover) {
            el.pause();
          } else {
            el.play().catch(()=>{});
          }
        }
      } else {
        el.style.display = "none";
        if (el.tagName === 'VIDEO') el.pause();
      }
    });
    document.getElementById("cover-indicator").innerText = `${activeCoverIndex + 1} / ${coverElements.length}`;
  }

  function nextCover() {
    if (!coverElements.length) return;
    activeCoverIndex = (activeCoverIndex + 1) % coverElements.length;
    updateCoverDisplay();
  }

  function prevCover() {
    if (!coverElements.length) return;
    activeCoverIndex = (activeCoverIndex - 1 + coverElements.length) % coverElements.length;
    updateCoverDisplay();
  }

  function loadAndPlayCurrentTrack(track, album) {
    const audioUrl = createTrackedObjectURL(track.audioBlob);
    audio.src = audioUrl;
    audio.playbackRate = speedOptions[speedIndex];
    audio.play().then(() => {
      document.getElementById("btn-play").innerText = "⏸";
      document.getElementById("mini-btn-play").innerText = "⏸";
    }).catch(e => console.log(e));

    currentLrc = parseUniversalLyrics(track.lrcText);

    document.getElementById("album-tag").innerText = album ? `📁 ${album.title}` : "📁 ASMR 隨身庫";
    document.getElementById("mini-title").innerText = track.title;
    document.getElementById("mini-player").classList.remove("hidden");

    if (album && album.covers && album.covers.length > 0) {
      document.getElementById("mini-thumb").src = createTrackedObjectURL(album.covers[0]);
    }

    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title,
        artist: album ? album.title : "ASMR 隨身庫",
        album: "ASMR 私人隨身庫",
        artwork: (album && album.covers && album.covers.length > 0) ? [{ src: createTrackedObjectURL(album.covers[0]) }] : []
      });
    }
  }

  audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    let pct = (audio.currentTime / audio.duration) * 100;
    seekSlider.value = pct;

    document.getElementById("time-current").innerText = formatTime(audio.currentTime);
    document.getElementById("time-duration").innerText = formatTime(audio.duration);

    let currentText = getActiveSubtitleText(audio.currentTime);
    document.getElementById("lrc-box").innerText = currentText;
    document.getElementById("mini-lrc").innerText = currentText;
  });

  function getActiveSubtitleText(currentTime) {
    if (!currentLrc || currentLrc.length === 0) return "♪ 享受純淨聆聽時光 ♪";
    let activeText = "♪ 享受純淨聆聽時光 ♪";
    for (let i = 0; i < currentLrc.length; i++) {
      if (currentTime >= currentLrc[i].time) {
        activeText = currentLrc[i].text;
      } else {
        break;
      }
    }
    return activeText;
  }

  audio.addEventListener("ended", () => {
    if (repeatMode === 1) { // 單曲循環
      audio.currentTime = 0;
      audio.play();
    } else if (repeatMode === 2) { // 隨機播放
      let nextIdx = Math.floor(Math.random() * currentTrackList.length);
      currentIndex = nextIdx;
      const track = currentTrackList[currentIndex];
      const album = albums.find(a => a.id === track.albumId);
      setupActiveAlbumCovers(album);
      loadAndPlayCurrentTrack(track, album);
    } else {
      nextTrack();
    }
  });

  function togglePlay() {
    if (currentIndex === -1) return;
    if (audio.paused) {
      audio.play();
      document.getElementById("btn-play").innerText = "⏸";
      document.getElementById("mini-btn-play").innerText = "⏸";
      if (cachedCoverElement && cachedCoverElement.tagName === 'VIDEO' && !isPowerSavingCover) cachedCoverElement.play().catch(()=>{});
    } else {
      audio.pause();
      document.getElementById("btn-play").innerText = "▶";
      document.getElementById("mini-btn-play").innerText = "▶";
      if (cachedCoverElement && cachedCoverElement.tagName === 'VIDEO') cachedCoverElement.pause();
    }
  }

  function toggleRepeatMode() {
    repeatMode = (repeatMode + 1) % 3;
    const btn = document.getElementById("btn-repeat-mode");
    btn.innerText = repeatModeNames[repeatMode];
    btn.classList.toggle("active", repeatMode !== 0);
    showToast(`切換至：${repeatModeNames[repeatMode]}`);
  }

  function togglePlaybackSpeed() {
    speedIndex = (speedIndex + 1) % speedOptions.length;
    let rate = speedOptions[speedIndex];
    audio.playbackRate = rate;
    const btn = document.getElementById("btn-speed");
    btn.innerText = `⚡ ${rate}x`;
    btn.classList.toggle("active", rate !== 1.0);
    showToast(`播放速度：${rate}x`);
  }

  function toggleSleepTimer() {
    const btn = document.getElementById("btn-sleep-timer");
    if (sleepTimerTimeout) {
      clearTimeout(sleepTimerTimeout);
      sleepTimerTimeout = null;
      sleepTimerMinutes = 0;
      btn.innerText = "🌙 關閉定時";
      btn.classList.remove("active");
      showToast("睡眠定時器已取消");
    } else {
      let choice = prompt("請選擇倒數關閉時間(分鐘)：\n輸入 15, 30, 45, 60", "30");
      let mins = parseInt(choice, 10);
      if (isNaN(mins) || mins <= 0) return;
      sleepTimerMinutes = mins;
      btn.innerText = `🌙 ${mins}分後關閉`;
      btn.classList.add("active");
      showToast(`定時器已設定：${mins} 分鐘後自動停止`);
      sleepTimerTimeout = setTimeout(() => {
        audio.pause();
        document.getElementById("btn-play").innerText = "▶";
        document.getElementById("mini-btn-play").innerText = "▶";
        btn.innerText = "🌙 關閉定時";
        btn.classList.remove("active");
        sleepTimerTimeout = null;
        showToast("已自動停止播放 (睡眠定時)");
      }, mins * 60 * 1000);
    }
  }

  function nextTrack() {
    if (currentIndex === -1 || !currentTrackList.length) return;
    currentIndex = (currentIndex + 1) % currentTrackList.length;
    const track = currentTrackList[currentIndex];
    const album = albums.find(a => a.id === track.albumId);
    setupActiveAlbumCovers(album);
    loadAndPlayCurrentTrack(track, album);
    if (currentAlbumBgBlobs.length > 0) {
      albumBgIndex++;
      applyAlbumBackground(currentAlbumBgBlobs, albumBgIndex);
    }
  }

  function prevTrack() {
    if (currentIndex === -1 || !currentTrackList.length) return;
    currentIndex = (currentIndex - 1 + currentTrackList.length) % currentTrackList.length;
    const track = currentTrackList[currentIndex];
    const album = albums.find(a => a.id === track.albumId);
    setupActiveAlbumCovers(album);
    loadAndPlayCurrentTrack(track, album);
  }

  seekSlider.addEventListener("input", (e) => {
    if (!audio.duration) return;
    let time = (e.target.value / 100) * audio.duration;
    audio.currentTime = time;
  });

  function seekRelative(sec) {
    if (currentIndex === -1) return;
    audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + sec));
  }

  volumeSlider.addEventListener("input", (e) => {
    audio.volume = e.target.value;
    audio.muted = (audio.volume === 0);
    updateMuteIcon();
  });

  function toggleMute() {
    if (audio.muted) {
      audio.muted = false;
      audio.volume = lastVolume || 1;
      volumeSlider.value = audio.volume;
    } else {
      lastVolume = audio.volume;
      audio.muted = true;
      audio.volume = 0;
      volumeSlider.value = 0;
    }
    updateMuteIcon();
  }

  function updateMuteIcon() {
    const btn = document.getElementById("btn-mute");

  }

  function expandPlayer() {
    playerCard.classList.remove("minimized");

  }

  function minimizePlayer() {
    playerCard.classList.add("minimized");
    playerCard.style.transform = '';
    miniPlayer.classList.remove("hidden");
  }

  function formatTime(seconds) {
    let m = Math.floor(seconds / 60);
    let s = Math.floor(seconds % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  async function uploadCurrentTrackLrc(event) {
    if (currentIndex === -1) return;
    const file = event.target.files[0];
    if (!file) return;
    const text = await readFileAsTextAsync(file);
    const track = currentTrackList[currentIndex];
    track.lrcText = text;
    currentLrc = parseUniversalLyrics(text);

    const tx = db.transaction("tracks", "readwrite");
    tx.objectStore("tracks").put(track);
    tx.oncomplete = () => { showToast("✅ 字幕匯入成功！"); };
  }

  function pasteCurrentTrackLrc() {
    if (currentIndex === -1) return showToast("請先播放一個篇章！");
    let text = prompt("請貼上字幕內容 (支援 LRC / VTT / SRT / 純文字)：");
    if (text === null) return;
    const track = currentTrackList[currentIndex];
    track.lrcText = text;
    currentLrc = parseUniversalLyrics(text);

    const tx = db.transaction("tracks", "readwrite");
    tx.objectStore("tracks").put(track);
    tx.oncomplete = () => { showToast("✅ 字幕更新成功！"); };
  }

  function inspectCurrentTrackLrc() {
    if (currentIndex === -1) return showToast("請先播放一個篇章！");
    const track = currentTrackList[currentIndex];
    let newText = prompt("檢視與修改目前字幕原始碼：", track.lrcText || "");
    if (newText === null) return;
    track.lrcText = newText;
    currentLrc = parseUniversalLyrics(newText);

    const tx = db.transaction("tracks", "readwrite");
    tx.objectStore("tracks").put(track);
    tx.oncomplete = () => { showToast("✅ 字幕已修改儲存！"); };
  }

  // --- Blob Base64 無損導出與還原備份 ---
  function blobToBase64(blob) {
    return new Promise((resolve) => {
      if (!blob) resolve(null);
      const reader = new FileReader();
      reader.onloadend = () => resolve({ data: reader.result, type: blob.type });
      reader.readAsDataURL(blob);
    });
  }

  function base64ToBlob(base64Obj) {
    if (!base64Obj || !base64Obj.data) return null;
    let arr = base64Obj.data.split(',');
    let mime = base64Obj.type || arr[0].match(/:(.*?);/)[1];
    let bstr = atob(arr[1]);
    let n = bstr.length;
    let u8arr = new Uint8Array(n);
    while (n--) {
      u8arr[n] = bstr.charCodeAt(n);
    }
    return new Blob([u8arr], { type: mime });
  }

  async function exportDataBackup() {
    const btn = document.getElementById("btn-export-backup");
    btn.disabled = true;
    btn.innerText = "⏳ 正在打包完整備份與媒體中...";

    try {
      const tx = db.transaction(["albums", "tracks", "settings"], "readonly");
      let rawAlbums = [], rawTracks = [], rawSettings = [];

      await new Promise(res => {
        tx.objectStore("albums").getAll().onsuccess = (e) => { rawAlbums = e.target.result; res(); };
      });
      await new Promise(res => {
        tx.objectStore("tracks").getAll().onsuccess = (e) => { rawTracks = e.target.result; res(); };
      });
      await new Promise(res => {
        tx.objectStore("settings").getAll().onsuccess = (e) => { rawSettings = e.target.result; res(); };
      });

      let processedAlbums = [];
      for (let alb of rawAlbums) {
        let coversB64 = [];
        if (alb.covers) {
          for (let c of alb.covers) coversB64.push(await blobToBase64(c));
        }
        let bgsB64 = [];
        if (alb.backgrounds) {
          for (let b of alb.backgrounds) bgsB64.push(await blobToBase64(b));
        }
        processedAlbums.push({ ...alb, covers: coversB64, backgrounds: bgsB64 });
      }

      let processedTracks = [];
      for (let trk of rawTracks) {
        let audioB64 = await blobToBase64(trk.audioBlob);
        processedTracks.push({ ...trk, audioBlob: audioB64 });
      }

      let backupObj = { albums: processedAlbums, tracks: processedTracks, settings: rawSettings, version: "v3" };

      const blob = new Blob([JSON.stringify(backupObj)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ASMR_Backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      
      showToast("✅ 備份檔案已成功下載！");
    } catch(err) {
      console.error(err);
      alert("❌ 備份匯出失敗，請確認設備記憶體是否足夠。");
    } finally {
      btn.disabled = false;
      btn.innerText = "📤 1. 匯出完整無損備份檔案 (電腦/手機)";
    }
  }

  async function importDataBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (!confirm("匯入備份將會覆寫現有數據庫，是否繼續？")) return;

    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        const tx = db.transaction(["albums", "tracks", "settings"], "readwrite");
        
        if (data.albums) {
          let store = tx.objectStore("albums");
          for (let alb of data.albums) {
            let restoredCovers = (alb.covers) ? alb.covers.map(c => base64ToBlob(c)).filter(Boolean) : [];
            let restoredBgs = (alb.backgrounds) ? alb.backgrounds.map(b => base64ToBlob(b)).filter(Boolean) : [];
            store.put({ ...alb, covers: restoredCovers, backgrounds: restoredBgs });
          }
        }
        if (data.tracks) {
          let store = tx.objectStore("tracks");
          for (let trk of data.tracks) {
            let restoredAudio = base64ToBlob(trk.audioBlob);
            store.put({ ...trk, audioBlob: restoredAudio });
          }
        }
        if (data.settings) {
          let store = tx.objectStore("settings");
          data.settings.forEach(item => store.put(item));
        }

        tx.oncomplete = () => {
          loadData();
          showToast("✅ 跨裝置備份還原成功！");
        };
      } catch (err) {
        console.error(err);
        alert("❌ 備份檔案解析失敗，請確認檔案正確性。");
      }
    };
    reader.readAsText(file);
  }

  function initMediaSession() {
    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler('play', () => { togglePlay(); });
      navigator.mediaSession.setActionHandler('pause', () => { togglePlay(); });
      navigator.mediaSession.setActionHandler('previoustrack', () => { prevTrack(); });
      navigator.mediaSession.setActionHandler('nexttrack', () => { nextTrack(); });
    }
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }
</script>
