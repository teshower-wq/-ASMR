<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫 (YouTube 風格動態影音完美升級版)</title>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.45);
      --bg-dark: #07070a;
      --card-glass: rgba(16, 16, 22, 0.85);
      --card-glass-hover: rgba(24, 24, 34, 0.94);
      --text-main: #ffffff;
      --text-sub: #9494ab;
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-hover: rgba(255, 121, 198, 0.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; padding-bottom: 140px;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, "PingFang TC", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #bg-video, #bg-img {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; background-color: var(--bg-dark);
      z-index: -2; display: none; filter: brightness(0.7) blur(4px);
      transform: translateZ(0); will-change: transform, opacity;
      transition: opacity 0.8s ease;
    }
    @media (max-width: 768px) {
      #bg-video, #bg-img { top: -10vh; left: -10vw; width: 120vw; height: 120vh; }
    }

    #bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(7,7,10,0.3) 0%, rgba(7,7,10,0.88) 100%);
      z-index: -1; pointer-events: none;
    }

    .container { width: 100%; max-width: 680px; z-index: 1; position: relative; }
    .top-bar { width: 100%; max-width: 680px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; z-index: 10; }
    .app-logo { font-size: 1.4rem; font-weight: 800; color: var(--primary-pink); text-shadow: 0 0 20px var(--pink-glow); cursor: pointer; letter-spacing: 0.5px; }
    .top-actions { display: flex; gap: 8px; }
    .btn-clean-mem {
      background: rgba(80, 250, 123, 0.15); border: 1px solid rgba(80, 250, 123, 0.4);
      color: #50fa7b; padding: 10px 14px; border-radius: 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; backdrop-filter: blur(10px);
    }
    .btn-clean-mem:hover { background: rgba(80, 250, 123, 0.3); box-shadow: 0 0 15px rgba(80, 250, 123, 0.4); }
    .btn-toggle-admin {
      background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 10px 18px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; backdrop-filter: blur(10px);
    }
    .btn-toggle-admin:hover { background: rgba(255, 121, 198, 0.25); border-color: var(--primary-pink); box-shadow: 0 0 15px var(--pink-glow); }

    .admin-drawer { max-height: 0; overflow: hidden; transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; will-change: max-height; }
    .admin-drawer.open { max-height: 4500px; }

    .glass-card {
      background: var(--card-glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass); border-radius: 24px; padding: 20px; margin-bottom: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5); transform: translateZ(0);
    }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; color: var(--primary-pink); display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.2s ease;
    }
    input:focus, select:focus { border-color: var(--primary-pink); box-shadow: 0 0 12px rgba(255, 121, 198, 0.25); background: rgba(0,0,0,0.6); }
    
    input[type="file"] { padding: 8px; color: var(--text-sub); font-size: 0.85rem; cursor: pointer; }
    input[type="file"]::file-selector-button {
      background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-right: 12px;
    }

    .btn-pink {
      width: 100%; background: linear-gradient(135deg, #ff79c6 0%, #ff52b2 100%); color: #07070a; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(255, 121, 198, 0.35); transition: all 0.2s ease;
    }
    .btn-pink:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(255, 121, 198, 0.5); }

    .btn-blue {
      width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #ffffff; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35); transition: all 0.2s ease;
    }
    .btn-blue:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(59, 130, 246, 0.5); }

    .btn-green {
      width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; border: none;
      padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35); transition: all 0.2s ease;
    }
    .btn-green:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5); }
    .btn-green:disabled { opacity: 0.6; cursor: not-allowed; }

    .page-view { display: none; width: 100%; animation: fadeIn 0.2s ease; }
    .page-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .album-grid-card {
      background: var(--card-glass); backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass); border-radius: 20px; padding: 14px; margin-bottom: 12px;
      display: flex; align-items: center; cursor: pointer; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); transform: translateZ(0);
    }
    .album-grid-card:hover {
      background: var(--card-glass-hover); border-color: var(--border-glass-hover);
      transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 121, 198, 0.15);
    }
    .album-grid-thumb { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; margin-right: 14px; flex-shrink: 0; background: #121218; }
    
    .album-youtube-card {
      background: var(--card-glass); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 121, 198, 0.3); border-radius: 20px; overflow: hidden; margin-bottom: 16px;
      cursor: pointer; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .album-youtube-card:hover {
      border-color: var(--primary-pink);
      transform: translateY(-2px); box-shadow: 0 15px 40px rgba(255, 121, 198, 0.25);
    }
    .album-youtube-thumb-container { width: 100%; height: 200px; background: #000; position: relative; overflow: hidden; }
    .album-youtube-thumb-container video, .album-youtube-thumb-container img { width: 100%; height: 100%; object-fit: cover; }
    .album-youtube-info { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }

    .album-grid-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .album-grid-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .album-grid-count { font-size: 0.85rem; color: var(--primary-pink); font-weight: 600; }
    .album-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.72rem; margin-top: 4px; font-weight: 700; }
    .badge-mp3 { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-mp4 { background: rgba(255, 121, 198, 0.2); color: var(--primary-pink); border: 1px solid rgba(255, 121, 198, 0.4); }
    
    .btn-action-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; z-index: 2; }
    .btn-album-action {
      background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .btn-album-del {
      background: rgba(255, 85, 85, 0.1); border: 1px solid rgba(255, 85, 85, 0.25);
      color: #ff6b6b; padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }

    .breadcrumb-bar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 0.95rem; font-weight: 700;
      color: var(--primary-pink); cursor: pointer; padding: 2px 0;
    }

    .chapter-file-list { display: flex; flex-direction: column; gap: 8px; }
    .chapter-file-item {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 14px;
      cursor: pointer; transition: all 0.15s ease;
    }
    .chapter-file-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255, 121, 198, 0.25); }
    .chapter-info-left { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; margin-right: 10px; }
    .play-icon-circle {
      width: 36px; height: 36px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.95rem; flex-shrink: 0;
    }
    .chapter-meta-text { overflow: hidden; }
    .chapter-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; margin-bottom: 2px; color: #fff; font-size: 0.92rem; }
    .chapter-duration-sub { font-size: 0.78rem; color: var(--text-sub); }

    .btn-action-group { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-sm { padding: 5px 10px; border-radius: 9px; border: none; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-sm-edit { background: rgba(255, 121, 198, 0.15); color: var(--primary-pink); border: 1px solid rgba(255, 121, 198, 0.3); }
    .btn-sm-del { background: rgba(255,255,255,0.06); color: #ff6b6b; border: 1px solid rgba(255,85,85,0.15); }

    .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .btn-page {
      background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3); color: var(--primary-pink);
      padding: 8px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.88rem;
    }
    .btn-page:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-info { font-size: 0.85rem; color: var(--text-sub); }

    .player-card {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; width: 100%; 
      max-height: 92vh; height: auto; overflow-y: auto; overflow-x: hidden;
      background: rgba(16, 16, 22, 0.98); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-bottom: none; border-radius: 26px 26px 0 0;
      padding: 4px 18px 24px 18px; box-shadow: 0 -16px 50px rgba(0,0,0,0.85);
      z-index: 1000; transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform; transform: translateZ(0);
    }
    .player-card.minimized { transform: translateY(110%); pointer-events: none; }

    .drag-handle-area { width: 100%; padding: 12px 0; display: flex; justify-content: center; cursor: grab; touch-action: none; }
    .drag-handle { width: 50px; height: 5px; background: rgba(255, 255, 255, 0.45); border-radius: 10px; }

    #media-display-container {
      width: 100%; position: relative; display: flex; flex-direction: column; align-items: center;
    }

    /* 全螢幕模式：將容器填滿整個畫面，確保字幕與愛心浮在最上層 */
    #media-display-container:fullscreen,
    #media-display-container:-webkit-full-screen {
      width: 100vw !important; height: 100vh !important;
      background: #000000 !important;
      display: flex !important; flex-direction: column !important;
      justify-content: center !important; align-items: center !important;
      padding: 0 !important; margin: 0 !important;
      position: fixed !important; top: 0 !important; left: 0 !important;
      z-index: 99999 !important;
    }

    .cover-box { 
      width: 100%; height: 240px; border-radius: 16px; 
      overflow: hidden; background: #050508; margin: 0 auto 10px auto; 
      position: relative; box-shadow: 0 6px 20px rgba(0,0,0,0.5); 
      display: flex; align-items: center; justify-content: center;
    }
    .cover-box img, .cover-box video { 
      width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; top: 0; left: 0; border-radius: 12px;
    }

    /* YouTube 風格滿版影片播放面板 */
    .video-player-box {
      width: 100%; height: 380px; background: #000000; border-radius: 16px;
      overflow: hidden; position: relative; margin: 0 auto 10px auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
    }
    .video-player-box video { width: 100%; height: 100%; object-fit: cover; background: #000; outline: none; }
    
    #media-display-container:fullscreen .video-player-box,
    #media-display-container:-webkit-full-screen .video-player-box {
      width: 100vw !important; height: 100vh !important; max-height: 100vh !important;
      border-radius: 0 !important; margin: 0 !important; position: relative !important;
    }

    .video-subtitle-overlay {
      position: absolute; bottom: 20px; left: 16px; right: 16px; text-align: center;
      font-size: 1.15rem; font-weight: 800; color: var(--primary-pink);
      text-shadow: 0 0 16px rgba(0,0,0,0.95), 0 2px 6px rgba(0,0,0,0.9);
      pointer-events: none; z-index: 100; line-height: 1.4; background: transparent; border: none;
    }
    #media-display-container:fullscreen .video-subtitle-overlay,
    #media-display-container:-webkit-full-screen .video-subtitle-overlay {
      font-size: 2rem !important; bottom: 40px !important; z-index: 100000 !important;
    }

    .heart-toy-container {
      position: absolute; top: 16px; right: 16px; width: 46px; height: 46px;
      z-index: 100; cursor: pointer; user-select: none;
      filter: drop-shadow(0 0 8px rgba(255, 121, 198, 0.8));
      transition: transform 0.15s ease; pointer-events: auto;
    }
    .heart-toy-container:active { transform: scale(1.2); }
    #media-display-container:fullscreen .heart-toy-container,
    #media-display-container:-webkit-full-screen .heart-toy-container {
      top: 24px !important; right: 24px !important; width: 56px !important; height: 56px !important; z-index: 100000 !important;
    }

    .heart-svg { width: 100%; height: 100%; overflow: visible; }
    .heart-bg { fill: rgba(10, 10, 16, 0.45); stroke: #ff79c6; stroke-width: 2.2; }
    .heart-fill { fill: url(#heart-gradient); }
    
    .heart-full-beat { animation: heartFullBeat 0.45s infinite alternate ease-in-out !important; }
    @keyframes heartFullBeat {
      0% { transform: scale(1); filter: drop-shadow(0 0 10px #ff79c6); }
      100% { transform: scale(1.35); filter: drop-shadow(0 0 25px #ff1493); }
    }

    .cover-climax-shake-pink {
      animation: climaxPinkGlowShake 0.4s infinite alternate ease-in-out !important;
      border: 3px solid #ff1493 !important;
    }
    @keyframes climaxPinkGlowShake {
      0% { box-shadow: 0 0 20px rgba(255, 121, 198, 0.7), inset 0 0 20px rgba(255, 105, 180, 0.6); transform: translate(1px, 1px) rotate(0deg); }
      33% { transform: translate(-2px, -2px) rotate(-1deg); }
      66% { transform: translate(-1px, 2px) rotate(1deg); }
      100% { box-shadow: 0 0 60px rgba(255, 20, 147, 1), inset 0 0 50px rgba(255, 20, 147, 0.9); transform: translate(2px, -1px) rotate(0deg); }
    }

    .btn-cover-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 1rem; z-index: 10; backdrop-filter: blur(4px);
    }
    .cover-prev { left: 10px; }
    .cover-next { right: 10px; }
    .cover-indicator {
      position: absolute; bottom: 10px; right: 12px; background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px; border-radius: 8px; font-size: 0.72rem; color: #fff; z-index: 10;
      backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
    }
    
    .lrc-box {
      min-height: 48px; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 1.05rem; font-weight: 800; color: var(--primary-pink);
      text-shadow: 0 0 20px var(--pink-glow), 0 2px 4px rgba(0,0,0,0.8); padding: 2px 8px; line-height: 1.3; margin-bottom: 8px; width: 100%;
    }

    .sub-quick-tools { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
    .btn-sub-quick {
      padding: 5px 10px; background: rgba(255, 121, 198, 0.1); border: 1px solid rgba(255, 121, 198, 0.25);
      color: var(--primary-pink); border-radius: 9px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }

    .seek-slider { width: 100%; height: 6px; accent-color: var(--primary-pink); cursor: pointer; border-radius: 3px; background: rgba(255,255,255,0.1); }
    .time-box { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-sub); margin-top: 4px; margin-bottom: 10px; font-weight: 500; }
    
    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.25rem; cursor: pointer; padding: 6px; transition: transform 0.15s, color 0.2s; }
    .btn-ctrl:hover { color: var(--primary-pink); transform: scale(1.1); }
    .btn-play-main {
      width: 48px; height: 48px; background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%); color: #07070a; border-radius: 50%;
      font-size: 1.3rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(255,255,255,0.3);
    }

    .volume-box { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 10px; padding: 0 2px; }
    .volume-slider { flex: 1; height: 5px; accent-color: var(--text-sub); cursor: pointer; }
    .btn-mute { background: none; border: none; color: var(--text-sub); font-size: 1.05rem; cursor: pointer; }

    .bottom-tools { display: flex; gap: 8px; }
    .btn-pip {
      flex: 1; background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.82rem; cursor: pointer; text-align: center;
    }
    .btn-fullscreen {
      flex: 1; background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.82rem; cursor: pointer; text-align: center;
    }

    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; height: 64px;
      background: rgba(16, 16, 22, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; padding: 0 14px;
      z-index: 999; cursor: pointer; box-shadow: 0 -6px 25px rgba(0,0,0,0.6); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mini-player.hidden { transform: translateY(100%); pointer-events: none; }
    .mini-thumb { width: 42px; height: 42px; border-radius: 10px; background: #121218; object-fit: cover; margin-right: 10px; flex-shrink: 0; }
    .mini-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .mini-title { font-size: 0.88rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .mini-subtitle { font-size: 0.75rem; color: var(--primary-pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .mini-btn { background: none; border: none; color: #fff; font-size: 1.15rem; padding: 6px; cursor: pointer; }
  </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img" alt="全域背景">
<div id="bg-overlay"></div>

<div class="container">
  <div class="top-bar">
    <div class="app-logo" onclick="switchPage('home')">🌸 ASMR 隨身庫</div>
    <div class="top-actions">
      <button class="btn-clean-mem" onclick="cleanMemoryAndGC()">⚡ 清理記憶體</button>
      <button class="btn-toggle-admin" onclick="toggleAdminDrawer()">⚙️ 管理選單</button>
    </div>
  </div>

  <div id="admin-drawer" class="admin-drawer">
    <div class="glass-card" style="border: 1px solid rgba(255, 20, 147, 0.4); background: rgba(25, 10, 20, 0.85);">
      <div class="card-title" style="color: #ff1493;">🎀 動態影音專區自訂高潮特效 (圖片 + 音效)</div>

      <div id="chapter-list-container" class="chapter-file-list"></div>

    <button class="btn-ctrl" onclick="prevTrack()">⏮</button>
    <button class="btn-ctrl" onclick="seekRelative(-5)">↺5</button>

<video id="pip-video" crossorigin="anonymous" playsinline style="position: fixed; bottom: 0; right: 0; width: 2px; height: 2px; opacity: 0.001; pointer-events: none; z-index: -999;"></video>
<audio id="main-audio" crossorigin="anonymous" playsinline preload="auto"></audio>
<audio id="climax-audio-el" crossorigin="anonymous" playsinline preload="auto"></audio>

<script>
  let db;
  let albums = [];
  let tracks = [];
  let currentTrackList = [];
  let currentIndex = -1;
  let currentLrc = [];
  let currentActiveAlbumId = null;
  let lastVolume = 1;

  let globalBackgrounds = [];
  let bgIndex = 0;
  let bgTimer = null;
  let isCustomAlbumPlaying = false;
  let currentAlbumBgBlobs = [];
  let albumBgIndex = 0;

  let activeAlbumCoverBlobs = [];
  let activeCoverIndex = 0;
  let coverElements = [];
  let cachedCoverElement = null;
  let isCoverVideoActive = false;
  let currentAlbumType = 'mp3';

  let pipCanvas = null;
  let pipCtx = null;
  let isPiPInitialized = false;

  let currentPage = 1;
  const itemsPerPage = 4;
  let activeCreatedUrls = [];

  let audioCtx = null;
  let analyser = null;
  let audioSourceNode = null;
  let climaxAudioSourceNode = null;
  let heartFillPercent = 0;
  let isClimaxState = false;
  let climaxResetTimer = null;
  window.customClimaxData = null;

  let lastPiPRenderTime = 0;
  let PIP_FPS = 30;
  let PIP_INTERVAL = 1000 / PIP_FPS;
  let lastAudioAnalyzeTime = 0;
  const AUDIO_FPS = 15; 
  const AUDIO_INTERVAL = 1000 / AUDIO_FPS;

  const audio = document.getElementById("main-audio");
  const mainVideoPlayer = document.getElementById("main-video-player");
  const bgVideo = document.getElementById("bg-video");
  const bgImg = document.getElementById("bg-img");
  const pipVideo = document.getElementById("pip-video");
  const playerCard = document.getElementById("player-card");
  const miniPlayer = document.getElementById("mini-player");
  const seekSlider = document.getElementById("seek-slider");
  const volumeSlider = document.getElementById("volume-slider");
  const climaxAudioEl = document.getElementById("climax-audio-el");

  let touchStartY = 0;
  let touchCurrentY = 0;
  let isDragging = false;
  const dragHandleArea = document.getElementById("drag-handle-area");

  function getActiveMedia() { return audio; }

  function createTrackedObjectURL(blob) {
    if (!blob) return "";
    const url = URL.createObjectURL(blob);
    activeCreatedUrls.push(url);
    return url;
  }

  function cleanMemoryAndGC() {
    activeCreatedUrls.forEach(url => { try { URL.revokeObjectURL(url); } catch(e){} });
    activeCreatedUrls = [];
    alert("⚡ 已完成快取釋放與記憶體清理！");
  }

  dragHandleArea.addEventListener("touchstart", (e) => {
    touchStartY = e.touches[0].clientY;
    isDragging = true;
    playerCard.style.transition = 'none';
  }, { passive: true });

  dragHandleArea.addEventListener("touchmove", (e) => {
    if (!isDragging) return;
    touchCurrentY = e.touches[0].clientY;
    let diff = touchCurrentY - touchStartY;
    if (diff > 0) playerCard.style.transform = `translateY(${diff}px)`;
  }, { passive: true });

  dragHandleArea.addEventListener("touchend", () => {
    if (!isDragging) return;
    isDragging = false;
    playerCard.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
    let diff = touchCurrentY - touchStartY;
    if (diff > 80) minimizePlayer();
    else playerCard.style.transform = 'translateY(0)';
    touchStartY = 0; touchCurrentY = 0;
  });

  /* 核心修正：正確初始化 Web Audio API 識別音檔聲音 */
  function initAudioAnalysis() {
    if (currentAlbumType !== 'mp4') return;
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      
      audioSourceNode = audioCtx.createMediaElementSource(audio);
      audioSourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      climaxAudioSourceNode = audioCtx.createMediaElementSource(climaxAudioEl);
      climaxAudioSourceNode.connect(audioCtx.destination);
      
      requestAnimationFrame(analyzeAudioFrame);
    } catch(e) { console.error("AudioContext 初始化失敗:", e); }
  }

  function analyzeAudioFrame(timestamp) {
    requestAnimationFrame(analyzeAudioFrame);
    if (currentAlbumType !== 'mp4') return;
    if (timestamp - lastAudioAnalyzeTime < AUDIO_INTERVAL) return;
    lastAudioAnalyzeTime = timestamp;

    let m = getActiveMedia();
    if (!audioCtx || (m && m.paused) || isClimaxState) return;

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);

    let baseVoiceSum = 0;
    let moanVoiceSum = 0;
    for (let i = 1; i <= 4; i++) baseVoiceSum += dataArray[i];
    for (let i = 5; i <= 20; i++) moanVoiceSum += dataArray[i];

    let baseAvg = baseVoiceSum / 4;
    let moanAvg = moanVoiceSum / 16;

    if (baseAvg > 20) heartFillPercent += (0.015 / 8.0) * (baseAvg / 100);
    if (moanAvg > 25) heartFillPercent += (0.06 / 8.0) * (moanAvg / 100);

    if (heartFillPercent >= 100) {
      heartFillPercent = 100;
      triggerClimaxEffect();
    }
    updateHeartDisplay();
  }

  function updateHeartDisplay() {
    const clipRect = document.getElementById("heart-clip-rect");
    if (clipRect) {
      let fillHeight = (heartFillPercent / 100) * 32;
      clipRect.setAttribute("y", 32 - fillHeight);
      clipRect.setAttribute("height", fillHeight);
    }
  }

  async function triggerClimaxEffect() {
    if (currentAlbumType !== 'mp4' || isClimaxState) return;
    isClimaxState = true;
    heartFillPercent = 100;
    updateHeartDisplay();

    const heartEl = document.getElementById("heart-toy");
    const videoBox = document.getElementById("video-player-box");
    const climaxOverlay = document.getElementById("climax-overlay-img");

    if (heartEl) heartEl.classList.add("heart-full-beat");
    if (videoBox) videoBox.classList.add("cover-climax-shake-pink");

    if (window.customClimaxData && window.customClimaxData.audioBlob && window.customClimaxData.imgBlob) {
      if (!climaxAudioEl.src) climaxAudioEl.src = URL.createObjectURL(window.customClimaxData.audioBlob);
      climaxOverlay.src = URL.createObjectURL(window.customClimaxData.imgBlob);
      climaxOverlay.style.display = "block";

      try {
        climaxAudioEl.currentTime = 0;
        await climaxAudioEl.play();
        audio.pause();
        mainVideoPlayer.pause();
        document.getElementById("btn-play").innerText = "▶";
      } catch (e) {
        endClimax(climaxOverlay, heartEl, videoBox);
        return;
      }
      climaxAudioEl.onended = () => endClimax(climaxOverlay, heartEl, videoBox);
    } else {
      if (climaxResetTimer) clearTimeout(climaxResetTimer);
      climaxResetTimer = setTimeout(() => endClimax(null, heartEl, videoBox), 10000);
    }
  }

  function endClimax(climaxOverlay, heartEl, videoBox) {
    heartFillPercent = 0;
    updateHeartDisplay();
    if (heartEl) heartEl.classList.remove("heart-full-beat");
    if (videoBox) videoBox.classList.remove("cover-climax-shake-pink");
    isClimaxState = false;
    
    if (climaxOverlay) {
      climaxOverlay.style.display = "none";
      try { URL.revokeObjectURL(climaxOverlay.src); } catch(e){}
    }

    if (currentIndex !== -1) {
      audio.play().then(() => {
        mainVideoPlayer.play().catch(()=>{});
        document.getElementById("btn-play").innerText = "⏸";
        document.getElementById("mini-btn-play").innerText = "⏸";
      }).catch(e=>{});
    }
  }

  function triggerInstantOrgasm() {
    if (currentAlbumType !== 'mp4') return;
    if (climaxResetTimer) clearTimeout(climaxResetTimer);
    isClimaxState = false;
    triggerClimaxEffect();
  }

  async function saveClimaxSettings() {
    const imgInput = document.getElementById("climax-img-input");
    const audioInput = document.getElementById("climax-audio-input");
    let imgBlob = imgInput.files[0] || null;
    let audioBlob = audioInput.files[0] || null;
    if (!imgBlob || !audioBlob) return alert("請同時選擇「特效圖片」與「特效音效」！");

    const tx = db.transaction("settings", "readwrite");
    const climaxData = { key: "climaxCustomData", imgBlob, audioBlob };
    tx.objectStore("settings").put(climaxData);
    tx.oncomplete = () => {
      window.customClimaxData = climaxData;
      climaxAudioEl.src = URL.createObjectURL(audioBlob);
      alert("✅ 動態影音專區自訂高潮特效儲存成功！");
    };
  }

  /* 核心修復：強制將全螢幕作用於容器，解決 iOS 全螢幕按鈕無反應問題 */
  function toggleFullScreen() {
    const container = document.getElementById("media-display-container");
    if (!container) return;
    
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (container.requestFullscreen) {
        container.requestFullscreen().catch(err => alert("無法進入全螢幕：" + err.message));
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  const request = indexedDB.open("ASMR_Categorized_DB_V38", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("albums")) db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
  };
  request.onsuccess = (e) => { db = e.target.result; loadData(); };

  function onAlbumTypeChange() {
    const typeSel = document.getElementById("album-type");
    if (!typeSel) return;
    const isMp4 = typeSel.value === 'mp4';
    const coverGroup = document.getElementById("group-album-covers");
    const trackAudioLabel = document.getElementById("batch-audio-label");
    if (isMp4) {
      if (coverGroup) coverGroup.style.display = "none";
      if (trackAudioLabel) trackAudioLabel.innerText = "複選影片檔 (.mp4 / .mov) - 影片將作為畫面，聲音同步由音訊播放";
    } else {
      if (coverGroup) coverGroup.style.display = "block";
      if (trackAudioLabel) trackAudioLabel.innerText = "複選音訊檔 (.mp3 / .wav / .m4a)";
    }
  }

  function loadData() {
    if (!db) return;
    const tx = db.transaction(["albums", "tracks", "settings"], "readonly");
    tx.objectStore("albums").getAll().onsuccess = (e) => { albums = e.target.result; updateAlbumSelect(); renderHomeAlbums(); };
    tx.objectStore("tracks").getAll().onsuccess = (e) => { tracks = e.target.result; if (currentActiveAlbumId) renderDetailView(currentActiveAlbumId); };
    tx.objectStore("settings").get("climaxCustomData").onsuccess = (e) => {
      if (e.target.result) {
        window.customClimaxData = e.target.result;
        if (!climaxAudioEl.src && window.customClimaxData.audioBlob) climaxAudioEl.src = URL.createObjectURL(window.customClimaxData.audioBlob);
      }
    };
  }

  function toggleAdminDrawer() { document.getElementById("admin-drawer").classList.toggle("open"); }

  function switchPage(pageName, albumId) {
    document.querySelectorAll(".page-view").forEach(el => el.classList.remove("active"));
    if (pageName === 'home') {
      document.getElementById("view-home").classList.add("active");
      currentActiveAlbumId = null;
      renderHomeAlbums();
    } else if (pageName === 'detail') {
      document.getElementById("view-detail").classList.add("active");
      currentActiveAlbumId = albumId;
      renderDetailView(albumId);
    }
  }

  function updateAlbumSelect() {
    const sel = document.getElementById("select-album");
    sel.innerHTML = '<option value="">-- 請選擇分區 --</option>';
    albums.forEach(a => {
      let opt = document.createElement("option");
      opt.value = a.id;
      opt.innerText = `${a.title} [${a.albumType === 'mp4' ? '動態影音MP4' : '純音訊MP3'}]`;
      sel.appendChild(opt);
    });
  }

  async function createAlbum() {
    const title = document.getElementById("album-title").value.trim();
    const albumType = document.getElementById("album-type").value;
    const coverInput = document.getElementById("album-covers");
    const bgInput = document.getElementById("album-bgs");
    if (!title) return alert("請填寫分區名稱！");

    let coverBlobs = [];
    if (albumType === 'mp3' && coverInput) for (let f of coverInput.files) coverBlobs.push(f);
    let bgBlobs = [];
    for (let f of bgInput.files) bgBlobs.push(f);

    const tx = db.transaction("albums", "readwrite");
    tx.objectStore("albums").add({ title, albumType, covers: coverBlobs, backgrounds: bgBlobs });
    tx.oncomplete = () => {
      document.getElementById("album-title").value = "";
      if(coverInput) coverInput.value = "";
      bgInput.value = "";
      loadData();
      alert("✅ 分區建立成功！");
    };
  }

  function renderHomeAlbums() {
    const listEl = document.getElementById("album-list");
    listEl.innerHTML = "";
    if (!albums.length) {
      listEl.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:20px;">尚無作品分區，請從管理選單建立。</div>';
      return;
    }

    albums.forEach(album => {
      let albumTracks = tracks.filter(t => t.albumId === album.id);
      if (album.albumType === 'mp4') {
        let ytThumbUrl = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='225'><rect width='100%' height='100%' fill='%231f1f2e'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23ff79c6' font-size='18' font-weight='bold'>YouTube 滿版影片專區</text></svg>";
        if (albumTracks.length > 0 && albumTracks[0].videoBlob) ytThumbUrl = createTrackedObjectURL(albumTracks[0].videoBlob);

        let ytCard = document.createElement("div");
        ytCard.className = "album-youtube-card";
        ytCard.innerHTML = `
          <div class="album-youtube-thumb-container">
            <video src="${ytThumbUrl}" muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>
            <div style="position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.7); padding:4px 8px; border-radius:6px; font-size:0.75rem; color:#ff79c6; font-weight:700;">▶ 點擊觀看滿版影片 (${albumTracks.length} 則)</div>
          </div>
          <div class="album-youtube-info">
            <div>
              <div style="font-size:1.1rem; font-weight:700; color:#fff; margin-bottom:4px;">${escapeHTML(album.title)}</div>
              <span class="album-badge badge-mp4">🌸 MP4 動態影音專區 (YouTube 風格)</span>
            </div>
            <div class="btn-action-col">
              <button class="btn-album-action" onclick="event.stopPropagation(); playTrackFromAlbum(${album.id}, 0)">播放</button>
              <button class="btn-album-del" onclick="event.stopPropagation(); deleteAlbum(${album.id})">刪除</button>
            </div>
          </div>
        `;
        ytCard.onclick = () => playTrackFromAlbum(album.id, 0);
        listEl.appendChild(ytCard);
      } else {
        let card = document.createElement("div");
        card.className = "album-grid-card";
        card.innerHTML = `
          <div class="album-grid-info">
            <div class="album-grid-title">${escapeHTML(album.title)}</div>
            <div class="album-grid-count">📁 篇章數量：${albumTracks.length} 則</div>
            <span class="album-badge badge-mp3">🎵 純音訊 MP3 專區</span>
          </div>
          <div class="btn-action-col">
            <button class="btn-album-action" onclick="event.stopPropagation(); switchPage('detail', ${album.id})">開啟</button>
            <button class="btn-album-del" onclick="event.stopPropagation(); deleteAlbum(${album.id})">刪除</button>
          </div>
        `;
        card.onclick = () => switchPage('detail', album.id);
        listEl.appendChild(card);
      }
    });
  }

  function deleteAlbum(id) {
    if (!confirm("確定要刪除此作品分區嗎？")) return;
    const tx = db.transaction(["albums", "tracks"], "readwrite");
    tx.objectStore("albums").delete(id);
    let indexStore = tx.objectStore("tracks");
    indexStore.getAll().onsuccess = (e) => { e.target.result.forEach(t => { if (t.albumId === id) indexStore.delete(t.id); }); };
    tx.oncomplete = () => { loadData(); alert("已刪除！"); };
  }

  function renderDetailView(albumId) {
    const album = albums.find(a => a.id === albumId);
    if (!album) return;
    document.getElementById("detail-album-title").innerText = `${album.title}`;
    const container = document.getElementById("chapter-list-container");
    container.innerHTML = "";
    let albumTracks = tracks.filter(t => t.albumId === albumId);

    if (!albumTracks.length) {
      container.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:20px;">此分區尚無篇章。</div>';
      return;
    }

    albumTracks.forEach((track, idx) => {
      let item = document.createElement("div");
      item.className = "chapter-file-item";
      item.innerHTML = `
        <div class="chapter-info-left" onclick="playTrackFromAlbum(${albumId}, ${idx})">
          <div class="play-icon-circle">▶</div>
          <div class="chapter-meta-text">
            <div class="chapter-name">${escapeHTML(track.title)}</div>
            <div class="chapter-duration-sub">${track.lrcText ? '🎵 已載入字幕' : '⚪ 無字幕'}</div>
          </div>
        </div>
      `;
      container.appendChild(item);
    });
  }

  function parseUniversalLyrics(rawText) {
    if (!rawText) return [];
    const lines = rawText.split('\n');
    const lyrics = [];
    const lrcTimeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
    for (let line of lines) {
      const match = lrcTimeReg.exec(line);
      if (match) {
        let time = parseInt(match[1]) * 60 + parseInt(match[2]) + parseInt(match[3].padEnd(3,'0')) / 1000;
        let text = line.replace(lrcTimeReg, '').trim();
        if (text) lyrics.push({ time, text });
      }
    }
    if (lyrics.length === 0) {
      lines.map(l => l.trim()).filter(l => l).forEach((text, i) => lyrics.push({ time: i * 4.0, text }));
    }
    return lyrics.sort((a, b) => a.time - b.time);
  }

  async function batchUploadAndPair() {
    const albumId = parseInt(document.getElementById("select-album").value);
    const audioInput = document.getElementById("batch-audios");
    const lrcInput = document.getElementById("batch-lrcs");
    if (!albumId) return alert("請先選擇目標作品分區！");
    if (!audioInput.files.length) return alert("請選取媒體檔案！");

    let audios = Array.from(audioInput.files);
    let lrcs = Array.from(lrcInput.files);
    let lrcMapData = [];
    for (let l of lrcs) {
      let text = await l.text();
      lrcMapData.push({ base: l.name.replace(/\.[^/.]+$/, "").trim(), text });
    }

    const album = albums.find(a => a.id === albumId);
    const isMp4 = album && album.albumType === 'mp4';
    const tx = db.transaction("tracks", "readwrite");
    const store = tx.objectStore("tracks");

    for (let mediaFile of audios) {
      let baseName = mediaFile.name.replace(/\.[^/.]+$/, "").trim();
      let matchedLrcText = "";
      let found = lrcMapData.find(item => item.base === baseName);
      if (found) matchedLrcText = found.text;

      let trackObj = { albumId, title: baseName, lrcText: matchedLrcText };
      if (isMp4) {
        trackObj.videoBlob = mediaFile;
        trackObj.audioBlob = mediaFile;
      } else {
        trackObj.audioBlob = mediaFile;
      }
      store.add(trackObj);
    }

    tx.oncomplete = () => { loadData(); alert("✅ 批量匯入成功！"); };
  }

  function playTrackFromAlbum(albumId, index) {
    const album = albums.find(a => a.id === albumId);
    if (!album) return;
    currentAlbumType = album.albumType || 'mp3';

    currentTrackList = tracks.filter(t => t.albumId === albumId);
    currentIndex = index;
    const track = currentTrackList[currentIndex];

    if (currentAlbumType === 'mp4') {
      document.getElementById("player-cover-box").style.display = "none";
      document.getElementById("lrc-box").style.display = "none";
      document.getElementById("video-player-box").style.display = "flex";
      document.getElementById("heart-toy").style.display = "block";
    } else {
      document.getElementById("video-player-box").style.display = "none";
      document.getElementById("heart-toy").style.display = "none";
      document.getElementById("player-cover-box").style.display = "flex";
      document.getElementById("lrc-box").style.display = "flex";
    }

    loadAndPlayCurrentTrack(track, album);
    expandPlayer();
  }

  function loadAndPlayCurrentTrack(track, album) {
    if (currentAlbumType === 'mp4') {
      if (track.videoBlob) mainVideoPlayer.src = createTrackedObjectURL(track.videoBlob);
      mainVideoPlayer.muted = true;
      mainVideoPlayer.loop = true;
      mainVideoPlayer.load();

      if (track.audioBlob) {
        audio.src = createTrackedObjectURL(track.audioBlob);
        audio.loop = false;
        audio.load();
      }

      audio.play().then(() => {
        mainVideoPlayer.play().catch(()=>{});
        document.getElementById("btn-play").innerText = "⏸";
        document.getElementById("mini-btn-play").innerText = "⏸";
      }).catch(e => console.log(e));

      initAudioAnalysis();
    } else {
      mainVideoPlayer.pause();
      audio.src = createTrackedObjectURL(track.audioBlob);
      audio.play().then(() => {
        document.getElementById("btn-play").innerText = "⏸";
        document.getElementById("mini-btn-play").innerText = "⏸";
      }).catch(e => console.log(e));
    }

    currentLrc = parseUniversalLyrics(track.lrcText);
    document.getElementById("mini-title").innerText = track.title;
    document.getElementById("mini-player").classList.remove("hidden");
  }

  audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    seekSlider.value = (audio.currentTime / audio.duration) * 100;
    document.getElementById("time-current").innerText = formatTime(audio.currentTime);
    document.getElementById("time-duration").innerText = formatTime(audio.duration);

    let currentText = getActiveSubtitleText(audio.currentTime);
    document.getElementById("video-subtitle-overlay").innerText = currentText;
    document.getElementById("lrc-box").innerText = currentText;
    document.getElementById("mini-lrc").innerText = currentText;
  });

  audio.addEventListener("ended", () => { if (!isClimaxState) nextTrack(); });

  function getActiveSubtitleText(currentTime) {
    if (!currentLrc.length) return "♪ 享受沉浸影音時光 ♪";
    let activeText = "♪ 享受沉浸影音時光 ♪";
    for (let i = 0; i < currentLrc.length; i++) {
      if (currentTime >= currentLrc[i].time) activeText = currentLrc[i].text;
      else break;
    }
    return activeText;
  }

  function togglePlay() {
    if (currentIndex === -1) return;
    if (currentAlbumType === 'mp4') initAudioAnalysis();
    if (audio.paused) {
      audio.play();
      if (currentAlbumType === 'mp4') mainVideoPlayer.play().catch(()=>{});
      document.getElementById("btn-play").innerText = "⏸";
      document.getElementById("mini-btn-play").innerText = "⏸";
    } else {
      audio.pause();
      if (currentAlbumType === 'mp4') mainVideoPlayer.pause();
      document.getElementById("btn-play").innerText = "▶";
      document.getElementById("mini-btn-play").innerText = "▶";
    }
  }

  function nextTrack() {
    if (currentIndex === -1 || !currentTrackList.length) return;
    currentIndex = (currentIndex + 1) % currentTrackList.length;
    loadAndPlayCurrentTrack(currentTrackList[currentIndex], albums.find(a => a.id === currentTrackList[currentIndex].albumId));
  }

  function prevTrack() {
    if (currentIndex === -1 || !currentTrackList.length) return;
    currentIndex = (currentIndex - 1 + currentTrackList.length) % currentTrackList.length;
    loadAndPlayCurrentTrack(currentTrackList[currentIndex], albums.find(a => a.id === currentTrackList[currentIndex].albumId));
  }

  function seekRelative(sec) { audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec)); }

  seekSlider.addEventListener("input", () => {
    if (!audio.duration) return;
    audio.currentTime = (seekSlider.value / 100) * audio.duration;
  });

  volumeSlider.addEventListener("input", () => {
    audio.volume = parseFloat(volumeSlider.value);
    climaxAudioEl.volume = audio.volume;
  });

  function expandPlayer() { playerCard.classList.remove("minimized"); miniPlayer.classList.add("hidden"); }
  function minimizePlayer() { playerCard.classList.add("minimized"); miniPlayer.classList.remove("hidden"); }

  function formatTime(sec) {
    let m = Math.floor(sec / 60);
    let s = Math.floor(sec % 60);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }
</script>
