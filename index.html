<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫 (影音獨立 YouTube 風格進化版)</title>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.45);
      --bg-dark: #07070a;
      --card-glass: rgba(16, 16, 22, 0.85);
      --card-glass-hover: rgba(24, 24, 34, 0.94);
      --text-main: #ffffff;
      --text-sub: #9494ab;
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-hover: rgba(255, 121, 198, 0.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; padding-bottom: 140px;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #bg-video, #bg-img {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; background-color: var(--bg-dark);
      z-index: -2; display: none; filter: brightness(0.7) blur(4px);
      transition: opacity 0.8s ease;
    }
    #bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(7,7,10,0.3) 0%, rgba(7,7,10,0.88) 100%);
      z-index: -1; pointer-events: none;
    }

    /* 共用 UI 樣式 (保留原版優化) */
    .container { width: 100%; max-width: 680px; z-index: 1; position: relative; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .app-logo { font-size: 1.4rem; font-weight: 800; color: var(--primary-pink); text-shadow: 0 0 20px var(--pink-glow); cursor: pointer; }
    .top-actions { display: flex; gap: 8px; }
    .btn-clean-mem, .btn-toggle-admin {
      padding: 10px 14px; border-radius: 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; backdrop-filter: blur(10px);
    }
    .btn-clean-mem { background: rgba(80, 250, 123, 0.15); border: 1px solid rgba(80, 250, 123, 0.4); color: #50fa7b; }
    .btn-toggle-admin { background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3); color: var(--primary-pink); }
    
    .admin-drawer { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; width: 100%; }
    .admin-drawer.open { max-height: 4500px; }
    
    .glass-card {
      background: var(--card-glass); backdrop-filter: blur(24px); border: 1px solid var(--border-glass);
      border-radius: 24px; padding: 20px; margin-bottom: 18px; box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; color: var(--primary-pink); display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; color: #fff; outline: none; transition: all 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary-pink); }
    input[type="file"]::file-selector-button {
      background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 8px 14px; border-radius: 10px; cursor: pointer; margin-right: 12px;
    }
    
    .btn-pink { width: 100%; background: linear-gradient(135deg, #ff79c6 0%, #ff52b2 100%); color: #07070a; border: none; padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; }
    .btn-blue { width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; border: none; padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; }
    .btn-green { width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; border: none; padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 6px; }

    .page-view { display: none; width: 100%; animation: fadeIn 0.2s ease; }
    .page-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* 清單樣式保留 */
    .album-grid-card, .album-youtube-card {
      background: var(--card-glass); backdrop-filter: blur(16px); border: 1px solid var(--border-glass);
      border-radius: 20px; margin-bottom: 16px; cursor: pointer; overflow: hidden; transition: all 0.2s;
    }
    .album-grid-card { display: flex; align-items: center; padding: 14px; }
    .album-youtube-card { display: block; }
    .album-grid-card:hover, .album-youtube-card:hover { border-color: var(--primary-pink); transform: translateY(-2px); }
    .album-grid-thumb { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; margin-right: 14px; }
    .album-youtube-thumb-container { width: 100%; height: 200px; background: #000; position: relative; }
    .album-youtube-info { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    .album-grid-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .album-grid-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .album-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.72rem; margin-top: 4px; }
    .badge-mp3 { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-mp4 { background: rgba(255, 121, 198, 0.2); color: var(--primary-pink); border: 1px solid rgba(255, 121, 198, 0.4); }
    .btn-action-col { display: flex; flex-direction: column; gap: 6px; }
    .btn-album-action, .btn-album-del { padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: 1px solid; }
    .btn-album-action { background: rgba(255, 121, 198, 0.12); color: var(--primary-pink); border-color: rgba(255, 121, 198, 0.3); }
    .btn-album-del { background: rgba(255, 85, 85, 0.1); color: #ff6b6b; border-color: rgba(255, 85, 85, 0.25); }

    .breadcrumb-bar { color: var(--primary-pink); font-weight: 700; margin-bottom: 14px; cursor: pointer; }
    .chapter-file-item {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 14px; margin-bottom: 8px;
    }
    .chapter-info-left { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; }
    .play-icon-circle { width: 36px; height: 36px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
    .chapter-name { color: #fff; font-weight: 700; font-size: 0.92rem; }
    .chapter-duration-sub { font-size: 0.78rem; color: var(--text-sub); }
    .btn-sm-edit, .btn-sm-del { padding: 5px 10px; border-radius: 9px; font-size: 0.78rem; cursor: pointer; border: 1px solid; background: transparent; }
    .btn-sm-edit { color: var(--primary-pink); border-color: rgba(255, 121, 198, 0.3); }
    .btn-sm-del { color: #ff6b6b; border-color: rgba(255,85,85,0.15); }

    /* =========================================
       🎵 MP3 專屬面板 (保持原樣，不動它)
       ========================================= */
    .player-card {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; width: 100%; 
      background: rgba(16, 16, 22, 0.98); backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-bottom: none; border-radius: 26px 26px 0 0;
      padding: 4px 18px 24px 18px; box-shadow: 0 -16px 50px rgba(0,0,0,0.85);
      z-index: 1000; transition: transform 0.25s ease;
    }
    .player-card.minimized { transform: translateY(110%); pointer-events: none; }
    .drag-handle-area { padding: 12px 0; display: flex; justify-content: center; cursor: grab; }
    .drag-handle { width: 50px; height: 5px; background: rgba(255, 255, 255, 0.45); border-radius: 10px; }
    .cover-box { 
      width: 100%; height: 240px; border-radius: 16px; overflow: hidden; background: #050508; 
      margin: 0 auto 10px auto; position: relative; display: flex; align-items: center; justify-content: center;
    }
    .cover-box img, .cover-box video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .lrc-box { text-align: center; font-size: 1.05rem; font-weight: 800; color: var(--primary-pink); min-height: 48px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .seek-slider { width: 100%; height: 6px; accent-color: var(--primary-pink); cursor: pointer; }
    .time-box { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-sub); margin-bottom: 10px; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.25rem; cursor: pointer; }
    .btn-play-main { width: 48px; height: 48px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; height: 64px;
      background: rgba(16, 16, 22, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; padding: 0 14px; z-index: 999; cursor: pointer; transition: transform 0.25s ease;
    }
    .mini-player.hidden { transform: translateY(100%); pointer-events: none; }
    .mini-thumb { width: 42px; height: 42px; border-radius: 10px; margin-right: 10px; object-fit: cover; }
    .mini-info { flex: 1; overflow: hidden; }
    .mini-title { font-size: 0.88rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-subtitle { font-size: 0.75rem; color: var(--primary-pink); }
    .bottom-tools { display: flex; gap: 8px; margin-top: 10px; }
    .btn-pip { flex: 1; background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.3); color: var(--primary-pink); padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.82rem; cursor: pointer; }

    /* =========================================
       🎬 影音獨立 YouTube 風格全螢幕專區 (全新)
       ========================================= */
    #yt-video-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 999999; display: none; flex-direction: column;
    }
    .yt-video-container {
      flex: 1; width: 100%; position: relative; display: flex; align-items: center; justify-content: center; background: #000;
    }
    /* 強制填滿畫面，包含 iOS 橫向 */
    #yt-video-player {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
    }
    
    /* 頂部控制列 (關閉按鈕) */
    .yt-top-bar {
      position: absolute; top: 0; left: 0; right: 0; padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      z-index: 100; display: flex; justify-content: space-between; align-items: center;
      transition: opacity 0.3s;
    }
    .yt-close-btn {
      background: rgba(255,255,255,0.2); border: none; color: #fff; width: 36px; height: 36px;
      border-radius: 50%; font-size: 1.2rem; cursor: pointer; backdrop-filter: blur(4px);
    }
    
    /* 底部控制列 */
    .yt-bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 20px 20px 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 100; transition: opacity 0.3s;
    }
    .yt-subtitle {
      text-align: center; font-size: 1.5rem; font-weight: 800; color: var(--primary-pink);
      text-shadow: 0 2px 8px rgba(0,0,0,1); margin-bottom: 20px;
    }
    .yt-controls-row {
      display: flex; align-items: center; gap: 16px;
    }
    .yt-play-btn {
      background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer;
    }
    .yt-progress-container {
      flex: 1; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: #ddd; font-family: monospace;
    }
    .yt-seek-slider { flex: 1; accent-color: var(--primary-pink); cursor: pointer; }
    .yt-fullscreen-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

    /* 獨立愛心系統 */
    .yt-heart-container {
      position: absolute; top: 20px; right: 20px; width: 50px; height: 50px;
      z-index: 100; cursor: pointer; filter: drop-shadow(0 0 8px rgba(255, 121, 198, 0.8));
    }
    .yt-heart-container:active { transform: scale(1.2); }
    .heart-svg { width: 100%; height: 100%; overflow: visible; }
    .heart-bg { fill: rgba(10, 10, 16, 0.45); stroke: #ff79c6; stroke-width: 2.2; }
    .heart-fill { fill: url(#heart-gradient); }
    .heart-full-beat { animation: heartFullBeat 0.45s infinite alternate ease-in-out; }
    .climax-shake { animation: climaxPinkGlowShake 0.4s infinite alternate ease-in-out; }
    #yt-climax-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 90; display: none; }

    @keyframes heartFullBeat { 0% { transform: scale(1); filter: drop-shadow(0 0 10px #ff79c6); } 100% { transform: scale(1.35); filter: drop-shadow(0 0 25px #ff1493); } }
    @keyframes climaxPinkGlowShake { 0% { transform: translate(1px, 1px); } 33% { transform: translate(-2px, -2px); } 66% { transform: translate(-1px, 2px); } 100% { transform: translate(2px, -1px); box-shadow: inset 0 0 80px rgba(255, 20, 147, 0.8); } }
  </style>
</head>
<body>

<!-- 背景與主要內容 (保持原樣) -->
<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img">
<div id="bg-overlay"></div>

<div class="container">
  <div class="top-bar">
    <div class="app-logo" onclick="switchPage('home')">🌸 ASMR 隨身庫</div>
    <div class="top-actions">
      <button class="btn-clean-mem" onclick="cleanMemoryAndGC()">⚡ 清理記憶體</button>
      <button class="btn-toggle-admin" onclick="toggleAdminDrawer()">⚙️ 管理</button>
    </div>
  </div>

  <div id="admin-drawer" class="admin-drawer">
    <!-- 管理選單保留原版內容 (為簡潔已隱藏部分細節，核心功能保留) -->
    <div class="glass-card">
      <div class="card-title">🎀 高潮特效設定</div>
      <div class="form-group"><label>特效圖片</label><input type="file" id="climax-img-input" accept="image/*"></div>
      <div class="form-group"><label>特效音效</label><input type="file" id="climax-audio-input" accept="audio/*"></div>
      <button class="btn-pink" onclick="saveClimaxSettings()">儲存</button>
    </div>
    <div class="glass-card">
      <div class="card-title">📁 建立作品分區</div>
      <div class="form-group"><input type="text" id="album-title" placeholder="分區名稱"></div>
      <div class="form-group">
        <select id="album-type" onchange="onAlbumTypeChange()">
          <option value="mp3">🎵 純音訊 MP3</option>
          <option value="mp4">🌸 動態影音 MP4 (獨立影片專區)</option>
        </select>
      </div>
      <div class="form-group" id="group-album-covers"><label>封面</label><input type="file" id="album-covers" multiple></div>
      <button class="btn-pink" onclick="createAlbum()">建立</button>
    </div>
    <div class="glass-card">
      <div class="card-title">⚡ 新增單一篇章</div>
      <div class="form-group"><select id="select-album"></select></div>
      <div class="form-group"><input type="text" id="track-title-input" placeholder="篇章名稱"></div>
      <div class="form-group"><label id="track-audio-label">主媒體</label><input type="file" id="track-audio"></div>
      <div class="form-group" id="group-track-extra-audio"><label>MP4 專區主音源(必填)</label><input type="file" id="track-extra-audio" accept="audio/*"></div>
      <div class="form-group"><label>字幕</label><input type="file" id="track-lrc" accept=".lrc,.vtt,.srt,.txt"></div>
      <button class="btn-pink" onclick="addTrack()">新增</button>
    </div>
  </div>

  <div id="view-home" class="page-view active">
    <div class="glass-card">
      <div class="card-title">📚 選擇作品集</div>
      <div id="album-list"></div>
      <div id="pagination-container"></div>
    </div>
  </div>

  <div id="view-detail" class="page-view">
    <div class="glass-card">
      <div class="breadcrumb-bar" onclick="switchPage('home')">⬅ ROOT / <span id="detail-album-title"></span></div>
      <div id="chapter-list-container"></div>
    </div>
  </div>
</div>

<!-- =========================================
     🎵 舊版 MP3 專屬面板 (保留給 MP3 使用) 
     ========================================= -->
<div id="mini-player" class="mini-player hidden" onclick="expandPlayer()">
  <img id="mini-thumb" class="mini-thumb" src="">
  <div class="mini-info">
    <div id="mini-title" class="mini-title">未選擇</div>
    <div id="mini-lrc" class="mini-subtitle">♪ 點擊展開</div>
  </div>
  <button class="mini-btn" onclick="event.stopPropagation(); togglePlayMp3();" id="mini-btn-play">▶</button>
</div>

<div id="player-card" class="player-card minimized">
  <div class="drag-handle-area" id="drag-handle-area"><div class="drag-handle"></div></div>
  <div class="cover-box" id="player-cover-box"></div>
  <div id="lrc-box" class="lrc-box">♪ MP3 模式 ♪</div>
  <input type="range" id="seek-slider-mp3" class="seek-slider" value="0" min="0" max="100" step="0.1">
  <div class="time-box"><span id="time-current-mp3">00:00</span><span id="time-duration-mp3">00:00</span></div>
  <div class="controls">
    <button class="btn-ctrl" onclick="prevTrack()">⏮</button>
    <button class="btn-ctrl btn-play-main" id="btn-play-mp3" onclick="togglePlayMp3()">▶</button>
    <button class="btn-ctrl" onclick="nextTrack()">⏭</button>
  </div>
</div>

<!-- =========================================
     🎬 全新 YouTube 風格獨立影音專區 (MP4) 
     ========================================= -->
<div id="yt-video-modal">
  <div class="yt-video-container" id="yt-video-container-inner">
    <!-- 影片完全靜音、無限循環，聲音由 audio 標籤提供 -->
    <video id="yt-video-player" playsinline webkit-playsinline muted loop></video>
    
    <!-- 獨立高潮特效圖 -->
    <img id="yt-climax-overlay">
    
    <!-- 獨立愛心系統 -->
    <div class="yt-heart-container" id="yt-heart-toy" onclick="triggerInstantOrgasm()">
      <svg class="heart-svg" viewBox="0 0 32 32">
        <defs>
          <linearGradient id="heart-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#ff1493" /><stop offset="100%" stop-color="#ff79c6" />
          </linearGradient>
          <clipPath id="heart-clip"><rect id="heart-clip-rect" x="0" y="32" width="32" height="0" /></clipPath>
        </defs>
        <path class="heart-bg" d="M16 28.5 C16 28.5 3 19 3 10.5 C3 6 6.5 2.5 11 2.5 C13.8 2.5 15.3 3.8 16 5 C16.7 3.8 18.2 2.5 21 2.5 C25.5 2.5 29 6 29 10.5 C29 19 16 28.5 16 28.5 Z" />
        <path class="heart-fill" clip-path="url(#heart-clip)" d="M16 28.5 C16 28.5 3 19 3 10.5 C3 6 6.5 2.5 11 2.5 C13.8 2.5 15.3 3.8 16 5 C16.7 3.8 18.2 2.5 21 2.5 C25.5 2.5 29 6 29 10.5 C29 19 16 28.5 16 28.5 Z" />
      </svg>
    </div>
    
    <!-- 頂部控制列 -->
    <div class="yt-top-bar" id="yt-top-bar">
      <button class="yt-close-btn" onclick="closeVideoModal()">✕</button>
      <div style="color: #fff; font-weight: bold; text-shadow: 0 1px 4px #000;" id="yt-title-text"></div>
      <div style="width:36px;"></div> <!-- 排版平衡用 -->
    </div>
    
    <!-- 底部控制列 -->
    <div class="yt-bottom-bar" id="yt-bottom-bar">
      <div class="yt-subtitle" id="yt-subtitle-text">♪ 享受沉浸影音 ♪</div>
      <div class="yt-controls-row">
        <button class="yt-play-btn" id="yt-btn-play" onclick="togglePlayVideo()">▶</button>
        <div class="yt-progress-container">
          <span id="yt-time-current">00:00</span>
          <input type="range" id="yt-seek-slider" class="yt-seek-slider" value="0" min="0" max="100" step="0.1">
          <span id="yt-time-duration">00:00</span>
        </div>
        <button class="yt-fullscreen-btn" onclick="toggleVideoFullScreen()">🔲</button>
      </div>
    </div>
  </div>
</div>

<audio id="main-audio" crossorigin="anonymous" playsinline preload="auto"></audio>
<audio id="climax-audio-el" crossorigin="anonymous" playsinline preload="auto"></audio>

<script>
  let db;
  let albums = [], tracks = [], currentTrackList = [], currentLrc = [];
  let currentIndex = -1, currentAlbumType = 'mp3';
  let activeCreatedUrls = [];
  
  // 獨立影音層參數
  let uiTimeout = null;
  let heartFillPercent = 0;
  let isClimaxState = false;
  let climaxResetTimer = null;
  
  // 音訊分析 (保留給高潮使用)
  let audioCtx, analyser, lastAudioAnalyzeTime = 0;
  const AUDIO_INTERVAL = 1000 / 25;

  const audio = document.getElementById("main-audio");
  const climaxAudioEl = document.getElementById("climax-audio-el");
  
  // MP3 專區元素
  const playerCard = document.getElementById("player-card");
  const miniPlayer = document.getElementById("mini-player");
  const seekSliderMp3 = document.getElementById("seek-slider-mp3");
  
  // MP4 (YouTube 風格) 專區元素
  const ytVideoModal = document.getElementById("yt-video-modal");
  const ytVideoPlayer = document.getElementById("yt-video-player");
  const ytSeekSlider = document.getElementById("yt-seek-slider");

  // 初始化資料庫
  const request = indexedDB.open("ASMR_DB_V40", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("albums")) db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
  };
  request.onsuccess = (e) => { db = e.target.result; loadData(); };

  function loadData() {
    if (!db) return;
    const tx = db.transaction(["albums", "tracks", "settings"], "readonly");
    tx.objectStore("albums").getAll().onsuccess = (e) => { albums = e.target.result; updateAlbumSelect(); renderHomeAlbums(); };
    tx.objectStore("tracks").getAll().onsuccess = (e) => { tracks = e.target.result; };
    tx.objectStore("settings").get("climaxCustomData").onsuccess = (e) => {
      if (e.target.result) window.customClimaxData = e.target.result;
    };
  }

  function createTrackedObjectURL(blob) {
    if (!blob) return "";
    const url = URL.createObjectURL(blob);
    activeCreatedUrls.push(url);
    return url;
  }

  function cleanMemoryAndGC() {
    activeCreatedUrls.forEach(url => { try { URL.revokeObjectURL(url); } catch(e){} });
    activeCreatedUrls = []; alert("已清理！");
  }

  function toggleAdminDrawer() { document.getElementById("admin-drawer").classList.toggle("open"); }
  function switchPage(page) {
    document.querySelectorAll(".page-view").forEach(el => el.classList.remove("active"));
    document.getElementById("view-" + page).classList.add("active");
  }
  function updateAlbumSelect() {
    const sel = document.getElementById("select-album");
    sel.innerHTML = '<option value="">-- 選擇分區 --</option>';
    albums.forEach(a => sel.innerHTML += `<option value="${a.id}">${a.title}</option>`);
  }
  
  // 建立專輯與章節 (簡化保留核心邏輯)
  function onAlbumTypeChange() {
    const type = document.getElementById("album-type").value;
    document.getElementById("group-album-covers").style.display = type === 'mp3' ? 'block' : 'none';
    document.getElementById("group-track-extra-audio").style.display = type === 'mp4' ? 'block' : 'none';
  }
  
  function createAlbum() {
    const title = document.getElementById("album-title").value.trim();
    const type = document.getElementById("album-type").value;
    const tx = db.transaction("albums", "readwrite");
    tx.objectStore("albums").add({ title, albumType: type, covers: [] });
    tx.oncomplete = () => { loadData(); alert("分區建立成功！"); };
  }

  function addTrack() {
    const albumId = parseInt(document.getElementById("select-album").value);
    const audioInput = document.getElementById("track-audio");
    const extraInput = document.getElementById("track-extra-audio");
    if (!audioInput.files.length) return alert("選擇檔案！");
    
    let trackData = { albumId, title: "篇章", lrcText: "" };
    const album = albums.find(a => a.id === albumId);
    if (album.albumType === 'mp4') {
      trackData.videoBlob = audioInput.files[0];
      trackData.audioBlob = extraInput.files[0] || audioInput.files[0]; // MP4 用音檔主導
    } else {
      trackData.audioBlob = audioInput.files[0];
    }
    const tx = db.transaction("tracks", "readwrite");
    tx.objectStore("tracks").add(trackData);
    tx.oncomplete = () => { loadData(); alert("篇章新增成功！"); };
  }

  function renderHomeAlbums() {
    const list = document.getElementById("album-list");
    list.innerHTML = "";
    albums.forEach(album => {
      let div = document.createElement("div");
      div.className = album.albumType === 'mp4' ? 'album-youtube-card' : 'album-grid-card';
      let title = `<div style="padding:15px; font-weight:bold; color:white;">${album.title} [${album.albumType === 'mp4'?'獨立影片':'MP3'}]</div>`;
      div.innerHTML = title;
      div.onclick = () => {
        let t = tracks.filter(tr => tr.albumId === album.id);
        if(t.length) playTrackFromAlbum(album.id, 0);
      };
      list.appendChild(div);
    });
  }

  // =========================================
  // 🎵 & 🎬 核心播放邏輯分流
  // =========================================
  function playTrackFromAlbum(albumId, index) {
    const album = albums.find(a => a.id === albumId);
    currentTrackList = tracks.filter(t => t.albumId === albumId);
    currentIndex = index;
    currentAlbumType = album.albumType || 'mp3';
    
    const track = currentTrackList[currentIndex];
    
    if (currentAlbumType === 'mp4') {
      // 隱藏 MP3 播放器
      playerCard.classList.add("minimized");
      miniPlayer.classList.add("hidden");
      
      // 開啟獨立影片介面
      openVideoModal(track);
    } else {
      // 隱藏影片介面
      closeVideoModal(false);
      
      // 開啟 MP3 介面
      document.getElementById("mini-title").innerText = track.title;
      miniPlayer.classList.remove("hidden");
      expandPlayer();
      
      audio.src = createTrackedObjectURL(track.audioBlob);
      audio.play();
      document.getElementById("btn-play-mp3").innerText = "⏸";
    }
  }

  // =========================================
  // 🎬 YouTube 風格影片專區專屬邏輯
  // =========================================
  function openVideoModal(track) {
    ytVideoModal.style.display = 'flex';
    document.getElementById("yt-title-text").innerText = track.title;
    
    // 設置影片 (靜音、循環)
    ytVideoPlayer.src = createTrackedObjectURL(track.videoBlob);
    ytVideoPlayer.muted = true;
    ytVideoPlayer.loop = true;
    
    // 設置主聲音來源 (負責控制時間與進度)
    audio.src = createTrackedObjectURL(track.audioBlob);
    audio.play().then(() => {
      ytVideoPlayer.play();
      document.getElementById("yt-btn-play").innerText = "⏸";
    });
    
    initAudioAnalysis();
    resetVideoUIHideTimer();
  }
  
  function closeVideoModal(pauseAudio = true) {
    ytVideoModal.style.display = 'none';
    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    if (pauseAudio) {
      audio.pause();
      ytVideoPlayer.pause();
    }
  }

  function togglePlayVideo() {
    if (isClimaxState) return; 
    if (audio.paused) {
      audio.play();
      ytVideoPlayer.play();
      document.getElementById("yt-btn-play").innerText = "⏸";
    } else {
      audio.pause();
      ytVideoPlayer.pause();
      document.getElementById("yt-btn-play").innerText = "▶";
    }
  }
  
  function togglePlayMp3() {
    if (audio.paused) { audio.play(); document.getElementById("btn-play-mp3").innerText = "⏸"; } 
    else { audio.pause(); document.getElementById("btn-play-mp3").innerText = "▶"; }
  }

  // iOS 滿版全螢幕邏輯 (利用容器 Fullscreen API 或靠橫向螢幕)
  function toggleVideoFullScreen() {
    const container = document.getElementById("yt-video-container-inner");
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (container.requestFullscreen) {
        container.requestFullscreen().catch(err => alert("全螢幕失敗:"+err.message));
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen(); // Safari
      }
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  // UI 互動自動隱藏 (仿 YouTube)
  ytVideoModal.addEventListener('mousemove', resetVideoUIHideTimer);
  ytVideoModal.addEventListener('touchstart', resetVideoUIHideTimer);
  function resetVideoUIHideTimer() {
    document.getElementById("yt-top-bar").style.opacity = '1';
    document.getElementById("yt-bottom-bar").style.opacity = '1';
    if (uiTimeout) clearTimeout(uiTimeout);
    uiTimeout = setTimeout(() => {
      if (!audio.paused) {
        document.getElementById("yt-top-bar").style.opacity = '0';
        document.getElementById("yt-bottom-bar").style.opacity = '0';
      }
    }, 3000);
  }

  // 時間同步與進度條綁定
  audio.addEventListener("timeupdate", () => {
    let pct = (audio.currentTime / (audio.duration || 1)) * 100;
    
    // MP4 更新
    if (currentAlbumType === 'mp4') {
      ytSeekSlider.value = pct;
      document.getElementById("yt-time-current").innerText = formatTime(audio.currentTime);
      document.getElementById("yt-time-duration").innerText = formatTime(audio.duration);
      // 維持影片與音檔同步 (防止影片因為效能落後)
      if (Math.abs(ytVideoPlayer.currentTime - (audio.currentTime % (ytVideoPlayer.duration || 1))) > 0.5) {
        try { ytVideoPlayer.currentTime = audio.currentTime % (ytVideoPlayer.duration || 1); } catch(e){}
      }
    } 
    // MP3 更新
    else {
      seekSliderMp3.value = pct;
      document.getElementById("time-current-mp3").innerText = formatTime(audio.currentTime);
      document.getElementById("time-duration-mp3").innerText = formatTime(audio.duration);
    }
  });

  ytSeekSlider.addEventListener("input", () => {
    audio.currentTime = (ytSeekSlider.value / 100) * audio.duration;
  });
  seekSliderMp3.addEventListener("input", () => {
    audio.currentTime = (seekSliderMp3.value / 100) * audio.duration;
  });

  // =========================================
  // 💖 高潮特效系統 (完全綁定 MP4 專區)
  // =========================================
  function initAudioAnalysis() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
      let src = audioCtx.createMediaElementSource(audio);
      src.connect(analyser); analyser.connect(audioCtx.destination);
      let clSrc = audioCtx.createMediaElementSource(climaxAudioEl);
      clSrc.connect(audioCtx.destination);
      requestAnimationFrame(analyzeAudioFrame);
    } catch(e) {}
  }
  
  function analyzeAudioFrame(t) {
    requestAnimationFrame(analyzeAudioFrame);
    if (currentAlbumType !== 'mp4' || t - lastAudioAnalyzeTime < AUDIO_INTERVAL || audio.paused || isClimaxState) return;
    lastAudioAnalyzeTime = t;
    
    let data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    let avg = data.reduce((a,b)=>a+b)/data.length;
    
    if (avg > 8) heartFillPercent += (0.12 * (avg / 50));
    if (heartFillPercent >= 100) triggerInstantOrgasm();
    
    const clip = document.getElementById("heart-clip-rect");
    if (clip) clip.setAttribute("y", 32 - ((heartFillPercent/100)*32));
  }

  function triggerInstantOrgasm() {
    if (isClimaxState || currentAlbumType !== 'mp4') return;
    isClimaxState = true; heartFillPercent = 100;
    
    document.getElementById("yt-heart-toy").classList.add("heart-full-beat");
    ytVideoPlayer.classList.add("climax-shake");
    
    if (window.customClimaxData) {
      const overlay = document.getElementById("yt-climax-overlay");
      overlay.src = URL.createObjectURL(window.customClimaxData.imgBlob);
      overlay.style.display = "block";
      climaxAudioEl.src = URL.createObjectURL(window.customClimaxData.audioBlob);
      
      audio.pause(); ytVideoPlayer.pause(); // 暫停主體
      
      climaxAudioEl.play();
      climaxAudioEl.onended = endClimax;
    } else {
      setTimeout(endClimax, 5000);
    }
  }

  function endClimax() {
    isClimaxState = false; heartFillPercent = 0;
    document.getElementById("yt-heart-toy").classList.remove("heart-full-beat");
    ytVideoPlayer.classList.remove("climax-shake");
    document.getElementById("yt-climax-overlay").style.display = "none";
    
    // 恢復播放
    audio.play(); ytVideoPlayer.play();
  }

  function formatTime(sec) {
    if (isNaN(sec)) return "00:00";
    let m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }
  
  function expandPlayer() { playerCard.classList.remove("minimized"); }
</script>
</body>
</html>
