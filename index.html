<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫 (極速省電優化版)</title>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.2);
      --bg-dark: #07070a;
      --card-glass: rgba(16, 16, 22, 0.95);
      --card-glass-hover: rgba(24, 24, 34, 0.98);
      --text-main: #ffffff;
      --text-sub: #9494ab;
      --border-glass: rgba(255, 255, 255, 0.1);
      --border-glass-hover: rgba(255, 121, 198, 0.4);
    }
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
      /* 關閉平滑滾動，降低動畫造成的硬體發燙 */
      scroll-behavior: auto !important; 
    }
    body {
      margin: 0; padding: 16px; padding-bottom: 130px;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, "PingFang TC", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
      /* 避免整體頁面滾動時頻繁重繪 */
      contain: layout style;
    }

    /* 背景素材：使用 transform 強制啟動獨立合成層，減少重排發燙 */
    #bg-video, #bg-img {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; background-color: var(--bg-dark);
      z-index: -2; display: none; filter: brightness(0.6);
      transform: translateZ(0); will-change: transform;
      contain: strict;
    }
    @media (max-width: 768px) {
      #bg-video, #bg-img {
        top: -10vh; left: -10vw; width: 120vw; height: 120vh;
      }
    }

    #bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(7,7,10,0.75);
      z-index: -1; pointer-events: none;
    }

    .container { width: 100%; max-width: 680px; z-index: 1; position: relative; }
    .top-bar { width: 100%; max-width: 680px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; z-index: 10; }
    .app-logo { font-size: 1.4rem; font-weight: 800; color: var(--primary-pink); cursor: pointer; letter-spacing: 0.5px; }
    
    .btn-toggle-admin {
      background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 10px 18px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }

    .admin-drawer { max-height: 0; overflow: hidden; transition: max-height 0.25s ease-out; width: 100%; }
    .admin-drawer.open { max-height: 3000px; }

    .glass-card {
      background: var(--card-glass);
      border: 1px solid var(--border-glass); border-radius: 20px; padding: 18px; margin-bottom: 16px;
      contain: content; /* 隔離卡片內部的渲染變動 */
    }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; color: var(--primary-pink); display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none;
    }
    
    input[type="file"] { padding: 8px; color: var(--text-sub); font-size: 0.85rem; cursor: pointer; }
    input[type="file"]::file-selector-button {
      background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-right: 12px;
    }

    .btn-pink {
      width: 100%; background: var(--primary-pink); color: #07070a; border: none;
      padding: 13px; font-weight: 700; border-radius: 12px; cursor: pointer; margin-top: 6px; font-size: 1rem;
    }

    .btn-blue {
      width: 100%; background: #3b82f6; color: #ffffff; border: none;
      padding: 13px; font-weight: 700; border-radius: 12px; cursor: pointer; margin-top: 6px; font-size: 1rem;
    }

    .page-view { display: none; width: 100%; }
    .page-view.active { display: block; }

    .album-grid-card {
      background: var(--card-glass); border: 1px solid var(--border-glass); border-radius: 18px; 
      padding: 12px; margin-bottom: 12px; display: flex; align-items: center; cursor: pointer;
      contain: content;
    }
    .album-grid-thumb { width: 70px; height: 70px; border-radius: 12px; object-fit: cover; margin-right: 12px; flex-shrink: 0; background: #121218; }
    .album-grid-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .album-grid-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .album-grid-count { font-size: 0.82rem; color: var(--primary-pink); font-weight: 600; }
    
    .btn-action-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .btn-album-action {
      background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 5px 10px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    .btn-album-del {
      background: rgba(255, 85, 85, 0.1); border: 1px solid rgba(255, 85, 85, 0.25);
      color: #ff6b6b; padding: 5px 10px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }

    .breadcrumb-bar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 0.95rem; font-weight: 700;
      color: var(--primary-pink); cursor: pointer;
    }

    .chapter-file-list { display: flex; flex-direction: column; gap: 8px; }
    .chapter-file-item {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); border-radius: 12px; cursor: pointer;
      contain: content;
    }
    .chapter-info-left { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; margin-right: 10px; }
    .play-icon-circle {
      width: 32px; height: 32px; background: #3b82f6; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.85rem; flex-shrink: 0;
    }
    .chapter-meta-text { overflow: hidden; }
    .chapter-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; margin-bottom: 2px; color: #fff; font-size: 0.9rem; }
    .chapter-duration-sub { font-size: 0.75rem; color: var(--text-sub); }

    .btn-action-group { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-sm { padding: 4px 8px; border-radius: 8px; border: none; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .btn-sm-edit { background: rgba(255, 121, 198, 0.15); color: var(--primary-pink); border: 1px solid rgba(255, 121, 198, 0.3); }
    .btn-sm-del { background: rgba(255,255,255,0.06); color: #ff6b6b; border: 1px solid rgba(255,85,85,0.15); }

    .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .btn-page {
      background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3); color: var(--primary-pink);
      padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
    }
    .btn-page:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-info { font-size: 0.85rem; color: var(--text-sub); }

    /* 播放器卡片：關閉模糊特效，使用硬體加速位移 */
    .player-card {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; width: 100%; 
      max-height: 90vh; height: auto; overflow-y: auto; overflow-x: hidden;
      background: #0d0d12;
      border: 1px solid rgba(255, 255, 255, 0.15); border-bottom: none; border-radius: 22px 22px 0 0;
      padding: 4px 18px 24px 18px; z-index: 1000; 
      transition: transform 0.25s ease-out;
      transform: translateZ(0); will-change: transform;
      contain: layout style;
    }
    .player-card.minimized { transform: translateY(105%); }

    .drag-handle-area { width: 100%; padding: 8px 0 10px 0; display: flex; justify-content: center; cursor: grab; }
    .drag-handle { width: 45px; height: 4px; background: rgba(255, 255, 255, 0.3); border-radius: 10px; }

    .cover-box { 
      width: 100%; height: 240px; border-radius: 14px; 
      overflow: hidden; background: #050508; margin: 0 auto 10px auto; 
      position: relative; display: flex; align-items: center; justify-content: center;
      contain: strict;
    }
    .cover-box img { 
      max-width: 85%; max-height: 85%; width: auto; height: auto; 
      object-fit: contain; display: none; position: absolute; 
      top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 8px;
    }
    .cover-box video { 
      width: 100%; height: 100%; object-fit: cover; display: none; 
      position: absolute; top: 0; left: 0; border-radius: 12px;
    }

    .btn-cover-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 0.9rem; z-index: 10;
    }
    .cover-prev { left: 10px; }
    .cover-next { right: 10px; }
    .cover-indicator {
      position: absolute; bottom: 10px; right: 12px; background: rgba(0, 0, 0, 0.7);
      padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; color: #fff; z-index: 10;
    }
    
    .album-tag { font-size: 0.8rem; color: var(--text-sub); text-align: center; margin-bottom: 4px; }
    
    .lrc-box {
      min-height: 44px; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 1.05rem; font-weight: 800; color: var(--primary-pink);
      padding: 2px 8px; line-height: 1.3; margin-bottom: 8px;
    }

    .sub-quick-tools { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
    .btn-sub-quick {
      padding: 5px 10px; background: rgba(255, 121, 198, 0.12); border: 1px solid rgba(255, 121, 198, 0.25);
      color: var(--primary-pink); border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }

    .seek-slider { width: 100%; height: 5px; accent-color: var(--primary-pink); cursor: pointer; border-radius: 3px; background: rgba(255,255,255,0.15); }
    .time-box { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; margin-bottom: 8px; }
    
    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; padding: 6px; }
    .btn-play-main {
      width: 46px; height: 46px; background: #ffffff; color: #07070a; border-radius: 50%;
      font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
    }

    .volume-box { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 10px; }
    .volume-slider { flex: 1; height: 4px; accent-color: var(--text-sub); cursor: pointer; }
    .btn-mute { background: none; border: none; color: var(--text-sub); font-size: 1rem; cursor: pointer; }

    .bottom-tools { display: flex; gap: 8px; }
    .btn-pip {
      flex: 1; background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.3);
      color: var(--primary-pink); padding: 9px; border-radius: 10px; font-weight: 700; font-size: 0.8rem; cursor: pointer; text-align: center;
    }

    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; height: 60px;
      background: #0d0d12; border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: flex; align-items: center; padding: 0 14px; z-index: 999; cursor: pointer;
      transition: transform 0.25s ease-out; transform: translateZ(0); will-change: transform;
    }
    .mini-player.hidden { transform: translateY(100%); }
    .mini-thumb { width: 40px; height: 40px; border-radius: 8px; background: #121218; object-fit: contain; margin-right: 10px; flex-shrink: 0; }
    .mini-info { flex: 1; overflow: hidden; margin-right: 10px; }
    .mini-title { font-size: 0.85rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-subtitle { font-size: 0.72rem; color: var(--primary-pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-btn { background: none; border: none; color: #fff; font-size: 1.1rem; padding: 6px; cursor: pointer; }
  </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img" alt="全域背景">
<div id="bg-overlay"></div>

<div class="container">
  <div class="top-bar">
    <div class="app-logo" onclick="switchPage('home')">🌸 ASMR 隨身庫</div>
    <button class="btn-toggle-admin" onclick="toggleAdminDrawer()">⚙️ 管理選單</button>
  </div>

  <div id="admin-drawer" class="admin-drawer">
    <div class="glass-card" style="border: 1px solid rgba(59, 130, 246, 0.4); background: rgba(16, 24, 39, 0.95);">
      <div class="card-title" style="color: #60a5fa;">🔄 跨裝置資料互通 (電腦 ⇄ 手機同步)</div>
      <div style="font-size:0.82rem; color:var(--text-sub); margin-bottom:12px;">
        點擊「匯出備份檔案」會下載 `.json` 檔案。傳到另一台裝置後點擊「匯入備份檔案」即可同步。
      </div>
      <button class="btn-blue" onclick="exportDataBackup()">📤 1. 匯出備份檔案 (電腦/手機)</button>
      <div class="form-group" style="margin-top: 12px;">
        <label>📥 2. 匯入備份檔案 (接收端裝置)</label>
        <input type="file" id="import-backup-input" accept=".json" onchange="importDataBackup(event)">
      </div>
    </div>

    <div class="glass-card">
      <div class="card-title">🖼️ 設定預設全域背景</div>
      <div class="form-group"><label>選取圖片或影片</label><input type="file" id="global-bg-input" accept="image/*,video/*" multiple></div>
      <button class="btn-pink" onclick="saveGlobalBackgrounds()">儲存全域背景素材</button>
    </div>
    <div class="glass-card">
      <div class="card-title">📁 建立作品分區</div>
      <div class="form-group"><label>作品分區名稱</label><input type="text" id="album-title" placeholder="例如：系列名稱"></div>
      <div class="form-group"><label>封面素材</label><input type="file" id="album-covers" accept="image/*,video/*" multiple></div>
      <div class="form-group"><label>此分區專屬背景</label><input type="file" id="album-bgs" accept="image/*,video/*" multiple></div>
      <button class="btn-pink" onclick="createAlbum()">建立分區</button>
    </div>
    <div class="glass-card">
      <div class="card-title">🎵 匯入篇章至分區</div>
      <div class="form-group"><label>選擇作品分區</label><select id="select-album"><option value="">-- 請先建立分區 --</option></select></div>
      <div class="form-group"><label>篇章名稱</label><input type="text" id="track-title-input" placeholder="例如：01_開場"></div>
      <div class="form-group"><label>音訊檔案</label><input type="file" id="track-audio"></div>
      <div class="form-group"><label>字幕檔案 (.lrc / .srt / .vtt / .txt)</label><input type="file" id="track-lrc"></div>
      <button class="btn-pink" onclick="addTrack()">新增篇章至分區</button>
    </div>
  </div>

  <div id="view-home" class="page-view active">
    <div class="glass-card">
      <div class="card-title">📚 選擇作品集</div>
      <div id="album-list">載入中...</div>
      <div id="pagination-container"></div>
    </div>
  </div>

  <div id="view-detail" class="page-view">
    <div class="glass-card">
      <div class="breadcrumb-bar" onclick="switchPage('home')">
        <span>⬅ ROOT / 📁 <span id="detail-album-title">作品名稱</span></span>
      </div>
      <div id="chapter-list-container" class="chapter-file-list"></div>
    </div>
  </div>
</div>

<div id="mini-player" class="mini-player hidden" onclick="expandPlayer()">
  <img id="mini-thumb" class="mini-thumb" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%23121218'/></svg>">
  <div class="mini-info">
    <div id="mini-title" class="mini-title">未選擇篇章</div>
    <div id="mini-lrc" class="mini-subtitle">♪ 點擊展開播放面板</div>
  </div>
  <button class="mini-btn" onclick="event.stopPropagation(); togglePlay();" id="mini-btn-play">▶</button>
  <button class="mini-btn" onclick="event.stopPropagation(); expandPlayer();">▲</button>
</div>

<div id="player-card" class="player-card minimized">
  <div class="drag-handle-area" id="drag-handle-area" title="點擊關閉面板">
    <div class="drag-handle"></div>
  </div>

  <div class="cover-box" id="player-cover-box">
    <button class="btn-cover-nav cover-prev" onclick="prevCover()">❮</button>
    <button class="btn-cover-nav cover-next" onclick="nextCover()">❯</button>
    <div class="cover-indicator" id="cover-indicator">1 / 1</div>
  </div>
  
  <div id="album-tag" class="album-tag">請選擇作品分區</div>
  <div id="lrc-box" class="lrc-box">♪ 選擇小篇章開始收聽 ♪</div>

  <div class="sub-quick-tools">
    <label class="btn-sub-quick">📂 匯入字幕<input type="file" id="quick-lrc-input" style="display:none;" onchange="uploadCurrentTrackLrc(event)"></label>
    <button class="btn-sub-quick" onclick="pasteCurrentTrackLrc()">📝 貼上字幕</button>
    <button class="btn-sub-quick" onclick="inspectCurrentTrackLrc()">🔍 檢視/修改</button>
  </div>

  <input type="range" id="seek-slider" class="seek-slider" value="0" min="0" max="100" step="0.1">
  <div class="time-box"><span id="time-current">00:00</span><span id="time-duration">00:00</span></div>

  <div class="controls">
    <button class="btn-ctrl" onclick="prevTrack()">⏮</button>
    <button class="btn-ctrl" onclick="seekRelative(-5)">↺5</button>
    <button class="btn-ctrl btn-play-main" id="btn-play" onclick="togglePlay()">▶</button>
    <button class="btn-ctrl" onclick="seekRelative(30)">↻30</button>
    <button class="btn-ctrl" onclick="nextTrack()">⏭</button>
  </div>

  <div class="volume-box">
    <button class="btn-mute" id="btn-mute" onclick="toggleMute()">🔈</button>
    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
    <span>🔊</span>
  </div>

  <div class="bottom-tools">
    <button class="btn-pip" onclick="enablePiP()">📺 桌面懸浮 (PiP)</button>
  </div>
</div>

<video id="pip-video" crossorigin="anonymous" playsinline muted style="position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; opacity: 0.001; pointer-events: none; z-index: -999;"></video>
<audio id="main-audio" crossorigin="anonymous" preload="metadata"></audio>

<script>
  let db;
  let albums = [];
  let tracks = [];
  let currentTrackList = [];
  let currentIndex = -1;
  let currentLrc = [];
  let currentPlayingAlbumId = null;
  let currentActiveAlbumId = null;
  let lastVolume = 1;

  let globalBackgrounds = [];
  let bgIndex = 0;
  let isCustomAlbumPlaying = false;
  let currentAlbumBgBlobs = [];
  let albumBgIndex = 0;

  let activeAlbumCoverBlobs = [];
  let activeCoverIndex = 0;
  let coverElements = [];
  let cachedCoverElement = null;
  let isCoverVideoActive = false;

  let activeSubtitleText = "";
  let currentBgObjectUrl = null;
  let lastUpdateTime = 0;

  let pipCanvas = null;
  let pipCtx = null;
  let isPiPInitialized = false;

  let currentPage = 1;
  const itemsPerPage = 4;

  const audio = document.getElementById("main-audio");
  const bgVideo = document.getElementById("bg-video");
  const bgImg = document.getElementById("bg-img");
  const pipVideo = document.getElementById("pip-video");
  const playerCard = document.getElementById("player-card");
  const miniPlayer = document.getElementById("mini-player");
  const seekSlider = document.getElementById("seek-slider");
  const volumeSlider = document.getElementById("volume-slider");

  document.getElementById("drag-handle-area").addEventListener("click", () => { minimizePlayer(); });

  pipVideo.addEventListener('pause', () => {
    if (!audio.paused) {
      audio.pause();
      document.getElementById("btn-play").innerText = "▶";
      document.getElementById("mini-btn-play").innerText = "▶";
    }
  });
  pipVideo.addEventListener('play', () => {
    if (audio.paused) {
      audio.play();
      document.getElementById("btn-play").innerText = "⏸";
      document.getElementById("mini-btn-play").innerText = "⏸";
    }
  });

  /* 效能優化版的 PiP 渲染：僅在字幕改變或靜態更新時觸發，嚴禁每秒 30/60 次高耗電畫布刷新 */
  function renderPiPFrameOnce() {
    if (!pipCtx) return;
    pipCtx.fillStyle = "#07070a";
    pipCtx.fillRect(0, 0, 800, 800);

    pipCtx.fillStyle = "#ff79c6";
    pipCtx.font = "bold 36px sans-serif";
    pipCtx.textAlign = "center";
    pipCtx.fillText("ASMR 隨身庫", 400, 350);

    pipCtx.font = "bold 42px sans-serif";
    pipCtx.fillStyle = "#ffffff";
    
    let text = activeSubtitleText || "♪ 播放中...";
    if (text.length > 20) {

  async function exportDataBackup() {
    try {
      const tx = db.transaction(["albums", "tracks", "settings"], "readonly");
      let exportAlbums = await new Promise(res => tx.objectStore("albums").getAll().onsuccess = e => res(e.target.result));
      let exportTracks = await new Promise(res => tx.objectStore("tracks").getAll().onsuccess = e => res(e.target.result));
      let exportSettings = await new Promise(res => tx.objectStore("settings").getAll().onsuccess = e => res(e.target.result));

      let totalBytes = 0;
      exportTracks.forEach(t => { if(t.audioBlob) totalBytes += t.audioBlob.size; });
      exportAlbums.forEach(a => { 
        if(a.coverBlobs) a.coverBlobs.forEach(b => totalBytes += b.size);
        if(a.bgBlobs) a.bgBlobs.forEach(b => totalBytes += b.size);
      });

      const totalMB = (totalBytes / (1024 * 1024)).toFixed(1);

      if (totalBytes > 100 * 1024 * 1024) {
        const includeMedia = confirm(`當前容量較大（約 ${totalMB} MB），完整備份可能會消耗較多時間。\n\n【確定】：匯出完整影音檔案\n【取消】：僅匯出「作品結構與字幕」（速度極快，防止卡死）`);
        if (!includeMedia) {
          let cleanAlbums = exportAlbums.map(a => ({ id: a.id, title: a.title }));
          let cleanTracks = exportTracks.map(t => ({ id: t.id, albumId: t.albumId, title: t.title, lrcText: t.lrcText }));
          downloadJson({ albums: cleanAlbums, tracks: cleanTracks, settings: [] }, `ASMR_Structure_Backup.json`);
          return;
        }
      }

      async function blobToBase64(blob) {
        if (!blob) return null;
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.readAsDataURL(blob);
        });
      }

      let cleanAlbums = [];
      for (let alb of exportAlbums) {
        let cBlobs = [];
        if (alb.coverBlobs) for (let b of alb.coverBlobs) cBlobs.push(await blobToBase64(b));
        let bBlobs = [];
        if (alb.bgBlobs) for (let b of alb.bgBlobs) bBlobs.push(await blobToBase64(b));
        cleanAlbums.push({ id: alb.id, title: alb.title, coverBlobs: cBlobs, bgBlobs: bBlobs });
      }

      let cleanTracks = [];
      for (let trk of exportTracks) {
        cleanTracks.push({
          id: trk.id, albumId: trk.albumId, title: trk.title,
          audioBase64: await blobToBase64(trk.audioBlob), lrcText: trk.lrcText
        });
      }

      downloadJson({ version: 1, albums: cleanAlbums, tracks: cleanTracks, settings: exportSettings }, `ASMR_Full_Backup_${new Date().toISOString().slice(0,10)}.json`);
      alert("備份檔案已成功匯出！");
    } catch (err) {
      console.error(err);
      alert("匯出失敗，請選擇僅備份結構與字幕。");
    }
  }

  function downloadJson(dataObj, filename) {
    const jsonStr = JSON.stringify(dataObj);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  async function importDataBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (!confirm("匯入將覆蓋現有資料，確定繼續？")) { event.target.value = ''; return; }

    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        function base64ToBlob(base64Data) {
          if (!base64Data) return null;
          const parts = base64Data.split(';base64,');
          const contentType = parts[0].split(':')[1];
          const raw = window.atob(parts[1]);
          const uInt8Array = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; ++i) uInt8Array[i] = raw.charCodeAt(i);
          return new Blob([uInt8Array], { type: contentType });
        }

        const tx = db.transaction(["albums", "tracks", "settings"], "readwrite");
        tx.objectStore("albums").clear(); tx.objectStore("tracks").clear(); tx.objectStore("settings").clear();

        for (let alb of data.albums) {
          let cBlobs = []; if (alb.coverBlobs) for (let bStr of alb.coverBlobs) cBlobs.push(base64ToBlob(bStr));
          let bBlobs = []; if (alb.bgBlobs) for (let bStr of alb.bgBlobs) bBlobs.push(base64ToBlob(bStr));
          tx.objectStore("albums").add({ id: alb.id, title: alb.title, coverBlobs: cBlobs, bgBlobs: bBlobs });
        }

        for (let trk of data.tracks) {
          tx.objectStore("tracks").add({
            id: trk.id, albumId: trk.albumId, title: trk.title,
            audioBlob: base64ToBlob(trk.audioBase64), lrcText: trk.lrcText
          });
        }

        tx.oncomplete = () => { alert("資料同步成功！"); location.reload(); };
      } catch (err) { alert("匯入失敗：檔案格式錯誤。"); }
    };
    reader.readAsText(file);
  }

  function readFileTextSmart(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        let text = e.target.result;
        if (text.includes('\uFFFD')) {
          const readerSJIS = new FileReader();
          readerSJIS.onload = (e2) => resolve(e2.target.result);
          readerSJIS.readAsText(file, 'shift-jis');
        } else resolve(text);
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  function playTrack(albumId, trackId) {
    const album = albums.find(a => a.id === albumId);
    currentTrackList = tracks.filter(t => t.albumId === albumId);
    currentIndex = currentTrackList.findIndex(t => t.id === trackId);
    if (currentIndex === -1) return;

    audio.src = URL.createObjectURL(track.audioBlob);
    audio.play();

    document.getElementById("mini-btn-play").innerText = "⏸";

    document.getElementById("mini-title").innerText = track.title;
    document.getElementById("mini-lrc").innerText = album ? album.title : "ASMR 隨身庫";
    document.getElementById("album-tag").innerText = album ? `📁 ${album.title}` : "";

    activeAlbumCoverBlobs = album && album.coverBlobs ? album.coverBlobs : (album && album.coverBlob ? [album.coverBlob] : []);
    activeCoverIndex = 0;
    setupPlayerCovers();

    let firstCoverUrl = activeAlbumCoverBlobs.length > 0 ? URL.createObjectURL(activeAlbumCoverBlobs[0]) : "";
    document.getElementById("mini-thumb").src = firstCoverUrl || "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%23121218'/></svg>";

    updateMediaSessionMetadata(track.title, album ? album.title : "ASMR 隨身庫", firstCoverUrl);
    currentLrc = parseSubtitles(track.lrcText);

    miniPlayer.classList.remove("hidden");
    expandPlayer();

  function setupPlayerCovers() {
    const coverBox = document.getElementById("player-cover-box");
    const navButtons = coverBox.querySelectorAll('.btn-cover-nav, .cover-indicator');
    coverBox.innerHTML = "";
    navButtons.forEach(btn => coverBox.appendChild(btn));

    coverElements = [];
    if (activeAlbumCoverBlobs.length === 0) {
      cachedCoverElement = null; isCoverVideoActive = false;
      document.getElementById("cover-indicator").innerText = "0 / 0";
      return;
    }

    activeAlbumCoverBlobs.forEach((blob, idx) => {
      let url = URL.createObjectURL(blob);
      let el;
      if (blob.type && blob.type.startsWith('video/')) {
        el = document.createElement('video');
        el.src = url; el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true;
      } else {
        el = document.createElement('img'); el.src = url;
      }
      el.style.display = idx === 0 ? "block" : "none";
      coverBox.appendChild(el);
      coverElements.push(el);
    });

    updateCoverDisplay();
  }

  function updateCoverDisplay() {
    if (coverElements.length === 0) return;
    coverElements.forEach((el, idx) => {
      if (idx === activeCoverIndex) {
        el.style.display = "block"; cachedCoverElement = el;
        isCoverVideoActive = el.tagName === 'VIDEO';
        if (isCoverVideoActive) el.play().catch(() => {});
      } else {
        el.style.display = "none";
        if (el.tagName === 'VIDEO') el.pause();
      }
    });
    document.getElementById("cover-indicator").innerText = `${activeCoverIndex + 1} / ${coverElements.length}`;
  }

  function nextCover() {
    if (coverElements.length <= 1) return;
    activeCoverIndex = (activeCoverIndex + 1) % coverElements.length;
    updateCoverDisplay();
  }

  function prevCover() {
    if (coverElements.length <= 1) return;
    activeCoverIndex = (activeCoverIndex - 1 + coverElements.length) % coverElements.length;
    updateCoverDisplay();
  }

  function togglePlay() {
    if (currentIndex === -1) return;
    if (audio.paused) {
      audio.play();
      if (isCoverVideoActive && cachedCoverElement) cachedCoverElement.play();
      document.getElementById("btn-play").innerText = "⏸";
      document.getElementById("mini-btn-play").innerText = "⏸";
    } else {
      audio.pause();
      if (isCoverVideoActive && cachedCoverElement) cachedCoverElement.pause();
      document.getElementById("btn-play").innerText = "▶";
      document.getElementById("mini-btn-play").innerText = "▶";
    }
  }

  function prevTrack() { if (currentIndex > 0) playTrack(currentPlayingAlbumId, currentTrackList[currentIndex - 1].id); }
  function nextTrack() { if (currentIndex < currentTrackList.length - 1) playTrack(currentPlayingAlbumId, currentTrackList[currentIndex + 1].id); }
  function seekRelative(seconds) { if (!audio.duration) return; audio.currentTime = Math.min(Math.max(audio.currentTime + seconds, 0), audio.duration); }

  function toggleMute() {
    if (audio.muted) {
      audio.muted = false; document.getElementById("btn-mute").innerText = "🔈"; volumeSlider.value = lastVolume;
    } else {
      lastVolume = audio.volume; audio.muted = true; document.getElementById("btn-mute").innerText = "🔇"; volumeSlider.value = 0;
    }
  }

  volumeSlider.addEventListener("input", (e) => {
    audio.volume = e.target.value; audio.muted = (e.target.value == 0);
    document.getElementById("btn-mute").innerText = (e.target.value == 0) ? "🔇" : "🔈";
  });

  seekSlider.addEventListener("input", (e) => {
    if (!audio.duration) return;
    audio.currentTime = (e.target.value / 100) * audio.duration;
  });

  /* 節流優化：每 250ms 才會更新一次 UI，大幅降低手機主線程運算 */
  audio.addEventListener("timeupdate", () => {
    const now = Date.now();
    if (now - lastUpdateTime < 250) return;
    lastUpdateTime = now;

    if (!audio.duration) return;
    seekSlider.value = (audio.currentTime / audio.duration) * 100;
    document.getElementById("time-current").innerText = formatTime(audio.currentTime);
    document.getElementById("time-duration").innerText = formatTime(audio.duration);

    let activeText = getActiveSubtitleText(audio.currentTime);
    if (activeText !== activeSubtitleText) {
      activeSubtitleText = activeText;
      document.getElementById("lrc-box").innerText = activeText;
      document.getElementById("mini-lrc").innerText = activeText !== "♪ 享受純淨的 ASMR 時光 ♪" ? activeText : "♪ 播放中...";
      if (isPiPInitialized) renderPiPFrameOnce();
    }
  });

  audio.addEventListener("ended", () => {
    if (currentIndex < currentTrackList.length - 1) { nextTrack(); }
    else { document.getElementById("btn-play").innerText = "▶"; document.getElementById("mini-btn-play").innerText = "▶"; }
  });

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function expandPlayer() {
    playerCard.style.transform = 'translateY(0)';
    playerCard.classList.remove("minimized");
    miniPlayer.classList.add("hidden");
  }

  function minimizePlayer() {
    playerCard.style.transform = 'translateY(105%)';
    playerCard.classList.add("minimized");
    if (currentIndex !== -1) miniPlayer.classList.remove("hidden");
  }

  function parseSubtitles(rawText) {
    if (!rawText || !rawText.trim()) return [];
    const lines = rawText.split('\n');
    let parsed = [];
    for (let line of lines) {
      line = line.trim(); if (!line) continue;
      const lrcMatch = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/);
      if (lrcMatch) {
        const m = parseInt(lrcMatch[1], 10);
        const s = parseInt(lrcMatch[2], 10);
        const msStr = lrcMatch[3];
        const ms = parseInt(msStr.length === 2 ? msStr * 10 : msStr, 10);
        parsed.push({ time: m * 60 + s + ms / 1000, text: lrcMatch[4].trim() });
      }
    }
    return parsed.sort((a, b) => a.time - b.time);
  }

  function getActiveSubtitleText(currentTime) {
    if (!currentLrc || currentLrc.length === 0) return "♪ 享受純淨的 ASMR 時光 ♪";
    let active = "♪ 享受純淨的 ASMR 時光 ♪";
    for (let item of currentLrc) {
      if (currentTime >= item.time) active = item.text || active;
      else break;
    }
    return active;
  }

  function initMediaSession() {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => togglePlay());
      navigator.mediaSession.setActionHandler('pause', () => togglePlay());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
    }
  }

  function updateMediaSessionMetadata(title, albumTitle, coverUrl) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title || 'ASMR 篇章',
        artist: albumTitle || 'ASMR 隨身庫',
        album: albumTitle || 'ASMR 隨身庫',
        artwork: coverUrl ? [{ src: coverUrl, sizes: '512x512', type: 'image/png' }] : []
      });
    }
  }
</script>

</body>
