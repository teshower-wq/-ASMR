<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR 私人隨身庫 (終極高潮升級版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary-pink: #ff79c6;
      --pink-glow: rgba(255, 121, 198, 0.6);
      --bg-dark: #07070a;
      --card-glass: rgba(16, 16, 22, 0.88);
      --card-glass-hover: rgba(24, 24, 34, 0.95);
      --text-main: #ffffff;
      --text-sub: #9494ab;
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-hover: rgba(255, 121, 198, 0.4);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; padding-bottom: 150px;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
      transition: filter 0.3s ease;
    }

    /* Backgrounds */
    #bg-video, #bg-img {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; background-color: var(--bg-dark);
      z-index: -2; display: none; filter: brightness(0.5) blur(8px);
      transition: opacity 1s ease;
    }
    #bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(7,7,10,0.3) 0%, rgba(7,7,10,0.9) 100%);
      z-index: -1; pointer-events: none;
    }

    /* Layout */
    .container { width: 100%; max-width: 680px; z-index: 1; position: relative; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .app-logo { font-size: 1.35rem; font-weight: 800; color: var(--primary-pink); text-shadow: 0 0 15px var(--pink-glow); cursor: pointer; }
    
    .nav-tabs { display: flex; gap: 8px; width: 100%; margin-bottom: 16px; }
    .nav-tab-btn {
      flex: 1; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass);
      color: var(--text-sub); border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.3s;
    }
    .nav-tab-btn.active { background: rgba(255, 121, 198, 0.15); border-color: var(--primary-pink); color: var(--primary-pink); box-shadow: 0 0 15px var(--pink-glow); }

    /* Admin Drawer */
    .admin-drawer { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
    .admin-drawer.open { max-height: 5000px; margin-bottom: 20px; }

    /* Cards */
    .glass-card {
      background: var(--card-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass); border-radius: 20px; padding: 20px; margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; color: var(--primary-pink); display: flex; align-items: center; gap: 8px; }
    
    /* Forms */
    .form-group { margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: 600; }
    input, select {
      width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s;
    }
    input:focus, select:focus { border-color: var(--primary-pink); box-shadow: 0 0 10px rgba(255, 121, 198, 0.3); }
    input[type="file"]::file-selector-button {
      background: rgba(255, 121, 198, 0.2); border: 1px solid rgba(255, 121, 198, 0.4);
      color: var(--primary-pink); padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-right: 10px;
    }

    /* Buttons */
    .btn-pink {
      width: 100%; background: linear-gradient(135deg, #ff79c6 0%, #ff52b2 100%); color: #000; border: none;
      padding: 14px; font-weight: 800; border-radius: 14px; cursor: pointer; margin-top: 8px; font-size: 1rem;
      box-shadow: 0 4px 15px rgba(255, 121, 198, 0.4); transition: transform 0.2s;
    }
    .btn-pink:active { transform: scale(0.98); }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; width: 100%; padding: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 8px; }

    /* Views */
    .page-view { display: none; animation: fadeIn 0.3s ease; }
    .page-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Album Grid */
    .album-grid-card {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 16px; 
      padding: 12px; margin-bottom: 12px; display: flex; align-items: center; cursor: pointer; transition: 0.3s;
    }
    .album-grid-card:hover { background: rgba(255,255,255,0.08); border-color: var(--border-glass-hover); transform: translateY(-2px); }
    .album-grid-thumb { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; margin-right: 14px; flex-shrink: 0; background: #000; }
    .album-info { flex: 1; overflow: hidden; }
    .album-title { font-size: 1.05rem; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .album-count { font-size: 0.85rem; color: var(--primary-pink); margin-top: 4px; }
    
    /* Chapter List */
    .chapter-item {
      display: flex; justify-content: space-between; align-items: center; padding: 12px;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 8px; cursor: pointer;
    }
    .chapter-item:hover { background: rgba(255,121,198,0.1); border-color: rgba(255,121,198,0.3); }

    /* Video Player Area (New Architecture) */
    .video-asmr-wrapper {
      position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px;
      overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin-bottom: 12px; display: flex; align-items: center; justify-content: center;
    }
    .video-asmr-wrapper video { width: 100%; height: 100%; object-fit: cover; }
    
    /* Subtitles (Pink and below video) */
    .pink-subtitle-box {
      min-height: 54px; background: rgba(16,16,22,0.95); border: 1px solid rgba(255,121,198,0.3);
      border-radius: 14px; padding: 12px; text-align: center; font-size: 1.15rem; font-weight: 900;
      color: #ff52b2; text-shadow: 0 0 12px rgba(255, 82, 178, 0.8), 0 2px 4px rgba(0,0,0,0.9); 
      margin-bottom: 12px; display: flex; align-items: center; justify-content: center; letter-spacing: 0.5px;
    }

    /* Heart Climax System UI */
    .heart-toy-container {
      position: absolute; top: 12px; right: 12px; width: 45px; height: 45px; z-index: 30;
      background: rgba(0,0,0,0.5); border-radius: 50%; padding: 6px; backdrop-filter: blur(4px);
      box-shadow: 0 0 15px rgba(0,0,0,0.5); cursor: pointer;
    }
    .heart-svg-mask {
      width: 100%; height: 100%; fill: transparent; stroke: #ff79c6; stroke-width: 2px;
      position: relative; overflow: hidden;
    }
    .heart-fill {
      fill: #ff2a85; transition: height 0.3s ease;
    }
    
    /* Extreme Climax Effects */
    .climax-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 25;
      display: none; animation: flashImage 0.3s infinite alternate;
    }
    @keyframes flashImage { from { filter: brightness(1) contrast(1.2); } to { filter: brightness(1.3) contrast(1.5) drop-shadow(0 0 20px #ff2a85); } }
    .screen-shake-extreme { animation: extremeShake 0.1s infinite !important; }
    @keyframes extremeShake {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      25% { transform: translate(-8px, 6px) rotate(-2deg) scale(1.02); filter: hue-rotate(10deg); }
      50% { transform: translate(8px, -6px) rotate(2deg) scale(1.02); filter: hue-rotate(-10deg); }
      75% { transform: translate(-6px, -8px) rotate(-1deg) scale(1.05); }
      100% { transform: translate(6px, 8px) rotate(1deg) scale(1.05); }
    }
    .heart-explosive { animation: heartExplode 0.4s infinite alternate; }
    @keyframes heartExplode {
      0% { transform: scale(1); filter: drop-shadow(0 0 10px #ff2a85); }
      100% { transform: scale(1.5); filter: drop-shadow(0 0 40px #ff79c6); }
    }

    /* Player Card */
    .player-card {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; width: 100%; 
      max-height: 90vh; height: auto; display: flex; flex-direction: column;
      background: rgba(12, 12, 16, 0.98); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 121, 198, 0.2); border-bottom: none; border-radius: 30px 30px 0 0;
      box-shadow: 0 -10px 50px rgba(255, 121, 198, 0.15); z-index: 1000; transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
    }
    .player-card.minimized { transform: translateY(105%); pointer-events: none; }
    .drag-handle-area { width: 100%; padding: 15px 0; display: flex; justify-content: center; cursor: grab; }
    .drag-handle { width: 60px; height: 6px; background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
    .player-scroll-area { overflow-y: auto; overflow-x: hidden; width: 100%; padding: 0 20px 30px 20px; }
    
    /* Cover Box (Audio Only) */
    .audio-cover-box {
      width: 100%; height: 220px; border-radius: 16px; overflow: hidden; background: #000; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .audio-cover-box img, .audio-cover-box video { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; }

    /* Controls */
    .seek-slider { width: 100%; height: 6px; accent-color: var(--primary-pink); border-radius: 3px; background: rgba(255,255,255,0.1); }
    .time-box { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-sub); margin-top: 8px; font-weight: 600; }
    .controls { display: flex; align-items: center; justify-content: space-evenly; margin: 15px 0; }
    .btn-ctrl { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; transition: 0.2s; }
    .btn-ctrl:hover { color: var(--primary-pink); transform: scale(1.1); }
    .btn-play-main { width: 56px; height: 56px; background: linear-gradient(135deg, #ff79c6, #ff2a85); color: #fff; border-radius: 50%; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(255,121,198,0.5); }
    
    .btn-pip-native {
      width: 100%; background: rgba(255, 121, 198, 0.15); border: 1px solid var(--primary-pink);
      color: var(--primary-pink); padding: 14px; border-radius: 14px; font-weight: 800; text-align: center; cursor: pointer; margin-top: 10px;
    }

    /* Mini Player */
    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0; margin: auto; max-width: 680px; height: 70px;
      background: rgba(16, 16, 22, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 121, 198, 0.3);
      display: flex; align-items: center; padding: 0 16px; z-index: 999; cursor: pointer; transition: 0.4s;
    }
    .mini-player.hidden { transform: translateY(120%); pointer-events: none; }
    .mini-info { flex: 1; overflow: hidden; margin-left: 12px; }
    .mini-title { font-size: 0.95rem; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Toast */
    .toast-msg {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: rgba(255, 121, 198, 0.95); color: #000; padding: 12px 24px; border-radius: 20px;
      font-weight: 800; font-size: 0.95rem; box-shadow: 0 10px 30px rgba(255, 121, 198, 0.5);
      z-index: 3000; opacity: 0; transition: 0.3s; pointer-events: none;
    }
    .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body id="main-body">

<video id="bg-video" autoplay loop muted playsinline></video>
<img id="bg-img" alt="Background">
<div id="bg-overlay"></div>
<div id="toast" class="toast-msg"></div>

<div class="container">
  <div class="top-bar">
    <div class="app-logo" onclick="switchPage('home')">🌸 ASMR 私人隨身庫</div>
    <div style="display:flex; gap:8px;">
      <button onclick="cleanMemory()" style="background: rgba(80, 250, 123, 0.15); border: 1px solid rgba(80, 250, 123, 0.4); color: #50fa7b; padding: 8px 12px; border-radius: 12px; font-size: 0.82rem; font-weight: 700; cursor: pointer;">⚡ 清理快取</button>
      <button onclick="toggleAdminDrawer()" style="background: rgba(255, 121, 198, 0.15); border: 1px solid rgba(255, 121, 198, 0.4); color: var(--primary-pink); padding: 8px 12px; border-radius: 12px; font-size: 0.82rem; font-weight: 700; cursor: pointer;">⚙️ 管理選單</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab-btn active" id="tab-voice" onclick="switchMainTab('voice')">🎵 一般語音庫</button>
    <button class="nav-tab-btn" id="tab-video-asmr" onclick="switchMainTab('video-asmr')">🎬 獨立影片 ASMR</button>
  </div>

  <div id="admin-drawer" class="admin-drawer">
    <div class="glass-card" style="border-color: #ff2a85; box-shadow: 0 0 20px rgba(255,42,133,0.3);">
      <div class="card-title" style="color: #ff2a85;">🔥 設定玩具高潮專屬素材 (全域套用)</div>
      <div style="font-size:0.85rem; color:var(--text-sub); margin-bottom:12px;">當女性叫床使愛心儲滿時，將強制切換至此高潮圖片與音效。</div>
      <div class="form-group"><label>上傳高潮圖片 (GIF/PNG/JPG)</label><input type="file" id="climax-img-input" accept="image/*"></div>
      <div class="form-group"><label>上傳高潮音效 (極度劇烈呻吟等)</label><input type="file" id="climax-audio-input" accept="audio/*"></div>
      <button class="btn-pink" onclick="saveClimaxSettings()" style="background: linear-gradient(135deg, #ff2a85, #ff0055);">儲存高潮設定</button>
    </div>

    <div class="glass-card">
      <div class="card-title">📁 建立作品分區 (修復版)</div>
      <div class="form-group"><label>分區名稱</label><input type="text" id="album-title" placeholder="例如：獸耳娘系列"></div>
      <div class="form-group"><label>封面素材 (圖片/影片)</label><input type="file" id="album-covers" accept="image/*,video/*"></div>
      <button class="btn-pink" onclick="createAlbum()">建立分區</button>
    </div>

    <div class="glass-card" style="border-color: var(--primary-pink);">
      <div class="card-title">🎬 新增獨立影片 ASMR</div>
      <div class="form-group"><label>影片標題</label><input type="text" id="v-asmr-title"></div>
      <div class="form-group"><label>上傳視覺影片 (將強制靜音循環)</label><input type="file" id="v-asmr-video" accept="video/*"></div>
      <div class="form-group"><label>上傳對應音訊檔 (提供主音量與高潮能量)</label><input type="file" id="v-asmr-audio" accept="audio/*"></div>
      <div class="form-group"><label>上傳字幕檔 (可選)</label><input type="file" id="v-asmr-lrc" accept=".lrc,.txt"></div>
      <button class="btn-pink" onclick="addVideoAsmrTrack()">上傳影片版 ASMR</button>
    </div>

    <div class="glass-card">
      <div class="card-title">⚡ 一般語音篇章上傳</div>
      <div class="form-group">
        <label>選擇分區</label>
        <select id="select-album"><option value="">-- 請先建立分區 --</option></select>
      </div>
      <div class="form-group"><label>音頻檔案</label><input type="file" id="batch-audios" accept="audio/*" multiple></div>
      <button class="btn-green" onclick="batchUploadAudio()">匯入語音篇章</button>
    </div>
  </div>

  <!-- Page Views -->
  <div id="view-home" class="page-view active">
    <div class="glass-card">
      <div class="card-title">📚 作品集列表</div>
      <div id="album-list"></div>
    </div>
  </div>

  <div id="view-detail" class="page-view">
    <div class="glass-card">
      <div style="font-weight:800; color:var(--primary-pink); margin-bottom:12px; cursor:pointer;" onclick="switchPage('home')">⬅ 返回 / <span id="detail-title"></span></div>
      <div id="chapter-list"></div>
    </div>
  </div>

  <div id="view-video-asmr" class="page-view">
    <div class="glass-card">
      <div class="card-title">🎬 獨立影片 ASMR 專區</div>
      <div style="font-size:0.85rem; color:var(--text-sub); margin-bottom:12px;">視覺與聽覺的極致結合，支援粉紅字幕與愛心高潮系統。</div>
      <div id="video-asmr-list"></div>
    </div>
  </div>

</div>

<!-- Player Card -->
<div id="player-card" class="player-card minimized">
  <div class="drag-handle-area" id="drag-handle-area">
    <div class="drag-handle"></div>
  </div>

  <div class="player-scroll-area">
    <!-- Video Player Area (For Video ASMR) -->
    <div id="video-asmr-area" style="display:none;">
      <div class="video-asmr-wrapper">
        <video id="active-video-element" muted loop playsinline></video>
        <img id="climax-overlay" class="climax-overlay" alt="Climax Image">
        
        <!-- Heart Toy Widget inside Video -->
        <div class="heart-toy-container" id="heart-btn" onclick="manualHeartBoost()">
          <svg viewBox="0 0 24 24" class="heart-svg-mask">
            <defs>
              <clipPath id="heart-clip">
                <!-- Rect grows from bottom to top to reveal fill -->
                <rect id="heart-fill-rect" x="0" y="24" width="24" height="24" />
              </clipPath>
            </defs>
            <!-- Outline -->
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            <!-- Fill -->
            <path class="heart-fill" clip-path="url(#heart-clip)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>
      <!-- Pink Subtitles -->
      <div id="video-pink-subtitle" class="pink-subtitle-box">♪ 準備好迎接高潮了嗎 ♪</div>
      <button class="btn-pip-native" onclick="toggleNativePiP()">📺 開啟全螢幕影片懸浮窗 (PiP)</button>
    </div>

    <!-- Audio Player Area (For Voice/Music) -->
    <div id="audio-asmr-area" style="display:none;">
      <div class="audio-cover-box" id="audio-cover-box"></div>
      <div id="audio-pink-subtitle" class="pink-subtitle-box" style="min-height:45px; font-size:1rem;">♪ 純淨語音聆聽 ♪</div>
    </div>

    <!-- Common Controls -->
    <input type="range" id="seek-slider" class="seek-slider" value="0" min="0" max="100" step="0.1" style="margin-top:15px;">
    <div class="time-box"><span id="time-current">00:00</span><span id="time-duration">00:00</span></div>
    
    <div class="controls">
      <button class="btn-ctrl" onclick="prevTrack()">⏮</button>
      <button class="btn-play-main" id="btn-play-main" onclick="togglePlay()">▶</button>
      <button class="btn-ctrl" onclick="nextTrack()">⏭</button>
    </div>
  </div>
</div>

<div id="mini-player" class="mini-player hidden" onclick="expandPlayer()">
  <div class="mini-info">
    <div id="mini-title" class="mini-title">未選擇篇章</div>
    <div style="font-size:0.75rem; color:var(--primary-pink); margin-top:4px;">♪ 點擊展開面板</div>
  </div>
  <button style="color:#fff; font-size:1.5rem; background:none; border:none; padding:10px;" id="mini-btn-play" onclick="event.stopPropagation(); togglePlay();">▶</button>
</div>

<!-- Invisible Audio Elements -->
<audio id="main-audio" crossorigin="anonymous" preload="auto"></audio>
<audio id="climax-audio" preload="auto"></audio>

<script>
  /** * Database & Global State 
   * Upgraded to V32 for Climax Settings
   */
  let db;
  let albums = [];
  let tracks = [];
  let videoAsmrTracks = [];
  let currentList = [];
  let currentIndex = -1;
  let currentMode = 'voice'; // 'voice' or 'video-asmr'
  
  // Climax & Audio Analyser State
  let climaxData = null;
  let isClimaxing = false;
  let heartProgress = 0; // 0 to 100
  let audioCtx, analyser, dataArray;
  let analyserInitialized = false;

  // Player Elements
  const mainAudio = document.getElementById("main-audio");
  const climaxAudio = document.getElementById("climax-audio");
  const activeVideoElement = document.getElementById("active-video-element");
  const playerCard = document.getElementById("player-card");
  const miniPlayer = document.getElementById("mini-player");
  const seekSlider = document.getElementById("seek-slider");
  let activeObjectURLs = []; // For memory management

  // Subtitles
  let currentLrcData = [];

  /** DB Initialization */
  const request = indexedDB.open("ASMR_DB_V32", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("albums")) db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("videoAsmrTracks")) db.createObjectStore("videoAsmrTracks", { keyPath: "id", autoIncrement: true });
    if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
  };
  request.onsuccess = (e) => { 
    db = e.target.result; 
    loadData(); 
  };

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  function trackURL(blob) {
    if (!blob) return "";
    const url = URL.createObjectURL(blob);
    activeObjectURLs.push(url);
    return url;
  }

  function cleanMemory() {
    activeObjectURLs.forEach(url => { try { URL.revokeObjectURL(url); } catch(e){} });
    activeObjectURLs = [];
    showToast("⚡ 記憶體與快取已清理");
  }

  /** Data Loading */
  function loadData() {
    const tx = db.transaction(["albums", "tracks", "videoAsmrTracks", "settings"], "readonly");
    tx.objectStore("albums").getAll().onsuccess = e => {
      albums = e.target.result;
      updateAlbumSelect();
      if(currentMode === 'voice') renderHomeAlbums();
    };
    tx.objectStore("tracks").getAll().onsuccess = e => { tracks = e.target.result; };
    tx.objectStore("videoAsmrTracks").getAll().onsuccess = e => {
      videoAsmrTracks = e.target.result;
      if(currentMode === 'video-asmr') renderVideoAsmrList();
    };
    tx.objectStore("settings").get("climax_media").onsuccess = e => {
      if (e.target.result) climaxData = e.target.result;
    };
  }

  /** Navigation */
  function switchMainTab(tab) {
    currentMode = tab;
    document.getElementById("tab-voice").classList.toggle("active", tab === 'voice');
    document.getElementById("tab-video-asmr").classList.toggle("active", tab === 'video-asmr');
    if (tab === 'voice') {
      switchPage('home');
    } else {
      switchPage('video-asmr');
      renderVideoAsmrList();
    }
  }

  function switchPage(page) {
    document.querySelectorAll(".page-view").forEach(el => el.classList.remove("active"));
    document.getElementById(`view-${page}`).classList.add("active");
    if(page === 'home') renderHomeAlbums();
  }

  function toggleAdminDrawer() {
    document.getElementById("admin-drawer").classList.toggle("open");
  }

  /** Album & Track Creation */
  function updateAlbumSelect() {
    const sel = document.getElementById("select-album");
    sel.innerHTML = '<option value="">-- 選擇分區 --</option>';
    albums.forEach(a => {
      sel.innerHTML += `<option value="${a.id}">${a.title}</option>`;
    });
  }

  async function createAlbum() {
    const title = document.getElementById("album-title").value.trim();
    const coverFile = document.getElementById("album-covers").files[0];
    if (!title) return showToast("需填寫分區名稱");
    
    const tx = db.transaction("albums", "readwrite");
    tx.objectStore("albums").add({ title, coverBlob: coverFile });
    tx.oncomplete = () => {
      document.getElementById("album-title").value = "";
      loadData();
      showToast("✅ 分區建立成功");
    };
  }

  async function addVideoAsmrTrack() {
    const title = document.getElementById("v-asmr-title").value.trim();
    const videoBlob = document.getElementById("v-asmr-video").files[0];
    const audioBlob = document.getElementById("v-asmr-audio").files[0];
    const lrcFile = document.getElementById("v-asmr-lrc").files[0];
    
    if (!title || !videoBlob || !audioBlob) return showToast("標題、影片、音檔為必填");
    
    let lrcText = lrcFile ? await lrcFile.text() : "";
    const tx = db.transaction("videoAsmrTracks", "readwrite");
    tx.objectStore("videoAsmrTracks").add({ title, videoBlob, audioBlob, lrcText });
    tx.oncomplete = () => {
      showToast("✅ 影片 ASMR 上傳成功");
      loadData();
    };
  }

  async function batchUploadAudio() {
    const albumId = parseInt(document.getElementById("select-album").value);
    const files = document.getElementById("batch-audios").files;
    if (!albumId || !files.length) return showToast("請選擇分區與音檔");

    const tx = db.transaction("tracks", "readwrite");
    const store = tx.objectStore("tracks");
    for (let file of files) {
      store.add({ albumId, title: file.name.replace(/\.[^/.]+$/, ""), audioBlob: file, lrcText: "" });
    }
    tx.oncomplete = () => { showToast("✅ 音檔匯入成功"); loadData(); };
  }

  /** Rendering Lists */
  function renderHomeAlbums() {
    const list = document.getElementById("album-list");
    list.innerHTML = "";
    if(!albums.length) return list.innerHTML = "<div class='text-center text-gray-500'>無資料</div>";

    albums.forEach(album => {
      const card = document.createElement("div");
      card.className = "album-grid-card";
      
      // Fix Cover Display Logic
      let mediaContainer = document.createElement("div");
      mediaContainer.style.width = "80px";
      mediaContainer.style.height = "80px";
      mediaContainer.style.marginRight = "14px";
      mediaContainer.style.flexShrink = "0";

      if (album.coverBlob) {
        const url = trackURL(album.coverBlob);
        if (album.coverBlob.type.startsWith("video")) {
          let vid = document.createElement("video");
          vid.src = url;
          vid.className = "album-grid-thumb";
          vid.style.margin = "0";
          vid.muted = true; vid.loop = true; vid.playsInline = true; vid.autoplay = true;
          mediaContainer.appendChild(vid);
        } else {
          let img = document.createElement("img");
          img.src = url;
          img.className = "album-grid-thumb";
          img.style.margin = "0";
          mediaContainer.appendChild(img);
        }
      } else {
        mediaContainer.innerHTML = `<div class="album-grid-thumb bg-gray-800" style="margin:0;"></div>`;
      }

      let info = document.createElement("div");
      info.className = "album-info";
      info.innerHTML = `
        <div class="album-title">${album.title}</div>
        <div class="album-count">📁 ${tracks.filter(t=>t.albumId===album.id).length} 篇章</div>
      `;
      
      card.appendChild(mediaContainer);
      card.appendChild(info);
      card.onclick = () => renderDetail(album.id, album.title);
      list.appendChild(card);
    });
  }

  function renderDetail(albumId, title) {
    switchPage('detail');
    document.getElementById("detail-title").innerText = title;
    const list = document.getElementById("chapter-list");
    list.innerHTML = "";
    
    let albumTracks = tracks.filter(t => t.albumId === albumId);
    if(!albumTracks.length) return list.innerHTML = "<div class='text-center text-gray-500'>無篇章</div>";

    albumTracks.forEach((track, idx) => {
      list.innerHTML += `
        <div class="chapter-item" onclick="playMedia('voice', ${albumId}, ${idx})">
          <div style="font-weight:700; color:#fff;">${track.title}</div>
          <div style="color:var(--primary-pink);">▶</div>
        </div>
      `;
    });
  }

  function renderVideoAsmrList() {
    const list = document.getElementById("video-asmr-list");
    list.innerHTML = "";
    if(!videoAsmrTracks.length) return list.innerHTML = "<div class='text-center text-gray-500'>無影片資料</div>";

    videoAsmrTracks.forEach((track, idx) => {
      list.innerHTML += `
        <div class="chapter-item" onclick="playMedia('video-asmr', null, ${idx})">
          <div>
            <div style="font-weight:800; color:#fff;">${track.title}</div>
            <div style="font-size:0.8rem; color:#ff52b2; margin-top:4px;">影片與音效完美同步 + 高潮支援</div>
          </div>
          <div style="color:var(--primary-pink); font-size:1.5rem;">🎬</div>
        </div>
      `;
    });
  }

  /** Player Core Logic */
  function playMedia(type, albumId, idx) {
    if(isClimaxing) endClimax(); // Force end if user switches track during climax

    if(type === 'voice') {
      currentList = tracks.filter(t => t.albumId === albumId);
      currentIndex = idx;
      let track = currentList[currentIndex];
      let album = albums.find(a => a.id === albumId);
      
      document.getElementById("video-asmr-area").style.display = "none";
      document.getElementById("audio-asmr-area").style.display = "block";
      
      // Setup Audio Cover
      const box = document.getElementById("audio-cover-box");
      box.innerHTML = "";
      if(album && album.coverBlob) {
        const url = trackURL(album.coverBlob);
        if(album.coverBlob.type.startsWith("video")){
          let vid = document.createElement("video");
          vid.src = url; vid.muted = true; vid.loop = true; vid.playsInline = true; vid.autoplay = true;
          box.appendChild(vid);
        } else {
          let img = document.createElement("img"); img.src = url; box.appendChild(img);
        }
      }
      
      mainAudio.src = trackURL(track.audioBlob);
      parseLrc(track.lrcText);
      document.getElementById("mini-title").innerText = track.title;
      
    } else {
      currentList = videoAsmrTracks;
      currentIndex = idx;
      let track = currentList[currentIndex];
      
      document.getElementById("audio-asmr-area").style.display = "none";
      document.getElementById("video-asmr-area").style.display = "block";
      
      activeVideoElement.src = trackURL(track.videoBlob);
      mainAudio.src = trackURL(track.audioBlob);
      parseLrc(track.lrcText);
      document.getElementById("mini-title").innerText = track.title;
      
      // Force video to mute and sync with audio
      activeVideoElement.muted = true;
    }
    
    initAudioAnalyser();
    heartProgress = 0;
    updateHeartUI();
    expandPlayer();
    togglePlay(true);
  }

  function togglePlay(forcePlay = false) {
    if(currentIndex === -1 || isClimaxing) return;
    
    let isPlaying = !mainAudio.paused;
    if (forcePlay || !isPlaying) {
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      mainAudio.play().catch(e=>console.log("Audio play error", e));
      if(document.getElementById("video-asmr-area").style.display === "block") {
         activeVideoElement.play().catch(()=>{});
      }
      updatePlayBtns("⏸");
      requestAnimationFrame(heartLoop);
    } else {
      mainAudio.pause();
      activeVideoElement.pause();
      updatePlayBtns("▶");
    }
  }

  function updatePlayBtns(txt) {
    document.getElementById("btn-play-main").innerText = txt;
    document.getElementById("mini-btn-play").innerText = txt;
  }

  function nextTrack() {
    if (currentIndex === -1 || !currentList.length) return;
    let nextIdx = (currentIndex + 1) % currentList.length;
    let t = currentList[nextIdx];
    playMedia(document.getElementById("video-asmr-area").style.display === "block" ? 'video-asmr' : 'voice', t.albumId, nextIdx);
  }

  function prevTrack() {
    if (currentIndex === -1 || !currentList.length) return;
    let pIdx = (currentIndex - 1 + currentList.length) % currentList.length;
    let t = currentList[pIdx];
    playMedia(document.getElementById("video-asmr-area").style.display === "block" ? 'video-asmr' : 'voice', t.albumId, pIdx);
  }

  /** Subtitles */
  function parseLrc(text) {
    currentLrcData = [];
    if(!text) {
      updateSubtitle("♪ 享受極致的 ASMR 體驗 ♪");
      return;
    }
    const lines = text.split('\n');
    const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
    lines.forEach(line => {
      const match = regex.exec(line);
      if(match) {
        const time = parseInt(match[1])*60 + parseInt(match[2]) + parseInt(match[3])/1000;
        const txt = line.replace(regex, '').trim();
        if(txt) currentLrcData.push({time, txt});
      }
    });
    currentLrcData.sort((a,b)=>a.time - b.time);
  }

  function updateSubtitle(text) {
    document.getElementById("video-pink-subtitle").innerText = text;
    document.getElementById("audio-pink-subtitle").innerText = text;
  }

  mainAudio.addEventListener("timeupdate", () => {
    if(!mainAudio.duration || isClimaxing) return;
    seekSlider.value = (mainAudio.currentTime / mainAudio.duration) * 100;
    
    let m = Math.floor(mainAudio.currentTime/60).toString().padStart(2,'0');
    let s = Math.floor(mainAudio.currentTime%60).toString().padStart(2,'0');
    document.getElementById("time-current").innerText = `${m}:${s}`;
    
    let dm = Math.floor(mainAudio.duration/60).toString().padStart(2,'0');
    let ds = Math.floor(mainAudio.duration%60).toString().padStart(2,'0');
    document.getElementById("time-duration").innerText = `${dm}:${ds}`;

    // Sync Video if desynced by more than 0.3s
    if (activeVideoElement && !activeVideoElement.paused) {
       if (Math.abs(activeVideoElement.currentTime - mainAudio.currentTime) > 0.3) {
           activeVideoElement.currentTime = mainAudio.currentTime;
       }
    }

    // Subtitle logic
    let activeTxt = "♪ 享受極致的 ASMR 體驗 ♪";
    for(let i=0; i<currentLrcData.length; i++) {
      if(mainAudio.currentTime >= currentLrcData[i].time) activeTxt = currentLrcData[i].txt;
      else break;
    }
    updateSubtitle(activeTxt);
  });

  mainAudio.addEventListener("ended", nextTrack);

  seekSlider.addEventListener("input", (e) => {
    if(!mainAudio.duration) return;
    mainAudio.currentTime = (e.target.value / 100) * mainAudio.duration;
    if(activeVideoElement) activeVideoElement.currentTime = mainAudio.currentTime;
  });

  /** Native Picture-in-Picture for Video ASMR */
  async function toggleNativePiP() {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
    } else {
      if (activeVideoElement && activeVideoElement.readyState >= 2) {
        try {
          await activeVideoElement.requestPictureInPicture();
          showToast("已開啟全螢幕影片懸浮！");
        } catch (error) {
          console.error(error);
          showToast("此瀏覽器不支援影片懸浮功能");
        }
      } else {
        showToast("影片載入中，請稍後");
      }
    }
  }

  /** Heart Climax System & Audio Analyser */
  async function saveClimaxSettings() {
    const imgFile = document.getElementById("climax-img-input").files[0];
    const audioFile = document.getElementById("climax-audio-input").files[0];
    if(!imgFile || !audioFile) return showToast("圖片與音效皆為必傳項目！");

    const tx = db.transaction("settings", "readwrite");
    const data = { key: "climax_media", imageBlob: imgFile, audioBlob: audioFile };
    tx.objectStore("settings").put(data);
    tx.oncomplete = () => {
      climaxData = data;
      showToast("🔥 高潮素材已儲存！");
    };
  }

  function initAudioAnalyser() {
    if(analyserInitialized) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      const source = audioCtx.createMediaElementSource(mainAudio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyserInitialized = true;
    } catch(e) { console.error("Audio API 失敗", e); }
  }

  function heartLoop() {
    if (mainAudio.paused || isClimaxing) return;

    if (analyser && dataArray) {
      analyser.getByteFrequencyData(dataArray);
      let sum = dataArray.reduce((a, b) => a + b, 0);
      let avg = sum / dataArray.length; // 0 to 255
      
      // Speed multiplier based on audio intensity (female moans make it go faster)
      let speed = 0.03 + (avg / 255) * 0.2; 
      heartProgress += speed;
    } else {
      // Fallback speed if analyser fails
      heartProgress += 0.05;
    }

    if (heartProgress >= 100) {
      triggerClimax();
    } else {
      updateHeartUI();
      requestAnimationFrame(heartLoop);
    }
  }

  function manualHeartBoost() {
    if(isClimaxing) return;
    heartProgress += 15;
    showToast("💖 愛心刺激加速！");
    if(heartProgress >= 100) triggerClimax();
    else updateHeartUI();
  }

  function updateHeartUI() {
    const rect = document.getElementById("heart-fill-rect");
    // Math to grow rect upwards from y=24 to y=0 based on progress
    let yPos = 24 - (24 * (Math.min(100, heartProgress) / 100));
    if(rect) rect.setAttribute("y", yPos);
  }

  function triggerClimax() {
    if(isClimaxing) return;
    isClimaxing = true;
    heartProgress = 100;
    updateHeartUI();
    
    // 1. Pause normal media
    mainAudio.pause();
    activeVideoElement.pause();

    // 2. Setup Climax Effects
    document.getElementById("heart-btn").classList.add("heart-explosive");
    document.getElementById("player-card").classList.add("screen-shake-extreme");
    document.getElementById("main-body").classList.add("screen-shake-extreme");

    if (climaxData && climaxData.imageBlob && climaxData.audioBlob) {
       // Show custom climax image
       const overlay = document.getElementById("climax-overlay");
       overlay.src = trackURL(climaxData.imageBlob);
       overlay.style.display = "block";
       
       // Play custom climax audio
       climaxAudio.src = trackURL(climaxData.audioBlob);
       climaxAudio.play().catch(()=>{});
       
       climaxAudio.onended = endClimax;
    } else {
       // Fallback if user didn't set climax media
       updateSubtitle("🔥🔥 啊啊啊... 高潮中... 🔥🔥");
       setTimeout(endClimax, 4000);
    }
  }

  function endClimax() {
    isClimaxing = false;
    heartProgress = 0;
    updateHeartUI();
    
    document.getElementById("heart-btn").classList.remove("heart-explosive");
    document.getElementById("player-card").classList.remove("screen-shake-extreme");
    document.getElementById("main-body").classList.remove("screen-shake-extreme");
    document.getElementById("climax-overlay").style.display = "none";
    
    climaxAudio.pause();
    climaxAudio.currentTime = 0;

    // Resume normal playback
    if(document.getElementById("video-asmr-area").style.display === "block") activeVideoElement.play();
    mainAudio.play();
    requestAnimationFrame(heartLoop);
  }

  /** Player Drag & Min/Max logic */
  let startY = 0, isDragging = false;
  document.getElementById("drag-handle-area").addEventListener("touchstart", e => {
    startY = e.touches[0].clientY; isDragging = true;
    playerCard.style.transition = 'none';
  }, {passive:true});
  
  document.getElementById("drag-handle-area").addEventListener("touchmove", e => {
    if(!isDragging) return;
    let diff = e.touches[0].clientY - startY;
    if (diff > 0) playerCard.style.transform = `translateY(${diff}px)`;
  }, {passive:true});
  
  document.getElementById("drag-handle-area").addEventListener("touchend", e => {
    if(!isDragging) return; isDragging = false;
    playerCard.style.transition = 'transform 0.4s cubic-bezier(0.2, 1, 0.3, 1)';
    let diff = e.changedTouches[0].clientY - startY;
    if (diff > 80) minimizePlayer();
    else playerCard.style.transform = '';
  });

  function expandPlayer() {
    playerCard.classList.remove("minimized");
    playerCard.style.transform = '';
    miniPlayer.classList.add("hidden");
  }

  function minimizePlayer() {
    playerCard.classList.add("minimized");
    miniPlayer.classList.remove("hidden");
  }

</script>
</body>
